28", "flag": "", "deck": "w08"}, {"id": "w08-031", "week": 8, "topic": "Fully connected layers", "type": "explain", "q": "Describe the role of the fully connected layers at the end of a CNN, including the flatten layer and softmax.", "model": "Once convolution and pooling have found features, fully connected layers use them to predict the best label for the image. The flatten layer first turns the feature maps into a single vector. Normal fully connected layers then apply weights and biases to the features. The output layer uses softmax, which turns the raw values, called logits, into a probability for each label. The probabilities sum to one.", "points": ["They take the output of the feature stage and predict a label", "Flatten turns feature maps into a single vector", "Normal layers apply weights and biases", "Softmax turns logits into probabilities that sum to one"], "source": "Week 8 lecture, slide 29 to 32", "flag": "", "deck": "w08"}, {"id": "w08-032", "week": 8, "topic": "CNN structure", "type": "explain", "q": "Describe the layers of a CNN and the order in which an image moves through them to produce a label.", "model": "A typical CNN stacks layers that reduce the image size while keeping the features that separate one class from another. Convolutional layers apply filters to find local features. Activation layers act as gates on the outputs, normalisation layers keep feature values comparable, pooling layers shrink the maps and dropout layers fight overfitting. This is the feature stage. A flatten layer then feeds fully connected layers, and a softmax output layer gives the label probabilities.", "points": ["Six layer types are convolution, pooling, activation, normalisation, dropout and fully connected", "The feature stage reduces size while keeping key features", "Flatten feeds the fully connected layers", "Softmax gives the final label probabilities"], "source": "Week 8 lecture, slide 17, 18 and 29", "flag": "", "deck": "w08"}, {"id": "w09-001", "week": 9, "topic": "Segmentation", "type": "single", "q": "What is the key difference between image classification and image segmentation?", "options": ["Classification gives one label to the whole image, while segmentation gives a class label to each pixel", "Classification works on pixels, while segmentation labels the whole image once", "Classification draws bounding boxes, while segmentation outputs a single class number", "Classification needs a mask label, while segmentation needs a one hot vector"], "answer": [0], "explain": "Segmentation localises the target by assigning a class to every pixel. Classification only returns one label for the entire picture.", "source": "Week 9 lecture, slide 8", "flag": "", "deck": "w09"}, {"id": "w09-002", "week": 9, "topic": "Segmentation", "type": "single", "q": "A photo shows a person and a small dog. Why is a single label such as DOG or HUMAN not enough?", "options": ["A single label cannot be produced by a CNN once there is more than one object", "A single label always needs the image to be resized to a fixed shape", "The target may fill only a small part of the frame, other objects share the scene, and we may want to know where and how many", "A single label would be correct but would need fully connected layers removed"], "answer": [2], "explain": "Classification cannot say where an object is or how many there are, and one label does not fit a scene with several objects. This is why localisation approaches are needed.", "source": "Week 9 lecture, slide 5", "flag": "", "deck": "w09"}, {"id": "w09-003", "week": 9, "topic": "Segmentation labels", "type": "multi", "q": "Which statements about the labels used to train a segmentation network are correct?", "options": ["Only the centre coordinates and the box size are required", "The label is given as a binary mask image", "The mask shows where the target object sits across the image", "Producing ground truth masks is labour intensive", "One categorical label is enough for the whole image"], "answer": [1, 2, 3], "explain": "Segmentation needs a mask for every training image, which takes a lot of effort. A single label or a box description would not give pixel level detail.", "source": "Week 9 lecture, slide 6 and 9", "flag": "", "deck": "w09"}, {"id": "w09-004", "week": 9, "topic": "Segmentation", "type": "single", "q": "What should a segmentation network output for a given input image?", "options": ["A single class prediction for the whole image", "A predicted mask image that shows the spatial location of the desired object", "A list of bounding boxes with confidence scores", "A one hot vector with one entry per class"], "answer": [1], "explain": "Unlike a classifier, which gives one label, a segmentation network produces a prediction mask that localises the object. Boxes with confidence scores belong to object detection.", "source": "Week 9 lecture, slide 7", "flag": "", "deck": "w09"}, {"id": "w09-005", "week": 9, "topic": "Segmentation uses", "type": "multi", "q": "Which tasks need a class label for each pixel?", "options": ["Giving one label to each photo in a holiday album", "Analysing satellite images", "Choosing a colour scheme for a website", "Outlining a brain tumour in a scan", "Understanding the road scene for a self driving car"], "answer": [1, 3, 4], "explain": "Segmentation suits tasks that need localisation, such as medical imaging, self driving cars and satellite analysis. Labelling whole photos is plain classification.", "source": "Week 9 lecture, slide 8 and 13", "flag": "", "deck": "w09"}, {"id": "w09-006", "week": 9, "topic": "U-Net", "type": "single", "q": "What are the three sections of a U-Net model?", "options": ["Encoding blocks, a pooling gate and classification blocks", "Convolution blocks, a dropout section and softmax blocks", "Contraction blocks, a grid layer and anchor blocks", "Contraction blocks, a bottleneck and expansion blocks"], "answer": [3], "explain": "U-Net shrinks the image in contraction blocks, passes through a bottleneck and then rebuilds an image in expansion blocks. The shape of this layout looks like a U.", "source": "Week 9 lecture, slide 10 and 11", "flag": "", "deck": "w09"}, {"id": "w09-007", "week": 9, "topic": "U-Net", "type": "single", "q": "Why does an expansion block of U-Net receive a copy and crop of feature maps from the matching contraction block?", "options": ["To reduce the number of classes the network must predict", "To remove duplicate bounding boxes from the output", "To make up for the information lost during max pooling", "To convert the mask back into a single label"], "answer": [2], "explain": "Max pooling throws away detail on the way down. Copying and cropping the earlier feature maps hands some of that detail back so the reconstructed mask is sharper.", "source": "Week 9 lecture, slide 11", "flag": "", "deck": "w09"}, {"id": "w09-008", "week": 9, "topic": "U-Net", "type": "multi", "q": "Which statements about U-Net are correct?", "options": ["The bottleneck sits between the contraction and expansion blocks", "It is trained with a single label per image", "Its contraction blocks end with an up sampling layer", "Expansion blocks use an up sampling layer", "It converts the image into a feature vector and then reconstructs a segmented image", "It outputs bounding boxes around each object"], "answer": [0, 3, 4], "explain": "U-Net encodes then rebuilds the image, with the bottleneck in the middle and up sampling in the expansion path. It outputs a mask, not boxes, and needs mask labels.", "source": "Week 9 lecture, slide 10 and 11", "flag": "", "deck": "w09"}, {"id": "w09-009", "week": 9, "topic": "Segmentation versus detection", "type": "single", "q": "How does the output of object detection differ from the output of segmentation?", "options": ["Detection draws bounding boxes with a class label, which is coarser but faster than a pixel mask", "Detection gives a pixel mask, which is finer but slower than boxes", "Detection gives one label for the whole image, which is the fastest option", "Detection gives a feature vector, which cannot show object position"], "answer": [0], "explain": "Segmentation produces a detailed pixel level mask of each object. Detection gives a box and a label, a rougher but quicker result.", "source": "Week 9 lecture, slide 13", "flag": "", "deck": "w09"}, {"id": "w09-010", "week": 9, "topic": "Choosing a method", "type": "single", "q": "A team needs the exact shape and boundary of a tumour in a medical scan. Which approach fits best?", "options": ["Object detection with bounding boxes only", "Plain classification of the whole scan", "Non maximum suppression on a grid of cells", "Image segmentation, for example with U-Net"], "answer": [3], "explain": "Only a pixel level mask shows the exact outline. Boxes are too coarse and a whole image label gives no location at all.", "source": "Week 9 lecture, slide 13", "flag": "", "deck": "w09"}, {"id": "w09-011", "week": 9, "topic": "Choosing a method", "type": "single", "q": "A system must find pedestrians and vehicles in video as it plays. Which approach suits this real time task?", "options": ["Hand labelling a binary mask for every frame afterwards", "Object detection, for example with YOLO", "Classification with one label for each frame", "Training a bigger classifier and ignoring location"], "answer": [1], "explain": "Detection gives faster boxes and labels, which suits real time work. A single frame label cannot say where each pedestrian or vehicle is.", "source": "Week 9 lecture, slide 13 and 18", "flag": "", "deck": "w09"}, {"id": "w09-012", "week": 9, "topic": "Detection labels", "type": "single", "q": "Why is a one hot label by itself not enough for object detection?", "options": ["The label must also hold the information needed to rebuild the bounding box", "A one hot vector can only describe objects that are not people", "A one hot vector cannot be used with convolutional layers", "A one hot vector needs a separate mask image for every class"], "answer": [0], "explain": "A one hot vector names the class but says nothing about where the object is. A detection label adds the box centre, width and height.", "source": "Week 9 lecture, slide 15", "flag": "", "deck": "w09"}, {"id": "w09-013", "week": 9, "topic": "Detection labels", "type": "multi", "q": "Which items belong in the label an object detector predicts for one object?", "options": ["The centre coordinates of the box", "One label that describes the whole image", "The class label", "The width and height of the box", "A full pixel mask of the object"], "answer": [0, 2, 3], "explain": "A detection label has at least five values, which are x, y, width, height and class. A pixel mask belongs to segmentation.", "source": "Week 9 lecture, slide 15 and 16", "flag": "", "deck": "w09"}, {"id": "w09-014", "week": 9, "topic": "YOLO", "type": "single", "q": "Why is YOLO described as extremely fast compared with older methods such as Faster R-CNN?", "options": ["It skips the CNN and works on raw pixels directly", "It only handles images with a single object in them", "It processes the entire image in one forward pass", "It labels every pixel before drawing any box"], "answer": [2], "explain": "YOLO stands for You Only Look Once, because it looks at the whole image in a single pass. It still uses a CNN and it does not label every pixel.", "source": "Week 9 lecture, slide 18", "flag": "", "deck": "w09"}, {"id": "w09-015", "week": 9, "topic": "YOLO preprocessing", "type": "multi", "q": "Which steps does an input image go through before the YOLO network uses it?", "options": ["Drawing a pixel mask for each object", "Division into an S by S grid", "Resizing to a fixed shape", "Normalising pixel values to a scale of 0 to 1", "Conversion to a single grayscale channel"], "answer": [1, 2, 3], "explain": "Images are resized, normalised and split into a grid. Normalising stops large pixel values dominating and helps the network learn faster. Grayscale conversion and masks are not part of it.", "source": "Week 9 lecture, slide 19", "flag": "", "deck": "w09"}, {"id": "w09-016", "week": 9, "topic": "YOLO grid", "type": "single", "q": "In YOLO, which grid cell is responsible for detecting a particular object?", "options": ["Every cell that the object touches", "The cell that contains the centre of the object", "The cell in the top left corner of the image", "The cell with the lowest confidence score"], "answer": [1], "explain": "Each cell detects objects whose centre falls inside it. This is quicker than checking every possible region as R-CNN does.", "source": "Week 9 lecture, slide 19", "flag": "", "deck": "w09"}, {"id": "w09-017", "week": 9, "topic": "YOLO grid", "type": "multi", "q": "Which statements about YOLO grid cells are correct?", "options": ["The grid avoids checking every possible region of the image", "Each cell predicts several bounding boxes", "Each predicted box carries a confidence score", "Each cell is responsible for objects whose centre falls inside it"], "answer": [0, 1, 2, 3], "explain": "YOLO gives each grid cell the job of detecting objects centred in it and predicts multiple boxes with confidence scores per cell. All four statements are correct.", "source": "Week 9 lecture, slide 19, 24 and 25", "flag": "", "deck": "w09"}, {"id": "w09-018", "week": 9, "topic": "YOLO backbone", "type": "single", "q": "What does the CNN backbone of YOLO, such as Darknet, do?", "options": ["It removes overlapping boxes using intersection over union", "It resizes the image to a fixed shape and scales the pixels", "It assigns one class label to the entire image", "It extracts features such as edges, textures and shapes and turns the image into a feature map"], "answer": [3], "explain": "The backbone is a CNN that builds the feature map from which boxes and classes are predicted. Removing overlaps is the job of non maximum suppression.", "source": "Week 9 lecture, slide 22", "flag": "", "deck": "w09"}, {"id": "w09-019", "week": 9, "topic": "YOLO boxes", "type": "single", "q": "What does each predicted bounding box in YOLO contain?", "options": ["A pixel mask, a class number and the image resolution", "The grid size, the number of anchors and the class count", "The centre position relative to the cell, the width and height relative to the image, and a confidence score", "A softmax vector for the whole image and a colour histogram"], "answer": [2], "explain": "Each box gives x and y for the centre, w and h for the size, and a probability that an object is present. A pixel mask belongs to segmentation.", "source": "Week 9 lecture, slide 24", "flag": "", "deck": "w09"}, {"id": "w09-020", "week": 9, "topic": "Anchor boxes", "type": "single", "q": "Why does each YOLO grid cell predict several anchor boxes?", "options": ["Because objects have different shapes and sizes, and anchors help predict them more effectively", "Because one box per cell would be too slow to compute", "Because anchors replace the need for a CNN backbone", "Because anchors are used to normalise the pixel values"], "answer": [0], "explain": "A cell may hold a car and a person, which need differently shaped boxes. Several anchors let the model cover varied shapes.", "source": "Week 9 lecture, slide 25", "flag": "", "deck": "w09"}, {"id": "w09-021", "week": 9, "topic": "Class prediction", "type": "single", "q": "How does the way YOLOv3 predicts classes differ from older YOLO versions?", "options": ["It uses softmax, which allows more than one class for an object, instead of sigmoid", "It stops predicting classes and only predicts box positions", "It predicts one class for each pixel instead of each box", "It uses sigmoid, which allows more than one class for an object, instead of softmax with one class"], "answer": [3], "explain": "Older versions used softmax so each object received one class. Sigmoid lets several classes apply to the same object, which is useful for multi label problems.", "source": "Week 9 lecture, slide 28", "flag": "", "deck": "w09"}, {"id": "w09-022", "week": 9, "topic": "Non maximum suppression", "type": "single", "q": "Why is non maximum suppression applied to YOLO predictions?", "options": ["The network produces too few boxes for each object", "Several boxes may overlap the same object, so redundant ones must be removed", "Pixel values must be scaled back to the range 0 to 255", "The confidence scores must be turned into class labels"], "answer": [1], "explain": "Many boxes can land on one object. Non maximum suppression keeps the best box and discards the duplicates so each object appears once.", "source": "Week 9 lecture, slide 29", "flag": "", "deck": "w09"}, {"id": "w09-023", "week": 9, "topic": "Non maximum suppression", "type": "multi", "q": "Which steps are part of non maximum suppression?", "options": ["Repeat for the remaining boxes", "Keep the box with the highest confidence", "Discard remaining boxes that overlap the kept box above the threshold", "Sort the boxes by confidence score", "Merge all overlapping boxes into a pixel mask", "Discard the lowest confidence boxes regardless of overlap"], "answer": [0, 1, 2, 3], "explain": "The procedure keeps the most confident box and removes boxes that overlap it too much, then repeats. It is the overlap with the kept box that decides, not confidence alone.", "source": "Week 9 lecture, slide 29", "flag": "", "deck": "w09"}, {"id": "w09-024", "week": 9, "topic": "Intersection over union", "type": "single", "q": "In non maximum suppression, what is intersection over union used for?", "options": ["To measure how much a box overlaps the selected box, so duplicates can be discarded", "To measure how confident the model is that an object is present", "To decide which class an object belongs to", "To measure how many grid cells the image has"], "answer": [0], "explain": "A high overlap with the chosen box shows the box is a duplicate of the same object, so it is removed. Overlap says nothing about class or confidence.", "source": "Week 9 lecture, slide 29", "flag": "", "deck": "w09"}, {"id": "w09-025", "week": 9, "topic": "Segmentation", "type": "explain", "q": "Explain the difference between image classification and image segmentation and why segmentation needs different labels.", "model": "Classification assigns one label to the whole image, which is not enough when the target fills a small area or several objects share the frame. Segmentation assigns a class to each pixel, so it shows where the target is and can find several of them. Because of this the training label must be a binary mask image, not a single category. The network also outputs a prediction mask. Producing the ground truth masks is labour intensive.", "points": ["Classification gives one label for the whole image", "Segmentation labels each pixel and so localises objects", "Labels must be binary mask images", "Network outputs a prediction mask and masks are costly to make"], "source": "Week 9 lecture, slide 5 to 9", "flag": "", "deck": "w09"}, {"id": "w09-026", "week": 9, "topic": "U-Net", "type": "explain", "q": "Describe the structure of U-Net and say how it produces a segmented image.", "model": "U-Net turns the image into a feature vector and then rebuilds an image from it, and its layout looks like the letter U. Contraction blocks use convolution layers followed by max pooling to shrink the maps. The bottleneck sits between the two halves. Expansion blocks use convolution layers followed by up sampling to grow the maps again until a segmented prediction mask is produced.", "points": ["Contraction blocks use convolution then max pooling", "The bottleneck sits between contraction and expansion", "Expansion blocks use convolution then up sampling", "The output is a reconstructed segmented image"], "source": "Week 9 lecture, slide 10 and 11", "flag": "", "deck": "w09"}, {"id": "w09-027", "week": 9, "topic": "U-Net", "type": "explain", "q": "Explain why U-Net uses copy and crop connections.", "model": "Max pooling in the contraction blocks throws away some spatial information as the maps shrink. Each expansion block therefore receives a copy and crop of the feature maps from the matching contraction block. This hands the lost detail back to the expansion path. It helps the network rebuild a more accurate segmented image than it could from the compressed vector alone.", "points": ["Max pooling loses information", "Feature maps are copied from the matching contraction block", "Copying compensates for the loss", "This supports a more accurate reconstructed mask"], "source": "Week 9 lecture, slide 11", "flag": "The last point about accuracy is a reasonable inference. Slide 11 only says copy and crop compensates for information loss.", "deck": "w09"}, {"id": "w09-028", "week": 9, "topic": "Segmentation versus detection", "type": "explain", "q": "Compare image segmentation and object detection and give one situation where each is the better choice.", "model": "Segmentation classifies every pixel and gives a detailed mask with the exact shape and boundary of each object. It suits medical imaging and satellite analysis. Object detection draws bounding boxes and gives each a class label. It is coarser but faster, so it suits real time tasks such as finding pedestrians or vehicles. U-Net is a segmentation model, while YOLO is a detection model.", "points": ["Segmentation gives pixel level masks and exact boundaries", "Detection gives bounding boxes with class labels", "Detection is coarser but faster", "Example uses such as medical imaging for segmentation and vehicle detection for detection"], "source": "Week 9 lecture, slide 13", "flag": "", "deck": "w09"}, {"id": "w09-029", "week": 9, "topic": "Detection labels", "type": "explain", "q": "Compare the label used for image classification with the label used for object detection.", "model": "In classification the label is a one hot vector that only says which class the whole image belongs to. In object detection the label must name the class and also hold what is needed to rebuild the bounding box. The model predicts at least five values, which are the box centre x and y, the width and height, and the class label. Detection therefore tells us both what and where.", "points": ["Classification uses a one hot vector for the whole image", "Detection needs the class plus box information", "Five values are x, y, width, height and class", "Detection gives what and where"], "source": "Week 9 lecture, slide 15 and 16", "flag": "", "deck": "w09"}, {"id": "w09-030", "week": 9, "topic": "YOLO", "type": "explain", "q": "Explain how YOLO detects objects in an image, from input to final output.", "model": "YOLO resizes the image to a fixed shape, normalises the pixels and divides it into a grid. A CNN backbone extracts a feature map. Each grid cell predicts several bounding boxes with a confidence score and predicts class probabilities. Because the whole image is handled in one forward pass, YOLO is fast. Non maximum suppression then removes overlapping duplicates. The final output is a list of boxes, each with a class label and confidence score.", "points": ["Preprocessing with resize, normalise and grid", "CNN backbone extracts features", "Cells predict boxes, confidence and classes", "Non maximum suppression removes duplicates", "Output is boxes with labels and confidence"], "source": "Week 9 lecture, slide 18 to 31", "flag": "", "deck": "w09"}, {"id": "w09-031", "week": 9, "topic": "YOLO grid and anchors", "type": "explain", "q": "Explain the role of the grid and anchor boxes in YOLO.", "model": "YOLO splits the image into an S by S grid and each cell is responsible for objects whose centre falls inside it. This is faster and more efficient than checking every possible region as R-CNN does. Each cell predicts several boxes using anchors, which are boxes of different shapes. Anchors help the model handle objects of varying sizes, for example one anchor suited to a car and another to a person in the same cell.", "points": ["Image is divided into an S by S grid", "A cell handles objects whose centre is inside it", "The grid is faster than checking every region", "Anchors let a cell predict objects of different shapes and sizes"], "source": "Week 9 lecture, slide 19, 21 and 25", "flag": "", "deck": "w09"}, {"id": "w09-032", "week": 9, "topic": "Non maximum suppression", "type": "explain", "q": "Describe how non maximum suppression removes duplicate detections.", "model": "Several boxes can overlap the same object, so redundant boxes must be removed. All boxes are sorted by confidence score and the one with the highest score is kept. Each remaining box is compared with it using intersection over union. If the overlap is above a threshold, such as 0.5, the box is a duplicate and is discarded. If it is below the threshold the box is kept. The process repeats for the remaining boxes.", "points": ["Many boxes may overlap one object", "Sort by confidence and keep the highest", "Compare others using intersection over union", "Discard those above the threshold and keep those below", "Repeat until all boxes are handled"], "source": "Week 9 lecture, slide 29", "flag": "", "deck": "w09"}, {"id": "w09-033", "week": 9, "topic": "Class prediction", "type": "explain", "q": "Explain how YOLO predicts class labels and how the activation used changed in later versions.", "model": "After predicting boxes, YOLO outputs a vector of class scores for each detected object, showing how likely each type is, such as car, person or dog. Older versions used softmax, which assigns one class to each object. YOLOv3 and later use sigmoid instead. This allows more than one class prediction for the same object, which helps in multi label classification.", "points": ["Class scores are output for each detected object", "Older versions used softmax with one class per object", "YOLOv3 and later use sigmoid", "Sigmoid allows multiple classes per object"], "source": "Week 9 lecture, slide 28", "flag": "", "deck": "w09"}, {"id": "w10-001", "week": 10, "topic": "Sequential data", "type": "single", "q": "Which task needs a model that uses the order of the data?", "options": ["Translating a sentence from one language to another", "Predicting a flower type from four fixed measurements", "Deciding the species of a plant from one photo", "Sorting a table of unrelated records by one column"], "answer": [0], "explain": "In translation the order of the words changes the meaning, so history matters. Flower measurements are independent examples with no temporal behaviour.", "source": "Week 10 lecture, slide 3 and 4", "flag": "", "deck": "w10"}, {"id": "w10-002", "week": 10, "topic": "Sequential data", "type": "single", "q": "Why do the sentences \"The cat killed the dog\" and \"The dog killed the cat\" show that order matters?", "options": ["They use different words, so a model must learn each word separately", "They have different lengths, so a model needs padding", "They use the same words but the order changes the meaning completely", "They are both too short for a model to classify"], "answer": [2], "explain": "The words are identical and only the order differs, yet the meaning is opposite. A model that ignores order cannot tell them apart.", "source": "Week 10 lecture, slide 4", "flag": "", "deck": "w10"}, {"id": "w10-003", "week": 10, "topic": "RNN architecture", "type": "single", "q": "What extra type of connection does an RNN have compared with an ordinary feedforward network or CNN?", "options": ["A connection that skips every second layer", "A recurrent connection that forms a cycle", "A connection that links every input pixel to every output", "A connection that copies the filter to the next layer"], "answer": [1], "explain": "Feedforward networks and CNNs only connect one layer to the next. An RNN adds a recurrent connection that feeds information back in a loop.", "source": "Week 10 lecture, slide 6", "flag": "", "deck": "w10"}, {"id": "w10-004", "week": 10, "topic": "Sequential memory", "type": "single", "q": "To predict which way a ball is moving, why is a sequence of frames better than a single frame?", "options": ["One frame is always too small to contain a ball", "A single frame cannot be turned into a number", "More frames make the colours easier to separate", "Without knowing where the ball has been, one frame lacks enough data to show its direction"], "answer": [3], "explain": "Direction depends on earlier positions. A sequence of snapshots gives that history, which is the idea behind sequential memory in an RNN.", "source": "Week 10 lecture, slide 7", "flag": "", "deck": "w10"}, {"id": "w10-005", "week": 10, "topic": "Hidden state", "type": "single", "q": "In an RNN, what is the hidden state?", "options": ["The final label that the network predicts for the sequence", "The set of weights that never change during training", "A representation of previous inputs that is passed forward through the loop", "A copy of the input image kept for reference"], "answer": [2], "explain": "The loop passes prior information forward and this information is the hidden state. It gives the network a form of memory of what came before.", "source": "Week 10 lecture, slide 8", "flag": "", "deck": "w10"}, {"id": "w10-006", "week": 10, "topic": "Sequential problems", "type": "multi", "q": "Which of these are problems where the order of the data matters?", "options": ["Time series forecasting", "Video sequence prediction", "Handwriting recognition", "Speech recognition", "Labelling iris flowers from four measurements"], "answer": [0, 1, 2, 3], "explain": "Speech, handwriting, video and time series all depend on what came before or after. Iris flower labelling treats each row as independent.", "source": "Week 10 lecture, slide 3 and 4", "flag": "", "deck": "w10"}, {"id": "w10-007", "week": 10, "topic": "RNN architecture", "type": "single", "q": "At a given time step, what does the hidden layer of an RNN receive?", "options": ["The current input combined with the hidden state from the previous step", "Only the current input, with no earlier information", "Only the final output from the whole sequence", "The class labels of all future steps"], "answer": [0], "explain": "The hidden layer combines the input at time t with the hidden state from the step before, which itself depends on earlier inputs. This is how history is carried forward.", "source": "Week 10 lecture, slide 10 and 11", "flag": "", "deck": "w10"}, {"id": "w10-008", "week": 10, "topic": "RNN hidden node", "type": "multi", "q": "Which statements describe what happens in an RNN hidden node?", "options": ["The output is sent onwards to the output layer", "The result is passed through an activation function", "A copy of the output is forwarded to the next step as working memory", "The current input is concatenated with the working memory from the previous step"], "answer": [0, 1, 2, 3], "explain": "The node joins the new input to the old memory, applies an activation and sends the result both onwards and forwards in time. All four statements are correct.", "source": "Week 10 lecture, slide 13", "flag": "", "deck": "w10"}, {"id": "w10-009", "week": 10, "topic": "Sequence classification", "type": "single", "q": "An RNN reads a sentence word by word and its final output is passed to a feedforward layer. What is this used for?", "options": ["To undo the effect of the hidden state", "To split the sentence back into single words", "To choose which filters to apply to the text", "To classify something such as the intent of the sentence"], "answer": [3], "explain": "By the final step the RNN has encoded information from all earlier words, so its output can be used to classify the intent.", "source": "Week 10 lecture, slide 15 and 16", "flag": "", "deck": "w10"}, {"id": "w10-010", "week": 10, "topic": "Vanishing gradient", "type": "single", "q": "What does the vanishing gradient problem mean for training an RNN?", "options": ["Gradients grow too large, so the weights become unstable", "Gradients shrink as they pass backwards, so early steps barely learn and the network forgets older information", "Gradients are lost only at the output layer, so predictions are random", "Gradients disappear because the learning rate was set to zero"], "answer": [1], "explain": "Each step makes the adjustment smaller than the one before it, so the earliest layers hardly change. This gives the RNN its short term memory.", "source": "Week 10 lecture, slide 17 to 19", "flag": "", "deck": "w10"}, {"id": "w10-011", "week": 10, "topic": "Vanishing gradient", "type": "multi", "q": "Which statements about the vanishing gradient problem are correct?", "options": ["Earlier layers are barely adjusted because the gradients are tiny", "Gradients shrink exponentially as they are backpropagated", "It only affects the output layer", "It is common in very deep fully connected networks and in RNNs", "Gradients grow without limit and cause overflow"], "answer": [0, 1, 3], "explain": "Small adjustments in later layers lead to even smaller ones earlier on, so early layers fail to learn. It is a problem of shrinking, not growing, gradients.", "source": "Week 10 lecture, slide 18 and 19", "flag": "", "deck": "w10"}, {"id": "w10-012", "week": 10, "topic": "BPTT", "type": "single", "q": "What is computed at the end of the forward pass when training an RNN with backpropagation through time?", "options": ["The total loss, which measures the difference between the true and estimated labels", "The partial derivative of every weight", "The new cell state of the network", "The mask of the final output"], "answer": [0], "explain": "The forward pass takes the input through the hidden states and works out the loss. Partial derivatives come later, in the backward pass.", "source": "Week 10 lecture, slide 20 and 21", "flag": "", "deck": "w10"}, {"id": "w10-013", "week": 10, "topic": "BPTT", "type": "single", "q": "What happens in the backward pass of backpropagation through time?", "options": ["The input is processed through the hidden state to estimate a label", "The hidden state is reset to zero at every time step", "The total loss is propagated back, and the change for each weight is found using partial derivatives and the chain rule", "The window of time steps is made longer after each epoch"], "answer": [2], "explain": "The backward pass sends the loss back through the network and uses the chain rule to work out how much each weight should change.", "source": "Week 10 lecture, slide 22", "flag": "", "deck": "w10"}, {"id": "w10-014", "week": 10, "topic": "Truncated BPTT", "type": "single", "q": "How does truncated backpropagation through time tackle the vanishing gradient problem?", "options": ["It adds a gate that deletes the oldest hidden state", "It only looks back over a moving window of time steps instead of the entire sequence", "It replaces the RNN with a feedforward network", "It raises the size of the gradients at each step"], "answer": [1], "explain": "Normal backpropagation goes through the whole sequence, which makes gradients vanish. Limiting the window avoids far away steps.", "source": "Week 10 lecture, slide 23", "flag": "", "deck": "w10"}, {"id": "w10-015", "week": 10, "topic": "Truncated BPTT", "type": "multi", "q": "Which statements about truncated backpropagation through time are correct?", "options": ["Dependencies longer than the window cannot be learned", "It still passes backwards through the entire sequence", "It is less complex because far away steps add no gradient", "It can learn dependencies that are longer than the window", "It is much faster than normal backpropagation through time"], "answer": [0, 2, 4], "explain": "Using a window saves time and complexity but cuts off long range links. That limit is its main drawback.", "source": "Week 10 lecture, slide 23", "flag": "", "deck": "w10"}, {"id": "w10-016", "week": 10, "topic": "Long term dependencies", "type": "single", "q": "A model must finish the sentence \"I grew up in France and I speak fluent ...\". Why can truncated backpropagation struggle here?", "options": ["The word France is too short to be encoded as a hidden state", "The window deletes the most recent word first", "The sentence must be fed in reverse order", "The clue about France may lie further back than the window, so the link cannot be learned"], "answer": [3], "explain": "The nearby words only show that a language is coming. The word France is needed to pick the language, and a long gap can put it outside the window.", "source": "Week 10 lecture, slide 24", "flag": "", "deck": "w10"}, {"id": "w10-017", "week": 10, "topic": "LSTM", "type": "single", "q": "What is the cell state in an LSTM?", "options": ["A gate that decides what to forget", "A layer that flattens the input into a vector", "A line running along the whole chain, like a conveyor belt, with only minor linear changes", "A copy of the loss used during training"], "answer": [2], "explain": "The cell state carries information straight along the chain. Gates carefully add to or remove from it. The forget gate is one of those gates, not the cell state.", "source": "Week 10 lecture, slide 26", "flag": "", "deck": "w10"}, {"id": "w10-018", "week": 10, "topic": "LSTM gates", "type": "multi", "q": "Which statements about an LSTM gate are correct?", "options": ["It is built from a sigmoid layer and a pointwise multiplication", "It outputs values between minus one and one", "A value of one lets everything through", "A value of zero lets nothing through"], "answer": [0, 2, 3], "explain": "A sigmoid outputs values between zero and one, which say how much of each component to let through. Minus one to one is the range of tanh.", "source": "Week 10 lecture, slide 27 and 31", "flag": "", "deck": "w10"}, {"id": "w10-019", "week": 10, "topic": "LSTM gates", "type": "single", "q": "What is the job of the forget gate in an LSTM?", "options": ["It decides which information to throw away from the cell state", "It creates candidate values to add to the cell state", "It decides which part of the cell state to output", "It resets the hidden state of the previous step"], "answer": [0], "explain": "The forget gate outputs a number between 0 and 1 for each value in the cell state. A 1 means keep it completely and a 0 means get rid of it.", "source": "Week 10 lecture, slide 28", "flag": "", "deck": "w10"}, {"id": "w10-020", "week": 10, "topic": "LSTM gates", "type": "multi", "q": "Which describe the step where an LSTM stores new information in the cell state?", "options": ["The output gate chooses what to send to the next layer", "The hidden state of the previous step is reset to zero", "A second layer builds a vector of new candidate values", "A sigmoid input gate decides which values to update"], "answer": [2, 3], "explain": "Storing new information has two parts, an input gate that picks which values to update and a layer that creates candidates. Output filtering is a separate, later step.", "source": "Week 10 lecture, slide 29", "flag": "", "deck": "w10"}, {"id": "w10-021", "week": 10, "topic": "LSTM gates", "type": "single", "q": "What does the output step of an LSTM produce?", "options": ["A raw copy of the whole cell state", "A new set of candidate values for the cell state", "A list of the values the forget gate threw away", "A filtered version of the cell state, formed by a tanh and a sigmoid gate"], "answer": [3], "explain": "A sigmoid layer decides which parts to output and the cell state is pushed through tanh to lie between minus one and one. The two are multiplied, so only chosen parts leave.", "source": "Week 10 lecture, slide 31", "flag": "", "deck": "w10"}, {"id": "w10-022", "week": 10, "topic": "LSTM", "type": "single", "q": "How does the internal structure of an LSTM differ from a standard RNN?", "options": ["A standard RNN has four interacting layers, while an LSTM has a single layer", "A standard RNN has a single layer, while an LSTM has four interacting layers", "A standard RNN has no hidden state, while an LSTM has one", "A standard RNN has gates, while an LSTM has none"], "answer": [1], "explain": "The repeating module of an LSTM is more elaborate, with several interacting layers that make up the gates. A plain RNN uses just one.", "source": "Week 10 lecture, slide 25", "flag": "", "deck": "w10"}, {"id": "w10-023", "week": 10, "topic": "GRU", "type": "multi", "q": "Which statements about a gated recurrent unit are correct?", "options": ["It is a simplified variant of the LSTM", "It has more gates than an LSTM", "It has an update gate and a reset gate", "It needs less computational power than an LSTM", "It removes the recurrent connection altogether"], "answer": [0, 2, 3], "explain": "A GRU keeps the gating idea but uses fewer gates, so it still models temporal patterns with less computation.", "source": "Week 10 lecture, slide 32", "flag": "", "deck": "w10"}, {"id": "w10-024", "week": 10, "topic": "Sequential data", "type": "explain", "q": "Explain the difference between tasks that are not sequence based and tasks where sequence matters, with one example of each.", "model": "In a task that is not sequence based, each example is independent and there is no temporal behaviour, so order and history do not matter. Predicting an iris flower type from its four measurements is an example. In other tasks the order carries meaning and earlier or later information changes the answer. Machine translation, speech recognition, video prediction and time series are examples. The cat and dog sentences use the same words but have opposite meanings.", "points": ["Non sequence tasks have independent examples and no history", "Example such as iris flower classification", "Sequence tasks depend on order and context", "Example such as translation, speech or time series"], "source": "Week 10 lecture, slide 3 and 4", "flag": "", "deck": "w10"}, {"id": "w10-025", "week": 10, "topic": "RNN", "type": "explain", "q": "Describe how a recurrent neural network remembers earlier inputs.", "model": "An RNN adds a recurrent connection that forms a cycle, so information from one step can be passed to the next. This passed on information is the hidden state, a representation of previous inputs. At each time step the current input is combined with the previous hidden state and sent through an activation function. The result goes to the output layer and a copy is passed to the next step as working memory. This gives the network sequential memory.", "points": ["A recurrent connection forms a cycle", "The hidden state represents previous inputs", "Current input is combined with the previous hidden state", "A copy of the output is passed forward as working memory"], "source": "Week 10 lecture, slide 6 to 13", "flag": "", "deck": "w10"}, {"id": "w10-026", "week": 10, "topic": "RNN", "type": "explain", "q": "Explain how an RNN reads a sentence word by word and then uses it to classify an intent.", "model": "The sentence is broken into a sequence of words. The RNN encodes the first word and produces an output. The next word is then fed in together with the hidden state from the previous step. This repeats until the final word. By then the hidden state holds information from all the earlier words. The final output is therefore built from the whole sequence, and it can be passed to a feedforward layer to classify the intent.", "points": ["Sentence is split into words fed in one at a time", "Each step uses the previous hidden state", "Final step has encoded information from all words", "Final output goes to a feedforward layer to classify intent"], "source": "Week 10 lecture, slide 15 and 16", "flag": "", "deck": "w10"}, {"id": "w10-027", "week": 10, "topic": "Vanishing gradient", "type": "explain", "q": "Explain the vanishing gradient problem and why it gives an RNN short term memory.", "model": "In backpropagation each layer works out its gradient from the layer after it. If the adjustments there are already small, the adjustment for the current layer is even smaller, so gradients shrink exponentially as they travel back. The earliest layers or steps then receive tiny gradients and barely learn. In an RNN this means information from early steps is hard to retain over long sequences, which is the short term memory problem.", "points": ["Each layer's gradient depends on the one after it", "Gradients shrink exponentially going backwards", "Early layers barely adjust and fail to learn", "RNN struggles to retain information from earlier steps"], "source": "Week 10 lecture, slide 17 to 19", "flag": "", "deck": "w10"}, {"id": "w10-028", "week": 10, "topic": "BPTT", "type": "explain", "q": "Describe the forward and backward passes of backpropagation through time.", "model": "Training an RNN uses a loss function that measures the error between the true label and the predicted label. In the forward pass the input goes through the hidden states and the estimated label is calculated. The loss is computed at each step and the total loss L finishes the pass. In the backward pass the total loss is propagated back through the network. Partial derivatives and the chain rule measure how much each weight should change.", "points": ["Loss function measures error between true and predicted label", "Forward pass runs input through hidden states and computes total loss", "Backward pass propagates the loss back", "Partial derivatives and the chain rule give weight changes"], "source": "Week 10 lecture, slide 20 to 22", "flag": "", "deck": "w10"}, {"id": "w10-029", "week": 10, "topic": "Truncated BPTT", "type": "explain", "q": "Explain the benefit and the drawback of truncated backpropagation through time.", "model": "Normal backpropagation through time goes back through the whole sequence, which makes gradients vanish. Truncated backpropagation only considers a moving window of time steps. This is much faster and less complex, because gradients from faraway steps are not included. The drawback is that dependencies longer than the window length cannot be learned. For example the clue France may sit too far back to help predict the word French.", "points": ["Normal version goes through the whole sequence and gradients vanish", "Truncated uses a moving window", "It is faster and less complex", "It cannot learn dependencies longer than the window"], "source": "Week 10 lecture, slide 23 and 24", "flag": "", "deck": "w10"}, {"id": "w10-030", "week": 10, "topic": "LSTM", "type": "explain", "q": "Explain why an LSTM handles long sequences better than a simple recurrent network.", "model": "An LSTM is a special kind of RNN designed to remember information for long periods. Its key is the cell state, which runs straight along the chain like a conveyor belt with only minor linear changes. Information is added to or removed from the cell state under the control of gates. Because the important information can travel along this line with little change, an LSTM can learn long term dependencies where a simple RNN with a single layer fades.", "points": ["LSTM is designed to learn long term dependencies", "Cell state runs along the chain like a conveyor belt", "Gates control what is added or removed", "Simple RNN has a single layer and forgets over long gaps"], "source": "Week 10 lecture, slide 25 and 26", "flag": "The explanation of why the cell state helps with vanishing gradients is standard textbook reasoning. The slides only describe the cell state as a conveyor belt with minor linear interactions.", "deck": "w10"}, {"id": "w10-031", "week": 10, "topic": "LSTM gates", "type": "explain", "q": "Describe the three gate steps of an LSTM cell.", "model": "Gates use a sigmoid layer and pointwise multiplication to let a chosen amount through, with zero meaning nothing and one meaning everything. The forget gate decides which information to throw away from the cell state. The input gate decides which values to update, while another layer builds candidate values, and together they update the cell state. The output step runs the cell state through tanh and multiplies it by a sigmoid gate, so only the chosen parts are output.", "points": ["Gates are sigmoid layers with pointwise multiplication giving values from zero to one", "Forget gate removes information from the cell state", "Input gate and candidate values add new information", "Output step filters the cell state using tanh and a sigmoid gate"], "source": "Week 10 lecture, slide 27 to 31", "flag": "", "deck": "w10"}, {"id": "w10-032", "week": 10, "topic": "GRU", "type": "explain", "q": "Compare a gated recurrent unit with an LSTM.", "model": "A gated recurrent unit is a simplified variant of the LSTM. It keeps the idea of gates but has fewer of them, using an update gate and a reset gate. It can still model temporal patterns efficiently. Because it is simpler it needs less computational power. An LSTM has more gates and a separate cell state, so it is more elaborate and costs more to run.", "points": ["GRU is a simplified LSTM", "It has update and reset gates", "It needs less computational power", "LSTM has more gates and is more elaborate"], "source": "Week 10 lecture, slide 32", "flag": "The final comparison about a separate cell state is textbook knowledge. The slide only gives the one line description of the GRU.", "deck": "w10"}], "notes": [{"deck": "w01a", "html": "<h1 id=\"what-ai-is-and-the-main-types-of-ai\">What AI is and the main\r\ntypes of AI<\/h1>\r\n<h2 id=\"defining-ai\">Defining AI<\/h2>\r\n<p>The term was coined by John McCarthy in 1956. AI is the science and\r\nengineering of making intelligent machines. Artificial means produced by\r\nhuman effort and most people agree on that. Intelligence is very hard to\r\ndefine because it is hard to measure. AI does not have to copy\r\nbiologically observable methods.<\/p>\r\n<h2 id=\"the-turing-test\">The Turing Test<\/h2>\r\n<p>Turing replaced the question of whether machines can think with a\r\ntestable one. Can a machine pass a behaviour test for intelligence? A\r\nhuman judge talks to a hidden entity. If the judge cannot tell whether\r\nit is a computer, the computer passes and is said to be intelligent. The\r\ntest cares about behaviour and not about how the machine works.<\/p>\r\n<h2 id=\"multiple-intelligences\">Multiple intelligences<\/h2>\r\n<p>The theory says intelligence is split into modalities and is not one\r\ngeneral ability. The types are visual-spatial, emotional or\r\ninterpersonal, intrapersonal, linguistic-verbal, logical-mathematical,\r\nbodily-kinesthetic, naturalistic and existential. Each raises the\r\nquestion of whether a machine could have it.<\/p>\r\n<h2 id=\"weak-ai-and-strong-ai\">Weak AI and strong AI<\/h2>\r\n<p>Weak AI solves a specific problem with predefined instructions and\r\nparameters. Almost all of today's AI is weak, such as Siri, Alexa,\r\nchatbots and self driving cars. Strong AI would equal human\r\nintelligence, with self awareness, consciousness, creativity and\r\nplanning. It only exists as a theoretical idea.<\/p>\r\n<h2 id=\"four-types-of-ai\">Four types of AI<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Type<\/th>\r\n<th>Key idea<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Reactive machines<\/td>\r\n<td>No memory, so the same input gives the same output, as in Deep\r\nBlue<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Limited memory<\/td>\r\n<td>Looks at the past and improves with more training data, as in deep\r\nlearning<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Theory of mind<\/td>\r\n<td>Understands human motives and intentions and predicts behaviour<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Self-awareness<\/td>\r\n<td>Has a sense of self and does not exist yet<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<h2 id=\"how-the-splits-differ\">How the splits differ<\/h2>\r\n<p>Weak and strong AI split AI by how broad its ability is. The four\r\ntypes split it by memory and understanding. Do not mix the two\r\nlists.<\/p>\r\n<h2 id=\"conclusion\">Conclusion<\/h2>\r\n<p>In a computing context AI is the ability of a machine to mimic the\r\nbehaviour of living things, mainly humans. How it does this is not\r\nimportant and the outcome is what counts.<\/p>\r\n"}, {"deck": "w01b", "html": "<h1 id=\"data-modalities-and-exploratory-data-analysis\">Data modalities\r\nand exploratory data analysis<\/h1>\r\n<h2 id=\"ai-as-research\">AI as research<\/h2>\r\n<p>AI research follows the scientific method. The steps are observation,\r\nhypothesis, experimentation, analysis and conclusion. The research\r\npipeline runs from problem formulation to data collection, model\r\ndevelopment, evaluation and validation, and finally knowledge\r\ncontribution.<\/p>\r\n<h2 id=\"data-modalities\">Data modalities<\/h2>\r\n<p>Tabular data has rows as entities and columns as features. Time\r\nseries data is ordered. Text is profiled through tokens, vocabulary and\r\nlength. Images are profiled by shape, ratio and channels. Audio is\r\nprofiled by sampling rate, duration and spectrograms. Video adds frame\r\nrate, resolution and colour depth.<\/p>\r\n<h2 id=\"what-eda-is\">What EDA is<\/h2>\r\n<p>Exploratory data analysis profiles, summarises and visualises data\r\nbefore modelling. It uses simple statistics and plots. It finds missing\r\nvalues, duplicates, outliers, imbalance, leakage and bias. It also\r\nguides model choice and baselines.<\/p>\r\n<h2 id=\"tabular-data-checks\">Tabular data checks<\/h2>\r\n<p>Check schema and integrity for duplicates and constant columns. Check\r\nmissingness to plan imputation. Check distributions and outliers, and\r\ntell errors from true extremes. Check scaling because distance-based\r\nmodels are sensitive to it. Correlation shows redundancy and leakage\r\nsuspects. Multicollinearity shows how well each feature is explained by\r\nthe others. Target relationships show which features are informative.\r\nClass imbalance calls for stratified splits and metrics such as F1.<\/p>\r\n<h2 id=\"split-design\">Split design<\/h2>\r\n<p>Random or stratified splits suit independent rows. Time-based splits\r\nsuit data over time. Grouped splits keep records of the same entity\r\ntogether. A wrong split gives optimistic results. PCA gives a quick look\r\nat compression and noisy axes.<\/p>\r\n<h2 id=\"time-series-checks\">Time series checks<\/h2>\r\n<p>Look at continuity and gaps, seasonality, stationarity,\r\nautocorrelation, and anomalies or change points. Stationarity means mean\r\nand variance stay stable. Differencing and log transforms can help.<\/p>\r\n<h2 id=\"text-checks\">Text checks<\/h2>\r\n<p>Stop-word removal cuts noise. Case normalisation reduces sparsity but\r\ncase can carry meaning. Cleansing should keep meaning. Also look at\r\ncorpus size, length distributions, vocabulary, n-grams, noise and\r\nembeddings.<\/p>\r\n<h2 id=\"image-checks\">Image checks<\/h2>\r\n<p>Profile resolution and aspect ratio. Check channel statistics, blur\r\nand corrupt files. Find duplicates across splits with hashes or\r\nembeddings, since they leak information.<\/p>\r\n"}, {"deck": "w02", "html": "<h1 id=\"supervised-learning-k-nn-and-decision-trees\">Supervised\r\nlearning, k-NN and decision trees<\/h1>\r\n<h2 id=\"machine-learning\">Machine learning<\/h2>\r\n<p>Machine learning learns patterns from data instead of using\r\nhand-crafted rules. Supervised learning uses labelled examples.\r\nUnsupervised learning finds structure. Reinforcement learning uses\r\nrewards from trial and error. Use machine learning for complex patterns,\r\nmany edge cases and changing data. Use rules when logic is exact, data\r\nis tiny, errors are unacceptable or reasons must be clear.<\/p>\r\n<h2 id=\"supervised-learning\">Supervised learning<\/h2>\r\n<p>The model learns from features and labels to predict unseen cases.\r\nClassification predicts a category and regression predicts a continuous\r\nnumber. A classifier outputs probabilities and a threshold turns them\r\ninto labels. The threshold balances the cost of false positives and\r\nfalse negatives.<\/p>\r\n<h2 id=\"evaluating-classifiers\">Evaluating classifiers<\/h2>\r\n<p>The confusion matrix holds true and false positives and negatives.\r\nAccuracy is misleading when classes are imbalanced. Precision matters\r\nwhen false positives are costly. Recall matters when missing a positive\r\nis costly. F1 balances the two. Specificity measures how well negatives\r\nare rejected. The ROC curve plots true positive rate against false\r\npositive rate across thresholds.<\/p>\r\n<h2 id=\"k-nearest-neighbours\">k-nearest neighbours<\/h2>\r\n<p>k-NN finds the k closest training points and takes a majority vote\r\nfor classification. For regression it averages their values. It is lazy\r\nbecause it does little work in training. It is non-parametric because it\r\nassumes no data distribution. Choose k by comparing values on validation\r\ndata. Its drawbacks are high cost on large data, sensitivity to\r\nirrelevant features and dependence on k.<\/p>\r\n<h2 id=\"decision-trees\">Decision trees<\/h2>\r\n<p>A tree makes a series of splits that give readable if then rules.\r\nGini impurity shows how mixed a node is, and zero means pure. The tree\r\npicks the split with the largest drop in weighted impurity. It then\r\nrepeats on each child. It stops when nodes are pure, features run out,\r\nor limits such as depth are reached. An impure leaf predicts its\r\nmajority class.<\/p>\r\n<h2 id=\"comparing-the-two\">Comparing the two<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Point<\/th>\r\n<th>k-NN<\/th>\r\n<th>Decision tree<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Training<\/td>\r\n<td>Almost none<\/td>\r\n<td>Builds splits<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Output<\/td>\r\n<td>Vote of neighbours<\/td>\r\n<td>Rules that can be read<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Weak spot<\/td>\r\n<td>Slow on large data<\/td>\r\n<td>Impure leaves<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n"}, {"deck": "w03", "html": "<h1 id=\"supervised-regression\">Supervised Regression<\/h1>\r\n<h2 id=\"supervised-learning\">Supervised learning<\/h2>\r\n<p>Supervised learning trains a model on labelled historical data. Each\r\nexample has input features, also called independent variables or\r\npredictors, and an output label, also called the dependent variable or\r\ntarget. The model then predicts for new, unseen data.<\/p>\r\n<h2 id=\"regression-and-classification\">Regression and\r\nclassification<\/h2>\r\n<p>Regression predicts a continuous number, such as a price, a\r\ntemperature or energy demand. Classification predicts a discrete class,\r\nsuch as spam or not spam. Classification can return class probabilities\r\nand a threshold turns them into a label. Regression returns a numeric\r\nestimate directly. A count, such as tickets raised tomorrow, is still\r\ntreated as a regression target.<\/p>\r\n<h2 id=\"evaluation-metrics\">Evaluation metrics<\/h2>\r\n<p>Evaluation checks how far predicted values are from actual\r\nvalues.<\/p>\r\n<ul>\r\n<li>Mean absolute error is the average absolute difference. It is less\r\nsensitive to outliers.<\/li>\r\n<li>Mean squared error squares the errors, so large mistakes are\r\npenalised more.<\/li>\r\n<li>Root mean squared error is the square root of that, so it is in the\r\nsame units as the target. It is still sensitive to outliers.<\/li>\r\n<li>R-squared shows how much of the variance in the target the model\r\nexplains. A value of 1 is a perfect fit, 0 means no better than\r\npredicting the mean, and below 0 is worse than that baseline.<\/li>\r\n<\/ul>\r\n<h2 id=\"linear-regression\">Linear regression<\/h2>\r\n<p>It fits a straight line, or a flat surface for many inputs. Ordinary\r\nleast squares chooses the coefficients that make the sum of squared\r\nresiduals as small as possible. It works best when the relationship is\r\nroughly linear. It is used for baselines and when interpretable\r\ncoefficients matter.<\/p>\r\n<h2 id=\"random-forest-regression\">Random forest regression<\/h2>\r\n<p>It is an ensemble of many decision trees. Each tree is built on\r\nrandom rows and features. Each tree predicts a number and the forest\r\nreturns the average. Averaging makes it more stable than one tree. It\r\nhandles non-linear data, is robust to outliers and is less prone to\r\noverfitting.<\/p>\r\n<h2 id=\"comparing-the-models\">Comparing the models<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Model<\/th>\r\n<th>Strength<\/th>\r\n<th>Weakness<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Linear regression<\/td>\r\n<td>Simple and interpretable<\/td>\r\n<td>Needs a roughly linear relationship<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Random forest<\/td>\r\n<td>Handles non-linear data and outliers<\/td>\r\n<td>Harder to interpret<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Gradient boosting<\/td>\r\n<td>Builds trees in sequence to fix earlier errors<\/td>\r\n<td>Trees depend on each other, so they are built in order<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<p>Random forest is a bagging method, with independent trees averaged.\r\nBoosting builds trees one after another. Support vector regression suits\r\nmedium-sized datasets with complex relationships.<\/p>\r\n"}, {"deck": "w04", "html": "<h1 id=\"unsupervised-learning-clustering-and-pca\">Unsupervised Learning,\r\nClustering and PCA<\/h1>\r\n<h2 id=\"unsupervised-learning\">Unsupervised learning<\/h2>\r\n<p>It uses unlabelled data and aims to find inherent structure or\r\npatterns. Supervised learning uses labelled data and aims to predict\r\noutcomes. Examples of unsupervised methods are k-means, principal\r\ncomponent analysis and autoencoders. The two main types are clustering\r\nand dimensionality reduction.<\/p>\r\n<h2 id=\"clustering\">Clustering<\/h2>\r\n<p>Clustering groups similar data points together, with no labels or\r\ntarget. It is similarity based and works as an exploratory tool. Uses\r\ninclude customer segmentation and document clustering. Common methods\r\nare k-means, hierarchical clustering with a dendrogram, DBSCAN for\r\ndensity and arbitrary shapes, and Gaussian mixture models for\r\nprobabilistic clusters.<\/p>\r\n<h2 id=\"k-means\">K-means<\/h2>\r\n<p>The user chooses k. The algorithm places k centres at random, assigns\r\neach point to its closest centre, moves each centre to the mean of its\r\ncluster, and repeats. It stops at convergence, when no point changes\r\ncluster. It minimises the total squared distance from points to their\r\ncentres. Random starting centres mean results can differ between\r\nruns.<\/p>\r\n<h2 id=\"choosing-k\">Choosing k<\/h2>\r\n<ul>\r\n<li>Inertia is the sum of squared distances from points to their cluster\r\ncentre. Smaller means tighter clusters. It falls as k rises.<\/li>\r\n<li>The elbow method looks for the point where improvement drops\r\nsharply. It can be hard to see.<\/li>\r\n<li>The silhouette score compares cohesion with separation from the\r\nnearest other cluster. Values near 1 mean well clustered, near 0 mean on\r\na boundary, and negative means possibly misclassified. Choose the k with\r\nthe highest average score.<\/li>\r\n<\/ul>\r\n<h2 id=\"dimensionality-reduction\">Dimensionality reduction<\/h2>\r\n<p>It reduces the number of features while keeping relevant information.\r\nBenefits are speed, less noise and redundancy, less overfitting and\r\neasier plotting.<\/p>\r\n<h2 id=\"methods\">Methods<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Method<\/th>\r\n<th>Idea<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Principal component analysis<\/td>\r\n<td>Unsupervised, projects onto directions of greatest variance<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Linear discriminant analysis<\/td>\r\n<td>Supervised, maximises class separation<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>t-SNE<\/td>\r\n<td>Non-linear, preserves local structure for visualisation<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>UMAP<\/td>\r\n<td>Non-linear, preserves local and global structure<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<h2 id=\"how-pca-works\">How PCA works<\/h2>\r\n<p>Centre the data. Calculate the covariance matrix. Use\r\neigen-decomposition to get eigenvectors, which are the components, and\r\neigenvalues, which show variance. Project the data onto the top\r\ncomponents. If the first few components hold most of the variance, the\r\nfeatures were highly redundant.<\/p>\r\n"}, {"deck": "w05a", "html": "<h1 id=\"reinforcement-learning-and-q-learning\">Reinforcement Learning\r\nand Q-Learning<\/h1>\r\n<h2 id=\"reinforcement-learning\">Reinforcement learning<\/h2>\r\n<p>An agent learns to make sequential decisions by interacting with an\r\nenvironment. It tries actions and the environment responds with a reward\r\nor a penalty. Learning is by trial and error, aiming at the best long\r\nterm outcome. There are no labelled correct answers.<\/p>\r\n<h2 id=\"example\">Example<\/h2>\r\n<p>For a self-driving car, the agent is the driving system and the\r\nenvironment is the road, other cars and lights. Rewards are staying in\r\nlane and avoiding collisions. Penalties are collisions, hard braking and\r\nrunning red lights.<\/p>\r\n<h2 id=\"types-of-reinforcement-learning\">Types of reinforcement\r\nlearning<\/h2>\r\n<ul>\r\n<li>Model-free learns from experienced rewards and does not learn how\r\nthe environment works.<\/li>\r\n<li>Model-based uses a model with transition probabilities and a reward\r\nfunction to predict results and plan.<\/li>\r\n<li>Value-based estimates the expected future reward of states or\r\nactions and acts on those values. Q-learning is an example.<\/li>\r\n<li>Policy-based learns a policy directly, which maps a state to an\r\naction.<\/li>\r\n<li>Actor-critic combines the two. The actor learns the policy and the\r\ncritic learns a value function to judge it.<\/li>\r\n<\/ul>\r\n<h2 id=\"q-learning\">Q-learning<\/h2>\r\n<p>Q-learning is model free and value based. The agent learns the best\r\naction in each situation from experience.<\/p>\r\n<h2 id=\"tables\">Tables<\/h2>\r\n<p>The reward table gives the immediate reward for moving between\r\nstates. The Q-table stores learned values. Each entry is the expected\r\ntotal reward for taking an action in a state and then following the best\r\npolicy. The Q-table starts at zero.<\/p>\r\n<h2 id=\"the-update-idea\">The update idea<\/h2>\r\n<p>A Q-value equals the reward of the current move plus a learning\r\nparameter, typically 0.8, times the best value available from the next\r\nstate. The parameter sets how much future value counts. If it were zero,\r\nonly immediate reward would matter.<\/p>\r\n<h2 id=\"how-learning-spreads\">How learning spreads<\/h2>\r\n<p>Early moves are random. By chance the agent reaches the goal and the\r\nmove into the goal is strengthened. Next, the move before it is\r\nstrengthened, and so on backwards. This repeats over many episodes until\r\nthe values stabilise. That is convergence.<\/p>\r\n"}, {"deck": "w05b", "html": "<h1 id=\"genetic-algorithms\">Genetic Algorithms<\/h1>\r\n<h2 id=\"what-they-are\">What they are<\/h2>\r\n<p>A genetic algorithm is an optimisation method that imitates\r\nbiological evolution and survival of the fittest. It works on a\r\npopulation of candidate solutions and improves it over generations. It\r\nsuits large search spaces such as scheduling, route optimisation and\r\nfinance.<\/p>\r\n<h2 id=\"biological-terms\">Biological terms<\/h2>\r\n<ul>\r\n<li>A chromosome is a string of DNA. In the algorithm it is one\r\ncandidate solution, often a bitstring.<\/li>\r\n<li>A gene is one block of the chromosome, such as a single bit of 0 or\r\n1.<\/li>\r\n<li>Fitness is how successful an individual is, here how good the\r\nsolution is.<\/li>\r\n<li>Crossover recombines genes from two parents.<\/li>\r\n<li>Mutation is a random change, like a copying error.<\/li>\r\n<\/ul>\r\n<h2 id=\"the-loop\">The loop<\/h2>\r\n<ol type=\"1\">\r\n<li>Create an initial population of random solutions.<\/li>\r\n<li>Test each solution for fitness and rank them.<\/li>\r\n<li>Remove some bad solutions and duplicate some good ones.<\/li>\r\n<li>Make small changes using crossover and mutation.<\/li>\r\n<li>Repeat until the best solution is good enough.<\/li>\r\n<\/ol>\r\n<p>Problems are usually set up as finding a minimum, so other problems\r\nare reformulated as minimisation.<\/p>\r\n<h2 id=\"why-not-other-methods\">Why not other methods<\/h2>\r\n<p>The analytical method differentiates an equation and finds where the\r\ngradient is zero. It fails when the relationship cannot be written as an\r\nequation, when there are several minima, or when the problem is complex\r\nwith many variables.<\/p>\r\n<p>Blind generate and test guesses solutions and checks them. It may\r\ntake too long, can be misled by several minima, and does not build on\r\nearlier guesses.<\/p>\r\n<p>A genetic algorithm gives a guided search. It keeps good solutions\r\nand varies them.<\/p>\r\n<h2 id=\"strengths-and-limits\">Strengths and limits<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Point<\/th>\r\n<th>Detail<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Advantage<\/td>\r\n<td>Approximate solutions can usually be found<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Disadvantage<\/td>\r\n<td>It can be hard to represent a problem as a genetic problem<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Best use<\/td>\r\n<td>Large search spaces<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n"}, {"deck": "w06", "html": "<h1 id=\"neural-network-basics-perceptron-and-training\">Neural network\r\nbasics, perceptron and training<\/h1>\r\n<h2 id=\"the-brain-and-the-artificial-neuron\">The brain and the\r\nartificial neuron<\/h2>\r\n<p>A biological neuron receives impulses through its dendrites and\r\npasses them along its axon to other neurons. Artificial neurons copy\r\nthis idea at a small scale. Inputs play the part of dendrites and the\r\noutput plays the part of the axon.<\/p>\r\n<h2 id=\"the-perceptron\">The perceptron<\/h2>\r\n<p>A perceptron is a single neuron with several inputs and one output.\r\nEach input is multiplied by a weight and the products are summed. A bias\r\nis added, and an activation function decides whether the neuron fires. A\r\nstep function gives one of two values. Weights and biases start random\r\nand are adjusted later.<\/p>\r\n<h2 id=\"limits-and-networks\">Limits and networks<\/h2>\r\n<p>A single perceptron only learns linearly separable patterns.\r\nThousands of perceptrons in consecutive layers turn the input data into\r\npredictions based on features.<\/p>\r\n<h2 id=\"supervised-learning\">Supervised learning<\/h2>\r\n<p>Neural networks generally learn with labelled data. The desired\r\noutput for each sample is known, as with the iris features and the\r\nflower type label. The aim is to learn a function that links inputs to\r\nlabels.<\/p>\r\n<h2 id=\"the-training-loop\">The training loop<\/h2>\r\n<p>Training is iterative. Start with random weights and biases, so the\r\nfirst prediction is meaningless. Then repeat these steps.<\/p>\r\n<ul>\r\n<li>Feed forward from input to output to make a prediction.<\/li>\r\n<li>Use the cost function to measure the error.<\/li>\r\n<li>Backpropagate the error to each layer.<\/li>\r\n<li>Use gradient descent to adjust weights and biases.<\/li>\r\n<\/ul>\r\n<p>Stop when the cost converges or the maximum number of epochs is\r\nreached.<\/p>\r\n<h2 id=\"cost-and-loss\">Cost and loss<\/h2>\r\n<p>Loss usually means the error for one observation. Cost is the average\r\nloss over the training set. Both give one real number.<\/p>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Task<\/th>\r\n<th>Typical cost<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Regression<\/td>\r\n<td>Mean squared error, mean absolute error<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Classification with targets of 0 or 1<\/td>\r\n<td>Binary cross entropy<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<p>Mean squared error punishes far predictions much more than close\r\nones.<\/p>\r\n<h2 id=\"gradient-descent-and-backpropagation\">Gradient descent and\r\nbackpropagation<\/h2>\r\n<p>The slope of the cost shows which way to move. The weights move in\r\nthe negative direction of the slope. Backpropagation calculates the\r\npartial derivatives with the chain rule. Gradient descent uses them to\r\nmake the update.<\/p>\r\n<h2 id=\"testing\">Testing<\/h2>\r\n<p>After training, the network is tested on new unseen data and its\r\nperformance is measured. This is called inference.<\/p>\r\n"}, {"deck": "w07", "html": "<h1 id=\"feed-forward-and-backpropagation-in-a-multi-layer-network\">Feed\r\nforward and backpropagation in a multi-layer network<\/h1>\r\n<h2 id=\"the-example-network\">The example network<\/h2>\r\n<p>The worked example has two inputs, two perceptrons in a hidden middle\r\nlayer and two perceptrons in the last layer. The same process scales to\r\na network of any size.<\/p>\r\n<h2 id=\"forward-pass\">Forward pass<\/h2>\r\n<p>The forward pass moves from the input layer towards the output layer.\r\nEach perceptron finds its total net input and then applies the logistic\r\nactivation function to get its output. The last layer gives the\r\nprediction. With random starting weights the first prediction is\r\npoor.<\/p>\r\n<h2 id=\"total-error\">Total error<\/h2>\r\n<p>Each output neuron has a target and a prediction. The cost function\r\ncombines these errors into one total error for the network. This is the\r\nquantity training tries to reduce.<\/p>\r\n<h2 id=\"backward-pass\">Backward pass<\/h2>\r\n<p>The goal is to update every weight so the predictions move closer to\r\nthe targets. The key question is how much a change in one weight changes\r\nthe total error. That answer is a partial derivative.<\/p>\r\n<h2 id=\"why-the-chain-rule\">Why the chain rule<\/h2>\r\n<p>A weight reaches the error only through a chain of effects. It\r\nchanges the net input, which changes the output, which changes the\r\nerror. The chain rule multiplies the pieces together. A term drops to\r\nzero when the weight has no effect on it, such as the error of the other\r\noutput neuron.<\/p>\r\n<h2 id=\"weight-update-and-learning-rate\">Weight update and learning\r\nrate<\/h2>\r\n<p>Gradient descent moves each weight opposite to its gradient, so the\r\nerror falls. The learning rate scales the step.<\/p>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Learning rate<\/th>\r\n<th>Effect<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Too large<\/td>\r\n<td>Overshoots and the error bounces<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Too small<\/td>\r\n<td>Learning is very slow<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<h2 id=\"whole-network\">Whole network<\/h2>\r\n<p>The same process updates every weight and bias in every layer.\r\nBackpropagation matters because the error is measured at the output but\r\nevery layer affects it. It sends the error back so each layer can be\r\nadjusted.<\/p>\r\n<h2 id=\"forward-and-backward-compared\">Forward and backward\r\ncompared<\/h2>\r\n<p>The forward pass goes from inputs to outputs and makes a prediction.\r\nThe backward pass goes from the error back through the layers and finds\r\nhow to change the weights. After the update, a new forward pass starts\r\nthe next epoch.<\/p>\r\n"}, {"deck": "w08", "html": "<h1 id=\"convolutional-neural-networks\">Convolutional Neural\r\nNetworks<\/h1>\r\n<h2 id=\"why-cnns-exist\">Why CNNs exist<\/h2>\r\n<p>Traditional fully connected networks are good classifiers but poor at\r\nfeature extraction. Image meaning sits in groups of neighbouring pixels.\r\nA CNN assumes the input is an image, so it can use these local\r\nfeatures.<\/p>\r\n<h2 id=\"convolution-and-filters\">Convolution and filters<\/h2>\r\n<p>A filter or kernel is a small 2D array of weights. It slides over the\r\nimage and multiplies with each patch. Different filters find edges,\r\ncorners and other features. Filters start random and are improved by\r\ntraining. The usual size is 3 by 3.<\/p>\r\n<h2 id=\"stride-and-padding\">Stride and padding<\/h2>\r\n<p>Stride is how far the kernel shifts each step. A larger stride gives\r\na smaller output. Padding adds a border so edge pixels are handled. Zero\r\npadding is common. Reflection and replication padding are\r\nalternatives.<\/p>\r\n<h2 id=\"pooling\">Pooling<\/h2>\r\n<p>Pooling shrinks the feature maps and saves computation. Max pooling\r\nkeeps the largest value in each patch. Average pooling keeps the\r\nmean.<\/p>\r\n<h2 id=\"activation\">Activation<\/h2>\r\n<p>An activation function is a gate between a neuron's inputs and its\r\noutput. ReLU is the most popular in CNNs.<\/p>\r\n<h2 id=\"normalisation\">Normalisation<\/h2>\r\n<p>Scaling features keeps their magnitudes similar. Batch normalisation\r\nuses the mean and standard deviation of each feature across a mini\r\nbatch. It reduces covariate shift and speeds up learning.<\/p>\r\n<h2 id=\"dropout-and-overfitting\">Dropout and overfitting<\/h2>\r\n<p>Overfitting means tiny training error but large error on new data,\r\nbecause the network has memorised the examples. Dropout randomly ignores\r\nsome layer outputs during training, which acts as regularisation.<\/p>\r\n<h2 id=\"fully-connected-layers\">Fully connected layers<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Layer<\/th>\r\n<th>Job<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Flatten<\/td>\r\n<td>Turns feature maps into one vector<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Normal<\/td>\r\n<td>Applies weights and biases<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Softmax output<\/td>\r\n<td>Turns logits into probabilities that sum to one<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<h2 id=\"whole-picture\">Whole picture<\/h2>\r\n<p>Stage one uses convolution, pooling and dropout to find features.\r\nStage two uses fully connected layers to predict the label.<\/p>\r\n"}, {"deck": "w09", "html": "<h1 id=\"image-segmentation-and-object-detection\">Image Segmentation and\r\nObject Detection<\/h1>\r\n<h2 id=\"classification-versus-segmentation\">Classification versus\r\nsegmentation<\/h2>\r\n<p>Classification gives one label to the whole image. Segmentation gives\r\na class to every pixel. It shows where the object is and can find\r\nseveral objects. Its labels are binary mask images, which take a lot of\r\neffort to make.<\/p>\r\n<h2 id=\"u-net\">U-Net<\/h2>\r\n<p>U-Net rebuilds an image from a feature vector, and its shape looks\r\nlike a U.<\/p>\r\n<ul>\r\n<li>Contraction blocks use convolution then max pooling.<\/li>\r\n<li>The bottleneck sits in the middle.<\/li>\r\n<li>Expansion blocks use convolution then up sampling.<\/li>\r\n<li>Copy and crop passes earlier feature maps across to make up for\r\ninformation lost in max pooling.<\/li>\r\n<\/ul>\r\n<h2 id=\"segmentation-versus-detection\">Segmentation versus\r\ndetection<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th><\/th>\r\n<th>Segmentation<\/th>\r\n<th>Detection<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Output<\/td>\r\n<td>Pixel mask<\/td>\r\n<td>Boxes with labels<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Detail<\/td>\r\n<td>Fine<\/td>\r\n<td>Coarser<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Speed<\/td>\r\n<td>Slower<\/td>\r\n<td>Faster<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Example use<\/td>\r\n<td>Medical imaging<\/td>\r\n<td>Real time vehicle finding<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Models<\/td>\r\n<td>U-Net, SegNet<\/td>\r\n<td>YOLO, SSD, Faster R-CNN<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<h2 id=\"detection-labels\">Detection labels<\/h2>\r\n<p>A detection label holds the box centre x and y, the width and height,\r\nand the class. A one hot vector alone cannot do this.<\/p>\r\n<h2 id=\"yolo\">YOLO<\/h2>\r\n<p>YOLO looks at the whole image in one forward pass.<\/p>\r\n<ol type=\"1\">\r\n<li>Resize, normalise and divide into a grid.<\/li>\r\n<li>A CNN backbone makes a feature map.<\/li>\r\n<li>Each cell predicts several anchor boxes with confidence scores.<\/li>\r\n<li>Classes are predicted. YOLOv3 uses sigmoid, so one object can have\r\nseveral classes.<\/li>\r\n<li>Non maximum suppression removes duplicates.<\
