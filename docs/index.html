g returns the largest value in the patch covered by the kernel. Average pooling returns the mean of all values in that patch. Max pooling keeps the strongest response while average pooling gives a smoother summary.", "points": ["Pooling reduces spatial size and computation", "It keeps dominant features that are position and rotation invariant", "Max pooling returns the maximum value in the patch", "Average pooling returns the mean of the patch"], "source": "Week 8 lecture, slide 20 and 21", "flag": "", "deck": "w08"}, {"id": "w08-030", "week": 8, "topic": "Dropout", "type": "explain", "q": "Explain what overfitting is and how a dropout layer helps to prevent it.", "model": "Overfitting happens when the error on the training set is very small but the error on new data is large. The network has memorised the training examples and has not learned to generalise. Dropout is a simple regularisation technique. During training it randomly ignores some layer outputs, so the layer looks different from one pass to the next. This stops the network relying on memorising the whole training set.", "points": ["Overfitting means tiny training error but large error on new data", "The network has memorised rather than generalised", "Dropout is a regularisation technique", "It randomly ignores some layer outputs during training"], "source": "Week 8 lecture, slide 27 and 28", "flag": "", "deck": "w08"}, {"id": "w08-m01", "week": 8, "topic": "CNN architecture", "type": "explain", "q": "Describe the main components of a convolutional neural network and their functions. Explain how CNNs differ from ordinary feedforward networks in processing images.", "model": "A convolutional layer slides small filters, or kernels, over the image to produce feature maps that detect patterns such as edges and textures. An activation function such as ReLU adds nonlinearity. A pooling layer, for example max pooling, reduces the size of the feature maps and keeps the strongest responses. Batch normalisation normalises feature maps across the mini-batch to speed up training. A dropout layer randomly drops neurons during training to reduce overfitting. Fully connected layers at the end combine the features and give the class output. An ordinary feedforward network is a good classifier but poor at extracting features, and does not scale well to images. It flattens the image and connects every pixel to every neuron, which needs very many weights and loses the spatial layout. A CNN shares the same filter weights across the image and keeps the spatial structure, so it exploits local features, the relationships between neighbouring pixels, with filters that are learned in training.", "points": ["Convolutional layers use filters to make feature maps", "Pooling reduces the size of the feature maps", "Fully connected layers give the final classification", "Feedforward networks flatten the image and need many weights", "CNNs exploit local features with learned filters and scale better to images"], "source": "Tutor's mock test, written question 8", "flag": "The mock gives no sample answer. This model answer was written from the slides for that week. That a CNN shares filter weights across the image is textbook knowledge.", "mock": true, "focus": true, "deck": "w08"}, {"id": "w08-m02", "week": 8, "topic": "Convolution", "type": "single", "q": "What is the output size of a valid convolution on a 32 x 32 input with a 3 x 3 kernel, stride 1 and no padding?", "options": ["32 x 32", "30 x 30", "29 x 29", "34 x 34"], "answer": [1], "explain": "Output size is (input - kernel) / stride + 1 = (32 - 3) / 1 + 1 = 30 on each side.", "source": "Tutor's mock test, multiple choice question 14", "flag": "", "mock": true, "deck": "w08"}, {"id": "w08-m03", "week": 8, "topic": "Pooling", "type": "single", "q": "What is the output of a 2 x 2 max pooling operation on the values [2, 7; 5, 3]?", "options": ["4.25", "5", "7", "17"], "answer": [2], "explain": "Max pooling keeps the largest value in the window, which is 7. 4.25 would be average pooling.", "source": "Tutor's mock test, multiple choice question 15", "flag": "", "mock": true, "deck": "w08"}, {"id": "w08-m04", "week": 8, "topic": "Batch normalisation", "type": "single", "q": "Which best describes the main function of batch normalisation in a neural network?", "options": ["Eliminating the need for a loss function", "Normalising intermediate activations using batch statistics and learned scaling and shifting", "Removing all negative activation values", "Reducing the number of output classes"], "answer": [1], "explain": "Batch normalisation subtracts the mini-batch mean and divides by its standard deviation, then applies a learned scale and shift. Removing negative values is what ReLU does.", "source": "Tutor's mock test, multiple choice question 16", "flag": "The learned scale and shift come from the mock test and standard references. The slides describe only the mean and standard deviation step.", "mock": true, "deck": "w08"}, {"id": "w09-007", "week": 9, "topic": "U-Net", "type": "single", "q": "Why does an expansion block of U-Net receive a copy and crop of feature maps from the matching contraction block?", "options": ["To reduce the number of classes the network must predict", "To remove duplicate bounding boxes from the output", "To make up for information lost during max pooling", "To convert the mask back into a single label"], "answer": [2], "explain": "Max pooling throws away detail on the way down. Copying and cropping the earlier feature maps hands some of that detail back so the reconstructed mask is sharper.", "source": "Week 9 lecture, slide 11", "flag": "", "deck": "w09"}, {"id": "w09-011", "week": 9, "topic": "Choosing a method", "type": "single", "q": "A system must find pedestrians and vehicles in video as it plays. Which approach suits this real time task?", "options": ["Image segmentation with a mask for every frame", "Object detection, for example with YOLO", "Classification with one label for each frame", "A bigger classifier that ignores location"], "answer": [1], "explain": "Detection gives faster boxes and labels, which suits real time work. A single frame label cannot say where each pedestrian or vehicle is.", "source": "Week 9 lecture, slide 13 and 18", "flag": "", "deck": "w09"}, {"id": "w09-016", "week": 9, "topic": "YOLO grid", "type": "single", "q": "In YOLO, which grid cell is responsible for detecting a particular object?", "options": ["Every cell that the object touches", "The cell that contains the centre of the object", "The cell in the top left corner of the image", "The cell with the lowest confidence score"], "answer": [1], "explain": "Each cell detects objects whose centre falls inside it. This is quicker than checking every possible region as R-CNN does.", "source": "Week 9 lecture, slide 19", "flag": "", "deck": "w09"}, {"id": "w09-022", "week": 9, "topic": "Non maximum suppression", "type": "single", "q": "Why is non maximum suppression applied to YOLO predictions?", "options": ["The network produces too few boxes for each object", "Several boxes can land on one object, so duplicates are removed", "Pixel values must be scaled back to the range 0 to 255 before display", "The confidence scores must be turned into class labels"], "answer": [1], "explain": "Many boxes can land on one object. Non maximum suppression keeps the best box and discards the duplicates so each object appears once.", "source": "Week 9 lecture, slide 29", "flag": "", "deck": "w09"}, {"id": "w09-028", "week": 9, "topic": "Segmentation versus detection", "type": "explain", "q": "Compare image segmentation and object detection and give one situation where each is the better choice.", "model": "Segmentation classifies every pixel and gives a detailed mask with the exact shape and boundary of each object. It suits medical imaging and satellite analysis. Object detection draws bounding boxes and gives each a class label. It is coarser but faster, so it suits real time tasks such as finding pedestrians or vehicles. U-Net is a segmentation model, while YOLO is a detection model.", "points": ["Segmentation gives pixel level masks and exact boundaries", "Detection gives bounding boxes with class labels", "Detection is coarser but faster", "Gives one use for each, such as medical imaging for segmentation and vehicle detection for detection"], "source": "Week 9 lecture, slide 13", "flag": "", "deck": "w09"}, {"id": "w09-030", "week": 9, "topic": "YOLO", "type": "explain", "q": "Explain how YOLO detects objects in an image, from input to final output.", "model": "YOLO resizes the image to a fixed shape, normalises the pixels and divides it into a grid. A CNN backbone extracts a feature map. Each grid cell predicts several bounding boxes with a confidence score and predicts class probabilities. Because the whole image is handled in one forward pass, YOLO is fast. Non maximum suppression then removes overlapping duplicates. The final output is a list of boxes, each with a class label and confidence score.", "points": ["The image is resized, normalised and divided into a grid", "A CNN backbone extracts a feature map", "Each cell predicts boxes, confidence scores and classes", "Non maximum suppression removes duplicates", "The output is boxes with class labels and confidence scores"], "source": "Week 9 lecture, slide 18 to 31", "flag": "", "deck": "w09"}, {"id": "w09-032", "week": 9, "topic": "Non maximum suppression", "type": "explain", "q": "Describe how non maximum suppression removes duplicate detections.", "model": "Several boxes can overlap the same object, so redundant boxes must be removed. All boxes are sorted by confidence score and the one with the highest score is kept. Each remaining box is compared with it using intersection over union. If the overlap is above a threshold, such as 0.5, the box is a duplicate and is discarded. If it is below the threshold the box is kept. The process repeats for the remaining boxes.", "points": ["Many boxes may overlap one object", "Sort by confidence and keep the highest", "Compare others using intersection over union", "Discard those above the threshold and keep those below", "Repeat until all boxes are handled"], "source": "Week 9 lecture, slide 29", "flag": "", "deck": "w09"}, {"id": "w09-m01", "week": 9, "topic": "U-Net", "type": "explain", "q": "Explain the differences between image classification, object detection and image segmentation. Describe the architecture and working principles of U-Net.", "model": "Image classification gives one label for the whole image. Object detection finds each object and gives it a class and a bounding box. Image segmentation labels every pixel, so it gives the exact shape of each region. Detection gives a coarser but faster result. U-Net is a network for segmentation with a U-shaped encoder and decoder. Contraction blocks of two 3x3 convolutions followed by 2x2 max pooling shrink the image and extract features. A bottleneck links the contraction and expansion paths. Expansion blocks of two 3x3 convolutions followed by 2x2 up-sampling rebuild the image size. Each expansion block receives a copy and crop of the matching contraction feature map. These skip connections restore spatial detail lost during pooling, and the output is a segmentation mask.", "points": ["Classification gives one label per image", "Detection gives classes and bounding boxes, segmentation labels each pixel", "Contraction path of convolutions and max pooling", "Expansion path of convolutions and up-sampling to rebuild size", "Copy and crop skip connections restore detail lost in pooling"], "source": "Tutor's mock test, written question 9", "flag": "The mock gives no sample answer. This model answer was written from the slides for that week.", "mock": true, "focus": true, "deck": "w09"}, {"id": "w09-m02", "week": 9, "topic": "U-Net", "type": "single", "q": "What is the main purpose of the skip connections between the encoder and decoder in U-Net?", "options": ["To eliminate the need for convolutional operations", "To transfer spatial information from encoder features to the matching decoder stages", "To replace the output segmentation mask with a class label", "To ensure that the network uses fewer trainable parameters"], "answer": [1], "explain": "Copy and crop passes encoder feature maps to the decoder, restoring detail lost during max pooling.", "source": "Tutor's mock test, multiple choice question 17", "flag": "", "mock": true, "deck": "w09"}, {"id": "w09-m03", "week": 9, "topic": "YOLO", "type": "single", "q": "Which distinguishes YOLO from approaches that classify a whole image into a single category?", "options": ["YOLO produces only one classification score for an image", "YOLO requires all images to contain exactly one object", "YOLO predicts object locations and categories within an image", "YOLO performs clustering before every prediction"], "answer": [2], "explain": "YOLO is an object detector. It gives a bounding box and a class for each object it finds.", "source": "Tutor's mock test, multiple choice question 18", "flag": "", "mock": true, "deck": "w09"}, {"id": "w10-002", "week": 10, "topic": "Sequential data", "type": "single", "q": "Why do the sentences \"The cat killed the dog\" and \"The dog killed the cat\" show that order matters?", "options": ["They use different words, so a model must learn each word separately", "They have different lengths, so a model needs padding", "They use the same words, but the order changes the meaning", "They are both too short for a model to classify"], "answer": [2], "explain": "The words are identical and only the order differs, yet the meaning is opposite. A model that ignores order cannot tell them apart.", "source": "Week 10 lecture, slide 4", "flag": "", "deck": "w10"}, {"id": "w10-005", "week": 10, "topic": "Hidden state", "type": "single", "q": "In an RNN, what is the hidden state?", "options": ["The label that the network predicts for the whole sequence at the last step", "The weights that never change during training", "A representation of previous inputs, passed forward through the loop", "A copy of the input image kept for reference"], "answer": [2], "explain": "The loop passes prior information forward and this information is the hidden state. It gives the network a form of memory of what came before.", "source": "Week 10 lecture, slide 8", "flag": "", "deck": "w10"}, {"id": "w10-010", "week": 10, "topic": "Vanishing gradient", "type": "single", "q": "What does the vanishing gradient problem mean for training an RNN?", "options": ["Gradients grow too large as they pass back, so weights become unstable", "Gradients shrink as they pass back, so early steps barely learn", "Gradients are lost only at the output layer, so predictions are random", "Gradients vanish because the learning rate was set to zero"], "answer": [1], "explain": "Each step makes the adjustment smaller than the one before it, so the earliest layers hardly change. That is why an RNN has short term memory.", "source": "Week 10 lecture, slide 17 to 19", "flag": "", "deck": "w10"}, {"id": "w10-014", "week": 10, "topic": "Truncated backpropagation", "type": "single", "q": "How does truncated backpropagation through time tackle the vanishing gradient problem?", "options": ["It adds a gate that deletes the oldest hidden state", "It looks back over only a moving window of time steps", "It replaces the RNN with a feedforward network", "It raises the size of the gradients at each step"], "answer": [1], "explain": "Normal backpropagation goes through the whole sequence, which makes gradients vanish. Limiting the window avoids far away steps.", "source": "Week 10 lecture, slide 23", "flag": "", "deck": "w10"}, {"id": "w10-016", "week": 10, "topic": "Long term dependencies", "type": "single", "q": "A model must finish the sentence \"I grew up in France and I speak fluent ...\". Why can truncated backpropagation struggle here?", "options": ["The word France is too short to be stored as a hidden state", "The window always drops the most recent word first", "The sentence has to be fed into the network in reverse order, last word first", "The word France may fall outside the window, so the link is not learned"], "answer": [3], "explain": "The nearby words only show that a language is coming. The word France is needed to pick the language, and a long gap can put it outside the window.", "source": "Week 10 lecture, slide 24", "flag": "", "deck": "w10"}, {"id": "w10-022", "week": 10, "topic": "LSTM", "type": "single", "q": "How does the internal structure of an LSTM differ from a standard RNN?", "options": ["A standard RNN has four interacting layers, while an LSTM has a single layer", "A standard RNN has a single layer, while an LSTM has four interacting layers", "A standard RNN has no hidden state, while an LSTM has one", "A standard RNN has gates, while an LSTM has none"], "answer": [1], "explain": "The repeating module of an LSTM is more elaborate, with several interacting layers that make up the gates. A plain RNN uses just one.", "source": "Week 10 lecture, slide 25", "flag": "", "deck": "w10"}, {"id": "w10-027", "week": 10, "topic": "Vanishing gradient", "type": "explain", "q": "Explain the vanishing gradient problem and why it gives an RNN short term memory.", "model": "In backpropagation each layer works out its gradient from the layer after it. If the adjustments there are already small, the adjustment for the current layer is even smaller, so gradients shrink exponentially as they travel back. The earliest layers or steps then receive tiny gradients and barely learn. In an RNN this means information from early steps is hard to retain over long sequences, which is the short term memory problem.", "points": ["Each layer's gradient depends on the one after it", "Gradients shrink exponentially going backwards", "Early layers barely adjust and fail to learn", "RNN struggles to retain information from earlier steps"], "source": "Week 10 lecture, slide 17 to 19", "flag": "", "deck": "w10"}, {"id": "w10-031", "week": 10, "topic": "LSTM gates", "type": "explain", "q": "Describe the three gate steps of an LSTM cell.", "model": "Gates use a sigmoid layer and pointwise multiplication to let a chosen amount through, with zero meaning nothing and one meaning everything. The forget gate decides which information to throw away from the cell state. The input gate decides which values to update, while another layer builds candidate values, and together they update the cell state. The output step runs the cell state through tanh and multiplies it by a sigmoid gate, so only the chosen parts are output.", "points": ["Gates are sigmoid layers with pointwise multiplication giving values from zero to one", "Forget gate removes information from the cell state", "Input gate and candidate values add new information", "Output step filters the cell state using tanh and a sigmoid gate"], "source": "Week 10 lecture, slide 27 to 31", "flag": "", "deck": "w10"}, {"id": "w10-m01", "week": 10, "topic": "RNN", "type": "explain", "q": "Explain the architecture and working of a simple recurrent neural network. Discuss the limitations of simple RNNs on long sequences and how LSTM networks address them.", "model": "A simple RNN processes a sequence one step at a time. It has a recurrent connection that forms a loop, so at each step it combines the current input with the hidden state from the previous step. The hidden state acts as memory of earlier inputs, and unfolding the loop shows the same cell repeated for each time step. Simple RNNs are trained with backpropagation through time, and on long sequences the gradients shrink as they travel back. This vanishing gradient gives the network short-term memory, so it struggles to learn long-term dependencies. An LSTM adds a cell state that runs along the chain with only minor linear interactions. Forget, input and output gates, built from sigmoid layers, decide what to remove, what to add and what to output. This lets information survive over long sequences.", "points": ["Recurrent loop combines the current input with the previous hidden state", "Hidden state carries memory through time", "Vanishing gradient causes short-term memory on long sequences", "LSTM adds a cell state that carries information along", "Forget, input and output gates control what is removed, added and output"], "source": "Tutor's mock test, written question 10", "flag": "The mock gives no sample answer. This model answer was written from the slides for that week.", "mock": true, "focus": true, "deck": "w10"}, {"id": "w10-m02", "week": 10, "topic": "LSTM gates", "type": "single", "q": "Which part of an LSTM mainly controls how much of the previous cell state is kept?", "options": ["Input gate", "Forget gate", "Output gate", "Softmax layer"], "answer": [1], "explain": "The forget gate gives a value from 0 to 1 for each number in the cell state. 1 keeps it and 0 removes it.", "source": "Tutor's mock test, multiple choice question 19", "flag": "", "mock": true, "deck": "w10"}, {"id": "w11-007", "week": 11, "topic": "Case normalisation", "type": "single", "q": "Why is case normalisation applied to text for sentiment analysis?", "options": ["Capital letters always signal a strong positive sentiment, so the model needs them kept exactly as written", "Casing gives little relevant information, so removing it reduces irrelevant variety", "Lowercase words are shorter, so the model trains on fewer characters", "Neural networks can only read lowercase letters, so capitals cause errors"], "answer": [1], "explain": "Casing does not really tell the model about sentiment. Turning \"CASH\" and \"cash\" into one form reduces irrelevant variety in the data.", "source": "Week 11 lecture, slide 10", "flag": "", "deck": "w11"}, {"id": "w11-009", "week": 11, "topic": "Tokenization", "type": "single", "q": "What is tokenization?", "options": ["Splitting text into units such as words, subwords or characters", "Reducing each word to its root by cutting off suffixes", "Replacing every word with a number that counts how often it appears", "Removing common words such as \"and\" and \"the\" from a sentence"], "answer": [0], "explain": "Tokenization splits sentences into tokens. The level can be words, subwords or characters, depending on the granularity needed.", "source": "Week 11 lecture, slide 12", "flag": "", "deck": "w11"}, {"id": "w11-011", "week": 11, "topic": "Stop words", "type": "single", "q": "Why are stop words removed?", "options": ["They are spelling mistakes and typos that confuse the model during training", "They are common words such as \"and\" and \"the\" that add little meaning", "They are the rarest words, so the model cannot learn them", "They always carry negative sentiment and bias the model"], "answer": [1], "explain": "Stop words are common words that do not contribute to the sentiment. They are filtered out before the text reaches the model.", "source": "Week 11 lecture, slide 14", "flag": "", "deck": "w11"}, {"id": "w11-014", "week": 11, "topic": "Stemming versus lemmatization", "type": "single", "q": "Which statement compares stemming and lemmatization correctly?", "options": ["Stemming uses context and always gives a valid dictionary word, while lemmatization just cuts letters off the end by rule", "Lemmatization uses context and gives valid base forms, while stemming uses heuristics and can give non-words", "Both always give exactly the same output for every word in the text", "Lemmatization only removes prefixes, while stemming only removes suffixes"], "answer": [1], "explain": "Lemmatization keeps meaning and returns real words called lemmas. Stemming follows rules of thumb, so happily can become happi, which is not a word.", "source": "Week 11 lecture, slide 18", "flag": "", "deck": "w11"}, {"id": "w11-019", "week": 11, "topic": "Embedding", "type": "single", "q": "How do word embeddings differ from TF-IDF vectors?", "options": ["Embeddings are sparse vectors built from raw term counts, while TF-IDF gives dense vectors of continuous values that capture meaning", "Embeddings are dense vectors of continuous values that capture meaning, while TF-IDF gives sparse vectors", "Embeddings can only be used for images, while TF-IDF is used for text", "Embeddings keep the original words, while TF-IDF turns them into numbers"], "answer": [1], "explain": "Embeddings are dense, continuous vectors that place related words close together. TF-IDF gives sparse vectors based on term frequencies.", "source": "Week 11 lecture, slide 24", "flag": "", "deck": "w11"}, {"id": "w11-025", "week": 11, "topic": "Padding", "type": "single", "q": "Why are sequences padded before they go into an LSTM?", "options": ["Padding removes the rare words from the vocabulary so the model has fewer to learn", "The network needs input of the same shape, but texts have different lengths", "Padding adds the sentiment label to the end of each sequence", "Padding converts each word into a dense vector"], "answer": [1], "explain": "Texts give sequences of different lengths. pad_sequences pads or truncates them to one fixed length so the network gets the same shape every time.", "source": "Week 11 lecture, slide 32", "flag": "", "deck": "w11"}, {"id": "w11-031", "week": 11, "topic": "Stemming versus lemmatization", "type": "explain", "q": "Compare stemming and lemmatization, with an example of each.", "model": "Stemming reduces a word to its root by removing prefixes and suffixes, using heuristics. It can give non-words, for example happily and happiness both become happi. Lemmatization turns a word into its dictionary form and considers context and meaning. It always gives a valid word, for example went becomes go and better becomes good. Both bring variants of a word to a common form.", "points": ["Stemming removes prefixes and suffixes using heuristics", "Stemming can produce non-words, for example happi", "Lemmatization uses context and meaning to give the dictionary form", "Gives a lemma example such as went to go or better to good"], "source": "Week 11 lecture, slide 16 to 19", "flag": "", "deck": "w11"}, {"id": "w11-032", "week": 11, "topic": "TF-IDF", "type": "explain", "q": "Explain how TF-IDF works, and calculate it for a term that appears once in a 4-term document, where 8 of the 200 documents in the corpus contain the term.", "model": "TF-IDF is a statistic that shows how important a word is to a document within a corpus. Term frequency is how often the term appears in the document divided by the number of terms, here 1 / 4 = 0.25. Inverse document frequency is the log of the number of documents over the number containing the term, here ln(200 / 8) = 3.21. TF-IDF multiplies them, giving 0.25 x 3.21, about 0.80. Each document then becomes a vector of these numbers.", "points": ["Shows how important a word is to a document in a corpus", "TF is 1 / 4 = 0.25", "IDF is ln(200 / 8) = 3.21", "TF-IDF is TF x IDF, about 0.80"], "source": "Week 11 lecture, slide 21 and 22", "flag": "", "deck": "w11"}, {"id": "w11-m01", "week": 11, "topic": "TF-IDF", "type": "single", "q": "Which term is expected to get a relatively high TF-IDF weight within a document?", "options": ["A term appearing frequently in almost every document in the corpus", "A term appearing once in every document", "A term appearing frequently in the document but rarely across the corpus", "A term absent from the document but frequent elsewhere"], "answer": [2], "explain": "High term frequency raises TF and rarity across the corpus raises IDF, so both push the score up.", "source": "Tutor's mock test, multiple choice question 20", "flag": "", "mock": true, "deck": "w11"}, {"id": "w11-035", "week": 11, "topic": "Text preprocessing", "type": "explain", "q": "Explain how raw text is prepared and turned into numbers for a text classification model such as a spam filter. Compare TF-IDF with word embeddings, and explain why word order matters.", "model": "Raw text is first cleaned. Irrelevant characters such as punctuation, hashtags and HTML tags are removed, and the text is lowercased because casing adds little meaning. Tokenization splits sentences into tokens such as words, and stop words like and, to and the are removed. Stemming or lemmatization brings variants of a word to a common form. The text is then vectorised, because models do maths on numbers. TF-IDF scores how important a word is to a document within the corpus and gives sparse vectors. Word embeddings such as Word2Vec or GloVe give dense vectors that capture meaning, so related words like king and queen are close. A model built on word frequencies ignores order, but order and context change meaning. So the text is turned into sequences, padded to a fixed length and passed through an embedding layer into an RNN or LSTM.", "points": ["Cleaning removes irrelevant characters and lowercases the text", "Tokenization, stop word removal and stemming or lemmatization", "TF-IDF gives sparse vectors of word importance", "Embeddings give dense vectors that capture meaning", "Order matters, so sequences are padded and fed to an RNN or LSTM"], "source": "Week 11 lecture, slide 7 to 34", "flag": "", "focus": true, "deck": "w11"}], "notes": [{"deck": "w01a", "html": "<h1 id=\"what-ai-is-and-the-types-of-ai\">What AI is and the types of\r\nAI<\/h1>\r\n<h2 id=\"defining-artificial-intelligence\">Defining artificial\r\nintelligence<\/h2>\r\n<p>John McCarthy coined the term in 1956 and described\r\n<strong>artificial intelligence<\/strong> as the science and engineering\r\nof making intelligent machines, especially intelligent computer\r\nprograms. The aim is for computers to do things we link with human\r\nintelligence. The machine does not have to work the way a brain works.\r\nIn computing, AI is the ability of a machine to mimic the behaviour of\r\nliving things, mainly humans, and only the outcome counts.<\/p>\r\n<p>The term is hard to define because its two words are not equally\r\nclear. <strong>Artificial<\/strong> means made by human effort, and\r\npeople agree on that. <strong>Intelligence<\/strong> means intellect,\r\nwisdom and understanding, and it is hard to define because it is hard to\r\nmeasure. There is no single test and no single score.<\/p>\r\n<blockquote>\r\n<p>A program can reach intelligent results by methods that look nothing\r\nlike human thought, and that still counts as AI.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"the-turing-test\">The Turing Test<\/h2>\r\n<p>Alan Turing asked whether machines can think. Thinking is too vague\r\nto test, so he replaced the question with one that can be tested,\r\nwhether a machine can pass a <strong>behaviour test<\/strong> for\r\nintelligence. A human <strong>judge<\/strong> communicates with a hidden\r\nentity and must decide whether it is a computer or a person. If the\r\njudge cannot tell, the computer has passed and is said to be\r\nintelligent.<\/p>\r\n<blockquote>\r\n<p>Passing shows behaviour that looks intelligent. It does not prove\r\nconsciousness, so it does not make a machine strong AI.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"weak-ai-and-strong-ai\">Weak AI and strong AI<\/h2>\r\n<p><strong>Weak AI<\/strong>, also called narrow AI, is built to solve\r\none specific problem. It follows predefined instructions and parameters\r\nand does not cover the full range of human thinking. Siri, Alexa,\r\nchatbots and self-driving cars are weak AI, and almost all AI today is\r\nweak. <strong>Strong AI<\/strong> would match human intelligence, with\r\nself-awareness, consciousness, creativity, learning and planning, so it\r\nwould be indistinguishable from a human mind. It exists only as a\r\ntheory.<\/p>\r\n<blockquote>\r\n<p>Weak does not mean simple. A self-driving car is very capable, but it\r\nis built for one job. Strong is about breadth.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"the-four-types-of-ai\">The four types of AI<\/h2>\r\n<p>The four types order AI by memory and understanding, from simple to\r\nadvanced.<\/p>\r\n<ol type=\"1\">\r\n<li><strong>Reactive machines<\/strong> have no memory and do one task,\r\nso the same input always gives the same output. They use statistics,\r\nfixed rules and pattern matching. Deep Blue, the chess program, and\r\nrecommendation systems are examples.<\/li>\r\n<li><strong>Limited memory machines<\/strong> can look into the past and\r\ntrack things over time. They learn like connected neurons, so they\r\nimprove with more training data. Deep learning systems such as ChatGPT\r\nare examples.<\/li>\r\n<li><strong>Theory of mind<\/strong> AI would understand human motives\r\nand reasoning, grasp intentions and predict behaviour. It would place\r\ninformation in context and work across many tasks, where classic machine\r\nlearning works in one domain.<\/li>\r\n<li><strong>Self-aware<\/strong> AI would have a sense of self and\r\nunderstand its own existence. It does not exist, partly because we do\r\nnot know enough about the brain and emotion to build it.<\/li>\r\n<\/ol>\r\n<blockquote>\r\n<p>Weak and strong is a split by breadth of ability. The four types are\r\na split by memory and understanding. Today's systems are weak AI and sit\r\nin the first two types.<\/p>\r\n<\/blockquote>\r\n"}, {"deck": "w01b", "html": "<h1 id=\"exploratory-data-analysis\">Exploratory data analysis<\/h1>\r\n<h2 id=\"what-eda-is-and-why-it-comes-first\">What EDA is and why it comes\r\nfirst<\/h2>\r\n<p><strong>Exploratory data analysis<\/strong>, or EDA, is the step where\r\nyou profile, summarise and visualise a dataset before building a model.\r\nIt shows the structure and quality of the data and the patterns and\r\nproblems in it. EDA finds <strong>missing values<\/strong>, duplicates,\r\n<strong>outliers<\/strong>, wrong data types and entry errors. It shows\r\ndistributions, skew and class imbalance, which decide the transforms and\r\nresampling you need. It also guides the choice of model, sets a\r\nrealistic baseline and flags leakage.<\/p>\r\n<p>Three techniques come up most.<\/p>\r\n<ul>\r\n<li><strong>Descriptive statistics<\/strong> such as mean, median,\r\nstandard deviation, minimum and maximum show the distribution and spread\r\nof each numerical feature.<\/li>\r\n<li><strong>Visualisation<\/strong> with histograms and box plots shows\r\nthe shape of a distribution, its skew and its outliers. A <strong>box\r\nplot<\/strong> marks points beyond the whiskers as possible\r\noutliers.<\/li>\r\n<li><strong>Correlation analysis<\/strong> shows how strongly numerical\r\nvariables move together. A coefficient near +1 or -1 is a strong linear\r\nrelationship, and near 0 is weak. A value of -0.85 is a strong negative\r\nlinear relationship.<\/li>\r\n<\/ul>\r\n<p>Too little EDA leaves these problems hidden. The model then trains on\r\nbad data, gives misleading results and predicts poorly.<\/p>\r\n<blockquote>\r\n<p>EDA cannot tell you how well a model will perform. It prepares the\r\ndata, and testing comes later.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"missing-values-and-outliers\">Missing values and outliers<\/h2>\r\n<p>For <strong>missing values<\/strong>, find which columns have gaps,\r\nhow many, and whether the gaps are linked to the outcome. That decides\r\nwhether to fill them, called imputation, or drop them. For\r\n<strong>outliers<\/strong>, a rule such as the interquartile range flags\r\nvalues far from the rest, and then each one is inspected. An age of 250\r\nis an entry error and should be fixed or removed. A very high income may\r\nbe real, so it needs a modelling choice such as a log transform.<\/p>\r\n<blockquote>\r\n<p>Never delete outliers automatically. Some are errors and some are the\r\nmost important cases.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"correlation-leakage-and-multicollinearity\">Correlation, leakage\r\nand multicollinearity<\/h2>\r\n<p>Two features that are strongly correlated carry the same information.\r\nA feature that correlates almost perfectly with the target points to\r\n<strong>leakage<\/strong>, where information from the answer has crept\r\ninto the inputs. The model looks excellent in testing and fails on new\r\ndata. <strong>Multicollinearity<\/strong> means one feature can be\r\npredicted from the others. It is measured with the variance inflation\r\nfactor and fixed by dropping, combining or regularising features.<\/p>\r\n<blockquote>\r\n<p>Correlation does not show cause. A strong correlation only says two\r\nvariables move together.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"class-imbalance\">Class imbalance<\/h2>\r\n<p><strong>Class imbalance<\/strong> means one class is much rarer than\r\nthe other, such as fraud among normal payments. Accuracy then misleads,\r\nbecause always guessing the common class scores high while catching\r\nnothing. EDA finds the imbalance through class counts. The responses are\r\n<strong>stratified splits<\/strong>, the <strong>F1 score<\/strong> or\r\nPR-AUC instead of accuracy, class weights, or resampling.<\/p>\r\n<blockquote>\r\n<p>Never delete the rare class to balance the data. It is usually the\r\nclass that matters.<\/p>\r\n<\/blockquote>\r\n"}, {"deck": "w02", "html": "<h1 id=\"classification-k-nn-and-decision-trees\">Classification, k-NN and\r\ndecision trees<\/h1>\r\n<h2 id=\"supervised-learning-and-classification\">Supervised learning and\r\nclassification<\/h2>\r\n<p>In <strong>supervised learning<\/strong> a model learns from labelled\r\nhistorical data to predict new cases. Each example has input\r\n<strong>features<\/strong> and an output <strong>label<\/strong>.\r\n<strong>Classification<\/strong> predicts a category, such as whether a\r\nloan applicant will default, yes or no. <strong>Regression<\/strong>\r\npredicts a continuous number, such as a price. The model outputs a\r\nprobability for each class, and a <strong>threshold<\/strong> turns that\r\ninto a label. Raising the threshold gives fewer false alarms but more\r\nmissed cases.<\/p>\r\n<blockquote>\r\n<p>The type of answer decides it. A category is classification and a\r\nnumber on a scale is regression.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"evaluating-a-classifier\">Evaluating a classifier<\/h2>\r\n<p>A <strong>confusion matrix<\/strong> counts true positives, false\r\npositives, true negatives and false negatives, and every measure comes\r\nfrom these four. <strong>Accuracy<\/strong> is the share of all\r\npredictions that are right, and it misleads on imbalanced data. A model\r\nthat always predicts the majority class can score 99% and catch\r\nnothing.<\/p>\r\n<p><strong>Precision<\/strong> asks, of the cases predicted positive, how\r\nmany really are positive. It matters when false alarms are costly, such\r\nas a fraud team with few investigators. <strong>Recall<\/strong> asks, of\r\nall the real positives, how many were caught. It matters when a miss is\r\ncostly, such as disease screening. The two pull against each other. The\r\n<strong>F1 score<\/strong> is the harmonic mean of precision and recall,\r\nso it gives one balanced number when classes are imbalanced.<\/p>\r\n<blockquote>\r\n<p>Precision looks at the predictions. Recall looks at the real\r\ncases.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"k-nearest-neighbours\">k-nearest neighbours<\/h2>\r\n<p><strong>k-NN<\/strong> classifies a new point by measuring its\r\ndistance to the training points, usually <strong>Euclidean\r\ndistance<\/strong>, finding the k nearest, and taking a <strong>majority\r\nvote<\/strong> among them. For regression it averages their values.<\/p>\r\n<p>The choice of k matters. A small k such as 1 follows single points\r\nclosely, so noise can decide the class and the model\r\n<strong>overfits<\/strong> with high variance. A larger k gives smoother\r\nboundaries and resists noise, but too large a k\r\n<strong>underfits<\/strong> with high bias. The best k is chosen by\r\ntesting several values on validation data with\r\n<strong>cross-validation<\/strong>.<\/p>\r\n<p>k-NN is <strong>lazy<\/strong> because it builds no model during\r\ntraining. It keeps the training data and does its work at prediction\r\ntime. It is <strong>non-parametric<\/strong> because it assumes no fixed\r\nform for the data. It is slow on large data, hurt by irrelevant\r\nfeatures, and needs scaled features, otherwise the feature with the\r\nlargest range dominates the distance.<\/p>\r\n<blockquote>\r\n<p>Choosing k on the training data always favours k = 1, which just\r\nmemorises the training set.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"decision-trees\">Decision trees<\/h2>\r\n<p>A <strong>decision tree<\/strong> splits the data on one feature at a\r\ntime, building readable if-then rules that end in leaves. To choose a\r\nsplit, it tries each feature and measures how mixed the child nodes are\r\nwith <strong>Gini impurity<\/strong>. Zero impurity means a node holds\r\none class only. It keeps the split with the biggest drop in impurity,\r\nthen repeats on each child. It stops when nodes are pure, no features\r\nremain, or a limit such as maximum depth is reached. A new case follows\r\nthe rules down to a leaf, which predicts its majority class.<\/p>\r\n<blockquote>\r\n<p>A tree does its work in training and prediction is fast. k-NN does\r\nthe opposite.<\/p>\r\n<\/blockquote>\r\n"}, {"deck": "w03", "html": "<h1 id=\"regression\">Regression<\/h1>\r\n<h2 id=\"regression-and-classification\">Regression and\r\nclassification<\/h2>\r\n<p><strong>Regression<\/strong> predicts a continuous number, such as\r\ntomorrow's electricity use in kilowatt hours, a price or a temperature.\r\n<strong>Classification<\/strong> predicts a category. Both are\r\nsupervised, so the model learns from labelled examples with input\r\n<strong>features<\/strong> and a target <strong>label<\/strong>.<\/p>\r\n<blockquote>\r\n<p>A count, such as the number of support tickets tomorrow, is a number\r\non a scale, so it is regression.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"linear-regression\">Linear regression<\/h2>\r\n<p><strong>Linear regression<\/strong> assumes the target can be written\r\nas a linear equation of the inputs. Each feature gets a\r\n<strong>coefficient<\/strong> for its contribution, plus an\r\n<strong>intercept<\/strong>. For any candidate line, each point has a\r\n<strong>residual<\/strong>, the gap between the predicted and actual\r\nvalue. <strong>Ordinary least squares<\/strong> picks the coefficients\r\nthat make the <strong>sum of squared residuals<\/strong> as small as\r\npossible. Squaring stops positive and negative gaps cancelling and gives\r\nlarge gaps extra weight.<\/p>\r\n<p>Its advantages are simplicity, low computational cost and\r\n<strong>interpretability<\/strong>, since each coefficient shows how an\r\ninput changes the prediction. Its limits are that it fits poorly when\r\nthe relationship is curved, and it is sensitive to outliers and to\r\nmulticollinearity.<\/p>\r\n<blockquote>\r\n<p>Fitting only a straight line to a curved relationship breaks the\r\nlinearity assumption.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"measuring-a-regression-model\">Measuring a regression model<\/h2>\r\n<ul>\r\n<li><strong>Mean absolute error<\/strong>, MAE, is the average size of\r\nthe errors. Every error counts in proportion, so it is less sensitive to\r\noutliers.<\/li>\r\n<li><strong>Mean squared error<\/strong>, MSE, squares each error before\r\naveraging, so a few large errors raise it sharply.<\/li>\r\n<li><strong>Root mean squared error<\/strong>, RMSE, is the square root\r\nof MSE and is in the same units as the target, so it is easier to\r\nexplain.<\/li>\r\n<li><strong>R squared<\/strong> shows how much of the variation in the\r\ntarget the model explains. 1 is a perfect fit. 0 means no better than\r\nalways predicting the mean. Below 0 means worse than that.<\/li>\r\n<\/ul>\r\n<blockquote>\r\n<p>MSE reacts most to a few very large errors. MAE treats them more\r\nfairly.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"random-forest-regression\">Random forest regression<\/h2>\r\n<p>A <strong>random forest<\/strong> builds many decision trees, each on\r\na random sample of rows and features, and averages their predictions.\r\nEach tree makes different mistakes, so averaging cancels much of the\r\nerror. This makes it more stable than one tree, less thrown by outliers\r\nand able to follow nonlinear patterns. It is harder to interpret than\r\nlinear regression. <strong>Gradient boosting<\/strong> also uses many\r\ntrees, but builds them one after another, each fixing the errors of the\r\nones before.<\/p>\r\n<blockquote>\r\n<p>Random forest trees are independent and averaged. Boosting trees are\r\nsequential.<\/p>\r\n<\/blockquote>\r\n"}, {"deck": "w04", "html": "<h1 id=\"clustering-and-pca\">Clustering and PCA<\/h1>\r\n<h2 id=\"supervised-and-unsupervised-learning\">Supervised and\r\nunsupervised learning<\/h2>\r\n<p><strong>Supervised learning<\/strong> uses labelled input and output\r\npairs and aims to predict outcomes for new data. <strong>Unsupervised\r\nlearning<\/strong> uses unlabelled data and aims to find structure in the\r\ndata itself. Its two main types are <strong>clustering<\/strong> and\r\n<strong>dimensionality reduction<\/strong>. A dataset of wine\r\nmeasurements with no column naming the wine type is an unsupervised\r\nproblem.<\/p>\r\n<h2 id=\"k-means\">K-means<\/h2>\r\n<p><strong>K-means<\/strong> groups unlabelled data into <strong>K\r\nclusters<\/strong>, with K chosen by the user. It places K\r\n<strong>centroids<\/strong> at random, assigns every point to its nearest\r\ncentroid, then moves each centroid to the <strong>mean<\/strong> of its\r\npoints. Moving the centroids changes which is nearest for some points,\r\nso the two steps repeat until no point changes cluster, called\r\n<strong>convergence<\/strong>. Its aim is to minimise\r\n<strong>inertia<\/strong>, the sum of squared distances from each point\r\nto its centroid.<\/p>\r\n<blockquote>\r\n<p>The random start means two runs with the same K can give different\r\nclusters.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"choosing-k-and-judging-the-clusters\">Choosing K and judging the\r\nclusters<\/h2>\r\n<p>The <strong>elbow method<\/strong> plots inertia against K. Inertia\r\nalways falls as K grows, because more centroids sit closer to the\r\npoints. The elbow is the K where the improvement suddenly drops, though\r\nit can be hard to see.<\/p>\r\n<p>The <strong>silhouette score<\/strong> measures how well each point\r\nfits its cluster. For one point, a is the average distance to points in\r\nits own cluster, called cohesion, and b is the average distance to\r\npoints in the nearest other cluster, called separation. The score runs\r\nfrom -1 to +1. Near +1 means the point fits its cluster well, near 0\r\nmeans it sits between two clusters, and negative means it is probably in\r\nthe wrong one. Run K-means for several values of K, average the score\r\nfor each, and choose the K with the highest score.<\/p>\r\n<blockquote>\r\n<p>The lowest inertia is not the best K. One cluster per point gives\r\nzero inertia and no useful groups.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"other-clustering-methods\">Other clustering methods<\/h2>\r\n<p><strong>DBSCAN<\/strong> groups points by density, so it can find\r\nclusters of any shape and does not need K in advance.\r\n<strong>Hierarchical clustering<\/strong> builds a tree diagram, called a\r\ndendrogram, showing how clusters merge or split.<\/p>\r\n<h2 id=\"principal-component-analysis\">Principal component analysis<\/h2>\r\n<p><strong>Dimensionality reduction<\/strong> cuts the number of features\r\nwhile keeping as much information as possible. It speeds up training,\r\nremoves noise and redundancy, reduces overfitting and allows plots in\r\ntwo or three dimensions.<\/p>\r\n<p><strong>Principal component analysis<\/strong>, PCA, is unsupervised.\r\nIt finds new directions, called <strong>principal components<\/strong>,\r\nalong which the data varies most. The steps are as follows.<\/p>\r\n<ol type=\"1\">\r\n<li>Centre the data by subtracting each feature's mean.<\/li>\r\n<li>Calculate the <strong>covariance matrix<\/strong>, which shows how\r\neach pair of features varies together.<\/li>\r\n<li>Find its <strong>eigenvectors<\/strong> and\r\n<strong>eigenvalues<\/strong>. Each eigenvector is a principal component,\r\nand its eigenvalue shows how much variance lies along it.<\/li>\r\n<li>Project the data onto the top few components.<\/li>\r\n<\/ol>\r\n<p>In the four-feature example, the first two components hold about 99%\r\nof the variance, so two numbers describe each row well.<\/p>\r\n<blockquote>\r\n<p>PCA uses no labels. Linear discriminant analysis uses class labels to\r\nseparate the classes.<\/p>\r\n<\/blockquote>\r\n"}, {"deck": "w05a", "html": "<h1 id=\"reinforcement-learning-and-q-learning\">Reinforcement learning\r\nand Q-learning<\/h1>\r\n<h2 id=\"reinforcement-learning\">Reinforcement learning<\/h2>\r\n<p>In <strong>reinforcement learning<\/strong> an <strong>agent<\/strong>\r\nlearns to make sequential decisions by interacting with an\r\n<strong>environment<\/strong> to reach a goal. The agent tries an action,\r\nthe environment responds with a <strong>reward<\/strong> or a\r\n<strong>penalty<\/strong>, and over time the agent learns which actions\r\ngive the best long-term outcome. For a self-driving car, the agent is\r\nthe driving system and the environment is the road, other cars and\r\ntraffic lights. Staying in lane is rewarded and a collision is\r\npenalised.<\/p>\r\n<p><strong>Supervised learning<\/strong> is given the right answer for\r\neach input in a fixed labelled dataset. Reinforcement learning is never\r\ntold the right action. It only learns how good an outcome was, the\r\nreward can come later, and its own actions shape what it sees next.<\/p>\r\n<blockquote>\r\n<p>The agent is the learner that acts. The environment is everything\r\noutside it that gives the reward.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"model-free-and-model-based\">Model-free and model-based<\/h2>\r\n<p>A <strong>model-free<\/strong> agent learns only from experienced\r\ntransitions and rewards, without learning how the environment works. A\r\nchess AI that finds good openings by playing thousands of games is\r\nmodel-free. A <strong>model-based<\/strong> agent holds a model of the\r\nenvironment, with transition probabilities and rewards, and uses it to\r\nplan ahead. A robot vacuum that predicts the result of different routes\r\nbefore moving is model-based.<\/p>\r\n<h2 id=\"q-learning\">Q-learning<\/h2>\r\n<p><strong>Q-learning<\/strong> is a model-free, value-based method. The\r\nagent keeps a <strong>Q-table<\/strong> with one entry for each state and\r\naction pair. Each entry, Q(s, a), estimates the total future reward of\r\ntaking action a in state s. The table starts at zero. A separate\r\n<strong>reward table<\/strong> holds the fixed immediate reward for each\r\nmove.<\/p>\r\n<p>The update rule is<\/p>\r\n<p>Q(state, action) = R(state, action) + G x max Q(next state, all\r\nactions)<\/p>\r\n<p>So the new value of a move is its immediate reward plus G times the\r\nbest value available from the next state. <strong>G<\/strong>, typically\r\n0.8, sets how much the future counts. If G were 0 the agent would only\r\ncare about the immediate reward.<\/p>\r\n<p>Values spread backwards from the goal. At first the agent moves at\r\nrandom. When it reaches the goal by chance, the move into the goal gets\r\na strong value. On later episodes, the move before it sees that value in\r\nthe next state and is strengthened too, and so on back to the start.\r\nMany <strong>episodes<\/strong> are needed, and the table has\r\n<strong>converged<\/strong> when its values stop changing.<\/p>\r\n<p>A warehouse robot is a real example. The states are its locations,\r\nthe actions are its moves, reaching the target gives a positive reward\r\nand hitting an obstacle gives a penalty.<\/p>\r\n<blockquote>\r\n<p>The reward table is fixed by the environment. The Q-table is learned\r\nand changes over time.<\/p>\r\n<\/blockquote>\r\n"}, {"deck": "w05b", "html": "<h1 id=\"genetic-algorithms\">Genetic algorithms<\/h1>\r\n<h2 id=\"what-a-genetic-algorithm-is\">What a genetic algorithm is<\/h2>\r\n<p>A <strong>genetic algorithm<\/strong> solves optimisation problems by\r\nimitating <strong>natural selection<\/strong>, where the fittest survive.\r\nJohn Holland developed it in the 1970s. It keeps a\r\n<strong>population<\/strong> of candidate solutions and improves the\r\nwhole population over many <strong>generations<\/strong>.<\/p>\r\n<p>The terms come from biology. A <strong>chromosome<\/strong> is one\r\ncandidate solution, often written as a bitstring such as 101110. A\r\n<strong>gene<\/strong> is one unit of that string, such as one bit.\r\n<strong>Fitness<\/strong> measures how good a solution is and decides\r\nwhich are kept.<\/p>\r\n<p>The loop runs as follows.<\/p>\r\n<ol type=\"1\">\r\n<li>Create a random initial population.<\/li>\r\n<li>Test each solution for fitness and rank them.<\/li>\r\n<li>Remove some bad solutions and copy some good ones.<\/li>\r\n<li>Make new candidates from the good ones with crossover and\r\nmutation.<\/li>\r\n<li>Repeat from step 2 until the best solution is good enough.<\/li>\r\n<\/ol>\r\n<blockquote>\r\n<p>The whole bitstring is the chromosome. One bit is a gene.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"crossover-and-mutation\">Crossover and mutation<\/h2>\r\n<p><strong>Crossover<\/strong> joins parts of two parent chromosomes to\r\nmake a child, so it reuses good features already in the population.\r\n<strong>Mutation<\/strong> makes a small random change to one chromosome,\r\nsuch as flipping a bit, so it brings in variety no current solution has.\r\nCrossover alone can only reshuffle what exists. Mutation lets the search\r\nreach new areas. Together they keep what works and still explore.<\/p>\r\n<h2 id=\"why-use-one\">Why use one<\/h2>\r\n<p>Differentiating an equation to find a minimum fails when the problem\r\nhas no equation, has several minima, or has many variables and\r\nconstraints. Blind generate and test ignores earlier guesses and may\r\ntake too long. A genetic algorithm also generates and tests, but each\r\ngeneration builds on the best of the last one, and it needs no equation.\r\nIt suits large search spaces such as scheduling and route planning and\r\nusually finds a good approximate answer. Its main drawback is that it\r\ncan be hard to encode a problem as chromosomes with a fitness\r\nmeasure.<\/p>\r\n<blockquote>\r\n<p>Crossover needs two parents. Mutation changes one chromosome.<\/p>\r\n<\/blockquote>\r\n"}, {"deck": "w06", "html": "<h1 id=\"neural-networks-and-how-they-learn\">Neural networks and how they\r\nlearn<\/h1>\r\n<h2 id=\"the-perceptron\">The perceptron<\/h2>\r\n<p>A <strong>perceptron<\/strong> is the simplest neural network, a\r\nsingle neuron with several inputs and one output. It is loosely modelled\r\non a brain cell, with inputs in place of dendrites and an output in\r\nplace of the axon. Each input is multiplied by a\r\n<strong>weight<\/strong>, which sets how strongly that input counts. The\r\nproducts are added up and a <strong>bias<\/strong> is added, which shifts\r\nthe total whatever the inputs are. The <strong>activation\r\nfunction<\/strong> then checks the weighted sum and decides whether the\r\nneuron's output connections fire. A step function gives 0 or 1, and\r\nsigmoid and softmax are other common choices.<\/p>\r\n<p>A single perceptron can only learn <strong>linearly\r\nseparable<\/strong> patterns, where one straight line splits the classes.\r\nIt cannot learn XOR however long it trains. A network joins many\r\nperceptrons in layers, an input layer, one or more <strong>hidden\r\nlayers<\/strong> and an output layer. Each layer turns its inputs into\r\nfeatures, and together the layers turn the inputs into a prediction.<\/p>\r\n<blockquote>\r\n<p>The weight scales one input, the bias is added once, and the\r\nactivation function makes the decision.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"why-the-activation-function-matters\">Why the activation function\r\nmatters<\/h2>\r\n<p>The activation function adds <strong>nonlinearity<\/strong>. Without\r\nit, or with only linear activations, a stack of layers collapses into\r\none linear function, so the extra layers add no power to model curved\r\npatterns.<\/p>\r\n<h2 id=\"how-a-network-learns\">How a network learns<\/h2>\r\n<p>Learning is supervised. The right output for each training example is\r\nknown, as with the iris dataset, where four flower measurements are the\r\nfeatures and the flower type is the label. Training runs as a loop.<\/p>\r\n<ol type=\"1\">\r\n<li><strong>Initialise<\/strong> every weight and bias with random\r\nvalues, so the first predictions are random.<\/li>\r\n<li><strong>Feed forward<\/strong> from the input layer to the output\r\nlayer to make a prediction.<\/li>\r\n<li>Apply the <strong>cost function<\/strong> to measure the error\r\nbetween the prediction and the true label.<\/li>\r\n<li><strong>Backpropagate<\/strong> the error to each layer to find each\r\nweight's share of it.<\/li>\r\n<li>Use <strong>gradient descent<\/strong> to adjust the weights and\r\nbiases to reduce the error.<\/li>\r\n<\/ol>\r\n<p>The loop repeats over many <strong>epochs<\/strong> until the cost\r\nconverges or a maximum number of epochs is reached. The trained network\r\nis then tested on unseen data, called <strong>inference<\/strong>.<\/p>\r\n<p><strong>Weights and biases<\/strong> are the <strong>trainable\r\nparameters<\/strong>. The data and the architecture stay fixed during\r\ntraining.<\/p>\r\n<blockquote>\r\n<p>Loss is the error for one example. Cost is the average loss over the\r\ntraining set.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"cost-functions\">Cost functions<\/h2>\r\n<p>A cost function turns the error into one number that training tries\r\nto make as small as possible. <strong>Mean squared error<\/strong> suits\r\nregression, such as house prices, and gives far predictions a large\r\npenalty. <strong>Binary cross entropy<\/strong> suits classification with\r\ntargets of 0 or 1, such as spam or not spam.<\/p>\r\n<h2 id=\"gradient-descent\">Gradient descent<\/h2>\r\n<p><strong>Gradient descent<\/strong> uses the slope of the cost with\r\nrespect to each weight to decide which way to move it. A positive slope\r\nmeans the cost rises as the weight rises, so the weight is lowered.\r\nRepeating this lowers the cost step by step.<\/p>\r\n<blockquote>\r\n<p>Backpropagation finds the gradients. Gradient descent uses them to\r\nchange the weights.<\/p>\r\n<\/blockquote>\r\n"}, {"deck": "w07", "html": "<h1 id=\"backpropagation-and-gradient-descent\">Backpropagation and\r\ngradient descent<\/h1>\r\n<h2 id=\"training-with-backpropagation\">Training with\r\nbackpropagation<\/h2>\r\n<p>Training starts with <strong>random weights and biases<\/strong>, so\r\nthe first prediction is poor. In the <strong>forward pass<\/strong>, each\r\nneuron takes its weighted inputs plus bias, called the net input, and\r\napplies the <strong>logistic activation function<\/strong> to get its\r\noutput. The hidden layer's outputs feed the output layer, and the output\r\nlayer gives the prediction. The forward pass changes no weights.<\/p>\r\n<p>The <strong>cost function<\/strong> combines the errors of the output\r\nneurons into one <strong>total error<\/strong>. In the worked example the\r\ntwo outputs predict about 0.75 and 0.77 against targets of 0.01 and\r\n0.99, so the error is large.<\/p>\r\n<p><strong>Backpropagation<\/strong> sends this error back through the\r\nnetwork. For each weight it works out the <strong>partial\r\nderivative<\/strong> of the total error with respect to that weight,\r\nwhich says how much a small change in the weight would change the error.\r\nA weight does not touch the error directly. It changes its neuron's net\r\ninput, which changes the neuron's output, which changes the error. The\r\n<strong>chain rule<\/strong> multiplies these three links, so one hard\r\nquestion becomes three easy ones.<\/p>\r\n<p><strong>Gradient descent<\/strong> then updates each weight. It\r\nsubtracts the gradient times the <strong>learning rate<\/strong> from the\r\ncurrent weight, moving it in the direction that lowers the error. The\r\nworked example uses a learning rate of 0.5. The same process updates\r\nevery weight and bias in every layer, and the cycle repeats over epochs\r\nuntil the error reaches the desired accuracy or the maximum number of\r\nepochs is reached.<\/p>\r\n<blockquote>\r\n<p>The forward pass makes a prediction. Backpropagation finds the\r\ngradients. Gradient descent changes the weights.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"why-backpropagation-is-needed\">Why backpropagation is\r\nneeded<\/h2>\r\n<p>The error is measured only at the output, but every layer's weights\r\naffect it. Backpropagation passes the error back systematically so\r\nearlier layers can be corrected too. Without it only the last layer\r\ncould learn.<\/p>\r\n<h2 id=\"the-learning-rate\">The learning rate<\/h2>\r\n<p>The learning rate sets the size of each update step and is chosen\r\nbefore training. A rate that is too large makes steps overshoot the\r\nminimum, so the error bounces up and down and training is unstable. A\r\nrate that is too small makes learning very slow. A good rate lets the\r\nerror fall steadily.<\/p>\r\n<blockquote>\r\n<p>If the error bounces, lower the learning rate. Setting it to zero\r\nwould stop learning altogether.<\/p>\r\n<\/blockquote>\r\n"}, {"deck": "w08", "html": "<h1 id=\"convolutional-neural-networks\">Convolutional neural\r\nnetworks<\/h1>\r\n<h2 id=\"why-cnns-for-images\">Why CNNs for images<\/h2>\r\n<p>A traditional fully connected network is a good classifier but a poor\r\nfeature extractor, and it does not scale well to images. It flattens the\r\nimage and connects every pixel to every neuron, which needs very many\r\nweights and loses the layout of the picture. The meaning of an image\r\nsits in groups of neighbouring pixels. A <strong>convolutional neural\r\nnetwork<\/strong>, CNN, assumes its input is an image and exploits these\r\n<strong>local features<\/strong>, so it extracts features better and\r\nscales to images.<\/p>\r\n<h2 id=\"the-components\">The components<\/h2>\r\n<p>A CNN has two stages. The feature stage breaks the image into\r\nfeatures, and the classification stage predicts the label.<\/p>\r\n<ul>\r\n<li>A <strong>convolutional layer<\/strong> slides small\r\n<strong>filters<\/strong>, also called kernels, over the image. At each\r\nposition the filter multiplies its weights with the pixels under it to\r\ngive one value, building a <strong>feature map<\/strong>. Different\r\nfilters detect edges, corners and textures. Filters start random and are\r\nlearned in training. 3 x 3 is the most common size.<\/li>\r\n<li><strong>Stride<\/strong> is how far the filter moves each step. A\r\nstride of 2 gives a smaller output than a stride of 1.\r\n<strong>Padding<\/strong> adds a border, often zeros, so edge pixels are\r\ncovered and the output can stay close to the input size.<\/li>\r\n<li>An <strong>activation layer<\/strong>, usually <strong>ReLU<\/strong>,\r\nadds nonlinearity by passing positive values and setting negative ones\r\nto zero.<\/li>\r\n<li>A <strong>pooling layer<\/strong> shrinks the feature maps to save\r\ncomputation and keep the strongest features. <strong>Max\r\npooling<\/strong> keeps the largest value in each window. Average pooling\r\nkeeps the mean. Pooling also keeps dominant features that do not depend\r\non position or rotation, which helps training.<\/li>\r\n<li><strong>Batch normalisation<\/strong> subtracts the mini-batch mean\r\nof each feature and divides by its standard deviation, then applies a\r\nlearned scale and shift. This handles covariate shift between batches\r\nand speeds up training.<\/li>\r\n<li>A <strong>dropout layer<\/strong> randomly ignores some neuron\r\noutputs during training so the network cannot memorise the training\r\ndata, which reduces <strong>overfitting<\/strong>.<\/li>\r\n<li><strong>Fully connected layers<\/strong> come last. A flatten layer\r\nturns the feature maps into one vector, and a <strong>softmax<\/strong>\r\noutput gives a probability for each class.<\/li>\r\n<\/ul>\r\n<h2 id=\"two-calculations\">Two calculations<\/h2>\r\n<p>The output size of a convolution is (input - kernel + 2 x padding) /\r\nstride + 1. A 32 x 32 input with a 3 x 3 kernel, stride 1 and no padding\r\ngives (32 - 3) / 1 + 1 = <strong>30 x 30<\/strong>.<\/p>\r\n<p>Max pooling 2 x 2 on [2, 7; 5, 3] gives <strong>7<\/strong>, the\r\nlargest value. Average pooling would give 4.25.<\/p>\r\n<blockquote>\r\n<p>Overfitting means a tiny training error and a large error on new\r\ndata. Dropout helps prevent it.<\/p>\r\n<\/blockquote>\r\n"}, {"deck": "w09", "html": "<h1 id=\"segmentation-and-object-detection\">Segmentation and object\r\ndetection<\/h1>\r\n<h2 id=\"classification-detection-and-segmentation\">Classification,\r\ndetection and segmentation<\/h2>\r\n<p><strong>Image classification<\/strong> gives one label to the whole\r\nimage, such as cat. <strong>Object detection<\/strong> finds each object\r\nand gives it a class and a <strong>bounding box<\/strong>. <strong>Image\r\nsegmentation<\/strong> gives a class to every pixel, so it shows the\r\nexact shape of each object. A photo of a person and a dog cannot be\r\nlabelled as just DOG or HUMAN, which is why detection and segmentation\r\nexist.<\/p>\r\n<p>Segmentation suits tasks where the exact outline matters, such as the\r\nboundary of a tumour in a scan. Detection gives a coarser but faster\r\nresult, so it suits real-time tasks such as finding pedestrians and cars\r\nin video. A segmentation network is trained on <strong>mask\r\nimages<\/strong> that mark the object pixels, and it outputs a predicted\r\nmask.<\/p>\r\n<blockquote>\r\n<p>Classification says what. Detection says what and where. Segmentation\r\nsays exactly which pixels.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"u-net\">U-Net<\/h2>\r\n<p><strong>U-Net<\/strong> is a segmentation network shaped like the\r\nletter U. It turns the image into features and then rebuilds a segmented\r\nimage.<\/p>\r\n<ul>\r\n<li><strong>Contraction blocks<\/strong> each use two 3 x 3 convolution\r\nlayers followed by 2 x 2 <strong>max pooling<\/strong>, so the maps\r\nshrink and features are extracted.<\/li>\r\n<li>The <strong>bottleneck<\/strong> links the contraction and expansion\r\npaths.<\/li>\r\n<li><strong>Expansion blocks<\/strong> each use two 3 x 3 convolution\r\nlayers followed by 2 x 2 <strong>up-sampling<\/strong>, so the maps grow\r\nback towards the image size.<\/li>\r\n<li><strong>Copy and crop<\/strong> connections, also called skip\r\nconnections, pass each contraction feature map to the matching expansion\r\nblock. They restore the spatial detail lost during max pooling, which\r\ngives sharp boundaries.<\/li>\r\n<\/ul>\r\n<p>The output is a segmentation mask.<\/p>\r\n<blockquote>\r\n<p>Contraction shrinks with max pooling. Expansion grows with\r\nup-sampling.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"yolo\">YOLO<\/h2>\r\n<p><strong>YOLO<\/strong>, You Only Look Once, is a real-time object\r\ndetector that processes the whole image in one forward pass, which makes\r\nit much faster than older methods such as Faster R-CNN. The image is\r\nresized, for example to 416 x 416, normalised to the range 0 to 1, and\r\ndivided into a grid, 13 x 13 in YOLOv3. A CNN backbone such as Darknet\r\nextracts features. Each grid cell is responsible for objects whose\r\ncentre falls in it and predicts several <strong>anchor boxes<\/strong>,\r\neach with its centre, width, height and a <strong>confidence\r\nscore<\/strong>. Each cell also predicts class probabilities.<\/p>\r\n<p><strong>Non-maximum suppression<\/strong> removes duplicate boxes.\r\nSort boxes by confidence and keep the highest. Compare each other box\r\nwith it using <strong>intersection over union<\/strong>, which measures\r\noverlap. Discard boxes that overlap above a threshold such as 0.5, since\r\nthey are duplicates, and repeat.<\/p>\r\n<blockquote>\r\n<p>Confidence picks the best box. Intersection over union only measures\r\noverlap.<\/p>\r\n<\/blockquote>\r\n"}, {"deck": "w10", "html": "<h1 id=\"recurrent-neural-networks\">Recurrent neural networks<\/h1>\r\n<h2 id=\"why-order-matters\">Why order matters<\/h2>\r\n<p>In some tasks each example stands alone, such as classifying an iris\r\nflower from four measurements. In others the <strong>order<\/strong> of\r\nthe data carries meaning, such as speech recognition, translation,\r\nhandwriting and time series. The cat killed the dog and the dog killed\r\nthe cat use the same words with opposite meanings.<\/p>\r\n<h2 id=\"how-a-simple-rnn-works\">How a simple RNN works<\/h2>\r\n<p>A <strong>recurrent neural network<\/strong>, RNN, processes a\r\nsequence one step at a time. A feedforward network or CNN only passes\r\ninformation from one layer to the next. An RNN adds a <strong>recurrent\r\nconnection<\/strong> that forms a loop. At each step the hidden node\r\ncombines the current input with the <strong>hidden state<\/strong> from\r\nthe previous step, passes the result through an activation function, and\r\nsends a copy forward as the new hidden state. The hidden state is the\r\nnetwork's memory of earlier inputs. Unfolding the loop shows the same\r\ncell repeated once for each time step. To classify a sentence, the RNN\r\nreads it word by word and passes its final output to a feedforward\r\nlayer.<\/p>\r\n<h2 id=\"the-limit-vanishing-gradients\">The limit, vanishing\r\ngradients<\/h2>\r\n<p>An RNN is trained with <strong>backpropagation through time<\/strong>.\r\nThe forward pass runs through the sequence and computes the loss, and\r\nthe backward pass sends the error back across the time steps. Each\r\nstep's gradient depends on the gradient of the step after it. Going\r\nback, the gradient is multiplied by small values again and again, so it\r\nshrinks exponentially. This is the <strong>vanishing gradient<\/strong>\r\nproblem. The earliest steps barely learn, so the RNN has\r\n<strong>short-term memory<\/strong> and struggles with <strong>long-term\r\ndependencies<\/strong>. To finish I grew up in France and I speak fluent,\r\nit needs France from far back.<\/p>\r\n<p><strong>Truncated backpropagation through time<\/strong> only looks\r\nback over a fixed window of steps. It is faster, but it cannot learn\r\ndependencies longer than the window.<\/p>\r\n<blockquote>\r\n<p>The gradient shrinks toward zero, so the early steps stop\r\nlearning.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"how-an-lstm-fixes-it\">How an LSTM fixes it<\/h2>\r\n<p>A <strong>long short-term memory<\/strong> network, LSTM, is a special\r\nRNN built to remember for long periods. A standard RNN cell has a single\r\nlayer, while an LSTM cell has four interacting layers. It adds a\r\n<strong>cell state<\/strong> that runs along the whole chain like a\r\nconveyor belt, with only minor linear interactions, so information can\r\npass along unchanged. <strong>Gates<\/strong> control it. Each gate is a\r\nsigmoid layer, giving values from 0 to 1, and a pointwise\r\nmultiplication.<\/p>\r\n<ol type=\"1\">\r\n<li>The <strong>forget gate<\/strong> looks at the previous hidden state\r\nand current input and decides how much of the old cell state to keep. 1\r\nkeeps it and 0 removes it.<\/li>\r\n<li>The <strong>input gate<\/strong> decides which values to update, and\r\na tanh layer creates new candidate values, which are added to the cell\r\nstate.<\/li>\r\n<li>The <strong>output gate<\/strong> decides which parts of the cell\r\nstate, passed through tanh, become the output.<\/li>\r\n<\/ol>\r\n<p>A <strong>GRU<\/strong> is a simpler variant with only an update gate\r\nand a reset gate, so it needs less computation.<\/p>\r\n<blockquote>\r\n<p>Forget removes old information, input adds new information and output\r\nfilters what is shown.<\/p>\r\n<\/blockquote>\r\n"}, {"deck": "w11", "html": "<h1 id=\"natural-language-processing\">Natural language processing<\/h1>\r\n<h2 id=\"what-nlp-is\">What NLP is<\/h2>\r\n<p><strong>Natural language processing<\/strong>, NLP, is a branch of\r\nmachine learning and AI that derives meaning from human language and\r\nhandles it automatically. It covers speech and text. Its uses include\r\nchatbots, sentiment analysis of reviews, fake news detection,\r\ntranslation, question answering, summarising and speech recognition.\r\n<strong>Natural language understanding<\/strong> works out what a\r\nsentence means. <strong>Natural language generation<\/strong> turns a\r\nformal statement into natural language. The lecture's running example is\r\na spam filter for text messages.<\/p>\r\n<h2 id=\"preparing-text\">Preparing text<\/h2>\r\n<p>Raw text is cleaned before a model sees it.<\/p>\r\n<ol type=\"1\">\r\n<li><strong>Remove irrelevant characters<\/strong> such as punctuation,\r\nhashtags, HTML tags and encoding symbols.\r\n<code>&lt;p&gt;Hey there!!!&lt;/p&gt; #Excited<\/code> becomes Hey there\r\nExcited.<\/li>\r\n<li><strong>Normalise case<\/strong> by lowercasing, since casing tells\r\nlittle about sentiment. SIX chances to win CASH! becomes six chances to\r\nwin cash!.<\/li>\r\n<li><strong>Tokenize<\/strong>, splitting sentences into tokens, usually\r\nwords but sometimes subwords or characters. <strong>N-grams<\/strong> are\r\nsequences of N tokens in a row that capture context.<\/li>\r\n<li><strong>Remove stop words<\/strong>, common words such as and, to and\r\nthe that add little meaning.<\/li>\r\n<li><strong>Stem or lemmatize<\/strong>. <strong>Stemming<\/strong> cuts\r\nprefixes and suffixes by rule, so happily and happiness both become\r\nhappi, which is not a word. <strong>Lemmatization<\/strong> uses meaning\r\nto give the dictionary form, so went becomes go and better becomes\r\ngood.<\/li>\r\n<\/ol>\r\n<blockquote>\r\n<p>Stemming can give non-words. Lemmatization always gives a real\r\nword.<\/p>\r\n<\/blockquote>\r\n<h2 id=\"turning-text-into-numbers\">Turning text into numbers<\/h2>\r\n<p>Models do maths on numbers, so text is <strong>vectorised<\/strong>.\r\nTechniques include bag of words, one-hot encoding and TF-IDF.<\/p>\r\n<p><strong>TF-IDF<\/strong> shows how important a word is to one document\r\nwithin a collection, the corpus. TF is how often the term appears\r\ndivided by the number of terms in the document. IDF is ln of the number\r\nof documents over the number that contain the term. With 200 documents,\r\n8 containing aid, and a 4-term document containing aid once, the working\r\nis below.<\/p>\r\n<ul>\r\n<li>TF = 1 / 4 = 0.25<\/li>\r\n<li>IDF = ln(200 / 8) = 3.21<\/li>\r\n<li>TF-IDF = 0.25 x 3.21 = about 0.80<\/li>\r\n<\/ul>\r\n<p>A word frequent in one document but rare across the corpus scores\r\nhigh. TF-IDF vectors are <strong>sparse<\/strong>.<\/p>\r\n<p><strong>Word embeddings<\/strong> are <strong>dense<\/strong> vectors\r\nof continuous values that capture meaning, so words used in similar\r\ncontexts, such as king and queen, get similar vectors. Word2Vec, GloVe\r\nand FastText are pre-trained embeddings. An <strong>embedding\r\nlayer<\/strong> inside a network turns words into dense vectors,\r\nreplacing inefficient sparse one-hot vectors.<\/p>\r\n<h2 id=\"why-word-order-matters\">Why word order matters<\/h2>\r\n<p>A model built on word frequencies ignores order, but order and\r\ncontext change meaning, and that car is sick could be praise or a\r\ncomplaint. So the text is turned into number <strong>sequences<\/strong>,\r\nfor example with <code>texts_to_sequences<\/code>, which keeps the word\r\norder. RNNs and LSTMs need a fixed input size, so\r\n<code>pad_sequences<\/code> pads or truncates every sequence to the same\r\nlength. The sequences pass through an embedding layer into an RNN or\r\nLSTM.<\/p>\r\n<blockquote>\r\n<p>Padding fixes the length of each sequence. The embedding layer turns\r\neach word into a dense vector.<\/p>\r\n<\/blockquote>\r\n"}]};
