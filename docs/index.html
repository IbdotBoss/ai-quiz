neighbouring pixels that together form a shape, and a traditional network is not designed to use these local features. It treats pixels as separate inputs, so it is good at classifying but poor at extracting features. A CNN assumes the input is an image. This lets the architecture encode visual features and use local patterns, so it extracts features better and runs more efficiently.", "points": ["Image meaning comes from groups of neighbouring pixels", "Traditional networks do not use local features and are weak at feature extraction", "A CNN assumes the input is an image", "So a CNN uses local features and works more efficiently"], "source": "Week 8 lecture, slide 5 and 6", "flag": "", "core": true, "deck": "w08"}, {"id": "w08-025", "week": 8, "topic": "Convolution", "type": "explain", "q": "Describe what the convolution operation does and the role of the filter.", "model": "Convolution slides a small 2D array of weights, called a filter or kernel, over the image and multiplies it with each patch of input. This is a linear operation that extracts and keeps local features. Different filters pick out different features such as edges or corners. The result is a smaller output that is easier to process without losing features that matter for prediction. The filters begin random and are improved by training.", "points": ["A filter or kernel is a 2D array of weights applied across the input", "It multiplies the weights with each patch of input in a linear operation", "Different filters detect different features such as edges and corners", "The output is smaller but keeps the features that matter", "Filters start random and are learned in training"], "source": "Week 8 lecture, slide 8 to 11 and 19", "flag": "", "core": true, "deck": "w08"}, {"id": "w08-026", "week": 8, "topic": "Stride and padding", "type": "explain", "q": "Explain what stride and padding control in a convolution.", "model": "Stride is the amount the kernel shifts each time as it moves across the input. It moves right by the stride until the width is covered, then drops down and repeats. A larger stride means fewer positions and a smaller output. Padding adds extra values around the border of the image so that edge pixels are handled properly. The most common choice is zero padding, but reflection and replication padding also exist.", "points": ["Stride is the shift of the kernel at each step", "A larger stride visits fewer positions", "Padding adds a border to handle edge pixels", "Zero padding is common and reflection or replication padding are alternatives"], "source": "Week 8 lecture, slide 13 to 16", "flag": "", "core": true, "deck": "w08"}, {"id": "w08-027", "week": 8, "topic": "Pooling", "type": "explain", "q": "Compare max pooling and average pooling and explain why a CNN uses pooling.", "model": "A pooling layer reduces the spatial size of the convolved features, which lowers the computing power needed. It also extracts dominant features that do not depend much on position or rotation, which keeps training effective. Max pooling returns the largest value in the patch covered by the kernel. Average pooling returns the mean of all values in that patch. Max pooling keeps the strongest response while average pooling gives a smoother summary.", "points": ["Pooling reduces spatial size and computation", "It keeps dominant features that are position and rotation invariant", "Max pooling returns the maximum value in the patch", "Average pooling returns the mean of the patch"], "source": "Week 8 lecture, slide 20 and 21", "flag": "", "core": true, "deck": "w08"}, {"id": "w08-028", "week": 8, "topic": "Activation", "type": "explain", "q": "Explain the purpose of the activation layer in a CNN and name the most popular activation function.", "model": "An activation function is a mathematical equation that decides the output of a neuron. In a CNN it works across two dimensions like a screen and decides whether each output pixel is activated. It acts as a gate between the inputs feeding a neuron and its output going to the next layer. It also adds the nonlinearity that a plain dot product lacks. ReLU is the most popular activation function in CNNs.", "points": ["It decides the output of a neuron", "It acts as a gate between inputs and output", "It decides whether each output pixel is activated", "ReLU is the most popular choice"], "source": "Week 8 lecture, slide 22 and 23", "flag": "The nonlinearity point is standard textbook knowledge. Slide 4 only says the dot product is optionally followed by a nonlinearity.", "core": true, "deck": "w08"}, {"id": "w08-029", "week": 8, "topic": "Batch normalisation", "type": "explain", "q": "Explain how batch normalisation helps the training of a CNN.", "model": "Very different looking batches cause a large shift in the data distribution, called covariate shift. The network is misled into changing its weights towards one odd batch, so it bounces between distributions and learns slowly. Batch normalisation works on feature maps across a mini batch. For each feature it finds the mean and variance, subtracts the mean and divides by the standard deviation. This speeds up learning and gives faster convergence.", "points": ["Different batches cause covariate shift", "Covariate shift slows training because the network bounces between distributions", "It subtracts the mini batch mean and divides by the standard deviation for each feature", "Learning is faster and converges sooner"], "source": "Week 8 lecture, slide 24 to 26", "flag": "", "core": true, "deck": "w08"}, {"id": "w08-030", "week": 8, "topic": "Dropout", "type": "explain", "q": "Explain what overfitting is and how a dropout layer helps to prevent it.", "model": "Overfitting happens when the error on the training set is very small but the error on new data is large. The network has memorised the training examples and has not learned to generalise. Dropout is a simple regularisation technique. During training it randomly ignores some layer outputs, so the layer looks different from one pass to the next. This stops the network relying on memorising the whole training set.", "points": ["Overfitting means tiny training error but large error on new data", "The network has memorised rather than generalised", "Dropout is a regularisation technique", "It randomly ignores some layer outputs during training"], "source": "Week 8 lecture, slide 27 and 28", "flag": "", "core": true, "deck": "w08"}, {"id": "w08-031", "week": 8, "topic": "Fully connected layers", "type": "explain", "q": "Describe the role of the fully connected layers at the end of a CNN, including the flatten layer and softmax.", "model": "Once convolution and pooling have found features, fully connected layers use them to predict the best label for the image. The flatten layer first turns the feature maps into a single vector. Normal fully connected layers then apply weights and biases to the features. The output layer uses softmax, which turns the raw values, called logits, into a probability for each label. The probabilities sum to one.", "points": ["They take the output of the feature stage and predict a label", "Flatten turns feature maps into a single vector", "Normal layers apply weights and biases", "Softmax turns logits into probabilities that sum to one"], "source": "Week 8 lecture, slide 29 to 32", "flag": "", "core": true, "deck": "w08"}, {"id": "w08-032", "week": 8, "topic": "CNN structure", "type": "explain", "q": "Describe the layers of a CNN and the order in which an image moves through them to produce a label.", "model": "A typical CNN stacks layers that reduce the image size while keeping the features that separate one class from another. Convolutional layers apply filters to find local features. Activation layers act as gates on the outputs, normalisation layers keep feature values comparable, pooling layers shrink the maps and dropout layers fight overfitting. This is the feature stage. A flatten layer then feeds fully connected layers, and a softmax output layer gives the label probabilities.", "points": ["Six layer types are convolution, pooling, activation, normalisation, dropout and fully connected", "The feature stage reduces size while keeping key features", "Flatten feeds the fully connected layers", "Softmax gives the final label probabilities"], "source": "Week 8 lecture, slide 17, 18 and 29", "flag": "", "core": true, "deck": "w08"}, {"id": "w09-001", "week": 9, "topic": "Segmentation", "type": "single", "q": "What is the key difference between image classification and image segmentation?", "options": ["Classification gives one label to the whole image, while segmentation labels every pixel", "Classification labels each pixel, while segmentation labels the whole image once", "Classification draws bounding boxes, while segmentation gives one class number", "Classification needs a mask label, while segmentation needs a one hot vector"], "answer": [0], "explain": "Segmentation localises the target by assigning a class to every pixel. Classification only returns one label for the entire picture.", "source": "Week 9 lecture, slide 8", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-002", "week": 9, "topic": "Segmentation", "type": "single", "q": "A photo shows a person and a small dog. Why is a single label such as DOG or HUMAN not enough?", "options": ["A CNN cannot give a single label when two objects are present", "A single label needs every image resized to a fixed shape", "One label cannot show where objects are or how many there are", "A single label needs the fully connected layers to be removed"], "answer": [2], "explain": "Classification cannot say where an object is or how many there are, and one label does not fit a scene with several objects. That is why methods that locate objects are needed.", "source": "Week 9 lecture, slide 5", "flag": "", "core": false, "deck": "w09"}, {"id": "w09-003", "week": 9, "topic": "Segmentation labels", "type": "multi", "q": "Which statements about the labels used to train a segmentation network are correct?", "options": ["Only the centre coordinates and the box size are required", "The label is given as a binary mask image", "The mask shows where the target object sits across the image", "Producing ground truth masks is labour intensive", "One categorical label is enough for the whole image"], "answer": [1, 2, 3], "explain": "Segmentation needs a mask for every training image, which takes a lot of effort. A single label or a box description would not give pixel level detail.", "source": "Week 9 lecture, slide 6 and 9", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-004", "week": 9, "topic": "Segmentation", "type": "single", "q": "What should a segmentation network output for a given input image?", "options": ["One class prediction for the whole image", "A predicted mask image showing where the object is", "A list of bounding boxes with confidence scores", "A one hot vector with one entry per class"], "answer": [1], "explain": "Unlike a classifier, which gives one label, a segmentation network produces a prediction mask that localises the object. Boxes with confidence scores belong to object detection.", "source": "Week 9 lecture, slide 7", "flag": "", "core": false, "deck": "w09"}, {"id": "w09-005", "week": 9, "topic": "Segmentation uses", "type": "multi", "q": "Which tasks need a class label for each pixel?", "options": ["Giving one label to each photo in a holiday album", "Analysing satellite images", "Predicting whether an email is spam", "Outlining a brain tumour in a scan", "Understanding the road scene for a self driving car"], "answer": [1, 3, 4], "explain": "Segmentation suits tasks that need localisation, such as medical imaging, self driving cars and satellite analysis. Labelling whole photos is plain classification.", "source": "Week 9 lecture, slide 8 and 13", "flag": "", "core": false, "deck": "w09"}, {"id": "w09-006", "week": 9, "topic": "U-Net", "type": "single", "q": "What are the three sections of a U-Net model?", "options": ["Encoding blocks, a pooling layer and classification blocks", "Convolution blocks, a dropout section and softmax blocks", "Contraction blocks, a grid layer and anchor blocks", "Contraction blocks, a bottleneck and expansion blocks"], "answer": [3], "explain": "U-Net shrinks the image in contraction blocks, passes through a bottleneck and then rebuilds an image in expansion blocks. The shape of this layout looks like a U.", "source": "Week 9 lecture, slide 10 and 11", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-007", "week": 9, "topic": "U-Net", "type": "single", "q": "Why does an expansion block of U-Net receive a copy and crop of feature maps from the matching contraction block?", "options": ["To reduce the number of classes the network must predict", "To remove duplicate bounding boxes from the output", "To make up for information lost during max pooling", "To convert the mask back into a single label"], "answer": [2], "explain": "Max pooling throws away detail on the way down. Copying and cropping the earlier feature maps hands some of that detail back so the reconstructed mask is sharper.", "source": "Week 9 lecture, slide 11", "flag": "", "core": false, "deck": "w09"}, {"id": "w09-008", "week": 9, "topic": "U-Net", "type": "multi", "q": "Which statements about U-Net are correct?", "options": ["The bottleneck sits between the contraction and expansion blocks", "It is trained with a single label per image", "Its contraction blocks end with an up sampling layer", "Expansion blocks use an up sampling layer", "It converts the image into a feature vector and then reconstructs a segmented image", "It outputs bounding boxes around each object"], "answer": [0, 3, 4], "explain": "U-Net encodes then rebuilds the image, with the bottleneck in the middle and up sampling in the expansion path. It outputs a mask, not boxes, and needs mask labels.", "source": "Week 9 lecture, slide 10 and 11", "flag": "", "core": false, "deck": "w09"}, {"id": "w09-009", "week": 9, "topic": "Segmentation versus detection", "type": "single", "q": "How does the output of object detection differ from the output of segmentation?", "options": ["Detection draws boxes with class labels, which is coarser but faster than a mask", "Detection gives a pixel mask, which is finer but slower than boxes", "Detection gives one label for the whole image, which is the fastest option", "Detection gives a feature vector, which cannot show object position"], "answer": [0], "explain": "Segmentation produces a detailed pixel level mask of each object. Detection gives a box and a label, a rougher but quicker result.", "source": "Week 9 lecture, slide 13", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-010", "week": 9, "topic": "Choosing a method", "type": "single", "q": "A team needs the exact shape and boundary of a tumour in a medical scan. Which approach fits best?", "options": ["Object detection with bounding boxes only", "Plain classification of the whole scan", "A YOLO grid with anchor boxes", "Image segmentation, for example with U-Net"], "answer": [3], "explain": "Only a pixel level mask shows the exact outline. Boxes are too coarse and a whole image label gives no location at all.", "source": "Week 9 lecture, slide 13", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-011", "week": 9, "topic": "Choosing a method", "type": "single", "q": "A system must find pedestrians and vehicles in video as it plays. Which approach suits this real time task?", "options": ["Image segmentation with a mask for every frame", "Object detection, for example with YOLO", "Classification with one label for each frame", "A bigger classifier that ignores location"], "answer": [1], "explain": "Detection gives faster boxes and labels, which suits real time work. A single frame label cannot say where each pedestrian or vehicle is.", "source": "Week 9 lecture, slide 13 and 18", "flag": "", "core": false, "deck": "w09"}, {"id": "w09-012", "week": 9, "topic": "Detection labels", "type": "single", "q": "Why is a one hot label by itself not enough for object detection?", "options": ["The label must also give what is needed to rebuild the bounding box", "A one hot vector cannot be compared with the network output", "A one hot vector cannot be used with convolutional layers", "A one hot vector needs a separate mask image for every class"], "answer": [0], "explain": "A one hot vector names the class but says nothing about where the object is. A detection label adds the box centre, width and height.", "source": "Week 9 lecture, slide 15", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-013", "week": 9, "topic": "Detection labels", "type": "multi", "q": "Which items belong in the label an object detector predicts for one object?", "options": ["The centre coordinates of the box", "One label that describes the whole image", "The class label", "The width and height of the box", "A full pixel mask of the object"], "answer": [0, 2, 3], "explain": "A detection label has at least five values, which are x, y, width, height and class. A pixel mask belongs to segmentation.", "source": "Week 9 lecture, slide 15 and 16", "flag": "", "core": false, "deck": "w09"}, {"id": "w09-014", "week": 9, "topic": "YOLO", "type": "single", "q": "Why is YOLO described as extremely fast compared with older methods such as Faster R-CNN?", "options": ["It skips the CNN and works on raw pixels directly", "It only handles images with a single object in them", "It processes the entire image in one forward pass", "It labels every pixel before drawing any box"], "answer": [2], "explain": "YOLO stands for You Only Look Once, because it looks at the whole image in a single pass. It still uses a CNN and it does not label every pixel.", "source": "Week 9 lecture, slide 18", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-015", "week": 9, "topic": "YOLO preprocessing", "type": "multi", "q": "Which steps does an input image go through before the YOLO network uses it?", "options": ["Drawing a pixel mask for each object", "Division into an S by S grid", "Resizing to a fixed shape", "Normalising pixel values to a scale of 0 to 1", "Conversion to a single grayscale channel"], "answer": [1, 2, 3], "explain": "Images are resized, normalised and split into a grid. Normalising stops large pixel values dominating and helps the network learn faster. Grayscale conversion and masks are not part of it.", "source": "Week 9 lecture, slide 19", "flag": "", "core": false, "deck": "w09"}, {"id": "w09-016", "week": 9, "topic": "YOLO grid", "type": "single", "q": "In YOLO, which grid cell is responsible for detecting a particular object?", "options": ["Every cell that the object touches", "The cell that contains the centre of the object", "The cell in the top left corner of the image", "The cell with the lowest confidence score"], "answer": [1], "explain": "Each cell detects objects whose centre falls inside it. This is quicker than checking every possible region as R-CNN does.", "source": "Week 9 lecture, slide 19", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-017", "week": 9, "topic": "YOLO grid", "type": "multi", "q": "Which statements about YOLO grid cells are correct?", "options": ["The grid avoids checking every possible region of the image", "Each cell predicts several bounding boxes", "Each predicted box carries a confidence score", "Each cell is responsible for objects whose centre falls inside it"], "answer": [0, 1, 2, 3], "explain": "YOLO gives each grid cell the job of detecting objects centred in it and predicts multiple boxes with confidence scores per cell. All four statements are correct.", "source": "Week 9 lecture, slide 19, 24 and 25", "flag": "", "core": false, "deck": "w09"}, {"id": "w09-018", "week": 9, "topic": "YOLO backbone", "type": "single", "q": "What does the CNN backbone of YOLO, such as Darknet, do?", "options": ["It removes overlapping boxes using intersection over union", "It resizes the image to a fixed shape and scales the pixels", "It assigns one class label to the entire image", "It extracts features such as edges and shapes into a feature map"], "answer": [3], "explain": "The backbone is a CNN that builds the feature map from which boxes and classes are predicted. Removing overlaps is the job of non maximum suppression.", "source": "Week 9 lecture, slide 22", "flag": "", "core": false, "deck": "w09"}, {"id": "w09-019", "week": 9, "topic": "YOLO boxes", "type": "single", "q": "What does each predicted bounding box in YOLO contain?", "options": ["A pixel mask, a class number and the image resolution", "The grid size, the number of anchors and the class count", "A centre position, a width and height, and a confidence score", "A softmax vector for the whole image and a colour histogram"], "answer": [2], "explain": "Each box gives x and y for the centre, w and h for the size, and a probability that an object is present. A pixel mask belongs to segmentation.", "source": "Week 9 lecture, slide 24", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-020", "week": 9, "topic": "Anchor boxes", "type": "single", "q": "Why does each YOLO grid cell predict several anchor boxes?", "options": ["Because objects come in different shapes and sizes", "Because one box per cell would be too slow to compute", "Because anchors replace the need for a CNN backbone", "Because anchors are used to normalise the pixel values"], "answer": [0], "explain": "A cell may hold a car and a person, which need differently shaped boxes. Several anchors let the model cover varied shapes.", "source": "Week 9 lecture, slide 25", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-021", "week": 9, "topic": "Class prediction", "type": "single", "q": "How does the way YOLOv3 predicts classes differ from older YOLO versions?", "options": ["It uses softmax instead of sigmoid, so one object can have several classes", "It stops predicting classes and only predicts box positions", "It predicts one class for each pixel instead of each box", "It uses sigmoid instead of softmax, so one object can have several classes"], "answer": [3], "explain": "Older versions used softmax so each object received one class. Sigmoid lets several classes apply to the same object, which is useful for multi label problems.", "source": "Week 9 lecture, slide 28", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-022", "week": 9, "topic": "Non maximum suppression", "type": "single", "q": "Why is non maximum suppression applied to YOLO predictions?", "options": ["The network produces too few boxes for each object", "Several boxes can land on one object, so duplicates are removed", "Pixel values must be scaled back to the range 0 to 255", "The confidence scores must be turned into class labels"], "answer": [1], "explain": "Many boxes can land on one object. Non maximum suppression keeps the best box and discards the duplicates so each object appears once.", "source": "Week 9 lecture, slide 29", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-023", "week": 9, "topic": "Non maximum suppression", "type": "multi", "q": "Which steps are part of non maximum suppression?", "options": ["Repeat for the remaining boxes", "Keep the box with the highest confidence", "Discard remaining boxes that overlap the kept box above the threshold", "Sort the boxes by confidence score", "Merge all overlapping boxes into a pixel mask", "Discard the lowest confidence boxes regardless of overlap"], "answer": [0, 1, 2, 3], "explain": "The procedure keeps the most confident box and removes boxes that overlap it too much, then repeats. It is the overlap with the kept box that decides, not confidence alone.", "source": "Week 9 lecture, slide 29", "flag": "", "core": false, "deck": "w09"}, {"id": "w09-024", "week": 9, "topic": "Intersection over union", "type": "single", "q": "In non maximum suppression, what is intersection over union used for?", "options": ["To measure how much one box overlaps another, to spot duplicates", "To measure how confident the model is that an object is present", "To decide which class an object belongs to", "To count how many grid cells the image has"], "answer": [0], "explain": "A high overlap with the chosen box shows the box is a duplicate of the same object, so it is removed. Overlap says nothing about class or confidence.", "source": "Week 9 lecture, slide 29", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-025", "week": 9, "topic": "Segmentation", "type": "explain", "q": "Explain the difference between image classification and image segmentation and why segmentation needs different labels.", "model": "Classification assigns one label to the whole image, which is not enough when the target fills a small area or several objects share the frame. Segmentation assigns a class to each pixel, so it shows where the target is and can find several of them. Because of this the training label must be a binary mask image, not a single category. The network also outputs a prediction mask. Producing the ground truth masks is labour intensive.", "points": ["Classification gives one label for the whole image", "Segmentation labels each pixel and so shows where objects are", "Training labels must be binary mask images", "Ground truth masks are labour intensive to produce"], "source": "Week 9 lecture, slide 5 to 9", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-026", "week": 9, "topic": "U-Net", "type": "explain", "q": "Describe the structure of U-Net and say how it produces a segmented image.", "model": "U-Net turns the image into a feature vector and then rebuilds an image from it, and its layout looks like the letter U. Contraction blocks use convolution layers followed by max pooling to shrink the maps. The bottleneck sits between the two halves. Expansion blocks use convolution layers followed by up sampling to grow the maps again until a segmented prediction mask is produced.", "points": ["Contraction blocks use convolution then max pooling", "The bottleneck sits between contraction and expansion", "Expansion blocks use convolution then up sampling", "The output is a reconstructed segmented image"], "source": "Week 9 lecture, slide 10 and 11", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-027", "week": 9, "topic": "U-Net", "type": "explain", "q": "Explain why U-Net uses copy and crop connections.", "model": "Max pooling in the contraction blocks throws away some spatial information as the maps shrink. Each expansion block therefore receives a copy and crop of the feature maps from the matching contraction block. This hands the lost detail back to the expansion path. It helps the network rebuild a more accurate segmented image than it could from the compressed vector alone.", "points": ["Max pooling loses spatial information", "Feature maps are copied from the matching contraction block", "The copy hands the lost detail back to the expansion block", "The rebuilt mask is more accurate"], "source": "Week 9 lecture, slide 11", "flag": "The last point about accuracy is a reasonable inference. Slide 11 only says copy and crop compensates for information loss.", "core": false, "deck": "w09"}, {"id": "w09-028", "week": 9, "topic": "Segmentation versus detection", "type": "explain", "q": "Compare image segmentation and object detection and give one situation where each is the better choice.", "model": "Segmentation classifies every pixel and gives a detailed mask with the exact shape and boundary of each object. It suits medical imaging and satellite analysis. Object detection draws bounding boxes and gives each a class label. It is coarser but faster, so it suits real time tasks such as finding pedestrians or vehicles. U-Net is a segmentation model, while YOLO is a detection model.", "points": ["Segmentation gives pixel level masks and exact boundaries", "Detection gives bounding boxes with class labels", "Detection is coarser but faster", "Gives one use for each, such as medical imaging for segmentation and vehicle detection for detection"], "source": "Week 9 lecture, slide 13", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-029", "week": 9, "topic": "Detection labels", "type": "explain", "q": "Compare the label used for image classification with the label used for object detection.", "model": "In classification the label is a one hot vector that only says which class the whole image belongs to. In object detection the label must name the class and also hold what is needed to rebuild the bounding box. The model predicts at least five values, which are the box centre x and y, the width and height, and the class label. Detection therefore tells us both what and where.", "points": ["Classification uses a one hot vector for the whole image", "Detection needs the class plus box information", "Detection predicts at least five values, x, y, width, height and class", "Detection says what the object is and where it is"], "source": "Week 9 lecture, slide 15 and 16", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-030", "week": 9, "topic": "YOLO", "type": "explain", "q": "Explain how YOLO detects objects in an image, from input to final output.", "model": "YOLO resizes the image to a fixed shape, normalises the pixels and divides it into a grid. A CNN backbone extracts a feature map. Each grid cell predicts several bounding boxes with a confidence score and predicts class probabilities. Because the whole image is handled in one forward pass, YOLO is fast. Non maximum suppression then removes overlapping duplicates. The final output is a list of boxes, each with a class label and confidence score.", "points": ["The image is resized, normalised and divided into a grid", "A CNN backbone extracts a feature map", "Each cell predicts boxes, confidence scores and classes", "Non maximum suppression removes duplicates", "The output is boxes with class labels and confidence scores"], "source": "Week 9 lecture, slide 18 to 31", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-031", "week": 9, "topic": "YOLO grid and anchors", "type": "explain", "q": "Explain the role of the grid and anchor boxes in YOLO.", "model": "YOLO splits the image into an S by S grid and each cell is responsible for objects whose centre falls inside it. This is faster and more efficient than checking every possible region as R-CNN does. Each cell predicts several boxes using anchors, which are boxes of different shapes. Anchors help the model handle objects of varying sizes, for example one anchor suited to a car and another to a person in the same cell.", "points": ["Image is divided into an S by S grid", "A cell handles objects whose centre is inside it", "The grid is faster than checking every region", "Anchors let a cell predict objects of different shapes and sizes"], "source": "Week 9 lecture, slide 19, 21 and 25", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-032", "week": 9, "topic": "Non maximum suppression", "type": "explain", "q": "Describe how non maximum suppression removes duplicate detections.", "model": "Several boxes can overlap the same object, so redundant boxes must be removed. All boxes are sorted by confidence score and the one with the highest score is kept. Each remaining box is compared with it using intersection over union. If the overlap is above a threshold, such as 0.5, the box is a duplicate and is discarded. If it is below the threshold the box is kept. The process repeats for the remaining boxes.", "points": ["Many boxes may overlap one object", "Sort by confidence and keep the highest", "Compare others using intersection over union", "Discard those above the threshold and keep those below", "Repeat until all boxes are handled"], "source": "Week 9 lecture, slide 29", "flag": "", "core": true, "deck": "w09"}, {"id": "w09-033", "week": 9, "topic": "Class prediction", "type": "explain", "q": "Explain how YOLO predicts class labels and how the activation used changed in later versions.", "model": "After predicting boxes, YOLO outputs a vector of class scores for each detected object, showing how likely each type is, such as car, person or dog. Older versions used softmax, which assigns one class to each object. YOLOv3 and later use sigmoid instead. This allows more than one class prediction for the same object, which helps in multi label classification.", "points": ["Class scores are output for each detected object", "Older versions used softmax with one class per object", "YOLOv3 and later use sigmoid", "Sigmoid allows multiple classes per object"], "source": "Week 9 lecture, slide 28", "flag": "", "core": true, "deck": "w09"}, {"id": "w10-001", "week": 10, "topic": "Sequential data", "type": "single", "q": "Which task needs a model that uses the order of the data?", "options": ["Translating a sentence from one language to another", "Predicting a flower type from four fixed measurements", "Deciding the species of a plant from one photo", "Sorting a table of unrelated records by one column"], "answer": [0], "explain": "In translation the order of the words changes the meaning, so history matters. Flower measurements are independent examples with no time order.", "source": "Week 10 lecture, slide 3 and 4", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-002", "week": 10, "topic": "Sequential data", "type": "single", "q": "Why do the sentences \"The cat killed the dog\" and \"The dog killed the cat\" show that order matters?", "options": ["They use different words, so a model must learn each word separately", "They have different lengths, so a model needs padding", "They use the same words, but the order changes the meaning", "They are both too short for a model to classify"], "answer": [2], "explain": "The words are identical and only the order differs, yet the meaning is opposite. A model that ignores order cannot tell them apart.", "source": "Week 10 lecture, slide 4", "flag": "", "core": false, "deck": "w10"}, {"id": "w10-003", "week": 10, "topic": "RNN architecture", "type": "single", "q": "What extra type of connection does an RNN have compared with an ordinary feedforward network or CNN?", "options": ["A connection that skips every second layer", "A recurrent connection that forms a cycle", "A connection that links every input pixel to every output", "A connection that copies the filter to the next layer"], "answer": [1], "explain": "Feedforward networks and CNNs only connect one layer to the next. An RNN adds a recurrent connection that feeds information back in a loop.", "source": "Week 10 lecture, slide 6", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-004", "week": 10, "topic": "Sequential memory", "type": "single", "q": "To predict which way a ball is moving, why is a sequence of frames better than a single frame?", "options": ["One frame cannot be fed into a neural network", "Extra frames make the colours easier to tell apart", "One frame has too few pixels to show a ball", "One frame cannot show where the ball has been"], "answer": [3], "explain": "Direction depends on earlier positions. A sequence of snapshots gives that history, which is the idea behind sequential memory in an RNN.", "source": "Week 10 lecture, slide 7", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-005", "week": 10, "topic": "Hidden state", "type": "single", "q": "In an RNN, what is the hidden state?", "options": ["The label that the network predicts for the sequence", "The weights that never change during training", "A representation of previous inputs, passed forward through the loop", "A copy of the input image kept for reference"], "answer": [2], "explain": "The loop passes prior information forward and this information is the hidden state. It gives the network a form of memory of what came before.", "source": "Week 10 lecture, slide 8", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-006", "week": 10, "topic": "Sequential data", "type": "multi", "q": "Which of these are problems where the order of the data matters?", "options": ["Time series forecasting", "Video sequence prediction", "Handwriting recognition", "Speech recognition", "Labelling iris flowers from four measurements"], "answer": [0, 1, 2, 3], "explain": "Speech, handwriting, video and time series all depend on what came before or after. Iris flower labelling treats each row as independent.", "source": "Week 10 lecture, slide 3 and 4", "flag": "", "core": false, "deck": "w10"}, {"id": "w10-007", "week": 10, "topic": "RNN architecture", "type": "single", "q": "At a given time step, what does the hidden layer of an RNN receive?", "options": ["The current input and the previous hidden state", "Only the current input, with no earlier information", "Only the final output from the whole sequence", "The class labels of all future steps"], "answer": [0], "explain": "The hidden layer combines the input at time t with the hidden state from the step before, which itself depends on earlier inputs. This is how history is carried forward.", "source": "Week 10 lecture, slide 10 and 11", "flag": "", "core": false, "deck": "w10"}, {"id": "w10-008", "week": 10, "topic": "RNN architecture", "type": "multi", "q": "Which statements describe what happens in an RNN hidden node?", "options": ["The output is sent onwards to the output layer", "The result is passed through an activation function", "A copy of the output is forwarded to the next step as working memory", "The current input is concatenated with the working memory from the previous step"], "answer": [0, 1, 2, 3], "explain": "The node joins the new input to the old memory, applies an activation and sends the result both onwards and forwards in time. All four statements are correct.", "source": "Week 10 lecture, slide 13", "flag": "", "core": false, "deck": "w10"}, {"id": "w10-009", "week": 10, "topic": "Sequence classification", "type": "single", "q": "An RNN reads a sentence word by word and its final output is passed to a feedforward layer. What is this used for?", "options": ["To undo the effect of the hidden state", "To split the sentence back into single words", "To choose which filters to apply to the text", "To classify something such as the intent of the sentence"], "answer": [3], "explain": "By the final step the RNN has encoded information from all earlier words, so its output can be used to classify the intent.", "source": "Week 10 lecture, slide 15 and 16", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-010", "week": 10, "topic": "Vanishing gradient", "type": "single", "q": "What does the vanishing gradient problem mean for training an RNN?", "options": ["Gradients grow too large as they pass back, so weights become unstable", "Gradients shrink as they pass back, so early steps barely learn", "Gradients are lost only at the output layer, so predictions are random", "Gradients vanish because the learning rate was set to zero"], "answer": [1], "explain": "Each step makes the adjustment smaller than the one before it, so the earliest layers hardly change. That is why an RNN has short term memory.", "source": "Week 10 lecture, slide 17 to 19", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-011", "week": 10, "topic": "Vanishing gradient", "type": "multi", "q": "Which statements about the vanishing gradient problem are correct?", "options": ["Earlier layers are barely adjusted because the gradients are tiny", "Gradients shrink exponentially as they are backpropagated", "It only affects the output layer", "It is common in very deep fully connected networks and in RNNs", "Gradients grow without limit and cause overflow"], "answer": [0, 1, 3], "explain": "Small adjustments in later layers lead to even smaller ones earlier on, so early layers fail to learn. It is a problem of shrinking, not growing, gradients.", "source": "Week 10 lecture, slide 18 and 19", "flag": "", "core": false, "deck": "w10"}, {"id": "w10-012", "week": 10, "topic": "Backpropagation through time", "type": "single", "q": "What is computed at the end of the forward pass when training an RNN with backpropagation through time?", "options": ["The total loss between true and estimated labels", "The partial derivative of the loss for every weight", "The updated weights for every layer in the network", "The learning rate to use in the next epoch"], "answer": [0], "explain": "The forward pass takes the input through the hidden states and works out the loss. Partial derivatives come later, in the backward pass.", "source": "Week 10 lecture, slide 20 and 21", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-013", "week": 10, "topic": "Backpropagation through time", "type": "single", "q": "What happens in the backward pass of backpropagation through time?", "options": ["The input passes through the hidden states to estimate a label", "The hidden state is reset to zero at every time step", "The loss is sent back and the weight changes come from the chain rule", "The window of time steps is made longer after each epoch"], "answer": [2], "explain": "The backward pass sends the loss back through the network and uses the chain rule to work out how much each weight should change.", "source": "Week 10 lecture, slide 22", "flag": "", "core": false, "deck": "w10"}, {"id": "w10-014", "week": 10, "topic": "Truncated backpropagation", "type": "single", "q": "How does truncated backpropagation through time tackle the vanishing gradient problem?", "options": ["It adds a gate that deletes the oldest hidden state", "It looks back over only a moving window of time steps", "It replaces the RNN with a feedforward network", "It raises the size of the gradients at each step"], "answer": [1], "explain": "Normal backpropagation goes through the whole sequence, which makes gradients vanish. Limiting the window avoids far away steps.", "source": "Week 10 lecture, slide 23", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-015", "week": 10, "topic": "Truncated backpropagation", "type": "multi", "q": "Which statements about truncated backpropagation through time are correct?", "options": ["Dependencies longer than the window cannot be learned", "It still passes backwards through the entire sequence", "It is less complex because far away steps add no gradient", "It can learn dependencies that are longer than the window", "It is much faster than normal backpropagation through time"], "answer": [0, 2, 4], "explain": "Using a window saves time and complexity but cuts off long range links. That limit is its main drawback.", "source": "Week 10 lecture, slide 23", "flag": "", "core": false, "deck": "w10"}, {"id": "w10-016", "week": 10, "topic": "Long term dependencies", "type": "single", "q": "A model must finish the sentence \"I grew up in France and I speak fluent ...\". Why can truncated backpropagation struggle here?", "options": ["The word France is too short to be stored as a hidden state", "The window always drops the most recent word first", "The sentence has to be fed into the network in reverse order", "The word France may fall outside the window, so the link is not learned"], "answer": [3], "explain": "The nearby words only show that a language is coming. The word France is needed to pick the language, and a long gap can put it outside the window.", "source": "Week 10 lecture, slide 24", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-017", "week": 10, "topic": "LSTM", "type": "single", "q": "What is the cell state in an LSTM?", "options": ["A gate that decides what information to forget", "A layer that flattens the input into a vector", "A line running along the chain, like a conveyor belt", "A copy of the loss kept during training"], "answer": [2], "explain": "The cell state carries information straight along the chain with only minor linear changes. Gates carefully add to or remove from it. The forget gate is one of those gates, not the cell state.", "source": "Week 10 lecture, slide 26", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-018", "week": 10, "topic": "LSTM gates", "type": "multi", "q": "Which statements about an LSTM gate are correct?", "options": ["It is built from a sigmoid layer and a pointwise multiplication", "It outputs values between minus one and one", "A value of one lets everything through", "A value of zero lets nothing through"], "answer": [0, 2, 3], "explain": "A sigmoid outputs values between zero and one, which say how much of each component to let through. Minus one to one is the range of tanh.", "source": "Week 10 lecture, slide 27 and 31", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-019", "week": 10, "topic": "LSTM gates", "type": "single", "q": "What is the job of the forget gate in an LSTM?", "options": ["It decides which information to throw away from the cell state", "It creates candidate values to add to the cell state", "It decides which part of the cell state to output", "It resets the hidden state of the previous step"], "answer": [0], "explain": "The forget gate outputs a number between 0 and 1 for each value in the cell state. A 1 means keep it completely and a 0 means get rid of it.", "source": "Week 10 lecture, slide 28", "flag": "", "core": false, "deck": "w10"}, {"id": "w10-020", "week": 10, "topic": "LSTM gates", "type": "multi", "q": "Which parts belong to the step where an LSTM stores new information in the cell state?", "options": ["The output gate chooses what to send to the next layer", "The hidden state of the previous step is reset to zero", "A second layer builds a vector of new candidate values", "A sigmoid input gate decides which values to update"], "answer": [2, 3], "explain": "Storing new information has two parts, an input gate that picks which values to update and a layer that creates candidates. Output filtering is a separate, later step.", "source": "Week 10 lecture, slide 29", "flag": "", "core": false, "deck": "w10"}, {"id": "w10-021", "week": 10, "topic": "LSTM gates", "type": "single", "q": "What does the output step of an LSTM produce?", "options": ["An unfiltered copy of the whole cell state", "A new set of candidate values to add to the cell state", "A list of values that the forget gate threw away", "A filtered version of the cell state, passed through tanh"], "answer": [3], "explain": "A sigmoid layer decides which parts to output and the cell state is pushed through tanh to lie between minus one and one. The two are multiplied, so only chosen parts leave.", "source": "Week 10 lecture, slide 31", "flag": "", "core": false, "deck": "w10"}, {"id": "w10-022", "week": 10, "topic": "LSTM", "type": "single", "q": "How does the internal structure of an LSTM differ from a standard RNN?", "options": ["A standard RNN has four interacting layers, while an LSTM has a single layer", "A standard RNN has a single layer, while an LSTM has four interacting layers", "A standard RNN has no hidden state, while an LSTM has one", "A standard RNN has gates, while an LSTM has none"], "answer": [1], "explain": "The repeating module of an LSTM is more elaborate, with several interacting layers that make up the gates. A plain RNN uses just one.", "source": "Week 10 lecture, slide 25", "flag": "", "core": false, "deck": "w10"}, {"id": "w10-023", "week": 10, "topic": "GRU", "type": "multi", "q": "Which statements about a gated recurrent unit are correct?", "options": ["It is a simplified variant of the LSTM", "It has more gates than an LSTM", "It has an update gate and a reset gate", "It needs less computational power than an LSTM", "It removes the recurrent connection altogether"], "answer": [0, 2, 3], "explain": "A GRU keeps the gating idea but uses fewer gates, so it still models temporal patterns with less computation.", "source": "Week 10 lecture, slide 32", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-024", "week": 10, "topic": "Sequential data", "type": "explain", "q": "Explain the difference between tasks that are not sequence based and tasks where sequence matters, with one example of each.", "model": "In a task that is not sequence based, each example is independent and there is no temporal behaviour, so order and history do not matter. Predicting an iris flower type from its four measurements is an example. In other tasks the order carries meaning and earlier or later information changes the answer. Machine translation, speech recognition, video prediction and time series are examples. The cat and dog sentences use the same words but have opposite meanings.", "points": ["Non sequence tasks have independent examples and no history", "Gives an example such as iris flower classification", "Sequence tasks depend on order and context", "Gives a sequence example such as translation, speech or time series"], "source": "Week 10 lecture, slide 3 and 4", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-025", "week": 10, "topic": "RNN", "type": "explain", "q": "Describe how a recurrent neural network remembers earlier inputs.", "model": "An RNN adds a recurrent connection that forms a cycle, so information from one step can be passed to the next. This passed on information is the hidden state, a representation of previous inputs. At each time step the current input is combined with the previous hidden state and sent through an activation function. The result goes to the output layer and a copy is passed to the next step as working memory. This gives the network sequential memory.", "points": ["A recurrent connection forms a cycle", "The hidden state represents previous inputs", "Current input is combined with the previous hidden state", "A copy of the output is passed forward as working memory"], "source": "Week 10 lecture, slide 6 to 13", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-026", "week": 10, "topic": "RNN", "type": "explain", "q": "Explain how an RNN reads a sentence word by word and then uses it to classify an intent.", "model": "The sentence is broken into a sequence of words. The RNN encodes the first word and produces an output. The next word is then fed in together with the hidden state from the previous step. This repeats until the final word. By then the hidden state holds information from all the earlier words. The final output is therefore built from the whole sequence, and it can be passed to a feedforward layer to classify the intent.", "points": ["Sentence is split into words fed in one at a time", "Each step uses the previous hidden state", "Final step has encoded information from all words", "Final output goes to a feedforward layer to classify intent"], "source": "Week 10 lecture, slide 15 and 16", "flag": "", "core": false, "deck": "w10"}, {"id": "w10-027", "week": 10, "topic": "Vanishing gradient", "type": "explain", "q": "Explain the vanishing gradient problem and why it gives an RNN short term memory.", "model": "In backpropagation each layer works out its gradient from the layer after it. If the adjustments there are already small, the adjustment for the current layer is even smaller, so gradients shrink exponentially as they travel back. The earliest layers or steps then receive tiny gradients and barely learn. In an RNN this means information from early steps is hard to retain over long sequences, which is the short term memory problem.", "points": ["Each layer's gradient depends on the one after it", "Gradients shrink exponentially going backwards", "Early layers barely adjust and fail to learn", "RNN struggles to retain information from earlier steps"], "source": "Week 10 lecture, slide 17 to 19", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-028", "week": 10, "topic": "Backpropagation through time", "type": "explain", "q": "Describe the forward and backward passes of backpropagation through time.", "model": "Training an RNN uses a loss function that measures the error between the true label and the predicted label. In the forward pass the input goes through the hidden states and the estimated label is calculated. The loss is computed at each step, and the total loss is the result of the pass. In the backward pass the total loss is propagated back through the network. Partial derivatives and the chain rule measure how much each weight should change.", "points": ["Loss function measures error between true and predicted label", "Forward pass runs input through hidden states and computes total loss", "Backward pass propagates the loss back", "Partial derivatives and the chain rule give weight changes"], "source": "Week 10 lecture, slide 20 to 22", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-029", "week": 10, "topic": "Truncated backpropagation", "type": "explain", "q": "Explain the benefit and the drawback of truncated backpropagation through time.", "model": "Normal backpropagation through time goes back through the whole sequence, which makes gradients vanish. Truncated backpropagation only considers a moving window of time steps. This is much faster and less complex, because gradients from faraway steps are not included. The drawback is that dependencies longer than the window length cannot be learned. For example the clue France may sit too far back to help predict the word French.", "points": ["Normal version goes through the whole sequence and gradients vanish", "Truncated uses a moving window", "It is faster and less complex", "It cannot learn dependencies longer than the window"], "source": "Week 10 lecture, slide 23 and 24", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-030", "week": 10, "topic": "LSTM", "type": "explain", "q": "Explain why an LSTM handles long sequences better than a simple recurrent network.", "model": "An LSTM is a special kind of RNN designed to remember information for long periods. Its key is the cell state, which runs straight along the chain like a conveyor belt with only minor linear changes. Information is added to or removed from the cell state under the control of gates. Because the important information can travel along this line with little change, an LSTM can learn long term dependencies where a simple RNN with a single layer fades.", "points": ["LSTM is designed to learn long term dependencies", "Cell state runs along the chain like a conveyor belt", "Gates control what is added or removed", "Simple RNN has a single layer and forgets over long gaps"], "source": "Week 10 lecture, slide 25 and 26", "flag": "The explanation of why the cell state helps with vanishing gradients is standard textbook reasoning. The slides only describe the cell state as a conveyor belt with minor linear interactions.", "core": true, "deck": "w10"}, {"id": "w10-031", "week": 10, "topic": "LSTM gates", "type": "explain", "q": "Describe the three gate steps of an LSTM cell.", "model": "Gates use a sigmoid layer and pointwise multiplication to let a chosen amount through, with zero meaning nothing and one meaning everything. The forget gate decides which information to throw away from the cell state. The input gate decides which values to update, while another layer builds candidate values, and together they update the cell state. The output step runs the cell state through tanh and multiplies it by a sigmoid gate, so only the chosen parts are output.", "points": ["Gates are sigmoid layers with pointwise multiplication giving values from zero to one", "Forget gate removes information from the cell state", "Input gate and candidate values add new information", "Output step filters the cell state using tanh and a sigmoid gate"], "source": "Week 10 lecture, slide 27 to 31", "flag": "", "core": true, "deck": "w10"}, {"id": "w10-032", "week": 10, "topic": "GRU", "type": "explain", "q": "Compare a gated recurrent unit with an LSTM.", "model": "A gated recurrent unit is a simplified variant of the LSTM. It keeps the idea of gates but has fewer of them, using an update gate and a reset gate. It can still model temporal patterns efficiently. Because it is simpler it needs less computational power. An LSTM has more gates and a separate cell state, so it is more elaborate and costs more to run.", "points": ["GRU is a simplified LSTM", "It has update and reset gates", "It needs less computational power", "LSTM has more gates and is more elaborate"], "source": "Week 10 lecture, slide 32", "flag": "The final comparison about a separate cell state is textbook knowledge. The slide only gives the one line description of the GRU.", "core": true, "deck": "w10"}], "notes": [{"deck": "w01a", "html": "<h1 id=\"what-ai-is-and-the-main-types-of-ai\">What AI is and the main\r\ntypes of AI<\/h1>\r\n<h2 id=\"defining-artificial-intelligence\">Defining artificial\r\nintelligence<\/h2>\r\n<p><strong>What it is.<\/strong> John McCarthy coined the term in 1956.\r\nHe described AI as the science and engineering of making intelligent\r\nmachines, especially intelligent computer programs. The aim is to use\r\ncomputers to do things we associate with human intelligence, but the\r\nmachine does not have to work the way a human brain works.<\/p>\r\n<p><strong>Why it is hard to define.<\/strong> The two words are not\r\nequally difficult. Artificial means produced by human effort rather than\r\narising naturally, and people broadly agree on that. Intelligence means\r\nintellect, wisdom and understanding, and it is hard to define because it\r\nis hard to measure. There is no single test and no single score.<\/p>\r\n<p><strong>Easily confused.<\/strong> Many people think AI means copying\r\nthe human brain. It does not. A program may reach intelligent results by\r\nmethods that look nothing like human thought, and that still counts.<\/p>\r\n<h2 id=\"the-turing-test\">The Turing Test<\/h2>\r\n<p><strong>What it is.<\/strong> Alan Turing asked whether machines can\r\nthink. Thinking is too vague to test, so he replaced the question with\r\none that can be tested, which is whether a machine can pass a behaviour\r\ntest for intelligence.<\/p>\r\n<p><strong>How it works.<\/strong> A human judge communicates with a\r\nhidden entity and has to decide whether it is a computer or a person. If\r\nthe judge cannot tell, the computer has passed and is said to be\r\nintelligent.<\/p>\r\n<p><strong>Example.<\/strong> A judge types questions to a hidden party\r\nand cannot reliably tell whether a machine or a person is answering. The\r\nmachine has passed.<\/p>\r\n<p><strong>Easily confused.<\/strong> Passing does not prove\r\nconsciousness or self-awareness, so it does not make a machine strong\r\nAI. The test measures behaviour equivalent to intelligent behaviour, and\r\nnothing more.<\/p>\r\n<h2 id=\"multiple-intelligences\">Multiple intelligences<\/h2>\r\n<p><strong>What it is.<\/strong> The theory of multiple intelligences\r\nsays human intelligence splits into separate kinds. It does not treat\r\nintelligence as one general ability. So whether a machine is intelligent\r\ndepends on which kind is meant.<\/p>\r\n<p><strong>The kinds, with an example for each.<\/strong><\/p>\r\n<ul>\r\n<li>Visual-spatial is spatial judgement and picturing things in the\r\nmind, such as navigating or seeing an object from another angle.<\/li>\r\n<li>Emotional or interpersonal is perceiving and handling emotions, and\r\nbeing sensitive to other people's moods and motives so that you can work\r\nin a group.<\/li>\r\n<li>Intrapersonal is introspection and a deep understanding of\r\noneself.<\/li>\r\n<li>Linguistic-verbal is skill with words, such as reading, writing and\r\ntelling stories.<\/li>\r\n<li>Logical-mathematical is logic, reasoning, numbers and understanding\r\nhow a causal system works.<\/li>\r\n<li>Bodily-kinesthetic is control of the body and skilful handling of\r\nobjects.<\/li>\r\n<li>Naturalistic is identifying, classifying and manipulating elements\r\nof the environment such as animals and plants. A Mars rover that\r\nclassifies rocks resembles it.<\/li>\r\n<li>Existential is asking about the meaning of life and our place in the\r\nworld.<\/li>\r\n<\/ul>\r\n<p><strong>Easily confused.<\/strong> Interpersonal looks outward at\r\nother people. Intrapersonal looks inward at the self.<\/p>\r\n<h2 id=\"weak-ai-and-strong-ai\">Weak AI and strong AI<\/h2>\r\n<p><strong>What they are.<\/strong> Weak AI has limited functionality. It\r\nis an algorithm designed to solve a specific problem, using predefined\r\ninstructions and parameters to produce output, and it does not cover the\r\nfull range of human cognitive abilities. Strong AI would have\r\nintelligence equal to humans, with self-awareness, consciousness,\r\ncreativity, learning and planning for the future. It aims to be\r\nindistinguishable from the human mind.<\/p>\r\n<p><strong>Where each stands.<\/strong> Almost all of today's AI is weak\r\nAI. Siri, Alexa, chatbots and self driving cars are examples. Strong AI\r\nexists only as a theoretical concept with current technology. Textbooks\r\nusually call weak AI narrow AI and mean the same thing.<\/p>\r\n<p><strong>Easily confused.<\/strong> Weak does not mean simple. A self\r\ndriving car is very capable, but it is built for one job. Strong refers\r\nto breadth and human-level ability.<\/p>\r\n<h2 id=\"four-types-of-ai\">Four types of AI<\/h2>\r\n<p>This list orders AI by memory and understanding, from simple to\r\nadvanced.<\/p>\r\n<p><strong>Reactive machines.<\/strong> They have no memory and each does\r\none task, so an input always gives the same output. They rely on\r\nstatistics, static rules and pattern recognition. Deep Blue, the chess\r\nprogram, and recommendation systems are examples.<\/p>\r\n<p><strong>Limited memory machines.<\/strong> These can look into the\r\npast and track objects or situations over time. They imitate the way\r\nneurons in the brain work together, so they get better as they receive\r\nmore data to train on. Deep learning systems such as ChatGPT are\r\nexamples.<\/p>\r\n<p><strong>Theory of mind.<\/strong> This type would understand human\r\nmotives and reasoning, grasp intentions and predict behaviour, as if it\r\nhad human relationships. It can place information in context and works\r\nacross a broad range of tasks, where classic machine learning works only\r\nin one domain. Here it is labelled AGI, although textbooks usually\r\ndefine AGI as general ability and not as this specific type.<\/p>\r\n<p><strong>Self-awareness.<\/strong> A self-aware system would have a\r\nsense of self and a conscious understanding of its own existence. It\r\nwould understand the world and also itself. It does not exist, partly\r\nbecause we do not know enough about the human brain and emotion to build\r\nit.<\/p>\r\n<p><strong>Easily confused.<\/strong> Reactive machines and limited\r\nmemory machines both match patterns. The difference is memory. Theory of\r\nmind goes a step further because it tries to understand what the\r\npatterns mean, not only to match them.<\/p>\r\n<h2 id=\"how-the-two-splits-fit-together\">How the two splits fit\r\ntogether<\/h2>\r\n<p>Weak and strong AI divide AI by how broad its ability is. The four\r\ntypes divide it by memory and understanding. They are separate lists.\r\nReactive machines are not a third option beside weak and strong. Today's\r\nsystems are weak AI and fall in the first two types.<\/p>\r\n<h2 id=\"the-computing-definition-of-ai\">The computing definition of\r\nAI<\/h2>\r\n<p>In a computing context, AI is the ability of a machine to mimic the\r\nbehaviour of living things, mainly humans. How it does this does not\r\nmatter. Only the outcome matters, which is the behaviour. This follows\r\nfrom the Turing Test, which avoids the unanswerable question of whether\r\na machine really thinks.<\/p>\r\n"}, {"deck": "w01b", "html": "<h1 id=\"data-modalities-and-exploratory-data-analysis\">Data modalities\r\nand exploratory data analysis<\/h1>\r\n<h2 id=\"ai-as-research\">AI as research<\/h2>\r\n<p><strong>Why AI helps research.<\/strong> It finds hidden patterns in\r\nlarge datasets, improves forecasting, automates routine work such as\r\ncleaning and labelling data, links fields such as biology and transport,\r\nand supports open science through shared models and data.<\/p>\r\n<p><strong>The scientific method.<\/strong> The steps run in a fixed\r\norder. Observation identifies a real problem, such as poor air quality.\r\nHypothesis proposes an algorithm or model to tackle it. Experimentation\r\ntests it under controlled conditions on datasets. Analysis judges the\r\nresults with numbers. Conclusion refines the model, generalises the\r\nfindings and publishes. Reproducibility and peer review matter.<\/p>\r\n<p><strong>The research pipeline.<\/strong> Problem formulation sets the\r\nobjectives and research questions. Data collection and preprocessing\r\nmake the data reliable and ethical. Model development chooses and\r\njustifies an algorithm. Evaluation and validation use cross-validation,\r\nstatistical tests and benchmark comparison to check that the model\r\nreally works. Knowledge contribution adds a new method, insight or\r\napplication.<\/p>\r\n<p><strong>Easily confused.<\/strong> Model development picks the\r\nalgorithm. Evaluation checks it. A question describing cross-validation\r\nor benchmarking is about evaluation.<\/p>\r\n<h2 id=\"data-modalities\">Data modalities<\/h2>\r\n<p>A modality is the kind of data, and each kind is profiled\r\ndifferently. Tabular data has rows as entities and columns as features,\r\noften of mixed types. Time series data is ordered, so autocorrelation\r\nmatters. Text is profiled by tokens, vocabulary and length. Images are\r\nprofiled by shape, aspect ratio and channels. Audio is profiled by\r\nsampling rate, duration and spectrograms. Video adds frame rate,\r\nresolution and colour depth.<\/p>\r\n<h2 id=\"what-exploratory-data-analysis-is\">What exploratory data\r\nanalysis is<\/h2>\r\n<p><strong>What it is.<\/strong> Exploratory data analysis, or EDA, is\r\nthe structured process of profiling, summarising and visualising data\r\nbefore formal modelling. It combines simple statistics such as counts,\r\nmeans and correlations with plots such as histograms, box plots and\r\nscatter plots.<\/p>\r\n<p><strong>Why it comes first.<\/strong> EDA reveals missing values,\r\nduplicates, outliers, wrong types and entry errors. It shows\r\ndistributions, skew and class imbalance, which guide transforms and\r\nresampling. It guides model choice, sets a realistic baseline and flags\r\nleakage and bias.<\/p>\r\n<p><strong>Easily confused.<\/strong> EDA is not model testing, so it\r\ncannot tell you final performance. Tuning and validation come after\r\nit.<\/p>\r\n<h2 id=\"tabular-data-checks\">Tabular data checks<\/h2>\r\n<ul>\r\n<li>Schema and integrity. Check structure, types and uniqueness.\r\nDuplicated rows after a join suggest the join went wrong, and a constant\r\ncolumn carries no signal.<\/li>\r\n<li>Missing values. Find which columns have gaps and how many, to plan\r\nimputation or dropping and to see whether missingness is linked to the\r\noutcome.<\/li>\r\n<li>Distributions. Summaries and plots show skew, heavy tails and\r\nunrealistic values.<\/li>\r\n<li>Outliers. A rule such as the interquartile range flags values far\r\nfrom the rest. Then inspect them. An age of 250 is an entry error. A\r\nvery high income may be real, so it needs a modelling choice such as a\r\ntransform, not automatic removal.<\/li>\r\n<li>Scaling. Features with very different ranges distort distance-based\r\nmethods and make optimisation unstable, so they may need standard,\r\nrobust or power scaling.<\/li>\r\n<li>Correlation. Strongly correlated features are redundant. A feature\r\nthat correlates almost perfectly with the target suggests leakage,\r\nmeaning information from the answer has crept in. Such a model looks\r\nexcellent in testing and fails on new data.<\/li>\r\n<li>Multicollinearity. It measures how well each feature is explained by\r\nthe other features, using the variance inflation factor, and shows which\r\nvariables to drop, combine or regularise. Target relationships differ,\r\nsince they ask how strongly each feature relates to the outcome.<\/li>\r\n<li>Class imbalance. When one class is rare, accuracy misleads because\r\nalways guessing the common class scores well. Respond with stratified\r\nsplits, F1, class weights or resampling. Never delete the rare class,\r\nsince it is usually the one that matters.<\/li>\r\n<li>Dimensionality. PCA on standardised data shows how variance\r\nconcentrates, how far the data can be compressed and which axes are\r\nmostly noise. It does not prove causes.<\/li>\r\n<\/ul>\r\n<h2 id=\"choosing-train-validation-and-test-splits\">Choosing train,\r\nvalidation and test splits<\/h2>\r\n<p>A split should match how the data were generated, so that the test\r\nhonestly imitates real use. Independent rows suit random or stratified\r\nsplits. Data over time suits time-based splits. Records of the same\r\nentity suit grouped splits.<\/p>\r\n<p><strong>Example.<\/strong> Three years of daily sales for forecasting.\r\nRandom shuffling lets the model train on days after the ones it is\r\ntested on, which is unrealistic. With many records per patient, a random\r\nsplit puts the same patient in both sets, so the model can recognise the\r\nperson. A wrong split gives results that look better than reality.<\/p>\r\n<h2 id=\"time-series-checks\">Time series checks<\/h2>\r\n<p><strong>What it is.<\/strong> Observations indexed by time, in order,\r\nregular or irregular, with one variable or several. The main tasks are\r\nforecasting and anomaly detection.<\/p>\r\n<p><strong>Checks.<\/strong> Continuity and gaps confirm the timeline is\r\nsound before resampling or filling. Seasonality finds recurring calendar\r\npatterns, such as more airline passengers in the summer holidays.\r\nStationarity asks whether the mean and variance stay stable over time. A\r\nseries with a rising average is not stationary, and differencing,\r\ndetrending or a log transform can fix that. Autocorrelation shows how\r\nfar current values depend on past ones. Change points separate a short\r\nspike, which may be noise, from a lasting level change, which means the\r\nregime shifted.<\/p>\r\n<h2 id=\"text-checks\">Text checks<\/h2>\r\n<p>Text is sequences of characters or tokens carrying meaning. Stop-word\r\nremoval drops very frequent words such as the and and, which add noise\r\nin bag-of-words models. Case normalisation, usually to lowercase, merges\r\nAI and ai and reduces sparsity, but capitalisation can carry meaning.\r\nCleansing standardises text, for example by unescaping HTML and masking\r\nURLs, and must not change what the text says. Also check corpus size and\r\nempty texts, length distributions, vocabulary, and bigrams and trigrams,\r\nbecause phrases carry meaning that single-word counts lose. Embeddings\r\nprojected to fewer dimensions reveal clusters and outliers, and give\r\nearly evidence of how separable the labels are.<\/p>\r\n<h2 id=\"image-checks\">Image checks<\/h2>\r\n<p>An image is an array of pixel values with one or more channels.\r\nProfile resolution and aspect ratio to decide on resizing and padding.\r\nCheck channel statistics, blur, exposure and corrupt files. Look for\r\nexact and near-duplicate images across splits using hashes or\r\nembeddings. A duplicate in both training and test sets means the model\r\nhas already seen the test picture, so the results are inflated.<\/p>\r\n"}, {"deck": "w02", "html": "<h1 id=\"supervised-learning-k-nn-and-decision-trees\">Supervised\r\nlearning, k-NN and decision trees<\/h1>\r\n<h2 id=\"machine-learning\">Machine learning<\/h2>\r\n<p><strong>What it is.<\/strong> Machine learning is a branch of AI where\r\ncomputer systems learn patterns from data, usually historical data, to\r\nimprove at a task. They do not rely on hand-crafted rules.<\/p>\r\n<p><strong>Three paradigms.<\/strong> Supervised learning uses labelled\r\nexamples, so each example comes with the right answer. Unsupervised\r\nlearning finds structure in unlabelled data, with no answers given.\r\nReinforcement learning learns by trial and error, guided by rewards and\r\npenalties, as when an agent learns a game by trying moves.<\/p>\r\n<p><strong>Why use it instead of rules.<\/strong> Rules struggle when\r\npatterns are complex, such as spam, fraud or images, because nobody can\r\nwrite them all down. They fail when there are many edge cases, because\r\nthe rule list explodes. They fail when data changes, because behaviour\r\ndrifts over time, called concept drift, and a model can simply be\r\nretrained.<\/p>\r\n<p><strong>When not to use it.<\/strong> Choose rules or verified\r\nalgorithms when data is tiny or poor, because the model will overfit and\r\na simple rule does better. Choose them when logic is deterministic, such\r\nas tax bands. Choose them when errors are unacceptable, such as dose\r\ncalculation or flight control. Choose them when clear, auditable reasons\r\nare required.<\/p>\r\n<h2 id=\"supervised-learning\">Supervised learning<\/h2>\r\n<p><strong>What it is.<\/strong> A model learns from labelled historical\r\ndata to predict unseen cases. Each example has input features, also\r\ncalled independent variables or predictors, and an output label, also\r\ncalled the dependent variable or target.<\/p>\r\n<p><strong>Classification and regression.<\/strong> Classification\r\npredicts a discrete category, such as default or no default, or one of\r\nseveral classes. Regression predicts a continuous number, such as price\r\nor journey time. The test is the type of answer. A category is\r\nclassification. A number on a scale is regression.<\/p>\r\n<p><strong>Example.<\/strong> Deciding from a chest X-ray whether a\r\npatient has pneumonia is classification. Forecasting travel time in\r\nminutes is regression.<\/p>\r\n<p><strong>Easily confused.<\/strong> A count of tickets is a number, so\r\nit is regression. Having several classes does not turn classification\r\ninto regression.<\/p>\r\n<h2 id=\"how-a-classifier-makes-a-decision\">How a classifier makes a\r\ndecision<\/h2>\r\n<p>The model learns patterns that separate the categories and outputs a\r\nprobability for each class. A threshold then turns the probabilities\r\ninto a final label. The threshold is chosen after the model has produced\r\nits probabilities, and it balances real-world costs. Raising it gives\r\nfewer false alarms but more missed cases, and lowering it does the\r\nopposite.<\/p>\r\n<h2 id=\"evaluating-classifiers\">Evaluating classifiers<\/h2>\r\n<p><strong>Confusion matrix.<\/strong> It counts true positives, false\r\npositives, true negatives and false negatives. Every other measure comes\r\nfrom these four counts.<\/p>\r\n<p><strong>Accuracy.<\/strong> The share of all predictions that are\r\ncorrect. It misleads on imbalanced data. If almost every case is in one\r\nclass, a model that always predicts that class scores high accuracy\r\nwhile catching nothing useful.<\/p>\r\n<p><strong>Precision and recall.<\/strong> Precision asks of the items\r\npredicted positive, how many really are positive. It matters when false\r\npositives are costly, such as a fraud team with few investigators.\r\nRecall, also called sensitivity, asks of all the real positives, how\r\nmany were caught. It matters when a miss is costly, such as disease\r\nscreening. The two pull against each other, since catching more\r\npositives usually brings more false alarms.<\/p>\r\n<p><strong>Easily confused.<\/strong> Precision looks at the predictions\r\nand recall looks at the real cases. Specificity looks at the real\r\nnegatives and asks how many were correctly rejected.<\/p>\r\n<p><strong>F1 and ROC.<\/strong> F1 is the harmonic mean of precision and\r\nrecall, giving one balanced number when classes are imbalanced. The ROC\r\ncurve plots the true positive rate against the false positive rate\r\nacross thresholds, with each point being one threshold. The area under\r\nit, AUC, summarises how well the model ranks positives above\r\nnegatives.<\/p>\r\n<h2 id=\"k-nearest-neighbours\">k-nearest neighbours<\/h2>\r\n<p><strong>What it is.<\/strong> k-NN is a simple, non-parametric, lazy\r\nalgorithm for classification and regression. It finds the k training\r\npoints closest to the new point and predicts from them.<\/p>\r\n<p><strong>How it works.<\/strong> First choose k. Then measure the\r\ndistance from the new point to the training points, for example with\r\nEuclidean distance, and find the k nearest. Finally, for classification\r\ntake a majority vote among them, and for regression average their\r\nvalues.<\/p>\r\n<p><strong>Example.<\/strong> For a new medical case plotted by age and\r\nnumber of nodes, one neighbour may say survived while a larger k changes\r\nthe vote. The class can change with k because different neighbours are\r\ncounted.<\/p>\r\n<p><strong>Lazy and non-parametric.<\/strong> Lazy means it does very\r\nlittle at training time and does the work when asked to predict.\r\nNon-parametric means it assumes no particular data distribution.<\/p>\r\n<p><strong>Choosing k.<\/strong> Start from an estimate based on the\r\nnumber of samples, then test values around it on validation data.\r\nCompare them with a performance metric and keep the best, using\r\ncross-validation for reliability. Judging on training data would favour\r\nk equal to one, which just memorises the training set.<\/p>\r\n<p><strong>Strengths and drawbacks.<\/strong> It is simple, has no\r\ntraining phase and handles both tasks. It costs a lot of memory and\r\ncomputation on large data, is hurt by irrelevant features and noise, and\r\ndepends heavily on k. Unscaled features also hurt, since the feature\r\nwith the largest range, such as income in pounds against age in years,\r\ndominates the distance.<\/p>\r\n<h2 id=\"decision-trees\">Decision trees<\/h2>\r\n<p><strong>What it is.<\/strong> A decision tree makes a series of splits\r\non features that produce readable if then rules, ending in leaves that\r\ngive a prediction.<\/p>\r\n<p><strong>Gini impurity.<\/strong> It measures how mixed a node is, as\r\nthe chance of mislabelling a random sample if you label it by the node's\r\nclass mix. Zero means the node is pure, with all samples in one\r\nclass.<\/p>\r\n<p><strong>How a split is chosen.<\/strong> At each node the tree tries\r\neach possible split and calculates the impurity of the child nodes,\r\nweighted by their size. It keeps the split with the biggest drop from\r\nthe parent's impurity, called the gain. It repeats this on each child.\r\nIn the weather example, splitting on Windy gave purer groups than\r\nsplitting on Outlook, so Windy became the root. Textbooks also use\r\nentropy for this.<\/p>\r\n<p><strong>When it stops.<\/strong> It stops when nodes are pure, when no\r\nfeatures remain, or when a limit such as maximum depth or minimum\r\nsamples is reached.<\/p>\r\n<p><strong>How it predicts.<\/strong> A new case follows the rules from\r\nthe root down to a leaf. A pure leaf predicts its single class. An\r\nimpure leaf predicts its majority class, and the share of that class\r\ngives an estimated probability, such as two thirds.<\/p>\r\n<p><strong>Easily confused with k-NN.<\/strong> A tree does its work in\r\ntraining by building the splits, and prediction just follows rules. k-NN\r\ndoes almost nothing in training and does its work at prediction.<\/p>\r\n"}, {"deck": "w03", "html": "<h1 id=\"supervised-learning-and-regression-models\">Supervised learning\r\nand regression models<\/h1>\r\n<h2 id=\"supervised-learning\">Supervised learning<\/h2>\r\n<p><strong>What it is.<\/strong> Supervised learning trains a model on\r\nlabelled historical data so that it can predict the outcome for new\r\ncases it has not seen. Each training example has input features, also\r\ncalled independent variables or predictors, and an output label, also\r\ncalled the dependent variable or target.<\/p>\r\n<p><strong>How it works.<\/strong> The model studies many past examples\r\nwhere the answer is already known. It learns the link
