 between the\r\nfeatures and the label, then applies that link to fresh inputs. The\r\nmodel can compare each guess with the known answer.<\/p>\r\n<p><strong>Example.<\/strong> A housing dataset has columns for square\r\nfeet, bedrooms, bathrooms and location score. These are the features.\r\nThe price column is the label, because price is the thing the model must\r\npredict.<\/p>\r\n<p><strong>Easily confused with.<\/strong> Reinforcement learning also\r\nlearns from feedback, but its feedback is a reward from trial and error\r\nand there are no labelled answers. Unsupervised learning has no label at\r\nall.<\/p>\r\n<h2 id=\"regression-and-classification\">Regression and\r\nclassification<\/h2>\r\n<p><strong>What it is.<\/strong> Regression predicts a continuous number,\r\nsuch as a price, a temperature or demand. Classification predicts a\r\ndiscrete class, such as spam or not spam. Both are supervised.<\/p>\r\n<p>A classification model can return class probabilities, and a\r\nthreshold turns a probability into a label. A regression model returns a\r\nnumeric estimate directly.<\/p>\r\n<p><strong>Example.<\/strong> Deciding from a chest X-ray whether a\r\npatient has pneumonia is classification. Forecasting the travel time in\r\nminutes from Cambridge to London is regression. Sorting customers into\r\nnew, active or churn-risk is classification with three classes.<\/p>\r\n<p><strong>Common mistake.<\/strong> Treating a count as a class. The\r\nnumber of support tickets raised tomorrow is a quantity on a scale, so\r\nit is a regression target even though it takes whole values.<\/p>\r\n<h2 id=\"regression-evaluation-metrics\">Regression evaluation\r\nmetrics<\/h2>\r\n<p><strong>What it is.<\/strong> Evaluating a regression model means\r\nmeasuring the distance between the predicted values and the actual\r\nlabels. A smaller distance means a better model. Four metrics are\r\ncommon.<\/p>\r\n<p><strong>Mean absolute error.<\/strong> This is the average size of the\r\ngaps between predicted and actual values, ignoring direction. Each gap\r\ncounts in proportion to its size, so the metric is less sensitive to\r\noutliers. It suits cases where occasional extreme values are noise and a\r\nfair typical error is wanted.<\/p>\r\n<p><strong>Mean squared error.<\/strong> This squares each gap before\r\naveraging. Squaring makes one large mistake count far more than several\r\nsmall ones, so the metric punishes big errors strongly. It suits cases\r\nwhere a few large misses are especially costly.<\/p>\r\n<p><strong>Root mean squared error.<\/strong> This is the square root of\r\nmean squared error. Taking the root brings the answer back to the same\r\nunits as the target, so it is easier to interpret. It stays sensitive to\r\noutliers because the squaring has already happened.<\/p>\r\n<p><strong>R-squared.<\/strong> This is the coefficient of determination.\r\nIt shows how much of the variance in the target the model explains. A\r\nvalue of 1 is a perfect fit and closer to 1 is better. A value of 0\r\nmeans the model does no better than always predicting the mean of the\r\nactual values. A value below 0 means the model is worse than that\r\nbaseline.<\/p>\r\n<h2 id=\"linear-regression\">Linear regression<\/h2>\r\n<p><strong>What it is.<\/strong> Linear regression fits a straight line\r\nthrough the data, or a flat surface when there are several inputs. The\r\nline has coefficients, which are the intercept and the slopes, and\r\nfitting means finding good values for them.<\/p>\r\n<p><strong>How it works.<\/strong> For any candidate line, each data\r\npoint has a residual, which is the gap between the value the line\r\npredicts and the actual value. Ordinary least squares picks the\r\ncoefficients that make the sum of the squared residuals as small as\r\npossible. Squaring stops positive and negative gaps from cancelling each\r\nother and gives large gaps extra weight. The result is the line closest\r\nto the data in the least squares sense.<\/p>\r\n<p><strong>When it is used.<\/strong> It works best when the relationship\r\nis roughly linear. It is the usual baseline model, and it is chosen when\r\ninterpretable coefficients matter, for instance when a regulator wants\r\nto see how each input changes the predicted price.<\/p>\r\n<h2 id=\"random-forest-regression\">Random forest regression<\/h2>\r\n<p><strong>What it is.<\/strong> A random forest is an ensemble of many\r\ndecision tree regressors. Each tree is built on random rows and random\r\nfeatures, and the forest predicts by averaging the numbers its trees\r\nproduce.<\/p>\r\n<p><strong>How it works.<\/strong> Because every tree sees a different\r\nrandom slice of the data, the trees differ from one another. For a new\r\ncase each tree predicts a number, and the forest returns the average.\r\nOne tree can be thrown off by quirks in its own training sample.\r\nDifferent trees make different mistakes, so averaging cancels much of\r\nthe error and gives a more stable answer. This also makes the forest\r\nrobust to outliers and less prone to overfitting.<\/p>\r\n<h2 id=\"gradient-boosting-and-other-models\">Gradient boosting and other\r\nmodels<\/h2>\r\n<p><strong>What it is.<\/strong> Gradient boosting regression, such as\r\nXGBoost, also uses many trees, but it builds them one after another.\r\nEach new tree is trained to fix the errors left by the trees before\r\nit.<\/p>\r\n<p><strong>Random forest against boosting.<\/strong> A random forest is a\r\nbagging method. Its trees are independent, built side by side, and\r\naveraged. Boosting is sequential, so every tree depends on the one\r\nbefore. Both are tree ensembles, which is why they are easy to mix\r\nup.<\/p>\r\n<p>Support vector regression extends support vector machines to\r\nregression and suits medium-sized datasets with complex\r\nrelationships.<\/p>\r\n<h2 id=\"choosing-between-models\">Choosing between models<\/h2>\r\n<p>Linear regression is simple and interpretable, but it needs a roughly\r\nlinear relationship. Random forest copes with non-linear patterns and\r\noutliers, but it is harder to interpret. Choose linear regression when a\r\nsimple, explainable model is needed and the relationship looks linear.\r\nChoose a random forest when the data is complex and non-linear and\r\naccuracy matters more than a clear formula.<\/p>\r\n<h2 id=\"why-regression-matters-in-research\">Why regression matters in\r\nresearch<\/h2>\r\n<p>Regression quantifies how much each input affects an outcome,\r\npredicts continuous values for forecasting and tests assumptions about\r\ncause and effect. Its coefficients are interpretable and many advanced\r\nmodels build on it.<\/p>\r\n"}, {"deck": "w04", "html": "<h1\r\nid=\"unsupervised-learning-clustering-and-principal-component-analysis\">Unsupervised\r\nlearning, clustering and principal component analysis<\/h1>\r\n<h2 id=\"unsupervised-learning\">Unsupervised learning<\/h2>\r\n<p><strong>What it is.<\/strong> Unsupervised learning finds inherent\r\nstructure or patterns in unlabelled data. There is no target column and\r\nno correct answer to copy. The two main types are clustering and\r\ndimensionality reduction.<\/p>\r\n<p><strong>Compared with supervised learning.<\/strong> Supervised\r\nlearning uses labelled input and output pairs and aims to predict\r\noutcomes for new data. Linear regression, decision trees and neural\r\nnetworks are examples. Unsupervised learning uses unlabelled data and\r\naims to describe the data itself. K-means, principal component analysis\r\nand autoencoders are examples.<\/p>\r\n<p><strong>Example.<\/strong> The Wine dataset holds chemical\r\nmeasurements of wines from one region of Italy, with no column naming\r\nthe wine type. Market basket analysis, which finds products bought\r\ntogether, is another use.<\/p>\r\n<h2 id=\"clustering\">Clustering<\/h2>\r\n<p><strong>What it is.<\/strong> Clustering groups similar data points\r\ntogether using their features, with no predefined labels. Points that\r\nare close under some measure, usually distance, go in the same cluster.\r\nIt works as an exploratory tool for discovering hidden groupings.<\/p>\r\n<p><strong>Example.<\/strong> A shop groups customers by behaviour and\r\npreferences to tailor marketing.<\/p>\r\n<p><strong>Methods.<\/strong> K-means divides the data into k groups by\r\nminimising within-cluster variance. Hierarchical clustering builds a\r\ntree, called a dendrogram, showing how clusters merge or split. DBSCAN\r\ngroups points by density and suits clusters of arbitrary shape. Gaussian\r\nmixture models are probabilistic and assume the data comes from Gaussian\r\ndistributions.<\/p>\r\n<h2 id=\"k-means\">K-means<\/h2>\r\n<p><strong>What it is.<\/strong> K-means is the most popular clustering\r\nalgorithm. The user decides on k, the number of clusters, and the\r\nalgorithm minimises the total squared distance between points and the\r\ncentre of their cluster.<\/p>\r\n<p><strong>How it works.<\/strong> First it places k centres at random,\r\nbecause it has no better starting guess. Then it assigns every point to\r\nits closest centre, so each centre gets a group. Then it moves each\r\ncentre to the mean position of its group, because the mean is the spot\r\nwith the smallest squared distance to those points. Moving the centres\r\nchanges which centre is closest for some points, so the assign and move\r\nsteps repeat. The algorithm stops at convergence, when no point changes\r\ncluster.<\/p>\r\n<p><strong>Example.<\/strong> Plot customers by age and income and pick k\r\nas 2. Two random centres start on the plot, points join the nearer one,\r\nand the centres shift to the middle of their groups until nothing\r\nchanges.<\/p>\r\n<p><strong>Common mistakes.<\/strong> Thinking k-means finds k for you,\r\nsince the user must choose it. Expecting the same answer every run.\r\nRandom starting centres mean two runs on the same data with the same k\r\ncan give different clusters.<\/p>\r\n<h2 id=\"k-means-against-dbscan\">K-means against DBSCAN<\/h2>\r\n<p>K-means works from centres and distances, needs k chosen in advance\r\nand tends to produce compact, roughly round groups. DBSCAN works from\r\ndensity, so it can follow clusters of arbitrary shape such as curved or\r\nirregular ones. Choose k-means for compact groups where a sensible k can\r\nbe found, and choose DBSCAN when the clusters are irregular.<\/p>\r\n<h2 id=\"choosing-k\">Choosing k<\/h2>\r\n<p><strong>Inertia.<\/strong> This is the sum of squared distances from\r\neach point to its cluster centre. Smaller means tighter clusters. It\r\nfalls as k rises, because more centres sit closer to the points. So the\r\nlowest inertia is not the best choice, since using one cluster per point\r\nwould give the lowest inertia and no useful grouping.<\/p>\r\n<p><strong>Elbow method.<\/strong> Plot inertia against k and look for\r\nthe point where the improvement drops sharply. That bend is the elbow\r\nand marks a good k. The elbow can be hard to see.<\/p>\r\n<p><strong>Silhouette score.<\/strong> This measures how well each point\r\nfits its own cluster compared with other clusters. For one point, a is\r\nthe average distance to the other points in its own cluster, which shows\r\ncohesion. The value b is the average distance to the points in the\r\nnearest neighbouring cluster, which shows separation. The score runs\r\nfrom minus 1 to plus 1. Near plus 1 means well clustered, near 0 means\r\nthe point sits on a boundary, and negative means it may be\r\nmisclassified. The overall score is the average across all points.<\/p>\r\n<p><strong>Using the silhouette score to pick k.<\/strong> Run k-means\r\nfor several values of k, average the score for each, and plot k against\r\nthe score. Choose the k with the highest score. A k that is too small\r\ngives broad clusters with low separation. A k that is too large splits\r\nthe data into fragments and the score drops.<\/p>\r\n<h2 id=\"dimensionality-reduction\">Dimensionality reduction<\/h2>\r\n<p><strong>What it is.<\/strong> Dimensionality reduction cuts the number\r\nof input features while keeping as much relevant information as\r\npossible. It projects the data into a lower-dimensional space.<\/p>\r\n<p><strong>Why it is done.<\/strong> Data with very many features is slow\r\nto process and hard to see, which is the curse of dimensionality. Fewer\r\nfeatures make computation faster, remove noise and redundancy, reduce\r\noverfitting and allow plotting in two or three dimensions.<\/p>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Method<\/th>\r\n<th>Main idea<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Principal component analysis<\/td>\r\n<td>Unsupervised, projects onto the directions of greatest variance<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Linear discriminant analysis<\/td>\r\n<td>Supervised, maximises separation between classes<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>t-SNE<\/td>\r\n<td>Non-linear, preserves local structure for visualisation<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>UMAP<\/td>\r\n<td>Non-linear, preserves local and global structure<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<p><strong>Easily confused.<\/strong> Principal component analysis and\r\nlinear discriminant analysis both give linear projections. The\r\ndifference is that linear discriminant analysis uses class labels and\r\nthe other does not.<\/p>\r\n<h2 id=\"principal-component-analysis\">Principal component analysis<\/h2>\r\n<p><strong>What it is.<\/strong> Principal component analysis finds new\r\ndirections, called principal components, along which the data varies\r\nmost, and describes each row using only the first few.<\/p>\r\n<p><strong>How it works.<\/strong> First centre the data by subtracting\r\neach feature's mean, so every feature is measured from the same starting\r\npoint. Next calculate the covariance matrix, which shows how each pair\r\nof features vary together. A positive value means they move in the same\r\ndirection, a negative value means opposite directions and zero means no\r\nrelation. Then use eigen-decomposition. An eigenvector is a direction\r\nthat the matrix only stretches without turning. An eigenvalue is the\r\nstretch factor. Here the eigenvectors are the principal components and\r\neach eigenvalue shows how much variance lies along its direction. A\r\nlarge eigenvalue means that direction carries a lot of the variation.\r\nFinally project the data onto the top components.<\/p>\r\n<p><strong>Example.<\/strong> In a four-feature dataset, the first\r\ncomponent holds about 96.6 percent of the variance and the first two\r\nhold about 99.2 percent. The features were highly redundant, and two\r\ncomponents summarise them well.<\/p>\r\n"}, {"deck": "w05a", "html": "<h1 id=\"reinforcement-learning-and-q-learning\">Reinforcement learning\r\nand Q-learning<\/h1>\r\n<h2 id=\"reinforcement-learning\">Reinforcement learning<\/h2>\r\n<p><strong>What it is.<\/strong> Reinforcement learning is a branch of\r\nmachine learning in which an agent learns to make sequential decisions\r\nby interacting with an environment to reach a goal. The agent tries\r\nactions, the environment responds with a reward or a penalty, and over\r\ntime the agent learns which actions give the best long-term outcome.<\/p>\r\n<p><strong>How it works.<\/strong> The agent tries an action. The\r\nenvironment answers with feedback. The agent uses that feedback to\r\nimprove its strategy for choosing actions. Learning comes from trial and\r\nerror. The agent is aiming at the total reward over time, so an action\r\nwith a small immediate payoff can still be the right one if it leads to\r\nbigger rewards later.<\/p>\r\n<p><strong>Example.<\/strong> A self-driving car has the driving system\r\nas its agent. The environment is the road, other cars, lanes and traffic\r\nlights. The goal is to drive safely to the destination. Staying in lane,\r\navoiding collisions and smooth driving are rewards. Collisions, hard\r\nbraking, lane violations and running red lights are penalties. A robot\r\nlearning to walk and a chess program such as AlphaZero fit the same\r\npattern. For the chess program the environment is the board and the\r\nopponent's moves.<\/p>\r\n<p><strong>Easily confused with supervised learning.<\/strong> Supervised\r\nlearning is given the correct answer for each input in a fixed dataset.\r\nReinforcement learning is never told the correct action. It only learns\r\nhow good an outcome was, and it learns by acting, so its own choices\r\nshape what it experiences next.<\/p>\r\n<p><strong>Common mistake.<\/strong> Mixing up the agent and the\r\nenvironment. The agent is the learner that acts. The environment is\r\neverything outside it that responds with the reward.<\/p>\r\n<h2 id=\"model-free-and-model-based-learning\">Model-free and model-based\r\nlearning<\/h2>\r\n<p><strong>Model-free.<\/strong> The agent learns from experienced\r\ntransitions and rewards, without learning how the environment works and\r\nwithout knowing the probabilities of future outcomes in advance. A chess\r\nAI shows this. It repeats an opening move over thousands of games, finds\r\nthat some openings tend to lead to winning positions, and gradually\r\nprefers them.<\/p>\r\n<p><strong>Model-based.<\/strong> The agent has a model of the\r\nenvironment, which holds transition probabilities and a reward function.\r\nIt uses the model to predict what its actions will cause and to plan\r\nahead, so it can think before it acts. A robot vacuum that predicts the\r\nresult of different routes, avoiding obstacles and saving battery,\r\nbefore it moves is the example.<\/p>\r\n<p><strong>Difference.<\/strong> The question is whether the agent holds\r\na model of how the world responds. The model-free agent learns only from\r\nwhat it has lived through. The model-based agent can look ahead inside\r\nits model.<\/p>\r\n<h2 id=\"value-based-and-policy-based-learning\">Value-based and\r\npolicy-based learning<\/h2>\r\n<p><strong>Value-based.<\/strong> The agent estimates the expected\r\ncumulative future reward of states or actions and picks actions with\r\nhigh values. A robot in an unknown maze learns by trial and error how\r\nvaluable each move is. Q-learning is a value-based algorithm.<\/p>\r\n<p><strong>Policy-based.<\/strong> The agent learns a policy directly. A\r\npolicy is a rule that says which action to take in a given state. An\r\nautonomous vehicle learning to steer, hold its lane and take bends\r\nsafely is the example.<\/p>\r\n<p><strong>Difference.<\/strong> A value-based agent learns scores and\r\nthen chooses by them. A policy-based agent learns the choice itself and\r\nskips the scoring step.<\/p>\r\n<h2 id=\"actor-critic\">Actor-critic<\/h2>\r\n<p><strong>What it is.<\/strong> Actor-critic combines policy-based and\r\nvalue-based learning using two components that work together. The actor\r\nlearns a policy and decides which action to take in each state. The\r\ncritic learns a value function and judges how good the decisions or\r\nstates are in terms of expected future reward.<\/p>\r\n<p><strong>Example.<\/strong> A humanoid robot learning to walk. The\r\nactor decides how to move the legs and the critic judges how well those\r\nmovements contribute to walking without falling.<\/p>\r\n<h2 id=\"q-learning\">Q-learning<\/h2>\r\n<p><strong>What it is.<\/strong> Q-learning is a model-free, value-based\r\nmethod. The agent learns the best action for each situation by trying\r\nactions and learning from the rewards. It does not need to know how the\r\nenvironment works.<\/p>\r\n<p><strong>What the Q-table stores.<\/strong> The Q-table is a lookup\r\ntable of learned values. Each entry is for one action taken in one\r\nstate. It holds the expected total reward from taking that action in\r\nthat state and then following the best policy afterwards.<\/p>\r\n<p><strong>Reward table against Q-table.<\/strong> The reward table holds\r\nthe immediate feedback for moving from one state to another, and it is\r\nfixed by the environment. The Q-table holds learned long-term value, and\r\nit starts at zero and changes as the agent learns.<\/p>\r\n<h2 id=\"how-a-q-value-is-updated\">How a Q-value is updated<\/h2>\r\n<p><strong>The rule.<\/strong> The new value for a move equals the reward\r\nfor that move plus G times the best value available from the next state.\r\nThe reward table supplies the reward. The Q-table supplies the best next\r\nvalue.<\/p>\r\n<p><strong>The role of G.<\/strong> G is called the learning parameter,\r\ntypically 0.8, and it sets how much future value counts. Textbooks call\r\nthe same quantity the discount factor. If G were zero, only the\r\nimmediate reward would matter and the agent would be short-sighted. A\r\nlarger G makes the agent care more about later rewards.<\/p>\r\n<p><strong>Why learning spreads backwards.<\/strong> Every value starts\r\nat zero, so early moves are random and tell the agent nothing. Only when\r\nthe agent happens to reach the goal does it see a reward. That\r\nstrengthens the move into the goal. On a later episode, the move before\r\nthe goal can see that strengthened value in the next state, so it gets\r\nstrengthened too. The move before that follows, and so on back to the\r\nstart. In the worked example, the move into the goal state carries a\r\nreward of 100 and the move just before it takes a share of that, so the\r\nvalues shrink with distance from the goal.<\/p>\r\n<p><strong>Convergence.<\/strong> The table is built step by step over\r\nmany episodes of interaction. When the values stop changing, the table\r\nhas converged. Many episodes are needed because each pass pushes the\r\nvalue back only one step.<\/p>\r\n<p><strong>Common mistake.<\/strong> Thinking a random start means\r\nnothing can be learned. The agent reaches the goal by chance and the\r\nupdate rule passes that value back.<\/p>\r\n"}, {"deck": "w05b", "html": "<h1 id=\"genetic-algorithms\">Genetic algorithms<\/h1>\r\n<h2 id=\"what-a-genetic-algorithm-is\">What a genetic algorithm is<\/h2>\r\n<p><strong>What it is.<\/strong> A genetic algorithm is a method for\r\nsolving constrained and unconstrained optimisation problems. It imitates\r\nnatural selection, where the fittest survive. It was developed by John\r\nHolland in the 1970s.<\/p>\r\n<p><strong>How it works.<\/strong> It keeps a population of candidate\r\nsolutions and does not improve just one. At each step it selects\r\nindividuals from the current population according to their fitness and\r\nuses them as parents to produce children for the next generation. Over\r\nmany generations the population evolves toward an optimal solution.\r\nFinding the optimum is a by-product of the evolving process.<\/p>\r\n<p><strong>Example.<\/strong> A genetic algorithm suits large search\r\nspaces such as scheduling, route optimisation and finance, where\r\nchecking every option would take far too long.<\/p>\r\n<p><strong>Common mistake.<\/strong> Describing it as improving one\r\nsolution step by step. It improves a whole population at once.<\/p>\r\n<h2 id=\"terms-borrowed-from-biology\">Terms borrowed from biology<\/h2>\r\n<p>In biology, chromosomes are strings of DNA inside each cell. Genes\r\nare blocks of DNA inside a chromosome, and each gene decides some aspect\r\nof the organism, such as eye colour. Crossover is the recombination of\r\ngenes from parents. Mutation is an error in copying a gene. Fitness is\r\nthe success of an organism.<\/p>\r\n<p>In the algorithm, a chromosome is one candidate solution, written as\r\na string. A gene is one unit of that string. Fitness is how good the\r\nsolution is, and it decides which solutions are kept.<\/p>\r\n<p><strong>Example.<\/strong> A candidate solution is stored as a\r\nbitstring such as 101110. The whole bitstring is the chromosome. Each\r\nsingle bit, 0 or 1, is a gene. The bitstring is decoded into a number,\r\nhere a whole number between 0 and 63, and that number is the proposed\r\nanswer to test. This is what representing a solution means.<\/p>\r\n<p><strong>Common mistake.<\/strong> Calling the whole string a gene. The\r\nwhole string is the chromosome and one bit is the gene.<\/p>\r\n<h2 id=\"crossover-against-mutation\">Crossover against mutation<\/h2>\r\n<p><strong>Crossover.<\/strong> This takes parts of two parent\r\nchromosomes and joins them to make a child, like parents passing on a\r\nmixture of their DNA. It reuses good features already in the\r\npopulation.<\/p>\r\n<p><strong>Mutation.<\/strong> This makes a small random change to one\r\nchromosome, such as flipping one bit, like a copying error. It can bring\r\nin variety that no existing solution contains.<\/p>\r\n<p><strong>Why both are used.<\/strong> Crossover alone can only shuffle\r\nwhat the population already has. Mutation adds new material, so the\r\nsearch can reach places the starting population never covered. Used\r\ntogether, the algorithm keeps what works and still explores. A common\r\nmix in one generation is a few crossovers and a couple of mutations.<\/p>\r\n<p><strong>Easily confused.<\/strong> Crossover needs two parents.\r\nMutation changes one chromosome.<\/p>\r\n<h2 id=\"the-steps-of-the-loop\">The steps of the loop<\/h2>\r\n<ol type=\"1\">\r\n<li>Create an initial population of random solutions. A random start\r\ngives a spread of guesses across the search space.<\/li>\r\n<li>Test each solution for fitness and rank them. Ranking shows which\r\nsolutions are worth keeping.<\/li>\r\n<li>Remove some bad solutions and duplicate some good ones, so the next\r\ngeneration leans toward better answers.<\/li>\r\n<li>Make small changes to the good solutions using crossover and\r\nmutation, to create new candidates.<\/li>\r\n<li>Repeat from step 2 until the best solution is good enough.<\/li>\r\n<\/ol>\r\n<p>Problems are usually set up as finding a minimum, because a lower\r\nvalue then means a better solution. Other problems are reformulated as\r\nminimisation so that the same loop can run on them.<\/p>\r\n<h2 id=\"why-other-methods-fall-short\">Why other methods fall short<\/h2>\r\n<p><strong>Analytical method.<\/strong> If the relationship can be\r\nwritten as an equation, differentiating it gives the gradient. The\r\nminimum sits where the gradient is zero. This fails when the\r\nrelationship cannot be expressed as an equation, when it has several\r\nminima, or when the real-world problem has many variables and\r\nconstraints.<\/p>\r\n<p><strong>Blind generate and test.<\/strong> This is a numerical method.\r\nIt guesses a possible solution, tests how good it is, and repeats until\r\none is good enough. Each guess ignores the earlier ones. It may take too\r\nlong to converge and may be misled by several minima.<\/p>\r\n<p><strong>How a genetic algorithm helps.<\/strong> It also generates and\r\ntests, but the search is guided. It ranks solutions, keeps and copies\r\nthe good ones and varies them, so each generation builds on earlier\r\nresults. It needs no equation.<\/p>\r\n<p><strong>Easily confused.<\/strong> Blind generate and test and a\r\ngenetic algorithm both test many solutions. Only the genetic algorithm\r\nuses what it has learned to choose the next candidates.<\/p>\r\n<h2 id=\"strengths-and-limits\">Strengths and limits<\/h2>\r\n<p>An advantage is that approximate solutions can usually be found. A\r\ndisadvantage is that it can be hard to represent a problem as a genetic\r\nproblem. The problem has to be encoded as chromosomes and given a\r\nfitness measure before the algorithm can run. The method suits large\r\nsearch spaces.<\/p>\r\n"}, {"deck": "w06", "html": "<h1 id=\"perceptrons-the-training-loop-and-cost-functions\">Perceptrons,\r\nthe training loop and cost functions<\/h1>\r\n<p>The worked forward pass, the chain rule and the weight update are in\r\nthe week 7 note.<\/p>\r\n<h2 id=\"the-brain-and-the-artificial-neuron\">The brain and the\r\nartificial neuron<\/h2>\r\n<p><strong>What it is.<\/strong> A biological neuron receives impulses\r\nthrough its dendrites, passes them through its nucleus and axon, and\r\nreleases them at the axon terminal to neighbouring neurons. An\r\nartificial neuron copies this layout at a small scale, with inputs in\r\nplace of dendrites and an output in place of the axon.<\/p>\r\n<p><strong>Why.<\/strong> Early AI researchers wanted machines to learn\r\nlike humans, and the brain was the one working example. The imitation is\r\nloose, keeping only the idea of many simple connected units passing\r\nsignals on.<\/p>\r\n<h2 id=\"the-perceptron-and-its-activation-function\">The perceptron and\r\nits activation function<\/h2>\r\n<p><strong>What it is.<\/strong> A perceptron is the simplest neural\r\nnetwork, a single neuron with several input nodes and one output\r\nnode.<\/p>\r\n<p><strong>How it works.<\/strong> Each connection leaving an input node\r\ncarries a weight, which sets how strongly that input counts. The neuron\r\nmultiplies every input by its weight and adds up the products. It then\r\nadds a bias, which shifts the total whatever the inputs are. Last, the\r\nactivation function looks at the total and decides whether the neuron\r\nfires. The step function gives one of two values, 0 or 1. Sigmoid and\r\nsoftmax are other common choices. Weights and bias start random.<\/p>\r\n<p><strong>Example.<\/strong> The course example has three inputs with a\r\nweight each, plus a bias. The total is large enough that the step\r\nfunction outputs 1.<\/p>\r\n<p><strong>Easily confused.<\/strong> The weight scales one input, the\r\nbias is added once to the total, and the activation function makes the\r\nfire decision. Saying the weight decides whether the neuron fires is a\r\ncommon mistake.<\/p>\r\n<h2 id=\"one-perceptron-and-layered-networks\">One perceptron and layered\r\nnetworks<\/h2>\r\n<p>A single perceptron can only learn linearly separable patterns, where\r\none straight boundary splits the classes. XOR is the usual example it\r\ncannot learn. A network joins thousands of perceptrons in consecutive\r\nlayers, and together they turn the input data into predictions based on\r\nfeatures being present or absent. Textbooks add that the extra layers\r\nare what remove the linear limit.<\/p>\r\n<p><strong>A common mistake.<\/strong> Believing more epochs will let one\r\nperceptron learn XOR. The limit comes from its structure.<\/p>\r\n<h2 id=\"supervised-learning\">Supervised learning<\/h2>\r\n<p><strong>What it is.<\/strong> In supervised learning the correct\r\noutput for each training sample is known in advance. The aim is to learn\r\na function that best matches inputs to outputs. Neural networks\r\ngenerally learn this way.<\/p>\r\n<p><strong>Example.<\/strong> In the iris dataset each flower has four\r\nmeasurements, sepal and petal length and width, plus a flower type. The\r\nmeasurements are the features the network reads. The flower type is the\r\nlabel it learns to predict.<\/p>\r\n<p><strong>A common mistake.<\/strong> Listing the label as an input, or\r\nthinking known answers remove the need for a cost function. The network\r\nstill needs to measure how far its predictions are from them.<\/p>\r\n<h2 id=\"initialisation\">Initialisation<\/h2>\r\n<p>Before training, every weight and bias is set to a random value, so\r\nthe first prediction is random and nothing has been optimised. The\r\ncourse sums this up as garbage in, garbage out. Textbooks add that\r\nidentical values would make every neuron learn the same thing.<\/p>\r\n<h2 id=\"the-training-loop\">The training loop<\/h2>\r\n<p><strong>What it is.<\/strong> Training is an iterative loop. After\r\nrandom initialisation each round has four steps.<\/p>\r\n<ul>\r\n<li>Feed forward from the input layer to the output layer to make a\r\nprediction.<\/li>\r\n<li>Apply the cost function to measure the error, which needs a\r\nprediction to exist first.<\/li>\r\n<li>Backpropagate the error to each layer so each layer's share is\r\nknown.<\/li>\r\n<li>Use gradient descent to adjust the weights and biases and reduce the\r\nerror.<\/li>\r\n<\/ul>\r\n<p>The epoch counter then goes up. The loop stops when the cost\r\nconverges or a maximum number of epochs is reached.<\/p>\r\n<p><strong>Epoch.<\/strong> The course counts one round of this loop as\r\nan epoch. Textbooks define an epoch as one pass over the whole training\r\nset.<\/p>\r\n<p><strong>A common mistake.<\/strong> Putting the steps in the wrong\r\norder, such as updating weights before the error has been measured.<\/p>\r\n<h2 id=\"cost-and-loss\">Cost and loss<\/h2>\r\n<p><strong>What it is.<\/strong> A cost function measures the error\r\nbetween what the model predicts and the true label, and gives it as one\r\nreal number. Training seeks parameters that make it as small as\r\npossible.<\/p>\r\n<p><strong>Easily confused.<\/strong> Loss usually refers to the error\r\nfor one observation. Cost usually refers to the average of the loss over\r\nthe training set. Reversing the two is a common mistake.<\/p>\r\n<h2 id=\"regression-and-classification-costs\">Regression and\r\nclassification costs<\/h2>\r\n<p>Regression predicts a number such as a house price. Classification\r\npredicts a class such as spam or not spam.<\/p>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Cost<\/th>\r\n<th>Task<\/th>\r\n<th>What it does<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Mean squared error<\/td>\r\n<td>Regression<\/td>\r\n<td>Averages the squared differences between predictions and true\r\nvalues<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Mean absolute error<\/td>\r\n<td>Regression<\/td>\r\n<td>Averages the size of the errors, ignoring direction<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Root mean squared error<\/td>\r\n<td>Regression<\/td>\r\n<td>Textbooks define it as the square root of the mean squared\r\nerror<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Binary cross entropy<\/td>\r\n<td>Classification with targets of 0 or 1<\/td>\r\n<td>Measures how far each prediction is from the true value and averages\r\nthese<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<p><strong>Mean squared error.<\/strong> In this course the errors are\r\ndescribed as growing exponentially with distance. Textbooks put it more\r\nexactly, saying the penalty grows with the square of the distance.\r\nEither way far predictions get a massive penalty and close ones a\r\nminimal penalty.<\/p>\r\n<p><strong>Binary cross entropy.<\/strong> It comes from information\r\ntheory and asks how many bits are lost. It is the difference between two\r\nprobability distributions, p the true one-hot label and q the predicted\r\nprobability. The prediction usually comes from a sigmoid or softmax.<\/p>\r\n<p><strong>A common mistake.<\/strong> Pairing a cost with the wrong\r\ntask, such as binary cross entropy for house prices.<\/p>\r\n<h2 id=\"gradient-descent\">Gradient descent<\/h2>\r\n<p><strong>What it is.<\/strong> Gradient descent finds which way to move\r\nthe weights and biases to lower the cost. It uses the derivative, which\r\nis the slope of the cost at the current point. The sign of the slope\r\ngives the direction of the next move.<\/p>\r\n<p><strong>Why the negative direction.<\/strong> A positive slope means\r\nthe cost rises as the weight rises, so the update lowers the weight.\r\nRepeating this lowers the cost step by step.<\/p>\r\n<p><strong>Easily confused.<\/strong> Backpropagation and gradient\r\ndescent do different jobs.<\/p>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Process<\/th>\r\n<th>Job<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Backpropagation<\/td>\r\n<td>Sends the error back to each layer and calculates partial\r\nderivatives with the chain rule, so it finds the direction of\r\nimprovement<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Gradient descent<\/td>\r\n<td>Uses those derivatives to adjust the weights and biases for the next\r\nround of feed forward, so it makes the change<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<h2 id=\"testing-and-inference\">Testing and inference<\/h2>\r\n<p>When training ends, the network is tested on new unseen data and its\r\nperformance is measured. This is usually called inference. The weights\r\nare not trained on the test data. Textbooks add that this shows how well\r\nthe function works beyond the training samples.<\/p>\r\n"}, {"deck": "w07", "html": "<h1\r\nid=\"forward-pass-total-error-and-weight-updates-in-a-small-network\">Forward\r\npass, total error and weight updates in a small network<\/h1>\r\n<p>The perceptron, the loop outline, the cost functions and the idea of\r\ngradient descent are in the week 6 note.<\/p>\r\n<h2 id=\"the-example-network\">The example network<\/h2>\r\n<p><strong>What it is.<\/strong> The worked example has two inputs, two\r\nperceptrons in a hidden middle layer and two perceptrons in the last\r\nlayer. The hidden layer sits between the inputs and the last layer. The\r\nsize is small so the working can be followed, and the same process\r\nscales to a network of any size.<\/p>\r\n<p><strong>Starting point.<\/strong> The example gives initial weights,\r\nbiases, training inputs and targets. The weights are random, so nothing\r\nhas been optimised and the first prediction is poor. Backpropagation\r\naims to improve them so the next prediction has less error.<\/p>\r\n<h2 id=\"the-forward-pass\">The forward pass<\/h2>\r\n<p><strong>What it is.<\/strong> The forward pass moves from the input\r\nlayer towards the output layer and produces a prediction.<\/p>\r\n<p><strong>How it works.<\/strong> Each perceptron first finds its total\r\nnet input, which is its weighted inputs plus its bias. It then applies\r\nthe logistic activation function to that net input to get its output.\r\nThe hidden perceptrons do this first. Their outputs become the inputs of\r\nthe last layer, which repeats the same two steps. The outputs of the\r\nlast layer are the prediction. Textbooks add that the logistic function\r\nsqueezes any net input into a value between 0 and 1.<\/p>\r\n<p><strong>Example.<\/strong> In the course example the first output\r\nneuron predicts about 0.75 against a target of 0.01, and the second\r\npredicts about 0.77 against a target of 0.99. Both are well off, as\r\nrandom weights would give.<\/p>\r\n<p><strong>A common mistake.<\/strong> Saying the forward pass changes\r\nthe weights or is where learning happens. It only uses the current\r\nweights to make a prediction.<\/p>\r\n<h2 id=\"total-error\">Total error<\/h2>\r\n<p><strong>What it is.<\/strong> Each output neuron has a target and a\r\nprediction. The cost function combines the errors of the output neurons\r\ninto one total error for the network.<\/p>\r\n<p><strong>Why it is needed.<\/strong> Training needs a single quantity\r\nto reduce, and the backward pass measures every weight against it. In\r\nthe example the two output neurons each contribute to the total.<\/p>\r\n<p><strong>Easily confused.<\/strong> Loss is for one observation and\r\ncost is an average over the training set. Here the combining is across\r\noutput neurons, and the course calls the result the total error.<\/p>\r\n<p><strong>A common mistake.<\/strong> Forming the total from only the\r\nfirst output neuron, or from the hidden neurons. Only the output neurons\r\nhave targets.<\/p>\r\n<h2 id=\"the-backward-pass\">The backward pass<\/h2>\r\n<p><strong>What it is.<\/strong> The backward pass starts from the error\r\nat the output and works back through the layers. Its goal is to update\r\nevery weight so the predictions move closer to the targets, which lowers\r\nthe error for each output neuron and for the network as a whole.<\/p>\r\n<p><strong>How it works.<\/strong> For one weight, the key question is\r\nhow much a change in that weight would change the total error. The\r\nanswer is the partial derivative of the total error with respect to the\r\nweight. Textbooks explain that partial means only that weight varies\r\nwhile all the others are held fixed. A larger value means the weight has\r\nmore effect on the error.<\/p>\r\n<p><strong>Easily confused.<\/strong> The backward pass includes\r\nbackpropagation, which finds the derivatives, and then gradient descent,\r\nwhich uses them to change the weights. Backpropagation does not change\r\nany weight itself.<\/p>\r\n<h2 id=\"why-the-chain-rule\">Why the chain rule<\/h2>\r\n<p><strong>What it is.<\/strong> A weight does not touch the total error\r\ndirectly. It changes the total net input of its neuron. That changes the\r\nneuron's output, and that output changes the error. The chain rule\r\nmultiplies the effect of each link, giving three pieces.<\/p>\r\n<ul>\r\n<li>How much the total error changes with the neuron's output.<\/li>\r\n<li>How much the output changes with the total net input.<\/li>\r\n<li>How much the total net input changes with the weight.<\/li>\r\n<\/ul>\r\n<p><strong>Why it helps.<\/strong> Each piece is simple alone, so one\r\nhard question becomes three easy ones.<\/p>\r\n<p><strong>Zero terms.<\/strong> A piece drops out as zero when the\r\nweight has no effect on it. For a weight into the first output neuron,\r\nthe error of the second output neuron drops out, because that weight\r\ndoes not influence it.<\/p>\r\n<p><strong>A common mistake.<\/strong> Treating the learning rate as one\r\nof the pieces. The learning rate enters later, at the update.<\/p>\r\n<h2 id=\"weight-update-and-learning-rate\">Weight update and learning\r\nrate<\/h2>\r\n<p><strong>What it is.<\/strong> Gradient descent subtracts the gradient\r\nfrom the current weight, which moves the weight in the opposite\r\ndirection to the gradient. The gradient points towards higher error, so\r\ngoing the other way lowers the error. The learning rate scales the step.\r\nThe course example applies a learning rate of 0.5.<\/p>\r\n<p><strong>Easily confused.<\/strong> The learning rate is chosen by\r\npeople before training, while training adjusts the weights. Textbooks\r\nmake this point.<\/p>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Learning rate<\/th>\r\n<th>Effect<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Too large<\/td>\r\n<td>Steps overshoot the minimum and the error bounces up and down<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Too small<\/td>\r\n<td>Each step is tiny, so learning is very slow<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<p>Textbooks give these effects. A good value lies between the two and\r\nlets the error fall steadily.<\/p>\r\n<p><strong>A common mistake.<\/strong> Setting the rate to zero to stop\r\nthe bouncing. The weights would then never change and learning would\r\nstop. To calm a bouncing error, reduce the rate.<\/p>\r\n<h2 id=\"updating-every-weight-and-bias\">Updating every weight and\r\nbias<\/h2>\r\n<p><strong>What it is.<\/strong> The same process updates every weight\r\nand bias in every layer and perceptron.<\/p>\r\n<p><strong>Why backpropagation is needed.<\/strong> The cost function\r\nmeasures the error only at the output, yet the weights and biases of\r\nevery layer influence that error. Backpropagation sends the error back\r\nsystematically so each parameter can be corrected. Without it the\r\nearlier layers could not be trained.<\/p>\r\n<p><strong>A common mistake.<\/strong> Believing only the output layer is\r\nupdated.<\/p>\r\n<h2 id=\"the-next-round-and-the-end-of-training\">The next round and the\r\nend of training<\/h2>\r\n<p>After the update, a new forward pass runs with the new weights. The\r\ncourse counts this as the next epoch, whereas textbooks define an epoch\r\nas one pass over the whole training set. The cycle repeats until the\r\ncost converges or the maximum number of epochs is reached. The finished\r\nnetwork is then tested on unseen data, which is called inference.<\/p>\r\n<h2 id=\"forward-pass-and-backward-pass-compared\">Forward pass and\r\nbackward pass compared<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th><\/th>\r\n<th>Forward pass<\/th>\r\n<th>Backward pass<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Direction<\/td>\r\n<td>Inputs to outputs<\/td>\r\n<td>From the error back through the layers<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Job<\/td>\r\n<td>Makes a prediction with the current weights<\/td>\r\n<td>Works out how each weight affects the error, so the weights can be\r\nupdated<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Changes the weights<\/td>\r\n<td>No<\/td>\r\n<td>It leads to the update that does<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<p>Both run in every round of training.<\/p>\r\n"}, {"deck": "w08", "html": "<h1 id=\"convolutional-neural-networks\">Convolutional neural\r\nnetworks<\/h1>\r\n<h2 id=\"why-ordinary-networks-struggle-with-images\">Why ordinary\r\nnetworks struggle with images<\/h2>\r\n<p><strong>What it is.<\/strong> A traditional fully connected network is\r\na good classifier but a poor feature extractor, and it does not scale\r\nwell to images. A convolutional neural network, or CNN, instead assumes\r\nthat its input is an image.<\/p>\r\n<p><strong>Why it matters.<\/strong> The meaning of an image sits in\r\ngroups of neighbouring pixels that together form a shape. One pixel on\r\nits own means almost nothing. A traditional network is not designed to\r\nuse these local groups. A CNN builds the image assumption into its\r\nstructure, so it can use local features. That makes feature extraction\r\nstronger and the whole network more efficient.<\/p>\r\n<p><strong>Confused with.<\/strong> A CNN is still made of neurons with\r\nlearnable weights and biases. Each neuron takes a dot product and may\r\nfollow it with a non-linearity. What changes is the image assumption,\r\nnot the neuron.<\/p>\r\n<h2 id=\"images-and-channels\">Images and channels<\/h2>\r\n<p>Every image is a matrix of pixel values from 0 to 255. A channel is\r\none colour component of the image. A colour image has three channels,\r\nred, green and blue, like three 2D matrices stacked on top of each\r\nother. A grayscale image has one channel.<\/p>\r\n<h2 id=\"convolution-and-the-filter\">Convolution and the filter<\/h2>\r\n<p><strong>What it is.<\/strong> Convolution is a linear operation that\r\nmultiplies a 2D array of weights, called a filter or kernel, with a\r\npatch of the 2D input image. It extracts and keeps the local features of\r\nthe image.<\/p>\r\n<p><strong>How it works.<\/strong> The filter slides across the image. At\r\neach position it multiplies its weights with the pixels beneath it to\r\nproduce one output value. The output is smaller and easier to process,\r\nyet it still holds the features that matter for a good prediction.\r\nDifferent filters detect different features, such as edges, points and\r\ncorners, or they sharpen or soften the image. The most common filter\r\nsize is 3 by 3. For an RGB image the filter works over all three\r\nchannels. Textbooks add that the filter has one layer of weights per\r\nchannel and combines the results into a single output value.<\/p>\r\n<p><strong>Why filters work.<\/strong> Filters start with random values,\r\njust like weights and biases in a traditional network. Many rounds of\r\nfeedforward and backpropagation then turn them into powerful feature\r\ndetectors.<\/p>\r\n<p><strong>Common mistake.<\/strong> Thinking that someone designs the\r\nfilters by hand. In a CNN they are learned during training.<\/p>\r\n<h2 id=\"stride-and-padding\">Stride and padding<\/h2>\r\n<p><strong>Stride.<\/strong> Stride is the amount the kernel shifts each\r\nstep. It moves right by the stride until it covers the full width, then\r\nreturns to the left, drops down by the same stride and repeats. A stride\r\nof 2 visits fewer positions than a stride of 1, so the output is\r\nsmaller.<\/p>\r\n<p><strong>Padding.<\/strong> The edges of the image are awkward, because\r\nedge pixels have fewer neighbours for the kernel to cover. Padding adds\r\na border around the image to handle them. Zero padding fills the border\r\nwith zeros. Reflection padding and replication padding fill it with\r\ncopies of nearby pixel values instead. Textbooks add that padding also\r\nlets the output stay close to the input size.<\/p>\r\n<p><strong>Confused with.<\/strong> Stride changes how far the kernel\r\nmoves. Padding changes what surrounds the image. Neither changes the\r\nfilter weights.<\/p>\r\n<h2 id=\"pooling\">Pooling<\/h2>\r\n<p><strong>What it is.<\/strong> A pooling layer reduces the spatial size\r\nof the convolved features. This lowers the computing power needed. It\r\nalso picks out dominant features that do not depend much on position or\r\nrotation, which helps the model train well.<\/p>\r\n<p><strong>Two types.<\/strong> Max pooling returns the largest value in\r\nthe patch under the kernel. Average pooling returns the mean of all\r\nvalues in that patch.<\/p>\r\n<p><strong>Confused with.<\/strong> Max pooling keeps only the strongest\r\nresponse. Average pooling gives a smoother summary of the whole patch.\r\nBoth shrink the map.<\/p>\r\n<h2 id=\"activation\">Activation<\/h2>\r\n<p><strong>What it is.<\/strong> An activation function is a mathematical\r\nequation that decides a neuron's output. In a CNN it works across two\r\ndimensions like a screen and decides whether each output pixel is\r\nactivated. It is a gate between the inputs feeding a neuron and the\r\noutput going to the next layer.<\/p>\r\n<p><strong>Why.<\/strong> Textbooks add that without a non-linear\r\nactivation the network could only learn simple linear relationships.\r\nReLU is the most popular choice in CNNs. Textbooks describe it as\r\npassing positive values and setting negative ones to zero.<\/p>\r\n<h2 id=\"normalisation\">Normalisation<\/h2>\r\n<p><strong>Input scaling.<\/strong> Features are scaled to a fixed range,\r\nfor example 0 to 1. This keeps the size of every feature's contribution\r\nto the prediction about the same.<\/p>\r\n<p><strong>Batch normalisation.<\/strong> Suppose two batches look very\r\ndifferent from each other. The data distribution then shifts a lot,\r\nwhich is called covariate shift. The network is misled into adjusting\r\nits weights towards one odd batch, so it bounces back and forth between\r\ndistributions and trains slowly. Batch normalisation works on feature\r\nmaps across a mini batch. For each feature it finds the mean and\r\nvariance, subtracts the mean and divides by the standard deviation. This\r\nspeeds up learning and gives faster convergence.<\/p>\r\n<p><strong>Confused with.<\/strong> Input scaling happens once to the raw\r\ndata. Batch normalisation happens inside the network, batch by\r\nbatch.<\/p>\r\n<h2 id=\"overfitting-and-dropout\">Overfitting and dropout<\/h2>\r\n<p><strong>Overfitting.<\/strong> The training error becomes very small,\r\nbut the error on new data is large. The network has memorised the\r\ntraining examples and has not learned to generalise.<\/p>\r\n<p><strong>Dropout.<\/strong> Dropout is a simple regularisation\r\ntechnique that helps prevent overfitting. During training, some layer\r\noutputs are randomly ignored. The layer then looks like a layer with a\r\ndifferent number of nodes and connections from the one in the previous\r\npass. The network cannot lean on any one path, so it cannot simply\r\nmemorise the whole training set. One description of dropout is that it\r\nthrows away some training samples in each iteration. Textbooks put it as\r\nrandomly ignoring some neuron outputs, and that is the version to use as\r\na definition.<\/p>\r\n<p><strong>Common mistake.<\/strong> Thinking dropout is meant to help\r\nmemorise the data. It does the opposite. The dropped outputs also come\r\nback on later passes, so they are not removed for good.<\/p>\r\n<h2 id=\"fully-connected-layers\">Fully connected layers<\/h2>\r\n<p>A CNN has two main stages. First, convolution, pooling and dropout\r\nbreak the image into features and analyse them. Then one or more fully\r\nconnected layers take those features and predict the best label.<\/p>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Layer<\/th>\r\n<th>Job<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Flatten<\/td>\r\n<td>Turns the feature maps into a single vector that the next stage can\r\ntake as input<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Normal fully connected<\/td>\r\n<td>Applies weights and biases to the features<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Softmax output<\/td>\r\n<td>Turns feature values, called logits, into a probability for each\r\nlabel, and the probabilities sum to one<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<h2 id=\"the-layers-in-order\">The layers in order<\/h2>\r\n<p>A CNN uses six layer types, which are convolutional, pooling,\r\nactivation, normalisation, dropout and fully connected. They are stacked\r\nin a certain order to shrink the image while keeping the features that\r\ntell classes apart. An image passes through the feature stage, then the\r\nflatten layer, then the fully connected layers, and softmax gives the\r\nfinal label probabilities.<\/p>\r\n"}, {"deck": "w09", "html": "<h1 id=\"image-segmentation-and-object-detection\">Image segmentation and\r\nobject detection<\/h1>\r\n<h2 id=\"classification-versus-segmentation\">Classification versus\r\nsegmentation<\/h2>\r\n<p><strong>What it is.<\/strong> Classification gives one label to the\r\nwhole image, such as cat or car. Segmentation gives a class to every\r\npixel, so it shows where the target object is.<\/p>\r\n<p><strong>Why segmentation exists.<\/strong> Sometimes the target fills\r\nonly a small part of the image and other objects share the frame. A\r\nphoto of a person and a dog cannot be labelled correctly as just DOG or\r\njust HUMAN. We may also want to know whether there is a dog, where it is\r\nand how many there are. Segmentation can find several occurrences of the\r\nobject across the image. It is used where each pixel needs a label, such\r\nas self-driving cars, cancer segmentation and brain tumour\r\nsegmentation.<\/p>\r\n<p><strong>Different labels.<\/strong> A classifier is trained with one\r\ncategorical or numerical label per image. A segmentation network is\r\ntrained with a binary mask image, which marks the object pixels. It also\r\noutputs a prediction mask image rather than a single label. So the\r\nnetwork must turn the image into a feature vector and then rebuild an\r\nimage from it. Making ground-truth masks is labour intensive, which is a\r\nreal cost of segmentation.<\/p>\r\n<p><strong>Common mistake.<\/strong> Treating the mask as an extra\r\ndecoration. It is the label itself, and the network is trained against\r\nit.<\/p>\r\n<h2 id=\"u-net\">U-Net<\/h2>\r\n<p><strong>What it is.<\/strong> U-Net is a segmentation network that\r\nconverts the image into a feature vector and then reconstructs a\r\nsegmented image from it. Its architecture looks like the letter U, which\r\ngives it the name.<\/p>\r\n<p><strong>How it works.<\/strong> It has three sections. Contraction\r\nblocks each use two 3 by 3 convolution layers followed by 2 by 2 max\r\npooling, so the maps shrink and the features get compressed. The\r\nbottleneck mediates between the contraction layers and the expansion\r\nlayers. Expansion blocks each use two 3 by 3 convolution layers followed\r\nby a 2 by 2 up-sampling layer, so the maps grow back towards the size of\r\nthe original image.<\/p>\r\n<p><strong>Why copy and crop.<\/strong> Max pooling loses some\r\ninformation as it shrinks the maps. Each expansion block therefore\r\nreceives a copy and crop of the feature map from the matching\r\ncontraction block. This compensates for the lost information. Textbooks\r\nadd that the copied maps give the expansion path fine spatial detail,\r\nwhich helps draw sharp object boundaries.<\/p>\r\n<p><strong>Confused with.<\/strong> Contraction shrinks with max pooling\r\nand expansion grows with up-sampling. Do not swap them. Also remember\r\nthat copy and crop is the link across the U between matching blocks.<\/p>\r\n<h2 id=\"segmentation-versus-object-detection\">Segmentation versus object\r\ndetection<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th><\/th>\r\n<th>Segmentation<\/th>\r\n<th>Object detection<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Output<\/td>\r\n<td>A pixel-level mask with the exact shape and boundary of each\r\nobject<\/td>\r\n<td>Bounding boxes, each with a class label<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Detail<\/td>\r\n<td>Fine<\/td>\r\n<td>Coarser<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Speed<\/td>\r\n<td>Slower<\/td>\r\n<td>Faster<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Suits<\/td>\r\n<td>Medical imaging and satellite image analysis<\/td>\r\n<td>Real-time tasks such as pedestrian or vehicle detection<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Models<\/td>\r\n<td>U-Net and SegNet<\/td>\r\n<td>Faster R-CNN, YOLO and SSD<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<p>Choose segmentation when the exact outline matters, such as the\r\nboundary of a tumour. Choose detection when speed matters more than fine\r\ndetail, such as finding vehicles in live video.<\/p>\r\n<h2 id=\"detection-labels\">Detection labels<\/h2>\r\n<p>In classification the label is a one hot vector. For four classes,\r\nperson is 1 0 0 0 and bottle is 0 1 0 0. That vector says only which\r\nclass the whole image belongs to. For detection the label must also hold\r\nwhat is needed to rebuild the bounding box. The model predicts at least\r\nfive values, which are the centre x and y of the box, the width and\r\nheight of the box, and the class label. In short, classification says\r\nwhat, and detection says what and where.<\/p>\r\n<h2 id=\"yolo\">YOLO<\/h2>\r\n<p><strong>What it is.<\/strong> YOLO stands for You Only Look Once. It\r\nis a real-time object detection model that processes the entire image in\r\none forward pass. That makes it extremely fast compared with older\r\nmethods such as Faster R-CNN. Other popular detectors are the R-CNN\r\nfamily, SSD and DETR.<\/p>\r\n<p><strong>Step 1, input processing.<\/strong> The image is resized to a\r\nfixed shape, typically 416 by 416 or 608 by 608, so any image can be\r\nhandled consistently. Pixel values are normalised from 0 to 255 to a\r\nscale of 0 to 1, which helps the network learn faster and stops large\r\npixel values dominating. The image is then divided into an S by S grid.\r\nIn YOLOv3 a 416 by 416 image gives a 13 by 13 grid.<\/p>\r\n<p><strong>Why a grid.<\/strong> Each cell is responsible for objects\r\nwhose centre falls inside it. This is faster and more efficient than\r\nchecking every possible region, as R-CNN does.<\/p>\r\n<p><strong>Step 2, feature extraction.<\/strong> A CNN backbone such as\r\nDarknet turns the image into a feature map, picking up edges, textures\r\nand shapes. Darknet-19 is used in YOLOv2 and Darknet-53 in YOLOv3.<\/p>\r\n<p><strong>Step 3, bounding boxes.<\/strong> Each cell predicts several\r\nboxes. Each box holds the centre x and y relative to the cell, the width\r\nand height relative to the whole image, and a confidence score from 0 to\r\n1 that an object is present. Each cell uses anchor boxes, usually 3 to 5\r\nper cell, because objects have different shapes. For example a cell\r\nholding a car and a person can use one anchor for each.<\/p>\r\n<p><strong>Step 4, class prediction.<\/strong> Each cell gives class\r\nprobabilities only for objects it detects. Older YOLO versions used\r\nsoftmax, which assigns one class per object. YOLOv3 and later use\r\nsigmoid, which allows several classes for one object. This helps in\r\nmulti-label classification. Softmax and sigmoid are easily mixed up, so\r\nremember that sigmoid is the newer one.<\/p>\r\n<p><strong>Step 5, non-maximum suppression.<\/strong> This removes\r\nduplicate boxes, as the next section explains.<\/p>\r\n<p><strong>Step 6, final output.<\/strong> A list of detected objects,\r\neach with box coordinates, a class label and a confidence score.<\/p>\r\n<h2 id=\"non-maximum-suppression\">Non-maximum suppression<\/h2>\r\n<p>Several boxes often overlap the same object, so redundant ones must\r\ngo. First sort all boxes by confidence score and keep the highest. Then\r\ncompare each remaining box with the kept one using intersection over\r\nunion, which measures how much two boxes overlap. If the overlap is\r\nabove a threshold such as 0.5, the box is a duplicate and is discarded.\r\nIf it is below, the box is kept, because it probably covers a different\r\nobject. Repeat for the remaining boxes.<\/p>\r\n<p><strong>Common mistake.<\/strong> Thinking that intersection over\r\nunion picks the best box. Confidence picks the best box, and\r\nintersection over union only measures overlap.<\/p>\r\n"}, {"deck": "w10", "html": "<h1 id=\"recurrent-neural-networks\">Recurrent neural networks<\/h1>\r\n<h2 id=\"sequential-data\">Sequential data<\/h2>\r\n<p><strong>What it is.<\/strong> In some tasks each example stands alone\r\nand no history is needed. Classifying an iris flower from its four\r\nmeasurements is one. In other tasks the order of the data matters and it\r\nhelps to know what came before and after. Examples are natural language\r\nprocessing, speech recognition, machine translation, handwriting\r\nrecognition, video sequence prediction and time series.<\/p>\r\n<p><strong>Why order matters.<\/strong> The cat killed the dog and the\r\ndog killed the cat use the same words with opposite meanings. A video\r\nexample makes the same point. One frame of a ball cannot show which way\r\nit is moving, but many frames in succession give enough information to\r\npredict its direction.<\/p>\r\n<p><strong>Confused with.<\/strong> Ordinary feedforward networks and\r\nCNNs treat each input on its own. Textbooks add that this is why they\r\ncannot use order.<\/p>\r\n<h2 id=\"how-an-rnn-remembers\">How an RNN remembers<\/h2>\r\n<p><strong>What it is.<\/strong> A recurrent neural network, or RNN, is a\r\nfamily of networks for sequential and temporal problems. A feedforward\r\nnetwork or CNN only has connections from one layer to the next. An RNN\r\nadds a recurrent connection that forms a cycle.<\/p>\r\n<p><strong>How it works.<\/strong> The loop passes prior information\r\nforward. That information is the hidden state, a representation of\r\nprevious inputs. At each time step the node joins the current input to\r\nthe old hidden state, which is called working memory, and passes the\r\nresult through an activation function. The output goes onward to the\r\noutput layer, and a copy goes to the next step as the new working\r\nmemory. So the input at time t depends on the current input and on the\r\nhidden state, which itself depends on earlier inputs. The folded view\r\nshows one node with a loop. The unfolded view shows the same node\r\nrepeated once for each time step.<\/p>\r\n<p><strong>Example.<\/strong> To read a sentence, split it into words.\r\nThe RNN encodes the first word and gives an output. The next word is fed\r\nin along with the hidden state from the previous step. This repeats\r\nuntil the last word. By then the hidden state holds information from all\r\nthe earlier words. The final output can be passed to a feedforward layer\r\nto classify the intent of the sentence.<\/p>\r\n<p><strong>Common mistake.<\/strong> Thinking that the hidden state is\r\nthe same as the output. The output is also sent to the next step, but\r\nthe hidden state is the memory carried through time.<\/p>\r\n<h2 id=\"vanishing-gradient\">Vanishing gradient<\/h2>\r\n<p><strong>What it is.<\/strong> The vanishing gradient problem is the\r\ncause of short-term memory in an RNN. As it processes more steps, it has\r\ntrouble keeping information from earlier steps.<\/p>\r\n<p><strong>Why it happens.<\/strong> In backpropagation each node works\r\nout its gradient from the effects of the layer after it. If the\r\nadjustments there are already small, the adjustment for the current\r\nlayer is even smaller. So gradients shrink exponentially as they travel\r\nback. The earliest layers receive tiny gradients, their weights barely\r\nchange and they learn almost nothing. It is common in very deep\r\nfeedforward networks as well as in RNNs.<\/p>\r\n<p><strong>Example.<\/strong> In a long sentence, the first words have\r\nlittle influence on the final hidden state.<\/p>\r\n<p><strong>Common mistake.<\/strong> Thinking that the gradient grows or\r\nthat the network crashes. The gradient becomes tiny, so learning\r\nstalls.<\/p>\r\n<h2 id=\"backpropagation-through-time\">Backpropagation through time<\/h2>\r\n<p>Training an RNN uses a loss function that measures the error between\r\nthe true label and the predicted label. The aim is to minimise it with a\r\nforward pass and a backward pass. In the forward pass the input goes\r\nthrough the hidden states and the estimated label is calculated. The\r\nloss is computed to see how far it is from the true label, and the total\r\nloss L completes the pass. In the backward pass the total loss is\r\npropagated back through the network. Partial derivatives and the chain\r\nrule show how much each weight should change. It is called through time\r\nbecause the error travels back across the time steps.<\/p>\r\n<h2 id=\"truncated-backpropagation-through-time\">Truncated\r\nbackpropagation through time<\/h2>\r\n<p><strong>What it is.<\/strong> Normal backpropagation through time goes\r\nback through the entire sequence, which causes the gradients to vanish.\r\nTruncated backpropagation through time only looks back over a moving\r\nwindow of time steps.<\/p>\r\n<p><strong>Benefit.<\/strong> It is much faster and less complex, because\r\ngradients from faraway steps are not included.<\/p>\r\n<p><strong>Drawback.<\/strong> Dependencies longer than the window cannot\r\nbe learned. Take the sentence I grew up in France and I speak fluent\r\nFrench. The recent words suggest a language. To narrow it down, the\r\nnetwork needs France from much further back. If the gap is larger than\r\nthe window, the clue is out of reach. That is why it may not be an ideal\r\nsolution.<\/p>\r\n<h2 id=\"lstm\">LSTM<\/h2>\r\n<p><strong>What it is.<\/strong> A long short-term memory network is a\r\nspecial kind of RNN that can learn long-term dependencies. It is\r\ndesigned to remember information for long periods. A standard RNN has a\r\nsingle layer in its repeating unit, while an LSTM has four interacting\r\nlayers.<\/p>\r\n<p><strong>Cell state.<\/strong> The cell state is the horizontal line\r\nrunning through the cell like a conveyor belt. It runs straight along\r\nthe whole chain with only minor linear interactions. Textbooks add that\r\nthis is why useful information and gradients can survive over long\r\nsequences, where a simple RNN fades.<\/p>\r\n<p><strong>Gates.<\/strong> A gate lets information through only in part.\r\nIt is built from a sigmoid layer and a pointwise multiplication. The\r\nsigmoid gives numbers from zero to one for each component. Zero means\r\nlet nothing through and one means let everything through. The LSTM uses\r\ngates to add or remove information from the cell state.<\/p>\r\n<p><strong>Step one, forget.<\/strong> The forget gate is a sigmoid layer\r\nthat looks at the previous hidden state and the current input. For each\r\nnumber in the cell state it gives a value from 0 to 1. A 1 means keep it\r\ncompletely and a 0 means get rid of it completely.<\/p>\r\n<p><strong>Step two, store.<\/strong> The input gate is a sigmoid layer\r\nthat decides which values to update. A second layer creates a vector of\r\nnew candidate values that could be added. Together they make an update,\r\nwhich is combined with the old cell state to form the new one.<\/p>\r\n<p><strong>Step three, output.<\/strong> The output is a filtered version\r\nof the cell state. A sigmoid layer decides which parts to output. The\r\ncell state goes through tanh, which pushes the values between minus 1\r\nand 1, and is multiplied by the sigmoid output so only the chosen parts\r\ncome out.<\/p>\r\n<p><strong>Common mistake.<\/strong> Mixing up the roles. Forget removes\r\nold information, input adds new information and output filters what is\r\nshown.<\/p>\r\n<h2 id=\"gru\">GRU<\/h2>\r\n<p>A gated recurrent unit is a simplified variant of the LSTM. It has\r\nfewer gates, only an update gate and a reset gate. It still models\r\ntemporal patterns efficiently and needs less computational power.<\/p>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th><\/th>\r\n<th>LSTM<\/th>\r\n<th>GRU<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Gates<\/td>\r\n<td>Forget, input and output<\/td>\r\n<td>Update and reset<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Cost<\/td>\r\n<td>More computation<\/td>\r\n<td>Less computation<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<p><strong>Confused with.<\/strong> Both are gated and both address the\r\nvanishing gradient problem. The GRU is the lighter one. Textbooks add\r\nthat a GRU has no separate cell state.<\/p>\r\n"}]};

const INTRO = "I am revising for a university Artificial Intelligence in-class test. The questions are descriptive, test basic understanding and need no calculations. Use plain language and keep your reply under 200 words.";
function prompt(q, mode, mine) {
  const L = [INTRO, "", "QUESTION", q.q, ""];
  if (isEx(q)) {
    if (mode === "hint") return L.concat(mine ? ["MY ANSWER SO FAR", mine, ""] : [], "Do not give me the full answer. Give me one hint that points me towards what a good answer covers, then ask me to try again.").join("\n");

      "Mark my answer against those points. Say which points I made, which I missed, and correct anything I got wrong. Then ask me one follow-up question that checks I understand the idea.").join("\n");
  }
  const letter = i => String.fromCharCode(65 + i), list = a => a.map(i => letter(i) + ". " + q.options[i]).join("\n") || "Nothing";
  const ok = same(mine, q.answer);
  return L.concat("OPTIONS", list(q.options.map((_, i) => i)), "", "CORRECT", list(q.answer), "", "I CHOSE", list(mine), "",
    ok ? "I got this right. Explain the idea behind it one level deeper, then ask me one follow-up question that checks I understand it."
       : "I got this wrong. Explain what I was probably thinking, why the correct answer is right, and the one idea to remember. Then ask me one follow-up question.").join("\n");
}

}
