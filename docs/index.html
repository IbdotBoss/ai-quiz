:root{
  --paper:#fff;--ink:#1b1424;--ink-2:#4b4357;--ink-3:#c9c3d3;--hair:#dedbe4;--tint:#f4f2f7;
  --font:"Atkinson Next",Verdana,sans-serif;
  --right:#18794e;--wrong:#b3261e;--focus:#3e4a89;--off:#6b6475;--hatch:#d9d5e0;--veil:#1b142499;
  --t-xs:.84rem;--t-s:.94rem;--t-m:1.0625rem;--t-l:1.375rem;--t-xl:2.25rem;
  --r:6px;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t-m)/1.5 var(--font)}
main{max-width:680px;margin:0 auto;padding:24px 16px 72px;min-height:100dvh}
@media (min-width:800px){main{padding:48px 24px 96px}}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:800 var(--t-xl)/1.1 var(--font)}
h2{font:700 var(--t-l)/1.25 var(--font);margin-top:40px}
h3,.sub{font-size:var(--t-m);font-weight:700;margin-top:20px;line-height:1.5}
h1.stem,h2.stem{margin:8px 0 4px}
h1:focus,h2:focus,.fb:focus,legend:focus{outline:none}
p{margin:8px 0;text-wrap:pretty}
.s{font-size:var(--t-s);color:var(--ink-2)}
a{color:var(--ink)}
svg{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

button,select{font:700 1rem/1.2 var(--font);color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 20px;min-height:44px;cursor:pointer}
button.p{background:var(--ink);color:var(--paper)}
button:active:not(:disabled){transform:translateY(1px)}
button.l{border:0;padding:12px 0;text-decoration:underline;font-weight:400;font-size:var(--t-s)}
button:disabled{color:var(--off);border-color:var(--off);background:var(--paper);cursor:default}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1.5px solid var(--ink);font-size:var(--t-s)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--wrong)}

/* the heatmap */
.plot{border-collapse:separate;border-spacing:4px 4px;margin:12px 0 0 -4px;width:calc(100% + 8px)}
.plot th{font-weight:400;text-align:left;padding:0}
.plot thead th{font-size:var(--t-xs);color:var(--ink-2);text-align:center;vertical-align:bottom;width:72px;line-height:1.2;padding-bottom:4px}
.plot thead th:first-child{width:auto}
.plot tbody th{border-top:1px solid var(--hair);padding:0 8px 0 0}
.plot .wk{display:flex;gap:4px;width:100%;min-height:48px;align-items:center;text-align:left;border:0;border-radius:0;padding:0;font-weight:400;font-size:var(--t-s);line-height:1.3}
.plot .wk b{font-weight:800;flex:0 0 1.7em;font-variant-numeric:tabular-nums}
.plot .wk span{text-decoration:underline}
select{max-width:100%;text-overflow:ellipsis}
.plot td{padding:0;height:1px}
.plot td button{width:100%;height:100%;min-height:48px;border:0;border-radius:0;padding:0;font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.plot td button.new{line-height:1.2;background:repeating-linear-gradient(135deg,var(--paper) 0 5px,var(--hatch) 5px 6.5px);color:var(--ink-2);font-size:var(--t-xs);font-weight:400}
.plot td button:hover{outline:2px solid var(--ink);outline-offset:1px}
.key{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:var(--t-xs);color:var(--ink-2);flex-wrap:wrap}
.key .sw{display:flex}.key .sw i{width:16px;height:12px;display:block}
.key .nw{width:16px;height:12px;background:repeating-linear-gradient(135deg,var(--paper) 0 3px,var(--hatch) 3px 4.5px);border:1px solid var(--hair);margin-left:12px}

.papers{border-top:1.5px solid var(--ink);margin-top:12px}
.papers button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:16px 0;font-weight:400}
.papers button b{font-size:var(--t-l);font-weight:700}
.papers button span{grid-column:1;color:var(--ink-2);font-size:var(--t-s);line-height:1.4}
.papers button i{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:var(--t-s);font-variant-numeric:tabular-nums;white-space:nowrap}
.papers button:hover:not(:disabled) b{text-decoration:underline}
.papers button:disabled b{color:var(--off)}
.paper{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;border-bottom:1px solid var(--hair);padding:16px 0}
.paper b{display:block;font-size:var(--t-l);font-weight:700}
.paper span{display:block;color:var(--ink-2);font-size:var(--t-s);line-height:1.4}
.paper .m{color:var(--ink);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px}.papers .acts button{display:inline-block;width:auto;border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 16px;font-weight:700;text-align:center}.papers .acts button:disabled{border-color:var(--off)}
@media (max-width:520px){.paper{grid-template-columns:minmax(0,1fr)}}
.pl{margin:8px 0;padding-left:20px}.pl li{margin:4px 0}
.top>b{min-width:0;overflow-wrap:anywhere}.top>button,.top>span{white-space:nowrap;flex:none}

fieldset{border:0;margin:0;padding:0;min-width:0}legend{padding:0}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:24px;font-size:var(--t-s);color:var(--ink-2)}
.stem{font:700 var(--t-l)/1.35 var(--font);margin:8px 0 4px;white-space:pre-wrap;text-wrap:balance;display:block}
.how{display:block;font-size:var(--t-s);color:var(--ink-2);font-weight:400;margin-bottom:12px}
.o{display:grid;grid-template-columns:22px minmax(0,1fr) 24px;gap:0 12px;align-items:start;padding:12px 0;border-top:1px solid var(--hair);cursor:pointer}
.o input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ink);cursor:pointer}
.o input:disabled{cursor:default}
.o small{display:block;font-weight:700;font-size:var(--t-xs);color:var(--wrong)}.o small.ok{color:var(--right)}
.o .mk{width:22px;height:22px;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:4px 24px}.row .o{border:0;grid-template-columns:22px auto;padding:8px 0;min-height:44px}
textarea{display:block;width:100%;min-height:200px;resize:vertical;font:400 var(--t-m)/1.6 var(--font);color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px}
textarea.short{min-height:96px}
textarea::placeholder{color:var(--ink-2);opacity:1}
.yours{white-space:pre-wrap;font-family:var(--font);background:var(--tint);padding:12px;border-radius:var(--r);overflow-wrap:break-word}
.fb{margin-top:20px;border-top:1.5px solid var(--ink);padding-top:4px;overflow-wrap:break-word}
.flag{background:var(--tint);padding:12px;border-radius:var(--r);font-size:var(--t-s);margin-top:12px}
.nav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:28px}
.ai{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
.ai button{font-weight:400;font-size:var(--t-s);padding:8px 16px}

details{margin-top:28px;border-top:1px solid var(--hair)}
summary{cursor:pointer;padding:12px 0;font-size:var(--t-s)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:4px 0 16px}
.grid button{padding:0;min-height:44px;font-size:var(--t-s);font-weight:400;font-variant-numeric:tabular-nums}
.grid .done{background:var(--ink);color:var(--paper);font-weight:700}
.grid .cur{outline:3px solid var(--focus);outline-offset:2px}

.total{font-size:var(--t-xl);font-weight:800;line-height:1.1;margin:16px 0 4px;font-variant-numeric:tabular-nums}
table.t{border-collapse:collapse;width:100%;font-size:var(--t-s);margin-top:8px;font-variant-numeric:tabular-nums}
.t td,.t th{border-bottom:1px solid var(--hair);padding:8px 12px 8px 0;text-align:left;vertical-align:top}
.t th{border-bottom:1.5px solid var(--ink);font-weight:700}
.t .num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0;white-space:nowrap}
.rev{border-top:1.5px solid var(--ink);margin-top:32px}
.foot{margin-top:64px;border-top:1px solid var(--hair);padding-top:16px;font-size:var(--t-s);color:var(--ink-2)}
.foot .gh{display:inline-flex;align-items:center;gap:8px;vertical-align:bottom;min-height:24px}
.notes{overflow-wrap:break-word;font-family:var(--font);font-size:1.0625rem;line-height:1.65}
.notes strong{font-weight:700}
.notes blockquote{margin:12px 0 20px;padding:12px 16px;border-radius:var(--r);background:var(--tint);font-size:var(--t-s)}
.notes blockquote p{margin:0}
.notes blockquote p::before{content:"Watch out. ";font-style:normal;font-weight:700;color:var(--wrong)}
.notes ol,.notes ul{padding-left:24px}
.notes h1{font-size:var(--t-xl);margin-top:28px}
.notes h2{border-top:1px solid var(--hair);padding-top:16px;margin-top:28px}
.notes h3{font-size:var(--t-m);margin-top:24px}
.notes h2{font-size:var(--t-l)}
.notes h4{font:700 var(--t-l)/1.3 var(--font);margin:20px 0 0;border-top:1px solid var(--hair);padding-top:12px}
.notes table{display:block;overflow-x:auto;border-collapse:collapse;margin:12px 0;font-size:var(--t-s);font-variant-numeric:tabular-nums}
.notes td,.notes th{border-bottom:1px solid var(--hair);padding:8px 16px 8px 0;text-align:left;vertical-align:top}
.notes li{margin:4px 0}
dialog{border:1.5px solid var(--ink);border-radius:var(--r);padding:20px;max-width:min(420px,calc(100% - 40px));color:var(--ink)}
dialog::backdrop{background:var(--veil)}
dialog .nav{margin-top:20px}

/* home */
.kick{font-size:var(--t-s);color:var(--ink-2);margin:0}
.next{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:20px;margin-top:16px}
.next small{display:block;font-size:var(--t-s);color:var(--ink-3)}
.next b{display:block;font-size:var(--t-l);line-height:1.3;margin:4px 0 16px;overflow-wrap:break-word}
.next button{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.next button:focus-visible{outline-color:var(--paper)}
.then{margin-top:28px}
.then h2,.wh{margin:0;font-size:var(--t-m)}
.then button{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:12px 0;font-weight:400}
.then button span{color:var(--ink-2);font-size:var(--t-s)}
.then button:hover b{text-decoration:underline}
.plot td .tr{display:block;font-size:var(--t-xs);font-weight:400}
.sq summary{list-style:none;cursor:pointer}.sq summary::-webkit-details-marker{display:none}.sq summary{font-weight:700;padding:12px 0}.sq .pm::after{content:" +";color:var(--ink-2)}.sq[open] .pm::after{content:" -"}
.sq{margin-top:28px}
.more{margin-top:24px}
.menu h2{font-size:var(--t-m);margin-top:28px}
</style>
</head>

<main id="app"></main>
<dialog id="dlg" aria-labelledby="dlg-t"><p id="dlg-t"></p><div class="nav"><button id="dlg-no">Keep answering</button><button class="p" id="dlg-yes">Hand in the paper</button></div></dialog>
<script>
const DATA = {"questions": [{"id": "w01a-001", "week": 1, "topic": "Turing Test", "type": "single", "q": "On what basis does the Turing Test judge whether a machine is intelligent?", "options": ["Whether a human judge can no longer tell it apart from a person", "Whether it reasons internally in the same way a human brain does", "Whether it can process information faster than a human can", "Whether it was built using biologically inspired methods"], "answer": [0], "explain": "A machine passes when a judge cannot tell its replies from a person's. The test looks only at behaviour, so how the machine works, its speed or brain-like design does not matter.", "source": "Week 1 lecture, slide 18", "flag": "", "deck": "w01a"}, {"id": "w01a-006", "week": 1, "topic": "Weak and strong AI", "type": "multi", "q": "Which statements describe strong AI?", "options": ["It aims to be indistinguishable from the human mind", "It is already in everyday use in chatbots and phones", "It is designed to solve one specific problem only", "It would be able to plan for the future and be creative", "It would have self-awareness and consciousness"], "answer": [0, 3, 4], "explain": "Strong AI is a theoretical goal, a machine with human-level intelligence. Systems in everyday use are narrow weak AI.", "source": "Week 1 lecture, slide 21", "flag": "", "deck": "w01a"}, {"id": "w01a-008", "week": 1, "topic": "AI types", "type": "single", "q": "A chess program always returns the same move for the same board and keeps no memory of earlier games. Which type of AI is this?", "options": ["A reactive machine", "A limited memory machine", "A theory of mind system", "A self-aware system"], "answer": [0], "explain": "Reactive machines have no memory and are task specific, so an input always gives the same output. Deep Blue is the standard example.", "source": "Week 1 lecture, slide 23", "flag": "", "deck": "w01a"}, {"id": "w01a-012", "week": 1, "topic": "AI types", "type": "multi", "q": "Which of these are among the four types of AI, ordered from simple to advanced?", "options": ["Self-awareness", "Weak AI", "Limited memory machines", "Reactive machines", "Theory of mind", "Strong AI"], "answer": [0, 2, 3, 4], "explain": "Weak and strong AI are a separate split, based on how broad the ability is. The four types are ordered by memory and understanding.", "source": "Week 1 lecture, slide 23 to 26", "flag": "", "deck": "w01a"}, {"id": "w01a-018", "week": 1, "topic": "Defining AI", "type": "single", "q": "A system reaches intelligent behaviour by a method that looks nothing like human thought. From the behavioural view of AI, is this a problem?", "options": ["Yes, because only biologically observable methods count as AI", "Yes, because the method must match how humans reason", "No, but only if the system also has consciousness", "No, because the outcome matters and the method does not"], "answer": [3], "explain": "In a computing context what matters is the behaviour produced. The definition of AI does not have to be confined to biologically observable methods.", "source": "Week 1 lecture, slide 2 and 27", "flag": "", "deck": "w01a"}, {"id": "w01a-019", "week": 1, "topic": "Turing Test", "type": "explain", "q": "Explain what the Turing Test is and how a computer passes it.", "model": "The Turing Test is a way of defining AI by behaviour instead of asking whether a machine can really think. A human judge communicates with a hidden entity and has to decide whether it is a computer or a person. If the judge cannot tell, the computer passes and is said to be intelligent. The test cares about the outcome, so it ignores how the machine produces its answers. It replaced the hard question of whether machines think with a question that can be tested.", "points": ["It tests whether a machine can show intelligent behaviour equal to a human", "A human judge cannot tell if the other entity is a computer", "If the judge fails to tell, the computer has passed and counts as intelligent", "It focuses on behaviour and not on intellect or how the machine works"], "source": "Week 1 lecture, slide 17 to 19", "flag": "", "deck": "w01a"}, {"id": "w01a-020", "week": 1, "topic": "Weak and strong AI", "type": "explain", "q": "Compare weak AI and strong AI and give one example of weak AI.", "model": "Weak AI is built to solve a specific problem using predefined instructions and parameters. It does not cover the full range of human cognitive ability. Almost all of today's AI is weak, for example Siri, Alexa or a self driving car. Strong AI would match human intelligence, with self awareness, consciousness, creativity and the ability to plan for the future. It exists only as a theoretical idea with today's technology, so no real system is an example.", "points": ["Weak AI solves limited specific problems", "Strong AI would equal human intelligence and have self awareness", "Gives one correct example of weak AI, such as a voice assistant or chatbot", "Strong AI only exists as a theoretical concept today"], "source": "Week 1 lecture, slide 21 and 22", "flag": "", "deck": "w01a"}, {"id": "w01a-022", "week": 1, "topic": "AI types", "type": "explain", "q": "Describe the four types of AI and say which one does not exist yet.", "model": "The four types run from simple to advanced. Reactive machines have no memory and give fixed outputs. Limited memory machines learn from data and look at the past. Theory of mind AI would understand human motives and intentions and predict behaviour, and it would be broad rather than limited to one domain. Self aware AI would have a conscious sense of its own existence. Self awareness does not exist yet because we do not know enough about the human brain and emotion.", "points": ["Names all four types in order", "Reactive machines have no memory and limited memory machines learn from past data", "Theory of mind understands motives and intentions", "Self awareness is a sense of self and does not exist yet"], "source": "Week 1 lecture, slide 23 to 26", "flag": "", "deck": "w01a"}, {"id": "w01b-001", "week": 1, "topic": "Exploratory data analysis", "type": "single", "q": "What is the purpose of exploratory data analysis before building a model?", "options": ["To profile, summarise and plot the data to understand its quality", "To tune the final model settings until test accuracy stops improving", "To deploy a trained model and monitor how it behaves on live data", "To replace validation by checking the model against the training set"], "answer": [0], "explain": "EDA happens before formal modelling. It builds a picture of the data's content, quality, relationships and anomalies. Tuning, deployment and validation come later.", "source": "Week 1 data lecture, slide 12", "flag": "", "deck": "w01b"}, {"id": "w01b-011", "week": 1, "topic": "Tabular data", "type": "single", "q": "A feature correlates almost perfectly with the target. What should you suspect first?", "options": ["Target leakage, where the feature reveals the label", "A perfect predictor that should simply be kept in the model", "Class imbalance in the target column", "A skewed feature that needs a log transform"], "answer": [0], "explain": "Correlations that are too perfect are a warning of leakage. A model using the leaked feature would look good in testing but fail on real new data.", "source": "Week 1 data lecture, slide 21 and 13", "flag": "", "deck": "w01b"}, {"id": "w01b-012", "week": 1, "topic": "Tabular data", "type": "single", "q": "What does multicollinearity describe?", "options": ["How strongly each feature is related to the target label in the data", "How strongly each feature can be explained by the other features", "How many values in each feature are missing", "How evenly the classes are spread across the dataset"], "answer": [1], "explain": "Multicollinearity describes how strongly a feature can be explained by the other features. The variance inflation factor measures it and helps decide which variables to drop, combine or regularise. How strongly a feature relates to the target is a different check.", "source": "Week 1 data lecture, slide 22", "flag": "", "deck": "w01b"}, {"id": "w01b-013", "week": 1, "topic": "Tabular data", "type": "multi", "q": "A dataset has a rare positive class. Which responses are sensible?", "options": ["Report overall accuracy only because it is the simplest measure", "Use stratified splits so each split keeps the class mix", "Use class weights or resampling", "Judge the model with measures such as F1 or PR-AUC", "Delete the rare class so the classes are balanced"], "answer": [1, 2, 3], "explain": "Imbalance makes accuracy misleading and can hide poor performance on the rare class. Deleting that class removes the very cases you care about.", "source": "Week 1 data lecture, slide 24", "flag": "", "deck": "w01b"}, {"id": "w01b-029", "week": 1, "topic": "Tabular data", "type": "explain", "q": "Describe how missing values and outliers are investigated in tabular data and what decisions the checks inform.", "model": "For missing values you measure where data are missing, how much, and whether gaps occur together or relate to the outcome. This shows which columns need imputing or dropping and warns of possible bias. For outliers you use robust rules such as the interquartile range and then inspect the flagged rows. The aim is to separate data entry errors from true extremes. Errors are fixed or removed, while real extremes lead to capping, transforming or choosing a model that copes with them.", "points": ["Missingness is measured by column, proportion and pattern", "It informs imputation or dropping and flags bias", "Outliers are found with robust rules and then inspected", "Errors are separated from legitimate extremes before deciding what to do"], "source": "Week 1 data lecture, slide 17 and 19", "flag": "", "deck": "w01b"}, {"id": "w01b-031", "week": 1, "topic": "Tabular data", "type": "explain", "q": "Explain what class imbalance is, why it matters and how EDA helps you respond.", "model": "Class imbalance means some classes or target regions occur much less often than others. It matters because a model can score high overall accuracy by favouring the common class while missing the rare one. EDA checks the class proportions early. If imbalance is found you can use stratified splits so each set keeps the mix, choose metrics such as F1 or PR-AUC, and apply class weights or resampling.", "points": ["Defines imbalance as unequal class frequencies", "Accuracy can hide poor performance on the rare class", "Checked by looking at class proportions", "Responses include stratified splits, better metrics, weights or resampling"], "source": "Week 1 data lecture, slide 24", "flag": "", "deck": "w01b"}, {"id": "w01b-m01", "week": 1, "topic": "Exploratory data analysis", "type": "explain", "q": "Explain the significance of exploratory data analysis in a machine learning project. Discuss three techniques commonly used in EDA and what each shows. What are the consequences of doing too little EDA before building a model?", "model": "Exploratory data analysis helps us understand the characteristics, structure and quality of a dataset before building a model. It finds patterns, relationships and problems in the data. Descriptive statistics such as mean, median, standard deviation, minimum and maximum show the distribution and spread of numerical features. Visualisation with histograms and box plots shows distributions, skewness and outliers. Correlation analysis shows relationships between numerical variables and possible multicollinearity. Too little EDA can leave missing values, outliers, wrong data types or highly correlated features undetected. These harm training, give misleading results and lower predictive performance, so EDA guides the choice of preprocessing and algorithm.", "points": ["EDA shows the structure, quality and patterns of the data before modelling", "Descriptive statistics show distribution and spread", "Histograms or box plots show skewness and outliers", "Correlation analysis shows relationships and multicollinearity", "Too little EDA leaves missing values, outliers or wrong types that harm the model"], "source": "Tutor's mock test, written question 1", "flag": "The model answer follows the tutor's sample answer in the mock test.", "mock": true, "focus": true, "deck": "w01b"}, {"id": "w01b-m02", "week": 1, "topic": "Exploratory data analysis", "type": "single", "q": "Which is the most appropriate method for identifying possible outliers in a continuous numerical variable?", "options": ["Pie chart", "Box plot", "Bar chart", "Confusion matrix"], "answer": [1], "explain": "A box plot shows the spread of a numerical variable and marks points beyond the whiskers as possible outliers. Pie and bar charts suit categories, and a confusion matrix evaluates a classifier.", "source": "Tutor's mock test, multiple choice question 1", "flag": "", "mock": true, "deck": "w01b"}, {"id": "w01b-m03", "week": 1, "topic": "Exploratory data analysis", "type": "single", "q": "Which statement about a correlation coefficient of -0.85 is correct?", "options": ["The variables have a strong negative linear relationship", "One variable causes the other to decrease", "The variables have a weak positive relationship", "The relationship must be nonlinear"], "answer": [0], "explain": "A value near -1 means a strong negative linear relationship. Correlation does not show cause.", "source": "Tutor's mock test, multiple choice question 2", "flag": "", "mock": true, "deck": "w01b"}, {"id": "w02-006", "week": 2, "topic": "Supervised learning", "type": "single", "q": "A bank wants to predict whether a new applicant will default within 12 months, yes or no. What kind of task is this?", "options": ["Regression, because default risk is a score", "Regression, because the bank holds numeric data on applicants", "Clustering, because applicants form natural groups", "Classification, because the outcome is a category"], "answer": [3], "explain": "Default or no default is a category, so this is classification. Regression predicts a continuous value such as a price or a time.", "source": "Week 2 lecture, slide 12 and 14", "flag": "", "deck": "w02"}, {"id": "w02-010", "week": 2, "topic": "Evaluating classifiers", "type": "single", "q": "A fraud team has few investigators and wants most of its flagged cases to be real fraud. Which measure should it watch most closely?", "options": ["Recall", "Mean squared error", "Precision", "Accuracy"], "answer": [2], "explain": "Precision asks how many predicted positives are truly positive, so it matters when false positives are costly. Recall focuses on missed positives instead.", "source": "Week 2 lecture, slide 24", "flag": "", "deck": "w02"}, {"id": "w02-011", "week": 2, "topic": "Evaluating classifiers", "type": "single", "q": "A hospital screening test must catch as many ill patients as possible, even at the cost of extra checks. Which measure matters most?", "options": ["Precision", "Accuracy", "Specificity", "Recall"], "answer": [3], "explain": "Recall is the share of actual positives that were caught, so it matters when missing a case is costly. Specificity concerns healthy people correctly cleared.", "source": "Week 2 lecture, slide 24 and 25", "flag": "", "deck": "w02"}, {"id": "w02-012", "week": 2, "topic": "Evaluating classifiers", "type": "single", "q": "A model on a heavily imbalanced dataset always predicts the majority class. What will its accuracy look like?", "options": ["High, even though it never finds a single positive case", "Low, because it ignores half of the classes", "Zero, because it never predicts the positive class for any record", "Equal to its recall on the positive class"], "answer": [0], "explain": "Accuracy counts all correct predictions, and the majority class makes up most of them. This is why accuracy can mislead and measures such as F1 are preferred.", "source": "Week 2 lecture, slide 24", "flag": "", "deck": "w02"}, {"id": "w02-023", "week": 2, "topic": "Decision trees", "type": "single", "q": "What does Gini impurity measure in a node of a decision tree?", "options": ["How mixed the classes in the node are", "How many features are left to split on", "How deep the node sits in the tree", "How many samples the node contains"], "answer": [0], "explain": "Gini impurity is the chance of mislabelling a random sample if it is labelled by the node's class mix. A pure node, where all samples share one class, has an impurity of zero.", "source": "Week 2 lecture, slide 42", "flag": "", "deck": "w02"}, {"id": "w02-031", "week": 2, "topic": "Evaluating classifiers", "type": "explain", "q": "Compare precision and recall and say when each matters most.", "model": "Precision asks, of the items predicted positive, how many are truly positive. It matters when false positives are costly, for example fraud investigations where staff time is limited. Recall asks, of all the real positives, how many were caught. It matters when missing a positive is costly, for example disease screening. The F1 score combines the two when a balance is needed.", "points": ["Precision is the share of predicted positives that are correct", "Recall is the share of actual positives that were found", "Precision matters when false positives are costly with an example", "Recall matters when false negatives are costly with an example"], "source": "Week 2 lecture, slide 24", "flag": "", "deck": "w02"}, {"id": "w02-035", "week": 2, "topic": "Decision trees", "type": "explain", "q": "Explain how a decision tree decides which feature to split on.", "model": "A decision tree tries each possible split at a node and measures how pure the resulting child nodes are. Gini impurity shows how mixed the classes in a node are, and zero means all samples share one class. The tree calculates the weighted impurity of the children and compares it with the parent. The split with the largest drop, called the gain, is chosen. The same process then repeats on each child node.", "points": ["Tries each possible split", "Gini impurity measures how mixed a node is", "Compares weighted child impurity with the parent to find the gain", "Picks the split with the largest gain and repeats on the children"], "source": "Week 2 lecture, slide 42 to 45", "flag": "", "deck": "w02"}, {"id": "w02-m01", "week": 2, "topic": "K nearest neighbours", "type": "explain", "q": "Explain how the K nearest neighbours classifier works. Discuss how the choice of K affects performance and generalisation. Explain why KNN is a lazy learning algorithm and a non-parametric model.", "model": "KNN is a supervised algorithm for classification. It classifies a new observation by measuring its distance to the training observations, often with Euclidean distance, and finding the K closest. The predicted class is usually the majority vote of those neighbours. A small K such as 1 makes the model sensitive to individual points and noise, which causes overfitting and high variance. A larger K gives smoother boundaries and less sensitivity to noise, but too large a K causes underfitting and high bias. K is usually chosen by cross-validation. KNN is lazy because it builds no explicit model during training and does most of its work at prediction time. It is non-parametric because it assumes no fixed functional form between the features and the classes.", "points": ["Measures distance, for example Euclidean, to find the K nearest training points", "Predicts by majority vote of the neighbours", "Small K overfits and is sensitive to noise, large K underfits", "Lazy because it builds no model in training and works at prediction time", "Non-parametric because it assumes no fixed functional form"], "source": "Tutor's mock test, written question 2", "flag": "The model answer follows the tutor's sample answer in the mock test.", "mock": true, "focus": true, "deck": "w02"}, {"id": "w02-m02", "week": 2, "topic": "K nearest neighbours", "type": "single", "q": "Which is a characteristic of the K nearest neighbours algorithm?", "options": ["It learns a fixed set of coefficients during training", "It requires a predefined number of decision rules", "It retains training observations for use during prediction", "It constructs a decision tree from the training data"], "answer": [2], "explain": "KNN is lazy. It keeps the training data and compares each new point with it at prediction time.", "source": "Tutor's mock test, multiple choice question 3", "flag": "", "mock": true, "deck": "w02"}, {"id": "w02-m03", "week": 2, "topic": "K nearest neighbours", "type": "single", "q": "What is a likely consequence of choosing a very small K in KNN classification?", "options": ["Higher bias and lower variance", "Greater sensitivity to noise in the training data", "Reduced computational cost during prediction regardless of dataset size", "The model becomes parametric"], "answer": [1], "explain": "With a very small K one noisy neighbour can decide the class, so the model overfits with high variance.", "source": "Tutor's mock test, multiple choice question 4", "flag": "", "mock": true, "deck": "w02"}, {"id": "w03-001", "week": 3, "topic": "Regression or classification", "type": "single", "q": "A utility company wants to estimate tomorrow's electricity use in kilowatt hours from the weather forecast. What kind of supervised task is this?", "options": ["Regression, because the target is a continuous numeric value", "Classification, because the answer falls into high, medium or low use", "Classification, because weather inputs are grouped into categories", "Clustering, because no labelled examples are needed for this task"], "answer": [0], "explain": "The target is a number on a continuous scale, so this is regression. Classification would only fit if the company chose to predict a category such as high or low use.", "source": "Week 3 lecture, slide 7 and 12", "flag": "", "deck": "w03"}, {"id": "w03-005", "week": 3, "topic": "Regression metrics", "type": "single", "q": "A regression model makes mostly small errors but a few very large ones. Which metric will react most strongly to those few large errors?", "options": ["Mean absolute error, because it squares each error before averaging", "Mean absolute error, because it adds extra weight to the largest errors", "R-squared, because it is measured in the units of the target variable", "Mean squared error, because squaring penalises larger mistakes more heavily"], "answer": [3], "explain": "Squaring makes a large error count far more than a small one, so mean squared error is pulled up by outliers. Mean absolute error treats every unit of error equally and is less sensitive.", "source": "Week 3 lecture, slide 19 and 20", "flag": "", "deck": "w03"}, {"id": "w03-007", "week": 3, "topic": "Regression metrics", "type": "single", "q": "A model has an R-squared of 0. What does this tell you about the model?", "options": ["It predicts every value perfectly, with no error at all", "It does no better than always predicting the mean target value", "It explains all of the variance in the target variable", "It is worse than the simple baseline of always predicting the mean value"], "answer": [1], "explain": "A value of 1 is a perfect fit and 0 means the model adds nothing over predicting the mean. Only a value below 0 means it is worse than that baseline.", "source": "Week 3 lecture, slide 22", "flag": "", "deck": "w03"}, {"id": "w03-013", "week": 3, "topic": "Random forest", "type": "single", "q": "Why is a random forest usually more stable than one decision tree?", "options": ["Each tree sees the whole dataset, so all of the trees agree and the errors vanish entirely", "The trees are built one after another, each one fixing the last tree", "Averaging many slightly different trees smooths out the mistakes of any one tree", "The forest removes outliers from the data before any tree is built"], "answer": [2], "explain": "The trees are built on random rows and features, so they differ, and averaging evens out their individual errors. Building trees one after another to fix errors describes boosting instead.", "source": "Week 3 lecture, slide 23 and 30", "flag": "", "deck": "w03"}, {"id": "w03-024", "week": 3, "topic": "Random forest", "type": "explain", "q": "Describe how a random forest regression model makes a prediction, and explain why this is more stable than using one decision tree.", "model": "A random forest is an ensemble of many decision tree regressors. Each tree is built on random rows and a random choice of features, so the trees differ from one another. For a new case every tree predicts a number. The forest returns the average of those numbers. A single tree can be thrown off by quirks in its training data, but averaging many different trees cancels out their individual errors. This makes the forest more stable, more robust to outliers and less prone to overfitting.", "points": ["Describes many trees built on random rows and features", "States that the final prediction is the average of the tree outputs", "Explains that averaging reduces the effect of any one tree's errors", "Mentions robustness to outliers or less overfitting"], "source": "Week 3 lecture, slide 30 to 32", "flag": "", "deck": "w03"}, {"id": "w03-026", "week": 3, "topic": "Regression metrics", "type": "explain", "q": "Explain what R-squared tells you about a regression model, and what the values 1, 0 and below 0 mean.", "model": "R-squared shows how much of the variance in the target variable the model explains. A value of 1 is a perfect fit. A value closer to 1 is better. A value of 0 means the model is no better than always predicting the mean of the actual values. A value below 0 means the model is worse than that mean baseline. It is useful because it compares the model against a simple reference.", "points": ["Says it measures the share of variance in the target explained by the model", "States that 1 is a perfect fit", "States that 0 equals the mean baseline", "States that a negative value is worse than the baseline"], "source": "Week 3 lecture, slide 22", "flag": "", "deck": "w03"}, {"id": "w03-m01", "week": 3, "topic": "Linear regression", "type": "explain", "q": "Explain how linear regression models the relationship between input variables and a continuous target. Explain how its performance can be evaluated and discuss its main advantages and limitations.", "model": "Linear regression is a supervised algorithm that predicts a continuous value from one or more inputs. It assumes the relationship can be written as a linear equation. Each feature gets a coefficient for its contribution, plus an intercept. The coefficients are usually learned by minimising the sum of squared errors between predicted and actual values. Performance is measured with mean absolute error, mean squared error and R squared. MAE and MSE measure prediction error, while R squared shows how much of the variation in the target the model explains. Its advantages are simplicity, low computational cost and interpretability. It performs poorly when relationships are nonlinear and is sensitive to outliers and multicollinearity.", "points": ["Predicts a continuous target with a linear equation of coefficients and an intercept", "Learns coefficients by minimising the sum of squared errors", "Evaluated with MAE, MSE or R squared, and says what they measure", "Advantages such as simplicity and interpretability", "Limitations such as nonlinear data, outliers or multicollinearity"], "source": "Tutor's mock test, written question 3", "flag": "The model answer follows the tutor's sample answer in the mock test.", "mock": true, "focus": true, "deck": "w03"}, {"id": "w03-m02", "week": 3, "topic": "Linear regression", "type": "single", "q": "In ordinary least squares linear regression, which quantity is minimised when estimating the coefficients?", "options": ["The sum of absolute residuals", "The sum of squared residuals", "The sum of predicted target values", "The variance of the input variables"], "answer": [1], "explain": "Ordinary least squares picks the coefficients that make the sum of squared residuals as small as possible.", "source": "Tutor's mock test, multiple choice question 5", "flag": "", "mock": true, "deck": "w03"}, {"id": "w03-m03", "week": 3, "topic": "Linear regression", "type": "single", "q": "Which situation most directly violates the linearity assumption of a standard linear regression model?", "options": ["The target variable contains negative values", "The dataset contains several input variables", "The expected target response has a curved relationship with a predictor, but only a linear term is included", "The estimated intercept is greater than zero"], "answer": [2], "explain": "Linearity means the target changes in a straight line with each predictor. A curved relationship fitted with only a linear term breaks that.", "source": "Tutor's mock test, multiple choice question 6", "flag": "", "mock": true, "deck": "w03"}, {"id": "w04-007", "week": 4, "topic": "K-means", "type": "single", "q": "Which list gives the steps of k-means in the correct order?", "options": ["Place centres at random, assign points to the nearest centre, move centres to cluster means, repeat", "Assign points to clusters, place centres at random, repeat until all clusters are the same size", "Move centres to cluster means, place centres at random, assign points once and stop", "Place centres at the data mean, label each point, then train a model on the labels"], "answer": [0], "explain": "K-means starts with random centres, assigns each point to the closest centre, moves each centre to the mean of its points, and repeats. It does not stop after one pass or need labels.", "source": "Week 4 lecture, slide 21 to 25", "flag": "", "deck": "w04"}, {"id": "w04-010", "week": 4, "topic": "Choosing k in k-means", "type": "single", "q": "Why can you not simply pick the value of k that gives the lowest inertia?", "options": ["Inertia is the same whatever value of k is used, so it cannot compare them", "Inertia rises as k grows, so the smallest k would always be chosen", "Inertia can only be worked out when k is two, so other values give no result", "Inertia keeps falling as k grows, so the lowest value is always the largest k"], "answer": [3], "explain": "Inertia keeps falling as more clusters are added, so the lowest value would always point to the largest k. This is why the elbow, where improvement drops sharply, is used to choose k instead of the minimum.", "source": "Week 4 lecture, slide 29 and 31", "flag": "The slide says inertia falls as k rises, the conclusion about not using the minimum is a standard reading.", "deck": "w04"}, {"id": "w04-015", "week": 4, "topic": "Clustering methods", "type": "single", "q": "Which clustering method groups points by density and can find clusters of arbitrary shape?", "options": ["K-means", "Hierarchical clustering", "Gaussian mixture models", "DBSCAN"], "answer": [3], "explain": "DBSCAN is density based and is good for irregular cluster shapes. K-means favours compact groups around centres.", "source": "Week 4 lecture, slide 13", "flag": "", "deck": "w04"}, {"id": "w04-018", "week": 4, "topic": "Principal component analysis", "type": "single", "q": "What does principal component analysis do to a dataset?", "options": ["It groups the points into a set number of clusters", "It projects the data onto directions that capture the greatest variance", "It predicts a label for each point from known examples that carry labels", "It deletes the points that lie furthest from the mean"], "answer": [1], "explain": "Principal component analysis finds new axes, the principal components, along which the data varies most, and projects the data onto them. It is not a clustering or prediction method.", "source": "Week 4 lecture, slide 36", "flag": "", "deck": "w04"}, {"id": "w04-024", "week": 4, "topic": "Supervised and unsupervised learning", "type": "explain", "q": "Compare supervised and unsupervised learning in terms of the data they use and what they aim to do.", "model": "Supervised learning uses labelled data, which are input and output pairs, and aims to predict outcomes for new data. Linear regression, decision trees and neural networks are examples. Unsupervised learning uses unlabelled data and aims to find inherent structure or patterns. K-means, principal component analysis and autoencoders are examples. For instance, supervised learning could predict house prices from past sales, while unsupervised learning could group customers by behaviour without any predefined groups.", "points": ["States that supervised learning uses labelled data and unsupervised learning uses unlabelled data", "States that supervised learning aims to predict and unsupervised learning aims to find structure", "Names a correct algorithm for each", "Gives a correct example of each, such as predicting prices and grouping customers"], "source": "Week 4 lecture, slide 6", "flag": "", "deck": "w04"}, {"id": "w04-031", "week": 4, "topic": "Principal component analysis", "type": "explain", "q": "Describe the main steps of principal component analysis and what the result is used for.", "model": "First the data is centred by subtracting the mean of each feature. Next the covariance matrix is calculated to show how features vary together. Eigen-decomposition of this matrix gives eigenvectors, which are the principal components, and eigenvalues, which show how much variance each carries. The data is then projected onto the chosen components. Keeping only the first few components gives a smaller summary that keeps most of the variance, which helps visualisation and can be useful before clustering.", "points": ["Mentions centring the data", "Mentions the covariance matrix", "Says eigenvectors give the components and eigenvalues give the variance", "Says the data is projected onto the top components"], "source": "Week 4 lecture, slide 37 to 44", "flag": "", "deck": "w04"}, {"id": "w04-m01", "week": 4, "topic": "K-means", "type": "explain", "q": "Describe how the K-means clustering algorithm works. Explain how a suitable number of clusters can be chosen and how the quality of the clusters can be evaluated.", "model": "K-means is an unsupervised algorithm that groups unlabelled data into K clusters. It places K centroids, assigns each point to its nearest centroid, then moves each centroid to the mean of the points assigned to it. These two steps repeat until the assignments stop changing. Its aim is to minimise inertia, the sum of squared distances from each point to its cluster centre. To choose K, the elbow method plots inertia against K. Inertia always falls as K grows, and the elbow is where the improvement drops sharply, though it can be hard to see. The silhouette score compares how close each point is to its own cluster with how close it is to the nearest other cluster. A score near +1 means a good fit, so the K with the highest average score is a good choice.", "points": ["Assigns each point to the nearest of K centroids", "Moves each centroid to the mean of its points and repeats until stable", "Elbow method plots inertia against K and picks the bend", "Silhouette score, from -1 to +1, measures cluster quality, and the K that maximises it is chosen", "Aim is to minimise inertia, the within-cluster sum of squared distances"], "source": "Tutor's mock test, written question 4", "flag": "The mock gives no sample answer. This model answer was written from the slides for that week.", "mock": true, "focus": true, "deck": "w04"}, {"id": "w04-m02", "week": 4, "topic": "K-means", "type": "single", "q": "What is the main objective of the K-means clustering algorithm?", "options": ["Maximise the distance between every pair of observations", "Minimise the within-cluster sum of squared distances", "Maximise classification accuracy using labelled data", "Minimise the number of features in the dataset"], "answer": [1], "explain": "K-means minimises inertia, the sum of squared distances from each point to its cluster centre. It uses no labels.", "source": "Tutor's mock test, multiple choice question 7", "flag": "", "mock": true, "deck": "w04"}, {"id": "w04-m03", "week": 4, "topic": "Silhouette score", "type": "single", "q": "What does a silhouette score close to +1 mean for an observation?", "options": ["The observation is likely assigned to an unsuitable cluster", "The observation is equally close to two clusters", "The observation is well matched to its cluster and separated from neighbouring clusters", "The observation is an outlier in every possible clustering solution"], "answer": [2], "explain": "Near +1 means the point is much closer to its own cluster than to the nearest other one. Near 0 means it sits between two, and negative means it is probably in the wrong cluster.", "source": "Tutor's mock test, multiple choice question 8", "flag": "", "mock": true, "deck": "w04"}, {"id": "w05a-001", "week": 5, "topic": "What reinforcement learning is", "type": "single", "q": "Which description best fits reinforcement learning?", "options": ["An agent learns by trying actions and receiving rewards or penalties from an environment", "A model learns to predict a numeric target from labelled examples with known answers", "An algorithm groups unlabelled data points by how similar they are to each other", "A model reduces the number of features while keeping most of the variance in the data"], "answer": [0], "explain": "Reinforcement learning is trial and error guided by feedback. The other options describe supervised regression, clustering and dimensionality reduction.", "source": "Week 5 reinforcement learning lecture, slide 5 and 6", "flag": "", "deck": "w05a"}, {"id": "w05a-003", "week": 5, "topic": "Agent, environment and reward", "type": "single", "q": "In reinforcement learning, which component responds to the agent's action with a reward or penalty?", "options": ["The agent itself", "The Q-table", "The environment", "The training dataset"], "answer": [2], "explain": "The agent acts and the environment responds with feedback. The agent then uses that feedback to improve its decisions.", "source": "Week 5 reinforcement learning lecture, slide 6", "flag": "", "deck": "w05a"}, {"id": "w05a-011", "week": 5, "topic": "Q-table", "type": "single", "q": "What does one entry in a Q-table, written Q(state, action), represent?", "options": ["The expected total reward for that action in that state, including later rewards", "The immediate reward for that action and nothing about later rewards", "The probability that the environment moves to the next state after that action", "The number of times the agent has taken that action in that state"], "answer": [0], "explain": "A Q-value is a long term estimate that includes later rewards. The immediate reward alone is held in the reward table.", "source": "Week 5 reinforcement learning lecture, slide 20", "flag": "", "deck": "w05a"}, {"id": "w05a-015", "week": 5, "topic": "Q-learning update rule", "type": "single", "q": "If G in the Q-learning update were set to zero, how would the agent value its actions?", "options": ["Only by the immediate reward, ignoring what comes after", "Only by the best value of the final goal state", "By the sum of all future rewards, with no discount applied", "It would not be able to assign any value at all"], "answer": [0], "explain": "With G equal to zero the future term vanishes, so each Q-value is just the reward of the current move. The agent becomes short sighted.", "source": "Week 5 reinforcement learning lecture, slide 22", "flag": "", "deck": "w05a"}, {"id": "w05a-016", "week": 5, "topic": "Q-learning", "type": "single", "q": "In Q-learning, the moves closest to the goal get strong values first and earlier moves follow. Why?", "options": ["The agent is told the whole route in advance and then learns it backwards from the goal", "The goal reward strengthens the last move first, then the effect spreads back", "Earlier moves are always given higher rewards than moves near the goal", "The agent always visits the states in the same fixed order each episode"], "answer": [1], "explain": "Reaching the goal strengthens the move into it. Next time, the move before it can see that strong value ahead, so the effect spreads back step by step.", "source": "Week 5 reinforcement learning lecture, slide 17 and 18", "flag": "", "deck": "w05a"}, {"id": "w05a-023", "week": 5, "topic": "Reinforcement versus supervised learning", "type": "explain", "q": "Compare reinforcement learning with supervised learning.", "model": "Supervised learning learns from labelled examples where the correct answer is given for each input, and it then predicts for new data. Reinforcement learning has no such answers. The agent acts, receives rewards or penalties and works out over many trials which actions give the best long term result. Supervised learning is passive learning from a fixed dataset, while reinforcement learning is an active process in which the agent's own actions shape what it experiences next.", "points": ["Says supervised learning uses labelled data with correct answers", "Says reinforcement learning uses rewards and penalties from trial and error", "Mentions the agent acting and learning from consequences"], "source": "Week 5 reinforcement learning lecture, slide 3 to 6", "flag": "The comparison is built from the recap and the trial and error wording, the passive and active framing is textbook.", "deck": "w05a"}, {"id": "w05a-024", "week": 5, "topic": "Types of reinforcement learning", "type": "explain", "q": "Explain the difference between model-free and model-based reinforcement learning, with an example of each.", "model": "A model-free agent learns directly from experience of actions and rewards, without learning how the environment works. An example is a chess AI that plays thousands of games and learns which moves tend to win. A model-based agent has a model of the environment, including transition probabilities and a reward function. It uses this to predict what its actions will do and to plan ahead. A robot vacuum that predicts the result of different routes before moving is an example.", "points": ["Says model-free learns from experience without a model of the environment", "Says model-based uses transition probabilities and a reward function to plan", "Gives a suitable example of each"], "source": "Week 5 reinforcement learning lecture, slide 10 and 11", "flag": "", "deck": "w05a"}, {"id": "w05a-m01", "week": 5, "topic": "Q-learning", "type": "explain", "q": "Explain the principles of Q-learning and how it differs from supervised learning. Describe a real-world problem where Q-learning could be applied and how it could be formulated.", "model": "In Q-learning an agent learns by interacting with an environment and receiving rewards or penalties for its actions. It keeps a Q-table where each entry Q(s, a) estimates the value of taking action a in state s. Values are updated with Q(state, action) = R(state, action) + G x max Q(next state, all actions), which combines the immediate reward with the discounted best future value. It learns from experienced transitions and needs no model of the environment. Supervised learning instead learns from labelled examples with the right answer given. Q-learning has no labels, only rewards, which can be delayed. A robot finding its way through a warehouse is one example. The states are its locations, the actions are its moves, reaching the target gives a positive reward and hitting obstacles gives a penalty.", "points": ["Agent learns from rewards by interacting with an environment", "Q-table holds a value for each state and action pair", "Update uses the immediate reward plus discounted best future value", "Supervised learning uses labelled answers, Q-learning only rewards", "Gives a problem with its states, actions and rewards defined"], "source": "Tutor's mock test, written question 5", "flag": "The mock gives no sample answer. This model answer was written from the slides for that week.", "mock": true, "focus": true, "deck": "w05a"}, {"id": "w05a-m02", "week": 5, "topic": "Q-learning", "type": "single", "q": "In Q-learning, what is needed to update the value of a state and action pair?", "options": ["A labelled target class for each state", "The immediate reward and an estimate of future reward", "The gradient of a neural network loss function", "The centroid of the nearest cluster"], "answer": [1], "explain": "The update adds the immediate reward to the discounted best Q value of the next state.", "source": "Tutor's mock test, multiple choice question 9", "flag": "", "mock": true, "deck": "w05a"}, {"id": "w05b-001", "week": 5, "topic": "Genetic algorithm basics", "type": "single", "q": "What natural process do genetic algorithms imitate?", "options": ["Biological evolution through natural selection", "The way neurons in the brain pass signals to each other", "The way an animal learns by being rewarded for its actions", "The way metals cool slowly and settle into a stable structure"], "answer": [0], "explain": "Genetic algorithms are inspired by evolution. A population of solutions changes over generations, and the fitter ones are more likely to pass on their features.", "source": "Week 5 genetic algorithms lecture, slide 1 and 6", "flag": "", "deck": "w05b"}, {"id": "w05b-006", "week": 5, "topic": "Crossover and mutation", "type": "single", "q": "Which operation in a genetic algorithm combines parts of two parent chromosomes to make a new one?", "options": ["Mutation", "Crossover", "Fitness testing", "Encoding"], "answer": [1], "explain": "Crossover is the recombination of genes from parents. Mutation instead changes bits at random in one chromosome.", "source": "Week 5 genetic algorithms lecture, slide 2, 4 and 16", "flag": "", "deck": "w05b"}, {"id": "w05b-007", "week": 5, "topic": "Crossover and mutation", "type": "single", "q": "What does mutation do to a chromosome in a genetic algorithm?", "options": ["It joins it with a second parent to make a child", "It deletes the weakest chromosomes from the population", "It randomly changes part of it, such as flipping a bit", "It scores it by how good a solution it is"], "answer": [2], "explain": "Mutation is a random change to the DNA or bitstring, like a copying error. It adds variety that crossover alone might not give.", "source": "Week 5 genetic algorithms lecture, slide 5 and 16", "flag": "The purpose of adding variety is standard knowledge, the slides define mutation as a random change.", "deck": "w05b"}, {"id": "w05b-016", "week": 5, "topic": "Genetic algorithms, strengths and limits", "type": "single", "q": "What is a main disadvantage of genetic algorithms?", "options": ["It can be difficult to represent a problem as a genetic problem", "They cannot find an approximate solution to any problem", "They need the problem to be written as a differentiable equation", "They can only work on problems with exactly one minimum"], "answer": [0], "explain": "Approximate solutions can usually be found, but the problem has to be encoded as chromosomes, which is not always easy. They do not need an equation and can cope with several minima.", "source": "Week 5 genetic algorithms lecture, slide 18", "flag": "", "deck": "w05b"}, {"id": "w05b-018", "week": 5, "topic": "Genetic algorithm basics", "type": "explain", "q": "Explain what a genetic algorithm is and the main steps it follows.", "model": "A genetic algorithm solves optimisation problems by imitating biological evolution. It starts with a population of random candidate solutions, often encoded as bitstrings called chromosomes. Each solution is tested for fitness and ranked. The poor ones are removed and the good ones are duplicated and changed by crossover and mutation to form the next generation. This loop repeats over many generations until the best solution is good enough, so the population evolves towards an optimum.", "points": ["Says it imitates biological evolution", "Starts with a random population of encoded solutions", "Describes testing for fitness and selecting the better solutions", "Describes creating new solutions with crossover and mutation", "Says the loop repeats until the best solution is good enough"], "source": "Week 5 genetic algorithms lecture, slide 6, 7, 13 and 14", "flag": "", "deck": "w05b"}, {"id": "w05b-020", "week": 5, "topic": "Crossover and mutation", "type": "explain", "q": "Compare crossover and mutation and explain why a genetic algorithm uses both.", "model": "Crossover combines genes from two parent chromosomes to make a child, in the same way that parents pass on a mixture of their DNA. Mutation makes a small random change, such as flipping one bit, like an error in copying a gene. Crossover mixes the good features that already exist in the population. Mutation introduces new variety that the existing solutions may not contain. Using both lets the algorithm keep what works while still exploring new possibilities.", "points": ["Describes crossover as recombining genes from parents", "Describes mutation as a random change to a gene or bit", "Explains that crossover mixes existing features while mutation adds new variety"], "source": "Week 5 genetic algorithms lecture, slide 4, 5 and 16", "flag": "The reason for using both is standard knowledge, the slides define each operator and use both in step 3.", "deck": "w05b"}, {"id": "w06-004", "week": 6, "topic": "Perceptron", "type": "single", "q": "In a perceptron, what happens to the weighted sum of the inputs before the activation function sees it?", "options": ["It is squared to measure the error", "It is divided by the number of inputs", "It is compared with the true label", "It has a bias added to it"], "answer": [3], "explain": "The perceptron sums the weighted inputs and then adds a bias. Comparing with a label happens in the cost function, outside the neuron.", "source": "Week 6 lecture, slide 8 and 9", "flag": "", "deck": "w06"}, {"id": "w06-008", "week": 6, "topic": "Perceptron", "type": "single", "q": "A single perceptron fails to learn the XOR function however long it trains. Why?", "options": ["XOR needs more input nodes than a perceptron allows", "A step function cannot ever output the value 1", "Random initialisation always starts it in the wrong place", "The XOR classes cannot be separated by one straight line"], "answer": [3], "explain": "XOR cannot be split by one straight boundary, so a single weighted sum and activation cannot separate its classes. Training longer or starting from other random weights does not remove this limit.", "source": "Week 6 lecture, slide 12", "flag": "The slide only says a single perceptron learns linearly separable patterns. That XOR is not linearly separable is standard textbook knowledge.", "deck": "w06"}, {"id": "w06-019", "week": 6, "topic": "Cost functions", "type": "single", "q": "How does mean squared error treat a prediction that is very far from its target compared with one that is close?", "options": ["It treats both errors as the same size of mistake", "It penalises the far prediction much more than the close one", "It ignores any error above a fixed threshold", "It rewards the far prediction so the model learns faster"], "answer": [1], "explain": "Squaring the distance makes far points cost much more than near points. Treating all sizes alike ignores the squaring.", "source": "Week 6 lecture, slide 25", "flag": "The slide says errors grow exponentially, which is more precisely quadratic growth, so the stem avoids that word.", "deck": "w06"}, {"id": "w06-023", "week": 6, "topic": "Gradient descent", "type": "single", "q": "At the current weight, the slope of the cost function is positive. What does this tell gradient descent?", "options": ["Increase the weight, because a positive slope means it is too small", "Stop, because a positive slope means the minimum has been reached", "Reset the weight to a new random value", "Decrease the weight, because moving against the slope lowers the cost"], "answer": [3], "explain": "Gradient descent moves in the negative direction of the derivative. With a positive slope that means decreasing the weight, and increasing it would raise the cost.", "source": "Week 6 lecture, slide 31 and 33", "flag": "", "deck": "w06"}, {"id": "w06-028", "week": 6, "topic": "Perceptron", "type": "explain", "q": "Describe how a single perceptron turns its inputs into an output.", "model": "Each input value is multiplied by the weight on its connection. The products are added together to give a weighted sum, and a bias is added to that sum. The result passes to an activation function, which decides whether the neuron fires. With a step function the output is one of two values. The weights and bias start random and are adjusted during training so that the error of the output becomes smaller.", "points": ["Inputs are multiplied by their weights and summed", "A bias is added to the sum", "An activation function decides whether the neuron fires", "Weights and bias are learned to reduce the output error"], "source": "Week 6 lecture, slide 7 to 12", "flag": "", "deck": "w06"}, {"id": "w06-029", "week": 6, "topic": "Activation functions", "type": "explain", "q": "Explain the purpose of an activation function and give one example.", "model": "An activation function looks at the weighted sum produced by a neuron and decides whether the output connections should fire. The step function is the simplest example, giving one of two values depending on the sum. Sigmoid and softmax are other examples and are often used so that the output of a classification network is a probability. The choice of activation function depends on the task the network has to do.", "points": ["It checks the weighted sum of a neuron", "It decides whether the output connections fire", "A step function is a valid example", "Sigmoid or softmax is a valid example"], "source": "Week 6 lecture, slide 8, 10 and 27", "flag": "", "deck": "w06"}, {"id": "w06-030", "week": 6, "topic": "Perceptron", "type": "explain", "q": "Explain why a single perceptron is limited and how a network of perceptrons goes further.", "model": "A single perceptron can only learn patterns that are linearly separable, so it cannot solve a problem where one straight boundary cannot split the classes. XOR is a standard example. Placing thousands of perceptrons in consecutive layers lets them work together. Each layer passes its results on, and the network turns the input data into predictions based on the presence or absence of features.", "points": ["A single perceptron only learns linearly separable patterns", "Names a problem it cannot learn, such as XOR", "A network uses many perceptrons in consecutive layers", "Layers turn inputs into predictions based on features"], "source": "Week 6 lecture, slide 12 and 13", "flag": "The slides only say a network turns inputs into predictions based on features. The claim that layers overcome the linear limit is standard textbook knowledge.", "deck": "w06"}, {"id": "w06-m01", "week": 6, "topic": "How a network learns", "type": "explain", "q": "Explain how an artificial neural network works and how learning takes place during training. Discuss trainable parameters, particularly weights and biases, and their roles in determining the output.", "model": "An artificial neural network is made of layers of neurons: an input layer, one or more hidden layers and an output layer. Each neuron multiplies its inputs by weights, adds them up with a bias and passes the result through an activation function. The outputs flow forward layer by layer to give a prediction. Training compares the prediction with the true value using a loss function. The error is sent back through the network and the weights and biases are adjusted by backpropagation and gradient descent to reduce it, and this repeats over many examples. Weights and biases are the trainable parameters. A weight sets how strongly an input affects a neuron. A bias shifts the weighted sum so the neuron can activate even when its inputs are zero.", "points": ["Layers of neurons, input, hidden and output", "Each neuron takes a weighted sum plus bias and applies an activation function", "Training compares predictions with targets using a loss", "Weights and biases are adjusted to reduce the loss", "Weights set input strength, bias shifts the sum"], "source": "Tutor's mock test, written question 6", "flag": "The mock gives no sample answer. This model answer was written from the slides for that week.", "mock": true, "focus": true, "deck": "w06"}, {"id": "w06-m02", "week": 6, "topic": "How a network learns", "type": "single", "q": "Which quantities are typically adjusted during training of a feedforward neural network?", "options": ["Input features and target labels", "Weights and biases", "Activation function names and dataset size", "Number of training observations and output classes"], "answer": [1], "explain": "Weights and biases are the trainable parameters. The data and the architecture stay fixed during training.", "source": "Tutor's mock test, multiple choice question 10", "flag": "", "mock": true, "deck": "w06"}, {"id": "w06-m03", "week": 6, "topic": "Activation functions", "type": "single", "q": "What is the main consequence of using only linear activation functions throughout a multilayer feedforward network?", "options": ["The network would automatically become a recurrent model", "The network would be unable to represent nonlinear mappings through its stacked layers", "The network would no longer require trainable weights", "The network would always produce binary outputs"], "answer": [1], "explain": "A stack of linear layers collapses into one linear function, so the extra layers add no power to model nonlinear patterns.", "source": "Tutor's mock test, multiple choice question 11", "flag": "That stacked linear layers collapse into one linear function is standard textbook reasoning.", "mock": true, "deck": "w06"}, {"id": "w07-009", "week": 7, "topic": "Backpropagation", "type": "single", "q": "In the backward pass, what does the partial derivative of the total error with respect to a weight tell us?", "options": ["How many epochs remain before training stops", "What the target value should be", "How much a change in that weight would change the total error", "Which activation function the neuron attached to that weight should use"], "answer": [2], "explain": "The partial derivative shows how sensitive the total error is to one weight. It says nothing about epochs, targets or activation choice.", "source": "Week 7 lecture, slide 33", "flag": "", "deck": "w07"}, {"id": "w07-010", "week": 7, "topic": "Chain rule", "type": "single", "q": "A weight in the example network does not touch the error directly. Why is the chain rule needed to find its effect on the total error?", "options": ["Updates must follow a fixed order within each layer", "Each layer needs its own learning rate", "The total error must become a probability for each class", "The weight reaches the error only through intermediate steps"], "answer": [3], "explain": "The weight changes the net input, which changes the output, which changes the error. The chain rule joins these steps. It does not order updates, set learning rates or create probabilities.", "source": "Week 7 lecture, slide 34", "flag": "", "deck": "w07"}, {"id": "w07-014", "week": 7, "topic": "Learning rate", "type": "single", "q": "What does the learning rate do in the weight update?", "options": ["It scales how big a step each weight update takes", "It sets how many perceptrons are in each layer", "It decides which weights are included in the update", "It measures how far the prediction is from the target"], "answer": [0], "explain": "The gradient is multiplied by the learning rate before it is subtracted from the weight, so the rate sets the step size. Layer size, weight choice and error belong elsewhere.", "source": "Week 7 lecture, slide 38", "flag": "The slide only mentions a learning rate of 0.5 being applied. Its role as the step size is standard knowledge.", "deck": "w07"}, {"id": "w07-024", "week": 7, "topic": "Chain rule", "type": "explain", "q": "Explain why the chain rule is used in backpropagation.", "model": "A weight does not change the total error directly. It changes the total net input of a neuron, which changes the output of that neuron, and that output changes the error. The chain rule lets us multiply the effect of each link, so the effect of the weight on the error is built from smaller pieces. Each piece is simple to work out, which makes the whole calculation manageable.", "points": ["A weight affects the error only indirectly", "The effect passes through net input then output then error", "The chain rule combines the effect of each link"], "source": "Week 7 lecture, slide 34 to 37", "flag": "", "deck": "w07"}, {"id": "w07-026", "week": 7, "topic": "Learning rate", "type": "explain", "q": "Compare the effect of a learning rate that is too large with one that is too small.", "model": "A learning rate that is too large makes each step big, so the weights can overshoot the minimum and the error may bounce around or even grow. A learning rate that is too small makes each step tiny, so training is very slow and may need many epochs to reach a low error. A good value sits between the two and lets the error fall steadily without overshooting.", "points": ["Too large causes overshooting and unstable error", "Too small makes training slow", "A middle value gives steady improvement"], "source": "Week 7 lecture, slide 38", "flag": "Effects of poor learning rates are standard textbook knowledge and are not stated on the slides.", "deck": "w07"}, {"id": "w07-m01", "week": 7, "topic": "Backpropagation", "type": "explain", "q": "Explain how an artificial neural network is trained using backpropagation. Discuss how gradient descent helps optimise the network.", "model": "Training starts with random weights and biases. In the forward pass the input goes through the network to give a prediction. A cost function measures the error between the predicted and actual values. Backpropagation then sends this error backwards through the network and uses the chain rule to work out the gradient of the cost with respect to each weight and bias. Gradient descent uses those gradients to update each parameter a small step in the direction that reduces the cost. The learning rate sets the size of each step. Too large a rate can overshoot the minimum and too small a rate makes training slow. The cycle repeats over epochs until the error reaches the desired accuracy or the maximum number of epochs is reached.", "points": ["Forward pass gives a prediction and the cost measures the error", "Backpropagation sends the error back and computes gradients with the chain rule", "Gradient descent moves each weight and bias in the direction that lowers the cost", "Learning rate sets the size of each update step", "Repeats over epochs until the error reaches the desired accuracy or the maximum number of epochs"], "source": "Tutor's mock test, written question 7", "flag": "The mock gives no sample answer. This model answer was written from the slides for that week. That too high a learning rate overshoots and too low a rate is slow is textbook knowledge.", "mock": true, "focus": true, "deck": "w07"}, {"id": "w07-m02", "week": 7, "topic": "Backpropagation", "type": "single", "q": "Which correctly describes the role of backpropagation in neural network training?", "options": ["It directly selects the optimal number of hidden layers", "It computes gradients of the loss with respect to trainable parameters", "It replaces the need for an optimisation algorithm", "It randomly changes weights until accuracy improves"], "answer": [1], "explain": "Backpropagation works out the gradients. An optimiser such as gradient descent then uses them to update the weights.", "source": "Tutor's mock test, multiple choice question 12", "flag": "", "mock": true, "deck": "w07"}, {"id": "w07-m03", "week": 7, "topic": "Gradient descent", "type": "single", "q": "What is a likely consequence of setting the learning rate too high in gradient-based optimisation?", "options": ["Training is guaranteed to converge more quickly", "The loss function becomes independent of the model parameters", "Parameter updates may overshoot minima and cause unstable training", "The neural network automatically removes unnecessary weights"], "answer": [2], "explain": "Big steps can jump past the minimum, so the loss bounces around or grows.", "source": "Tutor's mock test, multiple choice question 13", "flag": "", "mock": true, "deck": "w07"}, {"id": "w08-001", "week": 8, "topic": "CNN motivation", "type": "single", "q": "Why do traditional fully connected networks cope poorly with images?", "options": ["They do not use local groups of neighbouring pixels that form shapes", "They cannot apply a nonlinear function to the outputs of their neurons", "They cannot be trained using backpropagation at all", "They only accept grayscale images with a single channel"], "answer": [0], "explain": "The meaning of an image sits in groups of neighbouring pixels, and a fully connected network does not use that local structure. It can still use nonlinear functions and backpropagation, so those options fail.", "source": "Week 8 lecture, slide 6", "flag": "", "deck": "w08"}, {"id": "w08-005", "week": 8, "topic": "Stride", "type": "single", "q": "A kernel is moved across an image with a stride of 2 instead of 1. What is the effect?", "options": ["The kernel doubles in size and covers more of the image", "The border of the image is filled with zeros first", "Each kernel weight is doubled, so the detected features get stronger", "The kernel moves two positions per step, so the output is smaller"], "answer": [3], "explain": "Stride is the amount the kernel shifts over the input. A bigger shift means fewer positions are visited. Filling the border with zeros describes padding, not stride.", "source": "Week 8 lecture, slide 13 and 14", "flag": "", "deck": "w08"}, {"id": "w08-006", "week": 8, "topic": "Padding", "type": "single", "q": "Why is padding added around the border of an image before convolution?", "options": ["To enlarge the kernel so it can detect bigger shapes", "To convert a colour image with three channels into a single channel image", "To handle edge pixels, which the kernel would otherwise cover less", "To increase the stride so the kernel moves faster"], "answer": [2], "explain": "A sliding kernel treats pixels at the edges differently from the rest, so a border is added. Padding does not change the kernel size, the number of channels or the stride.", "source": "Week 8 lecture, slide 15", "flag": "", "deck": "w08"}, {"id": "w08-017", "week": 8, "topic": "Dropout", "type": "single", "q": "How does dropout reduce overfitting during training?", "options": ["It permanently deletes the weakest neurons after the first pass", "It normalises each feature using the mean and variance of the current mini batch", "It reduces the spatial size of the feature maps in each layer", "It randomly ignores some layer outputs, so the layer differs on each pass"], "answer": [3], "explain": "Dropout is a regularisation technique that randomly drops outputs during training, so the network cannot rely on memorising everything. The dropped outputs are not removed for good.", "source": "Week 8 lecture, slide 28", "flag": "", "deck": "w08"}, {"id": "w08-027", "week": 8, "topic": "Pooling", "type": "explain", "q": "Compare max pooling and average pooling and explain why a CNN uses pooling.", "model": "A pooling layer reduces the spatial size of the convolved features, which lowers the computing power needed. It also extracts dominant features that do not depend much on position or rotation, which keeps training effective. Max poolin
