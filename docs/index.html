ecture, slide 1", "flag": "", "deck": "w05b"}, {"id": "w05b-016", "week": 5, "topic": "GA trade-offs", "type": "single", "q": "What is a main disadvantage of genetic algorithms?", "options": ["It can be difficult to represent a problem as a genetic problem", "They cannot find an approximate solution to any problem", "They need the problem to be written as a differentiable equation", "They can only work on problems with exactly one minimum"], "answer": [0], "explain": "Approximate solutions can usually be found, but the problem has to be encoded as chromosomes, which is not always easy. They do not need an equation and can cope with several minima.", "source": "Week 5 genetic algorithms lecture, slide 18", "flag": "", "deck": "w05b"}, {"id": "w05b-017", "week": 5, "topic": "GA terms", "type": "multi", "q": "Which statements about genetic algorithm terms are correct?", "options": ["Fitness is how successful or good an individual is", "Mutation is a random change, like an error in copying a gene", "A gene is the complete string that represents one candidate solution", "Crossover recombines genes from parents"], "answer": [0, 1, 3], "explain": "Crossover mixes parent genes, mutation is a random change and fitness measures success. The complete string is the chromosome, and a gene is one block within it.", "source": "Week 5 genetic algorithms lecture, slide 2, 4 and 5", "flag": "", "deck": "w05b"}, {"id": "w05b-018", "week": 5, "topic": "Genetic algorithms", "type": "explain", "q": "Explain what a genetic algorithm is and the main steps it follows.", "model": "A genetic algorithm solves optimisation problems by imitating biological evolution. It starts with a population of random candidate solutions, often encoded as bitstrings called chromosomes. Each solution is tested for fitness and ranked. The poor ones are removed and the good ones are duplicated and changed by crossover and mutation to form the next generation. This loop repeats over many generations until the best solution is good enough, so the population evolves towards an optimum.", "points": ["Says it imitates biological evolution", "Starts with a random population of encoded solutions", "Describes testing for fitness and selecting the better solutions", "Describes creating new solutions with crossover and mutation and repeating until good enough"], "source": "Week 5 genetic algorithms lecture, slide 6, 7, 13 and 14", "flag": "", "deck": "w05b"}, {"id": "w05b-019", "week": 5, "topic": "GA terms", "type": "explain", "q": "Describe the biological terms chromosome, gene and fitness and say what each means in a genetic algorithm.", "model": "In biology a chromosome is a string of DNA and a gene is a block of DNA that decides some feature of the organism. Fitness is how successful the organism is. In a genetic algorithm a chromosome is a candidate solution, often a bitstring. A gene is one position in it, such as a single bit with a value of 0 or 1. Fitness is how good the candidate solution is, and it decides which chromosomes are kept to produce the next generation.", "points": ["Defines a chromosome as the string that represents a candidate solution", "Defines a gene as a unit within the chromosome such as one bit", "Defines fitness as how successful or good a solution is", "Links the terms back to the biological meaning"], "source": "Week 5 genetic algorithms lecture, slide 2 and 14", "flag": "", "deck": "w05b"}, {"id": "w05b-020", "week": 5, "topic": "GA operators", "type": "explain", "q": "Compare crossover and mutation and explain why a genetic algorithm uses both.", "model": "Crossover combines genes from two parent chromosomes to make a child, in the same way that parents pass on a mixture of their DNA. Mutation makes a small random change, such as flipping one bit, like an error in copying a gene. Crossover mixes the good features that already exist in the population. Mutation introduces new variety that the existing solutions may not contain. Using both lets the algorithm keep what works while still exploring new possibilities.", "points": ["Describes crossover as recombining genes from parents", "Describes mutation as a random change to a gene or bit", "Explains that crossover mixes existing features while mutation adds new variety"], "source": "Week 5 genetic algorithms lecture, slide 4, 5 and 16", "flag": "The reason for using both is standard knowledge, the slides define each operator and use both in step 3.", "deck": "w05b"}, {"id": "w05b-021", "week": 5, "topic": "Analytical and numerical limits", "type": "explain", "q": "Explain why finding the minimum of a function by differentiation may not work for real problems, and how a genetic algorithm helps.", "model": "Differentiation needs the relationship to be written as an equation, and many real relationships cannot be. Some problems have several minima and many variables, which makes the analytical method unsuitable. Blind trial and error can work but may take too long and does not learn from earlier guesses. A genetic algorithm starts with random solutions, ranks them, drops poor ones, copies good ones and makes small changes. This guided search can find a good approximate answer without needing an equation.", "points": ["Says not all relationships can be written as an equation", "Mentions multiple minima or complex multivariable problems", "Says blind generate and test can be too slow", "Says a genetic algorithm gives a guided search and approximate answers"], "source": "Week 5 genetic algorithms lecture, slide 9 to 13", "flag": "", "deck": "w05b"}, {"id": "w05b-022", "week": 5, "topic": "GA terms", "type": "explain", "q": "Describe how a candidate solution can be represented in a genetic algorithm, using the bitstring example.", "model": "A candidate solution is encoded as a string of bits, which forms a chromosome. Each bit is a gene with a value of 0 or 1. In the example a six bit string stands for a number x between 0 and 63, and the algorithm looks for the x that gives the lowest value of the equation. The initial population is a set of random bitstrings. Each is decoded to a number and tested to measure its fitness.", "points": ["Says the solution is encoded as a bitstring or chromosome", "Says each bit is a gene with value 0 or 1", "Says the string is decoded to a value that is tested for fitness", "Mentions a random initial population"], "source": "Week 5 genetic algorithms lecture, slide 14 and 15", "flag": "", "deck": "w05b"}, {"id": "w05b-023", "week": 5, "topic": "GA trade-offs", "type": "explain", "q": "Give one advantage and one disadvantage of genetic algorithms and say what kind of problem suits them.", "model": "An advantage is that approximate solutions can usually be found, even where no equation exists. A disadvantage is that it can be hard to represent a problem as a genetic problem, since it must first be encoded as chromosomes with a fitness measure. Genetic algorithms are most successful on large search spaces, such as scheduling, route optimisation and finance, where checking every option would be impractical.", "points": ["States the advantage of finding approximate solutions", "States the difficulty of encoding a problem", "Names large search spaces and gives an example such as scheduling or routes"], "source": "Week 5 genetic algorithms lecture, slide 1 and 18", "flag": "", "deck": "w05b"}, {"id": "w06-001", "week": 6, "topic": "Biological inspiration", "type": "single", "q": "An impulse reaches a biological neuron from its neighbours. Which part receives it first?", "options": ["The axon terminal", "A dendrite", "The axon", "The nucleus"], "answer": [1], "explain": "Dendrites receive the impulse from neighbouring neurons. It then passes through the core and axon and leaves at the axon terminal, so the terminal is the exit point and not the entry.", "source": "Week 6 lecture, slide 5", "flag": "", "deck": "w06"}, {"id": "w06-002", "week": 6, "topic": "Perceptron", "type": "single", "q": "What does the simplest neural network, a perceptron, consist of?", "options": ["Two hidden layers of neurons feeding one output", "Thousands of neurons arranged in consecutive layers", "A single neuron with several input nodes and one output node", "A set of input nodes with no output node"], "answer": [2], "explain": "In its simplest form a perceptron is one neuron whose output is connected to every input. Thousands of perceptrons in layers make a full network, which is the tempting wrong option.", "source": "Week 6 lecture, slide 7 and 13", "flag": "", "deck": "w06"}, {"id": "w06-003", "week": 6, "topic": "Perceptron", "type": "single", "q": "Each connection leaving an input node of a perceptron has a weight. What does the weight do?", "options": ["It controls how strongly that input contributes to the weighted sum", "It decides whether the neuron fires at all", "It records how many epochs have passed", "It measures the error of the final prediction"], "answer": [0], "explain": "Inputs are multiplied by their weights and summed, so a larger weight gives that input more influence. The decision to fire belongs to the activation function and not to the weight.", "source": "Week 6 lecture, slide 8", "flag": "", "deck": "w06"}, {"id": "w06-004", "week": 6, "topic": "Perceptron", "type": "single", "q": "In a perceptron, what happens to the weighted sum of the inputs before the activation function sees it?", "options": ["It is squared to measure the error", "It is divided by the number of inputs", "It is compared with the true label", "A bias is added to it"], "answer": [3], "explain": "The perceptron finds the weighted sum of the products and then adds a bias. Comparing with a label happens in the cost function and not inside the neuron.", "source": "Week 6 lecture, slide 8 and 9", "flag": "", "deck": "w06"}, {"id": "w06-005", "week": 6, "topic": "Activation functions", "type": "single", "q": "What decision does the activation function of a neuron make?", "options": ["Whether the output connections of the neuron should fire, given its weighted sum", "Whether the weights should be updated in this epoch", "How far the prediction is from the true label", "Which input node has the largest weight"], "answer": [0], "explain": "The activation function checks the weighted sum and decides whether the output connections fire. Updating weights is done by backpropagation and gradient descent, which is a separate stage of training.", "source": "Week 6 lecture, slide 8", "flag": "", "deck": "w06"}, {"id": "w06-006", "week": 6, "topic": "Activation functions", "type": "single", "q": "The example perceptron applies a step function to a large positive weighted sum and outputs 1. What kind of output does a step function give?", "options": ["Any real number that grows with the sum", "A probability spread across several classes", "One of two values, so the neuron either fires or does not", "The error between prediction and label"], "answer": [2], "explain": "A step function gives one of two values, shown as 0 and 1 in the example. Outputs that grow with the sum or spread across classes belong to other activation functions.", "source": "Week 6 lecture, slide 9 and 10", "flag": "", "deck": "w06"}, {"id": "w06-007", "week": 6, "topic": "Perceptron", "type": "single", "q": "Which kind of pattern can a single perceptron learn?", "options": ["Any pattern, given enough epochs", "Patterns that are linearly separable", "Only patterns with three or more inputs", "Patterns that need several hidden layers"], "answer": [1], "explain": "A single perceptron can only learn patterns that are linearly separable. Training for more epochs does not remove that limit.", "source": "Week 6 lecture, slide 12", "flag": "", "deck": "w06"}, {"id": "w06-008", "week": 6, "topic": "Perceptron", "type": "single", "q": "A single perceptron fails to learn the XOR function however long it trains. Why?", "options": ["XOR needs more input nodes than a perceptron allows", "A step function cannot ever output the value 1", "Random initialisation always starts it in the wrong place", "The XOR classes are not linearly separable, and one perceptron can only learn separable patterns"], "answer": [3], "explain": "XOR cannot be split by one straight boundary, so a single weighted sum and activation cannot separate its classes. Training longer or starting from other random weights does not remove this limit.", "source": "Week 6 lecture, slide 12", "flag": "The slide only says a single perceptron learns linearly separable patterns. That XOR is not linearly separable is standard textbook knowledge.", "deck": "w06"}, {"id": "w06-009", "week": 6, "topic": "Perceptron", "type": "multi", "q": "Which of these happen inside a single perceptron when it produces an output?", "options": ["The prediction error is passed back to earlier layers", "Each input is multiplied by its weight and the products are summed", "The cost is averaged over the whole training set", "A bias is added to the weighted sum", "An activation function decides whether the neuron fires"], "answer": [1, 3, 4], "explain": "The perceptron sums weighted inputs, adds a bias and applies an activation function. Sending error backwards and averaging the cost belong to training and not to the neuron's own calculation.", "source": "Week 6 lecture, slide 8", "flag": "", "deck": "w06"}, {"id": "w06-010", "week": 6, "topic": "Perceptron", "type": "multi", "q": "Which statements about the weights and biases of a network are correct?", "options": ["They start with random values", "They are readjusted using backpropagation and gradient descent", "They are fixed by hand before training and never change", "Learning means finding values that minimise the error of the output"], "answer": [0, 1, 3], "explain": "Weights and biases start random, are adjusted by backpropagation and gradient descent, and learning means finding values that minimise the output error. They are not fixed by hand.", "source": "Week 6 lecture, slide 9 and 12", "flag": "", "deck": "w06"}, {"id": "w06-011", "week": 6, "topic": "Supervised learning", "type": "multi", "q": "Which statements about supervised learning in neural networks are correct?", "options": ["The data carries no labels and the network finds groups on its own", "The desired output for each input sample is known in advance", "The goal is to learn a function that approximates the relationship between inputs and outputs", "A cost function is not needed because the answers are known", "Neural networks generally perform this kind of task"], "answer": [1, 2, 4], "explain": "Supervised learning has known desired outputs, aims to learn the input to output relationship, and is what neural networks generally do. A cost function is still needed to measure how far predictions are from those answers.", "source": "Week 6 lecture, slide 14", "flag": "", "deck": "w06"}, {"id": "w06-012", "week": 6, "topic": "Supervised learning", "type": "multi", "q": "A network is trained on the iris dataset to classify the flower type. Which columns are features that the network takes as input?", "options": ["Sepal length", "Sepal width", "Petal length", "Flower type", "Petal width"], "answer": [0, 1, 2, 4], "explain": "The four measurements form the feature set the network reads. Flower type is the label, which is the answer the network is trained to predict.", "source": "Week 6 lecture, slide 20", "flag": "", "deck": "w06"}, {"id": "w06-013", "week": 6, "topic": "Training and initialisation", "type": "single", "q": "Right after random initialisation and before any training, what can be said about the predictions of the network?", "options": ["They are close to the labels because the weights start small", "They already improve with each forward pass", "They are random, because nothing has been optimised yet", "They match the labels for the easy classes"], "answer": [2], "explain": "Random weights and biases give a random prediction, so garbage in gives garbage out. The labels have not yet been used to adjust anything.", "source": "Week 6 lecture, slide 17", "flag": "", "deck": "w06"}, {"id": "w06-014", "week": 6, "topic": "Training loop", "type": "single", "q": "Which order describes one iteration of the training loop?", "options": ["Backpropagation, feed forward, gradient descent, cost function", "Feed forward, cost function, backpropagation, gradient descent", "Cost function, gradient descent, feed forward, backpropagation", "Gradient descent, backpropagation, cost function, feed forward"], "answer": [1], "explain": "The prediction must exist before its error can be measured, the error must exist before it is sent back, and the derivatives must be known before the weights are updated. The other orders break that chain.", "source": "Week 6 lecture, slide 16", "flag": "", "deck": "w06"}, {"id": "w06-015", "week": 6, "topic": "Training loop", "type": "multi", "q": "Training can stop in which of these situations?", "options": ["Every weight has become exactly zero", "The cost function has converged to a minimum", "The network has seen each test sample once", "A set maximum number of epochs has been reached", "The first forward pass has finished"], "answer": [1, 3], "explain": "Training ends when the cost converges to a minimum or a set number of epochs is reached. Zero weights or a single forward pass are not stopping rules.", "source": "Week 6 lecture, slide 16 and 36", "flag": "", "deck": "w06"}, {"id": "w06-016", "week": 6, "topic": "Training loop", "type": "single", "q": "In the training loop, what does the epoch counter count?", "options": ["Each neuron in the hidden layer", "Each example in the training dataset", "Each value the cost function returns", "Each full round of forward pass, cost, backpropagation and gradient descent"], "answer": [3], "explain": "The counter goes up once for each full round of the loop, and training can stop when it reaches a set maximum. A neuron or a cost value is not an epoch.", "source": "Week 6 lecture, slide 16 and 33", "flag": "The slide counts each loop round as an epoch. Many textbooks define an epoch as one pass over the training set, so the stem names the loop round.", "deck": "w06"}, {"id": "w06-017", "week": 6, "topic": "Cost functions", "type": "single", "q": "How do a loss function and a cost function usually differ?", "options": ["Loss usually refers to one observation, while cost averages the loss over the whole training set", "Loss averages over the whole training set, while cost refers to one observation", "Loss is used for regression and cost is used for classification", "Loss is used in testing and cost is used in training"], "answer": [0], "explain": "Loss usually describes how well one observation fits, and cost averages that loss across the training set. The first wrong option simply swaps the two terms.", "source": "Week 6 lecture, slide 21", "flag": "", "deck": "w06"}, {"id": "w06-018", "week": 6, "topic": "Cost functions", "type": "single", "q": "What does a cost function return for the predictions of a model on a dataset?", "options": ["A new set of weights for each layer", "A label for each unseen sample", "A single real number that quantifies the error between predictions and actual labels", "A list of derivatives for every neuron"], "answer": [2], "explain": "A cost function summarises the error between predictions and actual labels as one real number. New weights come from gradient descent, not from the cost function.", "source": "Week 6 lecture, slide 21", "flag": "", "deck": "w06"}, {"id": "w06-019", "week": 6, "topic": "Cost functions", "type": "single", "q": "How does mean squared error treat a prediction that is very far from its target compared with one that is close?", "options": ["It treats both errors as the same size of mistake", "It adds a massive penalty for the far prediction and only a minimal one for the close prediction", "It ignores any error above a fixed threshold", "It rewards the far prediction so the model learns faster"], "answer": [1], "explain": "Squaring the distance makes far points cost much more than near points. Treating all sizes alike ignores the squaring.", "source": "Week 6 lecture, slide 25", "flag": "The slide says errors grow exponentially, which is more precisely quadratic growth, so the stem avoids that word.", "deck": "w06"}, {"id": "w06-020", "week": 6, "topic": "Cost functions", "type": "single", "q": "One network predicts house prices and another labels emails as spam or not spam. Which pairing of cost functions fits?", "options": ["Binary cross entropy for the prices and mean squared error for the spam labels", "Binary cross entropy for the prices and mean absolute error for the spam labels", "Mean absolute error for the spam labels and binary cross entropy for the prices", "Mean squared error for the prices and binary cross entropy for the spam labels"], "answer": [3], "explain": "Prices are continuous values, so a regression cost such as mean squared error fits. Spam or not spam is a target of 0 or 1, so binary cross entropy fits. The other pairings swap these.", "source": "Week 6 lecture, slide 23 and 26", "flag": "", "deck": "w06"}, {"id": "w06-021", "week": 6, "topic": "Cost functions", "type": "multi", "q": "Which statements about binary cross entropy are correct?", "options": ["It is used when the target is either 0 or 1", "It compares the true distribution with the predicted distribution", "It measures how far each prediction is from the true value and averages these errors", "The prediction is usually produced by a sigmoid or softmax activation"], "answer": [0, 1, 2, 3], "explain": "All four statements are true of binary cross entropy.", "source": "Week 6 lecture, slide 26 to 28", "flag": "", "deck": "w06"}, {"id": "w06-022", "week": 6, "topic": "Gradient descent", "type": "single", "q": "What is gradient descent used for during training?", "options": ["To make corrective updates to the weights and biases that reduce the cost", "To compute the cost for the training set", "To choose the activation function", "To measure performance on unseen data"], "answer": [0], "explain": "Gradient descent makes corrective updates to weights and biases to reduce the cost. The cost function only measures the error, and testing is separate from training.", "source": "Week 6 lecture, slide 30 and 31", "flag": "", "deck": "w06"}, {"id": "w06-023", "week": 6, "topic": "Gradient descent", "type": "single", "q": "At the current weight, the slope of the cost function is positive. What does this tell gradient descent?", "options": ["Increase the weight, since a positive slope means the weight is too small", "Stop, because a positive slope means the minimum has been reached", "Reset the weight to a new random value", "Move the weight in the opposite direction, so the cost goes down"], "answer": [3], "explain": "The sign of the slope gives the direction of the next move, and training moves in the negative direction of the derivative. Moving along a positive slope would raise the cost.", "source": "Week 6 lecture, slide 31 and 33", "flag": "", "deck": "w06"}, {"id": "w06-024", "week": 6, "topic": "Backpropagation", "type": "multi", "q": "Which statements about backpropagation and gradient descent are correct?", "options": ["Gradient descent produces the forward pass predictions", "Backpropagation sends the prediction error back to each layer", "Backpropagation chooses the test data", "Backpropagation calculates partial derivatives using the chain rule", "Gradient descent uses those derivatives to adjust weights and biases"], "answer": [1, 3, 4], "explain": "Backpropagation carries the error back and computes partial derivatives with the chain rule, and gradient descent uses them to change weights and biases. The forward pass and test data are not their jobs.", "source": "Week 6 lecture, slide 33", "flag": "", "deck": "w06"}, {"id": "w06-025", "week": 6, "topic": "Testing and inference", "type": "multi", "q": "Which statements about testing a trained network are correct?", "options": ["The weights are updated by gradient descent on the test data", "It uses new unseen data", "Performance is measured on that data", "The process is usually called inference"], "answer": [1, 2, 3], "explain": "Testing uses new unseen data, measures performance and is usually called inference. The weights are not trained further on the test data.", "source": "Week 6 lecture, slide 36", "flag": "", "deck": "w06"}, {"id": "w06-026", "week": 6, "topic": "Neural networks", "type": "multi", "q": "Which statements about a network of perceptrons are correct?", "options": ["The perceptrons work together in consecutive layers", "Every perceptron must start with the same weights", "The layers turn the input data into predictions based on features present or absent", "In the feed forward process information moves from the input layer towards the output layer", "A network with layers no longer needs a cost function"], "answer": [0, 2, 3], "explain": "Perceptrons work in consecutive layers, turn inputs into predictions based on features, and feed forward moves from input to output. Weights start random and differ, and the cost function is still needed.", "source": "Week 6 lecture, slide 13 and 18", "flag": "", "deck": "w06"}, {"id": "w06-027", "week": 6, "topic": "Biological inspiration", "type": "explain", "q": "Explain how an artificial neural network is inspired by the human brain.", "model": "The brain is a web of interconnected neurons. Each neuron has dendrites that receive impulses from neighbours, a core and a single axon that pass the impulse on, and an axon terminal that releases it to other neurons. Researchers recreated this structure and function with artificial neurons so that a machine could learn, decide and predict in a similar way. An artificial neuron has input nodes in place of dendrites and an output in place of the axon, and many of them are joined into a network.", "points": ["The brain is made of interconnected neurons", "Dendrites receive impulses and the axon passes them on", "Artificial neurons copy this structure at a small scale", "Inputs and outputs of an artificial neuron play the roles of dendrites and axon"], "source": "Week 6 lecture, slide 3 to 7", "flag": "", "deck": "w06"}, {"id": "w06-028", "week": 6, "topic": "Perceptron", "type": "explain", "q": "Describe how a single perceptron turns its inputs into an output.", "model": "Each input value is multiplied by the weight on its connection. The products are added together to give a weighted sum, and a bias is added to that sum. The result passes to an activation function, which decides whether the neuron fires. With a step function the output is one of two values. The weights and bias start random and are adjusted during training so that the error of the output becomes smaller.", "points": ["Inputs are multiplied by their weights and summed", "A bias is added to the sum", "An activation function decides whether the neuron fires", "Weights and bias are learned to reduce the output error"], "source": "Week 6 lecture, slide 7 to 12", "flag": "", "deck": "w06"}, {"id": "w06-029", "week": 6, "topic": "Activation functions", "type": "explain", "q": "Explain the purpose of an activation function and give one example.", "model": "An activation function looks at the weighted sum produced by a neuron and decides whether the output connections should fire. The step function is the simplest example, giving one of two values depending on the sum. Sigmoid and softmax are other examples and are often used so that the output of a classification network is a probability. The choice of activation function depends on the task the network has to do.", "points": ["It checks the weighted sum of a neuron", "It decides whether the output connections fire", "A step function is a valid example", "Sigmoid or softmax is a valid example"], "source": "Week 6 lecture, slide 8, 10 and 27", "flag": "", "deck": "w06"}, {"id": "w06-030", "week": 6, "topic": "Perceptron", "type": "explain", "q": "Explain why a single perceptron is limited and how a network of perceptrons goes further.", "model": "A single perceptron can only learn patterns that are linearly separable, so it cannot solve a problem where one straight boundary cannot split the classes. XOR is a standard example. Placing thousands of perceptrons in consecutive layers lets them work together. Each layer passes its results on, and the network turns the input data into predictions based on the presence or absence of features.", "points": ["A single perceptron only learns linearly separable patterns", "Give a sensible example such as XOR", "A network uses many perceptrons in consecutive layers", "Layers turn inputs into predictions based on features"], "source": "Week 6 lecture, slide 12 and 13", "flag": "The slides only say a network turns inputs into predictions based on features. The claim that layers overcome the linear limit is standard textbook knowledge.", "deck": "w06"}, {"id": "w06-031", "week": 6, "topic": "Supervised learning", "type": "explain", "q": "Describe supervised learning using the iris dataset as an example.", "model": "In supervised learning the correct output for every training sample is known in advance. In the iris dataset each sample has a feature set of sepal length, sepal width, petal length and petal width, and a label giving the flower type. The network takes the features as input and predicts a flower type. The aim is to learn a function that best approximates the relationship between the inputs and the labels so that it can predict well on new samples.", "points": ["Desired outputs are known in advance", "Features are the four flower measurements", "The label is the flower type", "The goal is to learn the input to output relationship"], "source": "Week 6 lecture, slide 14 and 20", "flag": "", "deck": "w06"}, {"id": "w06-032", "week": 6, "topic": "Training loop", "type": "explain", "q": "Describe the steps of the training loop for a neural network.", "model": "Training is iterative. First the weights and biases are set randomly. Each round then starts with a forward pass that moves from the input layer to the output layer to give a prediction. The cost function measures the error of that prediction. Backpropagation sends the error back to each layer, and gradient descent adjusts the weights and biases to reduce the error. The epoch counter goes up and the loop repeats until the cost converges or the maximum number of epochs is reached.", "points": ["Random initialisation of weights and biases", "Forward pass to make a prediction", "Cost function measures the error", "Backpropagation and gradient descent update the parameters", "Repeat until convergence or the epoch limit"], "source": "Week 6 lecture, slide 16 and 36", "flag": "", "deck": "w06"}, {"id": "w06-033", "week": 6, "topic": "Training and initialisation", "type": "explain", "q": "Explain why a network gives poor predictions straight after initialisation and what the phrase garbage in garbage out means here.", "model": "Weights and biases are set randomly across every perceptron, so the first prediction is also random. Nothing has been optimised, and the network has not yet used the labels to learn anything. The phrase garbage in garbage out means that random parameters can only produce meaningless output. Training exists to improve these parameters step by step, so later predictions move closer to the true labels.", "points": ["Weights and biases start random", "The first prediction is therefore random", "Nothing has been optimised yet", "Training improves the parameters over time"], "source": "Week 6 lecture, slide 17", "flag": "", "deck": "w06"}, {"id": "w06-034", "week": 6, "topic": "Cost functions", "type": "explain", "q": "Compare a loss function with a cost function and give one example of a regression cost and one of a classification cost.", "model": "A loss function usually refers to the error for one observation, while a cost function usually refers to the average of the loss over the whole training set. Both turn the gap between prediction and true label into a single number that training tries to make small. Mean squared error is a regression example and it punishes distant predictions heavily. Binary cross entropy is a classification example for targets that are either 0 or 1, and it compares the predicted probability with the true label.", "points": ["Loss is for one observation", "Cost is the average over the training set", "A regression example such as mean squared error", "A classification example such as binary cross entropy"], "source": "Week 6 lecture, slide 21 to 28", "flag": "", "deck": "w06"}, {"id": "w06-035", "week": 6, "topic": "Gradient descent", "type": "explain", "q": "Explain how gradient descent reduces the cost function.", "model": "Gradient descent uses the derivative, which is the slope of the cost at the current point. The sign of the slope shows which direction to move. To lower the cost the parameters are moved in the negative direction of the derivative, which is the opposite direction to the gradient. Each corrective update to the weights and biases moves the model towards a better combination of parameters, and repeating the updates drives the cost towards a minimum.", "points": ["It uses the slope of the cost", "The sign of the slope gives the direction", "Parameters move in the negative direction of the derivative", "Repeated updates move the cost towards a minimum"], "source": "Week 6 lecture, slide 30 to 33", "flag": "", "deck": "w06"}, {"id": "w06-036", "week": 6, "topic": "Backpropagation", "type": "explain", "q": "Explain how backpropagation and gradient descent work together.", "model": "Backpropagation sends the prediction error from the cost function back to each layer, and it calculates partial derivatives using the chain rule of calculus. These derivatives show how each weight and bias affects the cost. Gradient descent then uses them to adjust the weights and biases so that the cost is lower in the next round of feed forward, which is the next epoch. So backpropagation finds the direction of improvement and gradient descent makes the change.", "points": ["Backpropagation sends the error back to each layer", "It calculates partial derivatives with the chain rule", "Gradient descent uses the derivatives to adjust weights and biases", "The improvement shows in the next epoch"], "source": "Week 6 lecture, slide 33", "flag": "", "deck": "w06"}, {"id": "w06-037", "week": 6, "topic": "Testing and inference", "type": "explain", "q": "Describe how a trained network is tested.", "model": "Once training has finished, either because the cost converged to a minimum or because a set number of epochs was reached, the network is tested on new unseen data. The weights are no longer being trained. The network makes predictions and its performance is measured on this data. This process is usually called inference. Testing on unseen data shows how well the learned function works beyond the training samples.", "points": ["Testing follows the end of training", "It uses new unseen data", "Performance is measured on that data", "The process is called inference"], "source": "Week 6 lecture, slide 36", "flag": "", "deck": "w06"}, {"id": "w07-001", "week": 7, "topic": "Network structure", "type": "single", "q": "An example network has 2 inputs, 2 perceptrons in a hidden middle layer and 2 perceptrons in the last layer. What can be said about this design?", "options": ["It is the only size that backpropagation can handle", "Backpropagation needs the hidden layer to be larger than the input layer", "It is only an example, and the same process scales to a network of any size", "The last layer must always be smaller than the hidden layer"], "answer": [2], "explain": "The example is small so the working can be followed, and it can be scaled to any size. Backpropagation has no such size rules.", "source": "Week 7 lecture, slide 12", "flag": "", "deck": "w07"}, {"id": "w07-002", "week": 7, "topic": "Network structure", "type": "single", "q": "In the example network, where does the hidden layer sit?", "options": ["In the middle, between the input layer and the last layer of perceptrons", "After the last layer, to store the results", "Before the input layer, to clean the data", "It is the same layer as the output layer"], "answer": [0], "explain": "The hidden layer is the middle layer of perceptrons between the inputs and the last layer. It is neither the entry nor the exit of the network.", "source": "Week 7 lecture, slide 12", "flag": "", "deck": "w07"}, {"id": "w07-003", "week": 7, "topic": "Forward pass", "type": "single", "q": "What does the forward pass do?", "options": ["It updates every weight using the error", "It sends the error from the output back to the inputs", "It tests the finished network on unseen data", "It moves from the input layers toward the output layer to produce a prediction"], "answer": [3], "explain": "The forward pass runs from input to output and gives the prediction. Sending the error back is the backward pass, and weight updates come afterwards.", "source": "Week 7 lecture, slide 9 and 13", "flag": "", "deck": "w07"}, {"id": "w07-004", "week": 7, "topic": "Forward pass", "type": "multi", "q": "Which statements about computing a neuron's output in the forward pass are correct?", "options": ["First the total net input of the neuron is calculated", "The error of the neuron is worked out before its net input", "Then an activation function is applied to that net input", "The outputs of one layer feed the next layer", "The weights are changed before the output is produced"], "answer": [0, 2, 3], "explain": "Each neuron finds its total net input and then applies the activation function, and its output feeds the next layer. Error and weight changes come later in the loop.", "source": "Week 7 lecture, slide 13 to 16", "flag": "", "deck": "w07"}, {"id": "w07-005", "week": 7, "topic": "Forward pass", "type": "single", "q": "In the example network, what is the logistic activation function applied to?", "options": ["The total error, to give the weight update", "The total net input of a neuron, to give that neuron's output", "The learning rate, to keep it small", "The target value, to turn it into a label"], "answer": [1], "explain": "The forward pass calculates the total net input of a neuron and then applies the logistic function to get its output. The error, learning rate and targets are not passed through it.", "source": "Week 7 lecture, slide 13", "flag": "", "deck": "w07"}, {"id": "w07-006", "week": 7, "topic": "Initialisation", "type": "multi", "q": "Which statements describe the network straight after random initialisation?", "options": ["The first prediction is essentially random", "Nothing has been optimised yet", "The first prediction already matches the target", "Training must adjust the weights and biases to improve it"], "answer": [0, 1, 3], "explain": "Random weights give a random prediction, nothing has been optimised, and training has to adjust the parameters. A matching prediction would need no training.", "source": "Week 7 lecture, slide 11", "flag": "", "deck": "w07"}, {"id": "w07-007", "week": 7, "topic": "Cost function", "type": "single", "q": "The example network has two output neurons, each with its own target. How is the total error formed?", "options": ["By combining the errors of the output neurons into one value for the network", "From the first output neuron only, because it comes first", "From the hidden neurons only", "From the average of the input values"], "answer": [0], "explain": "Each output neuron has a target and a prediction, and together they give the total error. Hidden neurons and inputs have no targets of their own.", "source": "Week 7 lecture, slide 32 and 33", "flag": "", "deck": "w07"}, {"id": "w07-008", "week": 7, "topic": "Backpropagation", "type": "multi", "q": "What is the aim of the backward pass?", "options": ["To produce the first prediction of the network", "To update each weight so predictions move closer to the targets", "To reduce the error for each output neuron", "To label unseen test data", "To reduce the error of the network as a whole"], "answer": [1, 2, 4], "explain": "The backward pass updates the weights to push predictions towards the targets, lowering the error for each output and for the whole network. Predicting and testing are other stages.", "source": "Week 7 lecture, slide 33", "flag": "", "deck": "w07"}, {"id": "w07-009", "week": 7, "topic": "Backpropagation", "type": "single", "q": "In the backward pass, what does the partial derivative of the total error with respect to a weight tell us?", "options": ["How many epochs remain before training stops", "What the target value should be", "How much a change in that weight would change the total error", "Which activation function the neuron uses"], "answer": [2], "explain": "The partial derivative shows how sensitive the total error is to one weight. It says nothing about epochs, targets or activation choice.", "source": "Week 7 lecture, slide 33", "flag": "", "deck": "w07"}, {"id": "w07-010", "week": 7, "topic": "Chain rule", "type": "single", "q": "A weight in the example network does not touch the error directly. Why is the chain rule needed to find its effect on the total error?", "options": ["The chain rule decides which weights should be updated first in each layer", "The chain rule sets a suitable learning rate separately for each layer", "The chain rule turns the total error into a probability for each class", "The weight affects the error only through the neuron's net input and output, so the effects form a chain"], "answer": [3], "explain": "The weight changes the net input, which changes the output, which changes the error. The chain rule joins these steps. It does not order updates, set rates or create probabilities.", "source": "Week 7 lecture, slide 34", "flag": "", "deck": "w07"}, {"id": "w07-011", "week": 7, "topic": "Chain rule", "type": "multi", "q": "Applying the chain rule, the effect of one weight on the total error is built from which pieces?", "options": ["How much the learning rate changes with the epoch count", "How much the total error changes with the neuron's output", "How much the neuron's output changes with its total net input", "How much the neuron's total net input changes with the weight"], "answer": [1, 2, 3], "explain": "The three pieces follow the path from weight to net input to output to error. The learning rate is not part of the derivative.", "source": "Week 7 lecture, slide 34 to 37", "flag": "", "deck": "w07"}, {"id": "w07-012", "week": 7, "topic": "Chain rule", "type": "single", "q": "A weight feeds one output neuron. When the total error is differentiated with respect to that weight, the error contributed by the other output neuron drops out as zero. Why?", "options": ["The other neuron's error is always exactly zero", "That weight has no effect on the other output neuron's error", "Errors from different neurons cancel each other out", "The other neuron sits in a hidden layer"], "answer": [1], "explain": "A term vanishes when the weight does not influence it. The other output neuron is unaffected by this weight, so its error does not contribute.", "source": "Week 7 lecture, slide 35", "flag": "The slide text lost its symbols. The answer relies on the standard worked example this slide follows.", "deck": "w07"}, {"id": "w07-013", "week": 7, "topic": "Gradient descent", "type": "single", "q": "After the gradient of the error with respect to a weight is known, in which direction does gradient descent adjust the weight?", "options": ["Along the gradient, so the error increases", "Towards zero, whatever the gradient says", "Opposite to the gradient, so the error decreases", "Randomly, then it keeps whichever result is better"], "answer": [2], "explain": "Gradient descent subtracts the scaled gradient from the current weight, which moves the weight opposite to the gradient. Moving along it would raise the error.", "source": "Week 7 lecture, slide 38", "flag": "", "deck": "w07"}, {"id": "w07-014", "week": 7, "topic": "Learning rate", "type": "single", "q": "What does the learning rate do in the weight update?", "options": ["It scales how large a step the weight takes opposite to the gradient", "It sets how many perceptrons are in each layer", "It decides which weights are included in the update", "It measures how far the prediction is from the target"], "answer": [0], "explain": "The gradient is multiplied by the learning rate before it is subtracted from the weight, so the rate sets the step size. Layer size, weight choice and error belong elsewhere.", "source": "Week 7 lecture, slide 38", "flag": "The slide only mentions a learning rate of 0.5 being applied. Its role as the step size is standard knowledge.", "deck": "w07"}, {"id": "w07-015", "week": 7, "topic": "Learning rate", "type": "single", "q": "During training the error of a network bounces up and down and never settles. Which change to the learning rate is most likely to help?", "options": ["Increase it, so larger steps settle faster", "Set it to zero so that the weights stabilise", "Make it change sign every epoch", "Reduce it, because steps that are too large overshoot the minimum"], "answer": [3], "explain": "Large steps jump past the minimum and back again, so smaller steps help. A rate of zero would stop learning altogether.", "source": "Week 7 lecture, slide 38", "flag": "Effects of a too large learning rate are standard textbook knowledge and are not stated on the slides.", "deck": "w07"}, {"id": "w07-016", "week": 7, "topic": "Gradient descent", "type": "multi", "q": "Which statements about updating the weights across a network are correct?", "options": ["The same process is used for every weight and bias", "It applies across all layers and perceptrons", "Only the weights of the output layer are ever updated", "Each update moves the parameter in the direction that reduces the cost"], "answer": [0, 1, 3], "explain": "The same working is repeated for all weights and biases in every layer, each moved to reduce the cost. Updating only the output layer would leave earlier layers untrained.", "source": "Week 7 lecture, slide 38 and 39", "flag": "", "deck": "w07"}, {"id": "w07-017", "week": 7, "topic": "Backpropagation", "type": "single", "q": "A network has several layers, and the prediction error is measured only at the output. What does backpropagation allow?", "options": ["It lets the hidden layers skip the forward pass", "It propagates the error back so the weights and biases of every layer can be adjusted", "It removes the need for a cost function", "It makes the output layer ignore earlier layers"], "answer": [1], "explain": "Backpropagation systematically sends the error back to the weights and biases of the network. It still relies on the cost function and on the forward pass.", "source": "Week 7 lecture, slide 29", "flag": "", "deck": "w07"}, {"id": "w07-018", "week": 7, "topic": "Forward and backward passes", "type": "multi", "q": "Which statements compare the forward pass and the backward pass correctly?", "options": ["The forward pass changes the weights, and the backward pass produces the prediction", "The forward pass runs from inputs to outputs, and the backward pass runs from the error back through the layers", "Both passes only run after training has finished", "The forward pass produces a prediction, and the backward pass works out how to change the weights", "The backward pass needs no cost function"], "answer": [1, 3], "explain": "The forward pass predicts from inputs to outputs, and the backward pass uses the error to work out weight changes. Both happen during training and both depend on the cost.", "source": "Week 7 lecture, slide 9, 13 and 33", "flag": "", "deck": "w07"}, {"id": "w07-019", "week": 7, "topic": "Training loop", "type": "single", "q": "The weights have just been updated at the end of one round of training. What happens next if the stopping condition is not met?", "options": ["The network is tested on unseen data", "The weights are reset to random values", "Another forward pass runs with the new weights, starting the next epoch", "The cost function is replaced by a new type"], "answer": [2], "explain": "Training repeats the loop with the improved weights until convergence or the epoch limit. Testing comes only when training is finished.", "source": "Week 7 lecture, slide 9 and 41", "flag": "", "deck": "w07"}, {"id": "w07-020", "week": 7, "topic": "Forward pass", "type": "single", "q": "Is the following statement correct?\n\"A forward pass changes the weights so that the next prediction is better.\"", "options": ["Incorrect, a forward pass only produces a prediction and the weights are changed afterwards", "Correct, the forward pass is where the learning happens", "Correct, because the forward pass includes gradient descent", "Incorrect, because forward passes only happen when testing"], "answer": [0], "explain": "The forward pass moves inputs to outputs using the current weights. The weights change in the update that follows the backward pass.", "source": "Week 7 lecture, slide 9 and 38", "flag": "", "deck": "w07"}, {"id": "w07-021", "week": 7, "topic": "Forward pass", "type": "explain", "q": "Describe what happens during the forward pass in the example network with two inputs, two hidden perceptrons and two output perceptrons.", "model": "The input values enter the input layer and move towards the output layer. For each perceptron in the hidden layer the total net input is calculated from the inputs, the weights on the incoming connections and a bias. The logistic activation function turns that net input into the output of the perceptron. These outputs then feed the two perceptrons in the last layer, which repeat the same two steps. The outputs of the last layer are the prediction of the network.", "points": ["Inputs move from the input layer towards the output layer", "Each perceptron finds its total net input", "The logistic activation function gives its output", "The last layer produces the prediction"], "source": "Week 7 lecture, slide 12 to 16", "flag": "", "deck": "w07"}, {"id": "w07-022", "week": 7, "topic": "Cost function", "type": "explain", "q": "Explain how the total error is found for a network with two outputs, and why it is needed before the backward pass.", "model": "Each output neuron has a target value and a prediction. The cost function measures how far each prediction is from its target, and the errors of the output neurons are combined into one total error for the network. This single number shows how wrong the network is. The backward pass needs it because the aim is to change the weights so that this error becomes smaller, and gradient descent needs a quantity to minimise.", "points": ["Each output neuron has a target and a prediction", "The errors are combined into one total error", "The total error shows how wrong the network is", "The backward pass tries to reduce this error"], "source": "Week 7 lecture, slide 17, 32 and 33", "flag": "", "deck": "w07"}, {"id": "w07-023", "week": 7, "topic": "Backpropagation", "type": "explain", "q": "Describe the goal of the backward pass and what a partial derivative of the error tells us.", "model": "The goal is to update every weight in the network so that the predicted outputs move closer to the targets. This reduces the error for each output neuron and for the network as a whole. To do this we ask how much a small change in a particular weight would change the total error. That is the partial derivative of the total error with respect to the weight. A larger value means the weight has a stronger effect on the error.", "points": ["The goal is to update the weights", "Predictions should move closer to the targets", "A partial derivative shows how a weight changes the total error"], "source": "Week 7 lecture, slide 33", "flag": "", "deck": "w07"}, {"id": "w07-024", "week": 7, "topic": "Chain rule", "type": "explain", "q": "Explain why the chain rule is used in backpropagation.", "model": "A weight does not change the total error directly. It changes the total net input of a neuron, which changes the output of that neuron, and that output changes the error. The chain rule lets us multiply the effect of each link, so the effect of the weight on the error is built from smaller pieces. Each piece is simple to work out, which makes the whole calculation manageable.", "points": ["A weight affects the error only indirectly", "The effect passes through net input then output then error", "The chain rule combines the effect of each link"], "source": "Week 7 lecture, slide 34 to 37", "flag": "", "deck": "w07"}, {"id": "w07-025", "week": 7, "topic": "Gradient descent", "type": "explain", "q": "Explain how gradient descent updates a weight and what the learning rate does.", "model": "Gradient descent takes the gradient of the error with respect to the weight and moves the weight in the opposite direction, which means the gradient is subtracted from the current weight. The learning rate scales this gradient, so it controls how big each step is. A suitable learning rate lets the error fall steadily. The same rule is applied to the weights and biases in every layer.", "points": ["The weight moves opposite to the gradient", "The scaled gradient is subtracted from the current weight", "The learning rate sets the step size"], "source": "Week 7 lecture, slide 38 and 39", "flag": "The role of the learning rate as step size is standard knowledge, since the slide only applies an example rate.", "deck": "w07"}, {"id": "w07-026", "week": 7, "topic": "Learning rate", "type": "explain", "q": "Compare the effect of a learning rate that is too large with one that is too small.", "model": "A learning rate that is too large makes each step big, so the weights can overshoot the minimum and the error may bounce around or even grow. A learning rate that is too small makes each step tiny, so training is very slow and may need many epochs to reach a low error. A good value sits between the two and lets the error fall steadily without overshooting.", "points": ["Too large causes overshooting and unstable error", "Too small makes training slow", "A middle value gives steady improvement"], "source": "Week 7 lecture, slide 38", "flag": "Effects of poor learning rates are standard textbook knowledge and are not stated on the slides.", "deck": "w07"}, {"id": "w07-027", "week": 7, "topic": "Backpropagation", "type": "explain", "q": "Explain why backpropagation is needed in a network with many layers.", "model": "The cost function measures the error only at the output, but the weights and biases of every layer influence that error. We need to know how each parameter contributes before we can correct it. Backpropagation systematically sends the prediction error back through the network to every weight and bias. Without it we would have no systematic way to adjust the earlier layers, so the whole network could not be trained.", "points": ["The error is measured only at the output", "Every layer influences the error", "Backpropagation sends the error back to every weight and bias"], "source": "Week 7 lecture, slide 29", "flag": "", "deck": "w07"}, {"id": "w07-028", "week": 7, "topic": "Forward and backward passes", "type": "explain", "q": "Compare the forward pass and the backward pass.", "model": "The forward pass moves from the input layer to the output layer and produces a prediction using the current weights and biases. The backward pass starts from the error at the output and moves back through the layers, using partial derivatives and the chain rule to work out how each weight affects the error. The forward pass changes nothing about the network, while the backward pass leads to the weight updates that reduce the error. Training repeats both passes many times.", "points": ["Forward pass runs input to output and gives a prediction", "Backward pass runs from the error back through the layers", "Backward pass uses partial derivatives and the chain rule", "Both are repeated during training"], "source": "Week 7 lecture, slide 9, 13 and 33", "flag": "", "deck": "w07"}, {"id": "w07-029", "week": 7, "topic": "Gradient descent", "type": "explain", "q": "Explain how the same process is extended to all the weights and biases in a network.", "model": "The calculation worked out for one weight is repeated for every other weight and bias. The same chain of pieces is used, and the same rule subtracts a scaled gradient from the current value. This applies in every layer and to every perceptron. That is why the small example with two inputs, two hidden perceptrons and two outputs can be scaled to a network of any size.", "points": ["The same calculation is repeated for every weight and bias", "It applies in all layers and perceptrons", "The method scales to any network size"], "source": "Week 7 lecture, slide 12, 38 and 39", "flag": "", "deck": "w07"}, {"id": "w08-001", "week": 8, "topic": "CNN motivation", "type": "single", "q": "Why do traditional fully connected networks cope poorly with images?", "options": ["They are not designed to exploit local groups of neighbouring pixels that form shapes", "They cannot apply a nonlinear function to neuron outputs", "They cannot be trained using backpropagation at all", "They only accept grayscale images with a single channel"], "answer": [0], "explain": "The meaning of an image sits in groups of neighbouring pixels, and a fully connected network does not use that local structure. It can still use nonlinear functions and backpropagation, so those options fail.", "source": "Week 8 lecture, slide 6", "flag": "", "deck": "w08"}, {"id": "w08-002", "week": 8, "topic": "Images and channels", "type": "single", "q": "What does a channel refer to in a digital image?", "options": ["One hidden layer that sits between the input and the output of a network", "One class label that the network can assign to the whole picture", "One colour component of the image, held as its own 2D matrix of pixel values", "One filter position as the kernel slides across the width of an image"], "answer": [2], "explain": "A colour image is like three 2D matrices stacked together, one each for red, green and blue. A grayscale image has just one channel.", "source": "Week 8 lecture, slide 7", "flag": "", "deck": "w08"}, {"id": "w08-003", "week": 8, "topic": "Convolution", "type": "single", "q": "In a convolutional layer, what is the job of a filter, also called a kernel?", "options": ["It randomly switches off outputs to stop the network memorising", "It is a small 2D array of weights that slides over the input to detect a feature such as an edge", "It converts feature values into probabilities that sum to one", "It rescales pixel values so that all features share a similar magnitude"], "answer": [1], "explain": "The filter holds weights that are multiplied with each patch of the input, so it acts as a feature detector. Switching off outputs is dropout and turning values into probabilities is softmax.", "source": "Week 8 lecture, slide 9 and 11", "flag": "", "deck": "w08"}, {"id": "w08-004", "week": 8, "topic": "Filters", "type": "multi", "q": "Which tasks can different filters carry out on an input image?", "options": ["Randomly dropping layer outputs", "Converting logits into class probabilities", "Detecting edges", "Softening the image", "Sharpening the image", "Detecting corners"], "answer": [2, 3, 4, 5], "explain": "Different kernels pull out different features and can also sharpen or soften an image. Producing probabilities belongs to the softmax layer and dropping outputs belongs to the dropout layer.", "source": "Week 8 lecture, slide 10", "flag": "", "deck": "w08"}, {"id": "w08-005", "week": 8, "topic": "Stride", "type": "single", "q": "A kernel is moved across an image with a stride of 2 instead of 1. What is the effect?", "options": ["The kernel doubles in size, so it covers more of the image at every step", "The border of the image is filled with zeros before the kernel is applied", "Each kernel weight is multiplied by two, so features become stronger", "The kernel shifts two positions each step, so it visits fewer positions and the output is smaller"], "answer": [3], "explain": "Stride is the amount the kernel shifts over the input. A bigger shift means fewer positions are visited. Filling the border with zeros describes padding, not stride.", "source": "Week 8 lecture, slide 13 and 14", "flag": "", "deck": "w08"}, {"id": "w08-006", "week": 8, "topic": "Padding", "type": "single", "q": "Why is padding added around the border of an image before convolution?", "options": ["To make the kernel larger so it can detect bigger shapes", "To convert a colour image into a single channel image", "To handle the pixels at the edges, which the kernel would otherwise cover less well", "To increase the stride so the kernel moves faster"], "answer": [2], "explain": "Edge pixels are treated unusually by a sliding kernel, so a border is added. Padding does not change the kernel size, the number of channels or the stride.", "source": "Week 8 lecture, slide 15", "flag": "", "deck": "w08"}, {"id": "w08-007", "week": 8, "topic": "Padding", "type": "multi", "q": "Which of these are forms of padding?", "options": ["Reflection padding", "Replication padding", "Dropout padding", "Softmax padding", "Zero padding"], "answer": [0, 1, 4], "explain": "Zero padding fills the border with zeros, and reflection and replication padding fill it using the image's own edge values. Dropout and softmax are separate layer types, not padding methods.", "source": "Week 8 lecture, slide 15 and 16", "flag": "Slide 16 is image only, so the padding types come from the text on slide 15.", "deck": "w08"}, {"id": "w08-008", "week": 8, "topic": "Convolutional layer", "type": "single", "q": "How do the filters of a CNN become useful feature detectors?", "options": ["They start with random values and are refined over many rounds of feedforward and backpropagation", "They are designed by hand to match edges and corners before training", "They are copied from the pooling layer once training has finished", "They stay at their random starting values while later layers do the learning"], "answer": [0], "explain": "Filters are randomly initialised like ordinary weights and biases, then repeated training evolves them into strong feature extractors. They are not hand designed and they do not stay random.", "source": "Week 8 lecture, slide 19", "flag": "", "deck": "w08"}, {"id": "w08-009", "week": 8, "topic": "Pooling", "type": "single", "q": "A max pooling layer is added after a convolutional layer. What is its main job?", "options": ["To increase the spatial size so that finer detail can be recovered", "To turn the feature maps into a single vector for classification", "To randomly ignore some outputs so the network cannot memorise", "To reduce the spatial size of the feature maps while keeping the dominant features"], "answer": [3], "explain": "Pooling shrinks the convolved features, which lowers the computing needed. Turning maps into a vector is the flatten layer and ignoring outputs at random is dropout.", "source": "Week 8 lecture, slide 20 and 21", "flag": "", "deck": "w08"}, {"id": "w08-010", "week": 8, "topic": "Pooling", "type": "single", "q": "A kernel covers a patch of values in a feature map. How does average pooling summarise that patch?", "options": ["It keeps only the largest value in the patch", "It returns the mean of all the values in the patch", "It keeps the first value that the kernel reaches", "It subtracts the patch mean from every value"], "answer": [1], "explain": "Average pooling returns the average of the values under the kernel. Keeping only the largest value describes max pooling, which is the tempting wrong choice.", "source": "Week 8 lecture, slide 21", "flag": "", "deck": "w08"}, {"id": "w08-011", "week": 8, "topic": "Pooling", "type": "multi", "q": "Which are benefits of a pooling layer?", "options": ["It extracts dominant features that are rotation and position invariant", "It shrinks the spatial size of the convolved features", "It helps keep the training of the model effective", "It lowers the computing power needed to process the data"], "answer": [0, 1, 2, 3], "explain": "Pooling reduces dimensions, saves computation and keeps dominant features that do not depend on exact position or rotation, which supports effective training. All four statements are correct.", "source": "Week 8 lecture, slide 20", "flag": "", "deck": "w08"}, {"id": "w08-012", "week": 8, "topic": "Activation", "type": "single", "q": "What does an activation layer do in a CNN?", "options": ["It acts as a gate between a neuron's inputs and its output, deciding whether the output is activated", "It slides a kernel over the image to extract local features", "It averages groups of neighbouring values to shrink the feature map", "It flattens the feature maps into one long vector"], "answer": [0], "explain": "An activation function is a mathematical gate that decides the output of a neuron, and in a CNN it works across two dimensions like a screen. ReLU is the most popular choice.", "source": "Week 8 lecture, slide 22 and 23", "flag": "", "deck": "w08"}, {"id": "w08-013", "week": 8, "topic": "Normalisation", "type": "single", "q": "Why are input features scaled to a similar range, such as 0 to 1?", "options": ["So that the output layer produces probabilities that sum to one", "So that the image dimensions shrink before pooling is applied", "So that the size of the contribution each feature makes to prediction is about the same", "So that neurons can be dropped at random during training"], "answer": [2], "explain": "Normalisation makes feature magnitudes comparable, so one large valued feature does not dominate. Producing probabilities is softmax, and dropping neurons is dropout.", "source": "Week 8 lecture, slide 24", "flag": "", "deck": "w08"}, {"id": "w08-014", "week": 8, "topic": "Batch normalisation", "type": "single", "q": "Two batches from a dataset look very different from each other and training keeps lurching between them. What is this problem called?", "options": ["Overfitting, where training error is tiny but error on new data is large", "Covariate shift, a large change in the data distribution between batches", "Vanishing gradient, where early layers barely update at all", "Zero padding, where image borders are filled with zeros"], "answer": [1], "explain": "When batches differ a lot the network keeps changing its weights towards each odd distribution, which slows training. Batch normalisation is used to reduce this. Overfitting is about memorising the training set instead.", "source": "Week 8 lecture, slide 25", "flag": "", "deck": "w08"}, {"id": "w08-015", "week": 8, "topic": "Batch normalisation", "type": "multi", "q": "Which statements about batch normalisation are correct?", "options": ["It works on feature maps across a mini batch of a set size", "It generally speeds up learning and leads to faster convergence", "For each feature it subtracts the mini batch mean and divides by the mini batch standard deviation", "It chooses the largest value from each patch of the feature map", "It randomly removes outputs to reduce memorisation"], "answer": [0, 1, 2], "explain": "Batch normalisation standardises each feature using mini batch statistics, which speeds up learning. Removing outputs at random is dropout and taking the largest value is max pooling.", "source": "Week 8 lecture, slide 26", "flag": "", "deck": "w08"}, {"id": "w08-016", "week": 8, "topic": "Overfitting", "type": "multi", "q": "Which statements describe overfitting?", "options": ["The error on new data is large", "The error on the training set becomes very small", "The network generalises well to new situations", "The error on the training set stays high however long training runs"], "answer": [0, 1], "explain": "An overfitted network has memorised the training examples, so training error is tiny but new data gives large error. It has not learned to generalise.", "source": "Week 8 lecture, slide 27", "flag": "", "deck": "w08"}, {"id": "w08-017", "week": 8, "topic": "Dropout", "type": "single", "q": "How does dropout reduce overfitting during training?", "options": ["It permanently deletes the weakest neurons after the first pass", "It normalises each feature using the mini batch mean and variance", "It reduces the spatial size of the feature maps in each layer", "It randomly ignores some layer outputs, so the layer looks different on each pass"], "answer": [3], "explain": "Dropout is a regularisation technique that randomly drops outputs during training, so the network cannot rely on memorising everything. The dropped outputs are not removed for good.", "source": "Week 8 lecture, slide 28", "flag": "", "deck": "w08"}, {"id": "w08-018", "week": 8, "topic": "Dropout", "type": "single", "q": "Is the following statement correct?\n\"Dropout is used so that a network can memorise the whole training set.\"", "options": ["Yes, because dropout stores the training examples inside the layer", "Yes, because dropping outputs makes the layer more accurate on the training data only", "No, dropout is a regularisation technique that stops the network memorising the training set", "No, dropout is only used to shrink the spatial size of feature maps"], "answer": [2], "explain": "The purpose of dropout is the opposite of memorisation. By ignoring random outputs it pushes the network to generalise. Shrinking feature maps is the job of pooling.", "source": "Week 8 lecture, slide 27 and 28", "flag": "", "deck": "w08"}, {"id": "w08-019", "week": 8, "topic": "CNN structure", "type": "single", "q": "What are the two main stages of a CNN?", "options": ["A feature stage of convolution, pooling and dropout, then fully connected layers that predict the label", "A fully connected stage that finds features, then a convolutional stage that labels the image", "A normalisation stage that scales the image, then a dropout stage that predicts the label", "A pooling stage that finds features, then a convolutional stage that predicts the label"], "answer": [0], "explain": "The first stage breaks the image into features and analyses them. The second stage, made of fully connected layers, uses those features to predict the best label.", "source": "Week 8 lecture, slide 29", "flag": "", "deck": "w08"}, {"id": "w08-020", "week": 8, "topic": "Fully connected layers", "type": "single", "q": "What does the flatten layer at the start of the fully connected stage do?", "options": ["It gives the final probability for each label using softmax", "It applies a filter to detect edges in the image", "It randomly drops outputs to prevent overfitting", "It turns the output of the earlier layers into a single vector that can feed the next stage"], "answer": [3], "explain": "The flatten layer takes the feature maps and turns them into one vector so that ordinary fully connected layers can use them. Final probabilities come from the softmax output layer.", "source": "Week 8 lecture, slide 30 and 31", "flag": "", "deck": "w08"}, {"id": "w08-021", "week": 8, "topic": "Softmax", "type": "single", "q": "What is the purpose of the softmax function in the output layer?", "options": ["It flattens feature maps into a single vector", "It turns the raw feature values, called logits, into probabilities that sum to one", "It decides which neuron outputs to drop at random", "It scales each feature to the range 0 to 1 across a mini batch"], "answer": [1], "explain": "Softmax gives the final probability for each label, and the probabilities add up to one. Flattening, dropout and batch normalisation are different layers.", "source": "Week 8 lecture, slide 30 and 32", "flag": "", "deck": "w08"}, {"id": "w08-022", "week": 8, "topic": "Fully connected layers", "type": "multi", "q": "Which are types of fully connected layer in a CNN?", "options": ["A softmax layer that acts as the output", "A pooling input layer that keeps the maximum", "A normal layer that applies weights and biases", "A flatten layer that acts as the input", "A convolutional output layer that applies a small kernel"], "answer": [0, 2, 3], "explain": "Fully connected layers include the flatten input layer, ordinary layers with weights and biases, and the softmax output layer. Kernels and maximum values belong to convolution and pooling.", "source": "Week 8 lecture, slide 30", "flag": "", "deck": "w08"}, {"id": "w08-023", "week": 8, "topic": "Convolutional layer", "type": "multi", "q": "Which statements about convolution are correct?", "options": ["It returns the maximum value from each patch", "Its filters start random and improve through training", "Its filters are designed by hand and then frozen", "The most common filter size is 3 by 3", "It multiplies a set of weights with the input in a linear operation"], "answer": [1, 3, 4], "explain": "Convolution is a linear operation between a filter and the input, filters are learned, and 3 by 3 is the usual size. Hand designed frozen filters and maximum values do not describe it.", "source": "Week 8 lecture, slide 9, 11 and 19", "flag": "", "deck": "w08"}, {"id": "w08-024", "week": 8, "topic": "CNN motivation", "type": "explain", "q": "Explain why a traditional fully connected network does not scale well to images and what a CNN assumes instead.", "model": "The meaning of an image sits in groups of neighbouring pixels that together form a shape, and a traditional network is not designed to use these local features. It treats pixels as separate inputs, so it is good at classifying but poor at extracting features. A CNN assumes the input is an image. This lets the architecture encode visual features and use local patterns, which boosts feature extraction and makes the deep network more efficient.", "points": ["Image meaning comes from correlated local groups of pixels", "Traditional networks do not exploit local features and are weak at feature extraction", "A CNN explicitly assumes the input is an image", "This lets it use local features and work more efficiently"], "source": "Week 8 lecture, slide 5 and 6", "flag": "", "deck": "w08"}, {"id": "w08-025", "week": 8, "topic": "Convolution", "type": "explain", "q": "Describe what the convolution operation does and the role of the filter.", "model": "Convolution slides a small 2D array of weights, called a filter or kernel, over the image and multiplies it with each patch of input. This is a linear operation that extracts and keeps local features. Different filters pick out different features such as edges or corners. The result is a smaller output that is easier to process without losing features that matter for prediction. The filters begin random and are improved by training.", "points": ["A filter or kernel is a 2D array of weights applied across the input", "It is a linear multiplication of weights and input patches", "Different filters detect different features such as edges and corners", "It reduces output size while keeping critical features", "Filters start random and are learned in training"], "source": "Week 8 lecture, slide 8 to 11 and 19", "flag": "", "deck": "w08"}, {"id": "w08-026", "week": 8, "topic": "Stride and padding", "type": "explain", "q": "Explain what stride and padding control in a convolution.", "model": "Stride is the amount the kernel shifts each time as it moves across the input. It moves right by the stride until the width is covered, then drops down and repeats. A larger stride means fewer positions and a smaller output. Padding adds extra values around the border of the image so that edge pixels are handled properly. The most common choice is zero padding, but reflection and replication padding also exist.", "points": ["Stride is the shift of the kernel at each step", "A larger stride visits fewer positions", "Padding adds a border to handle edge pixels", "Zero padding is common and reflection or replication padding are alternatives"], "source": "Week 8 lecture, slide 13 to 16", "flag": "", "deck": "w08"}, {"id": "w08-027", "week": 8, "topic": "Pooling", "type": "explain", "q": "Compare max pooling and average pooling and explain why a CNN uses pooling.", "model": "A pooling layer reduces the spatial size of the convolved features, which lowers the computing power needed. It also extracts dominant features that do not depend much on position or rotation, which keeps training effective. Max pooling returns the largest value in the patch covered by the kernel. Average pooling returns the mean of all values in that patch. Max pooling keeps the strongest response while average pooling gives a smoother summary.", "points": ["Pooling reduces spatial size and computation", "It keeps dominant features that are position and rotation invariant", "Max pooling returns the maximum value in the patch", "Average pooling returns the mean of the patch"], "source": "Week 8 lecture, slide 20 and 21", "flag": "", "deck": "w08"}, {"id": "w08-028", "week": 8, "topic": "Activation", "type": "explain", "q": "Explain the purpose of the activation layer in a CNN and name the most popular activation function.", "model": "An activation function is a mathematical equation that decides the output of a neuron. In a CNN it works across two dimensions like a screen and decides whether each output pixel is activated. It acts as a gate between the inputs feeding a neuron and its output going to the next layer. It also adds the nonlinearity that a plain dot product lacks. ReLU is the most popular activation function in CNNs.", "points": ["It decides the output of a neuron", "It acts as a gate between inputs and output", "It decides whether each output pixel is activated", "ReLU is the most popular choice"], "source": "Week 8 lecture, slide 22 and 23", "flag": "The nonlinearity point is standard textbook knowledge. Slide 4 only says the dot product is optionally followed by a nonlinearity.", "deck": "w08"}, {"id": "w08-029", "week": 8, "topic": "Batch normalisation", "type": "explain", "q": "Explain how batch normalisation helps the training of a CNN.", "model": "Very different looking batches cause a large shift in the data distribution, called covariate shift. The network is misled into changing its weights towards one odd batch, so it bounces between distributions and learns slowly. Batch normalisation works on feature maps across a mini batch. For each feature it finds the mean and variance, subtracts the mean and divides by the standard deviation. This speeds up learning and gives faster convergence.", "points": ["Different batches cause covariate shift", "Covariate shift slows training because the network bounces between distributions", "It subtracts the mini batch mean and divides by the standard deviation for each feature", "Result is faster learning and convergence"], "source": "Week 8 lecture, slide 24 to 26", "flag": "", "deck": "w08"}, {"id": "w08-030", "week": 8, "topic": "Dropout", "type": "explain", "q": "Explain what overfitting is and how a dropout layer helps to prevent it.", "model": "Overfitting happens when the error on the training set is very small but the error on new data is large. The network has memorised the training examples and has not learned to generalise. Dropout is a simple regularisation technique. During training it randomly ignores some layer outputs, so the layer looks different from one pass to the next. This stops the network relying on memorising the whole training set.", "points": ["Overfitting means tiny training error but large error on new data", "The network has memorised rather than generalised", "Dropout is a regularisation technique", "It randomly ignores some layer outputs during training"], "source": "Week 8 lecture, slide 27 and
