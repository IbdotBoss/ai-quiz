:root{
  --paper:#fff;--ink:#1b1424;--ink-2:#4b4357;--hair:#dedbe4;--tint:#f4f2f7;
  --right:#18794e;--wrong:#b3261e;--focus:#3e4a89;--off:#767676;--hatch:#d9d5e0;--veil:#1b142499;
  --t-xs:.84rem;--t-s:.94rem;--t-m:1.0625rem;--t-l:1.375rem;--t-xl:2.25rem;
  --r:6px;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t-m)/1.5 "Atkinson Next",Verdana,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 20px 72px;min-height:100dvh}
@media (min-width:800px){main{padding:56px 20px 96px}}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:var(--t-xl);font-weight:800;line-height:1.02}
h2{font-size:var(--t-l);font-weight:700;line-height:1.25;margin-top:40px}
h3,.sub{font-size:var(--t-m);font-weight:700;margin-top:20px;line-height:1.5}
h1.stem,h2.stem{margin:8px 0 4px}
h1:focus,h2:focus,.fb:focus,legend:focus{outline:none}
p{margin:8px 0;text-wrap:pretty}
.s{font-size:var(--t-s);color:var(--ink-2)}
a{color:var(--ink)}
svg{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

button,select{font:700 1rem/1.2 "Atkinson Next",Verdana,sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 20px;min-height:44px;cursor:pointer}
button.p{background:var(--ink);color:var(--paper)}
button:active:not(:disabled){transform:translateY(1px)}
button.l{border:0;padding:12px 0;text-decoration:underline;font-weight:400;font-size:var(--t-s)}
button:disabled{color:var(--off);border-color:var(--off);background:var(--paper);cursor:default}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1.5px solid var(--ink);font-size:var(--t-s)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--wrong)}

/* the heatmap */
.plot{border-collapse:separate;border-spacing:4px 4px;margin:12px 0 0 -4px;width:calc(100% + 8px)}
.plot th{font-weight:400;text-align:left;padding:0}
.plot thead th{font-size:var(--t-xs);color:var(--ink-2);text-align:center;vertical-align:bottom;width:72px;line-height:1.2;padding-bottom:4px}
.plot thead th:first-child{width:auto}
.plot tbody th{border-top:1px solid var(--hair);padding:0 8px 0 0}
.plot .wk{display:flex;gap:4px;width:100%;min-height:48px;align-items:center;text-align:left;border:0;border-radius:0;padding:0;font-weight:400;font-size:var(--t-s);line-height:1.3}
.plot .wk b{font-weight:800;flex:0 0 1.7em;font-variant-numeric:tabular-nums}
.plot .wk:hover span{text-decoration:underline}
select{max-width:100%;text-overflow:ellipsis}
.plot td{padding:0;height:1px}
.plot td button{width:100%;height:100%;min-height:48px;border:0;border-radius:0;padding:0;font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.plot td button.new{line-height:1.2;background:repeating-linear-gradient(135deg,var(--paper) 0 5px,var(--hatch) 5px 6.5px);color:var(--ink-2);font-size:var(--t-xs);font-weight:400}
.plot td button:hover{outline:2px solid var(--ink);outline-offset:1px}
.key{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:var(--t-xs);color:var(--ink-2);flex-wrap:wrap}
.key .sw{display:flex}.key .sw i{width:16px;height:12px;display:block}
.key .nw{width:16px;height:12px;background:repeating-linear-gradient(135deg,var(--paper) 0 3px,var(--hatch) 3px 4.5px);border:1px solid var(--hair);margin-left:12px}

.papers{border-top:1.5px solid var(--ink);margin-top:12px}
.papers button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:16px 0;font-weight:400}
.papers button b{font-size:var(--t-l);font-weight:700}
.papers button span{grid-column:1;color:var(--ink-2);font-size:var(--t-s);line-height:1.4}
.papers button i{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:var(--t-s);font-variant-numeric:tabular-nums;white-space:nowrap}
.papers button:hover:not(:disabled) b{text-decoration:underline}
.papers button:disabled b{color:var(--off)}

fieldset{border:0;margin:0;padding:0;min-width:0}legend{padding:0}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:24px;font-size:var(--t-s);color:var(--ink-2)}
.stem{font-size:var(--t-l);font-weight:700;line-height:1.3;margin:8px 0 4px;white-space:pre-wrap;text-wrap:balance;display:block}
.how{display:block;font-size:var(--t-s);color:var(--ink-2);font-weight:400;margin-bottom:12px}
.o{display:grid;grid-template-columns:22px minmax(0,1fr) 24px;gap:0 12px;align-items:start;padding:12px 0;border-top:1px solid var(--hair);cursor:pointer}
.o input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ink);cursor:pointer}
.o input:disabled{cursor:default}
.o small{display:block;font-weight:700;font-size:var(--t-xs);color:var(--wrong)}.o small.ok{color:var(--right)}
.o .mk{width:22px;height:22px;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:4px 24px}.row .o{border:0;grid-template-columns:22px auto;padding:8px 0}
textarea{display:block;width:100%;min-height:168px;resize:vertical;font:400 var(--t-m)/1.5 "Atkinson Next",Verdana,sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px}
textarea.short{min-height:96px}
textarea::placeholder{color:var(--ink-2);opacity:1}
.yours{white-space:pre-wrap;background:var(--tint);padding:12px;border-radius:var(--r);overflow-wrap:break-word}
.fb{margin-top:20px;border-top:1.5px solid var(--ink);padding-top:4px;overflow-wrap:break-word}
.flag{background:var(--tint);padding:12px;border-radius:var(--r);font-size:var(--t-s);margin-top:12px}
.nav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:28px}
.ai{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
.ai button{font-weight:400;font-size:var(--t-s);padding:8px 16px}

details{margin-top:28px;border-top:1px solid var(--hair)}
summary{cursor:pointer;padding:12px 0;font-size:var(--t-s)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:4px 0 16px}
.grid button{padding:0;min-height:44px;font-size:var(--t-s);font-weight:400;font-variant-numeric:tabular-nums}
.grid .done{background:var(--ink);color:var(--paper);font-weight:700}
.grid .cur{outline:3px solid var(--focus);outline-offset:2px}

.total{font-size:var(--t-xl);font-weight:800;line-height:1.1;margin:16px 0 4px;font-variant-numeric:tabular-nums}
table.t{border-collapse:collapse;width:100%;font-size:var(--t-s);margin-top:8px;font-variant-numeric:tabular-nums}
.t td,.t th{border-bottom:1px solid var(--hair);padding:8px 12px 8px 0;text-align:left;vertical-align:top}
.t th{border-bottom:1.5px solid var(--ink);font-weight:700}
.t .num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0;white-space:nowrap}
.rev{border-top:1.5px solid var(--ink);margin-top:32px}
.foot{margin-top:64px;border-top:1px solid var(--hair);padding-top:16px;font-size:var(--t-s);color:var(--ink-2)}
.foot .gh{display:inline-flex;align-items:center;gap:8px;vertical-align:bottom;min-height:24px}
.notes{overflow-wrap:break-word}
.notes h1{font-size:var(--t-xl);margin-top:28px}
.notes h2{border-top:1px solid var(--hair);padding-top:16px;margin-top:28px}
.notes h3{font-size:var(--t-l);margin-top:28px}
.notes h4{font-size:var(--t-m);margin:20px 0 0;border-top:1px solid var(--hair);padding-top:12px}
.notes table{display:block;overflow-x:auto;border-collapse:collapse;margin:12px 0;font-size:var(--t-s);font-variant-numeric:tabular-nums}
.notes td,.notes th{border-bottom:1px solid var(--hair);padding:8px 16px 8px 0;text-align:left;vertical-align:top}
.notes li{margin:4px 0}
dialog{border:1.5px solid var(--ink);border-radius:var(--r);padding:20px;max-width:min(420px,calc(100% - 40px));color:var(--ink)}
dialog::backdrop{background:var(--veil)}
dialog .nav{margin-top:20px}
</style>
</head>
<body>
<main id="app"></main>
<dialog id="dlg" aria-labelledby="dlg-t"><p id="dlg-t"></p><div class="nav"><button id="dlg-no">Keep working</button><button class="p" id="dlg-yes">Hand in</button></div></dialog>

<script>
const DATA = {"questions": [{"id": "w01a-001", "week": 1, "topic": "Turing Test", "type": "single", "q": "On what basis does the Turing Test judge whether a machine is intelligent?", "options": ["Whether its behaviour can be told apart from that of a human by a judge", "Whether it reasons internally in the same way a human brain does", "Whether it can process information faster than a human can", "Whether it was built using biologically inspired methods"], "answer": [0], "explain": "The test looks only at observable behaviour. How the machine produces that behaviour is not examined, so speed or brain-like design does not matter.", "source": "Week 1 lecture, slide 18", "flag": "", "deck": "w01a"}, {"id": "w01a-002", "week": 1, "topic": "Turing Test", "type": "single", "q": "A human judge talks to a hidden entity and cannot tell whether it is a computer. What follows?", "options": ["The computer has shown that it is conscious and self-aware", "The computer has passed the test and is said to be intelligent", "The judge has failed and the test must be repeated with a new judge", "The computer has become a form of strong AI by definition"], "answer": [1], "explain": "Passing is defined by the judge being unable to tell the difference. This says nothing about consciousness, so it does not make the machine strong AI.", "source": "Week 1 lecture, slide 19", "flag": "", "deck": "w01a"}, {"id": "w01a-003", "week": 1, "topic": "Turing Test", "type": "single", "q": "Which question did Turing put in place of asking whether machines can think?", "options": ["Can machines store more knowledge than any human?", "Can machines describe their own thoughts accurately?", "Can machines pass a behaviour test for intelligence?", "Can machines copy the structure of a human brain?"], "answer": [2], "explain": "Thinking is hard to define and measure, so Turing swapped it for a question about behaviour that can be tested. The other options still ask about intellect or structure.", "source": "Week 1 lecture, slide 18", "flag": "", "deck": "w01a"}, {"id": "w01a-004", "week": 1, "topic": "Defining AI", "type": "multi", "q": "Which statements about the words in the term artificial intelligence are correct?", "options": ["Intelligence has one agreed test that gives a single score", "Artificial means produced by human effort rather than arising naturally", "Both words are equally disputed and have no agreed meaning", "Intelligence is hard to define because it is hard to measure"], "answer": [1, 3], "explain": "There is basic agreement about artificial, but intelligence is the difficult word. If it had a single agreed measure it would not be hard to define.", "source": "Week 1 lecture, slide 4", "flag": "", "deck": "w01a"}, {"id": "w01a-005", "week": 1, "topic": "Weak and strong AI", "type": "single", "q": "A voice assistant answers set questions using predefined instructions and parameters. How is it best classified?", "options": ["Strong AI, because it understands speech as well as a human does", "Strong AI, because it can plan for the future in its own way", "Weak AI, because it lacks the memory needed for any learning", "Weak AI, because it solves a limited task and does not have human cognitive range"], "answer": [3], "explain": "Assistants such as Siri and Alexa are narrow systems built for specific problems. The last option fails because weak AI can still learn from data.", "source": "Week 1 lecture, slide 22", "flag": "", "deck": "w01a"}, {"id": "w01a-006", "week": 1, "topic": "Weak and strong AI", "type": "multi", "q": "Which of the following are features of strong AI?", "options": ["It aims to be indistinguishable from the human mind", "It is already in everyday use in chatbots and phones", "It is designed to solve one specific problem only", "It would be able to plan for the future and be creative", "It would have self-awareness and consciousness"], "answer": [0, 3, 4], "explain": "Strong AI is a theoretical goal of human level intelligence. Narrow task systems in everyday use are weak AI.", "source": "Week 1 lecture, slide 21", "flag": "", "deck": "w01a"}, {"id": "w01a-007", "week": 1, "topic": "Weak and strong AI", "type": "multi", "q": "Which statements about weak AI are correct?", "options": ["It has consciousness but limited vocabulary", "Most or all of today's AI systems are examples of it", "It exists only as a theoretical concept", "It does not cover the full range of human cognitive abilities", "It generates output from predefined instructions and parameters", "It is built to solve a specific problem"], "answer": [1, 3, 4, 5], "explain": "Weak AI is the practical form that exists now. Consciousness and a purely theoretical status describe strong AI instead.", "source": "Week 1 lecture, slide 22", "flag": "", "deck": "w01a"}, {"id": "w01a-008", "week": 1, "topic": "AI types", "type": "single", "q": "A chess program always returns the same move for the same board and keeps no memory of earlier games. Which type of AI is this?", "options": ["A reactive machine", "A limited memory machine", "A theory of mind system", "A self-aware system"], "answer": [0], "explain": "Reactive machines have no memory and are task specific, so an input always gives the same output. Deep Blue is the standard example.", "source": "Week 1 lecture, slide 23", "flag": "", "deck": "w01a"}, {"id": "w01a-009", "week": 1, "topic": "AI types", "type": "multi", "q": "Which of the following describe limited memory machines?", "options": ["Deep learning systems such as ChatGPT are examples", "They can look at the past and monitor objects over time", "They get better as they receive more data to train on", "They always give the same output for the same input with no memory", "They have a conscious understanding of their own existence"], "answer": [0, 1, 2], "explain": "Limited memory is the step after reactive machines. The two wrong options describe reactive machines and self-aware systems.", "source": "Week 1 lecture, slide 24", "flag": "", "deck": "w01a"}, {"id": "w01a-010", "week": 1, "topic": "AI types", "type": "single", "q": "Which ability marks theory of mind AI, as opposed to systems that only match patterns?", "options": ["Reproducing identical outputs from fixed statistical rules", "Understanding human motives and intentions and predicting behaviour", "Monitoring one object over time without understanding it", "Having a conscious sense of its own existence"], "answer": [1], "explain": "Theory of mind AI would understand patterns rather than just match them. The third option describes the self-awareness type, which is a later step.", "source": "Week 1 lecture, slide 25", "flag": "", "deck": "w01a"}, {"id": "w01a-011", "week": 1, "topic": "AI types", "type": "single", "q": "Which type of AI does not exist yet, partly because too little is known about the human brain and emotion?", "options": ["Reactive machines", "Limited memory machines", "Self-awareness", "Recommendation systems"], "answer": [2], "explain": "Self-aware AI would understand itself as well as the world around it. Reactive and limited memory systems already exist.", "source": "Week 1 lecture, slide 26", "flag": "", "deck": "w01a"}, {"id": "w01a-012", "week": 1, "topic": "AI types", "type": "multi", "q": "Which of the following belong to the four types of AI in the evolution from simple to advanced?", "options": ["Self-awareness", "Weak AI", "Limited memory machines", "Reactive machines", "Theory of mind", "Strong AI"], "answer": [0, 2, 3, 4], "explain": "Weak and strong AI are a separate way of splitting AI by capability. The four types are ordered by memory and understanding.", "source": "Week 1 lecture, slide 23 to 26", "flag": "", "deck": "w01a"}, {"id": "w01a-013", "week": 1, "topic": "Multiple intelligences", "type": "single", "q": "What does the theory of multiple intelligences claim?", "options": ["Intelligence is one general ability that can be measured by one score", "Only logical and mathematical skill counts as true intelligence", "Machines can hold every modality but humans can hold only one", "Intelligence splits into specific modalities rather than being one general ability"], "answer": [3], "explain": "The theory separates intelligence into several kinds. This is why asking whether a machine is intelligent depends on which kind is meant.", "source": "Week 1 lecture, slide 6", "flag": "", "deck": "w01a"}, {"id": "w01a-014", "week": 1, "topic": "Multiple intelligences", "type": "single", "q": "Which intelligence is the ability to perceive, use, understand and manage emotions in oneself and others?", "options": ["Emotional or interpersonal intelligence", "Intrapersonal intelligence", "Naturalistic intelligence", "Existential intelligence"], "answer": [0], "explain": "Interpersonal intelligence is about sensitivity to the moods and motives of others and working in groups. Intrapersonal is about self-reflection.", "source": "Week 1 lecture, slide 8 and 9", "flag": "", "deck": "w01a"}, {"id": "w01a-015", "week": 1, "topic": "Multiple intelligences", "type": "single", "q": "Someone has a deep understanding of themselves and is good at introspection. Which intelligence is this?", "options": ["Emotional or interpersonal intelligence", "Intrapersonal intelligence", "Bodily-kinesthetic intelligence", "Linguistic-verbal intelligence"], "answer": [1], "explain": "Intrapersonal intelligence looks inward at the self. Interpersonal intelligence is the tempting wrong choice because it looks outward at other people.", "source": "Week 1 lecture, slide 9", "flag": "", "deck": "w01a"}, {"id": "w01a-016", "week": 1, "topic": "Multiple intelligences", "type": "single", "q": "A rover identifies and classifies rocks and features of its environment. Which human intelligence does this resemble most?", "options": ["Existential intelligence", "Linguistic-verbal intelligence", "Naturalistic intelligence", "Visual-spatial intelligence"], "answer": [2], "explain": "Naturalistic intelligence is the ability to identify, classify and manipulate elements of the environment. Visual-spatial is about spatial judgement and visualisation.", "source": "Week 1 lecture, slide 13", "flag": "", "deck": "w01a"}, {"id": "w01a-017", "week": 1, "topic": "Multiple intelligences", "type": "multi", "q": "Which of the following correctly match an intelligence with its description?", "options": ["Logical-mathematical with logic, abstraction and reasoning about causal systems", "Visual-spatial with a talent for numbers and critical thinking", "Bodily-kinesthetic with control of body movement and skilful handling of objects", "Existential with the ability to identify animals and plants", "Linguistic-verbal with a facility for words, reading and writing"], "answer": [0, 2, 4], "explain": "The two wrong pairs swap descriptions. Visual-spatial is about spatial problems and Existential is about the meaning of life.", "source": "Week 1 lecture, slide 7 to 14", "flag": "", "deck": "w01a"}, {"id": "w01a-018", "week": 1, "topic": "Defining AI", "type": "single", "q": "A system reaches intelligent behaviour by a method that looks nothing like human thought. From the behavioural view of AI, is this a problem?", "options": ["Yes, because only biologically observable methods count as AI", "Yes, because the method must match how humans reason", "No, but only if the system also has consciousness", "No, because the outcome matters and the method does not"], "answer": [3], "explain": "In a computing context what matters is the behaviour produced. The definition of AI does not have to be confined to biologically observable methods.", "source": "Week 1 lecture, slide 2 and 27", "flag": "", "deck": "w01a"}, {"id": "w01a-019", "week": 1, "topic": "Turing Test", "type": "explain", "q": "Explain what the Turing Test is and how a computer passes it.", "model": "The Turing Test is a way of defining AI by behaviour instead of asking whether a machine can really think. A human judge communicates with a hidden entity and has to decide whether it is a computer or a person. If the judge cannot tell, the computer passes and is said to be intelligent. The test cares about the outcome, so it ignores how the machine produces its answers. It replaced the hard question of whether machines think with a question that can be tested.", "points": ["It tests whether a machine can show intelligent behaviour equal to a human", "A human judge cannot tell if the other entity is a computer", "If the judge fails to tell, the computer has passed and counts as intelligent", "It focuses on behaviour and not on intellect or how the machine works"], "source": "Week 1 lecture, slide 17 to 19", "flag": "", "deck": "w01a"}, {"id": "w01a-020", "week": 1, "topic": "Weak and strong AI", "type": "explain", "q": "Compare weak AI and strong AI and give one example of each.", "model": "Weak AI is built to solve a specific problem using predefined instructions and parameters. It does not cover the full range of human cognitive ability. Almost all of today's AI is weak, for example Siri, Alexa or a self driving car. Strong AI would match human intelligence, with self awareness, consciousness, creativity and the ability to plan for the future. It is only a theoretical idea with current technology, so a human like thinking machine is the example people point to.", "points": ["Weak AI solves limited specific problems", "Strong AI would equal human intelligence and have self awareness", "An example of weak AI such as a voice assistant or chatbot", "Strong AI only exists as a theoretical concept today"], "source": "Week 1 lecture, slide 21 and 22", "flag": "", "deck": "w01a"}, {"id": "w01a-021", "week": 1, "topic": "AI types", "type": "explain", "q": "Compare reactive machines with limited memory machines.", "model": "A reactive machine has no memory and is built for one task, so the same input always gives the same output. It relies on statistics, fixed rules and pattern recognition, and a chess program or a recommendation system is an example. A limited memory machine can look at the past and track objects or situations over time. It improves as it is trained on more data, in the way neurons work together. Deep learning systems such as ChatGPT are examples.", "points": ["Reactive machines have no memory and give the same output for the same input", "Limited memory machines can look into the past and monitor things over time", "Limited memory machines improve with more training data", "One correct example of each, such as Deep Blue and ChatGPT"], "source": "Week 1 lecture, slide 23 and 24", "flag": "", "deck": "w01a"}, {"id": "w01a-022", "week": 1, "topic": "AI types", "type": "explain", "q": "Describe the four types of AI and say which are not yet achieved.", "model": "The four types run from simple to advanced. Reactive machines have no memory and give fixed outputs. Limited memory machines learn from data and look at the past. Theory of mind AI would understand human motives and intentions and predict behaviour, and it would be broad rather than limited to one domain. Self aware AI would have a conscious sense of its own existence. Self awareness does not exist yet because we do not know enough about the human brain and emotion.", "points": ["Names all four types in order", "Reactive has no memory and limited memory learns from past data", "Theory of mind understands motives and intentions", "Self awareness is a sense of self and does not exist yet"], "source": "Week 1 lecture, slide 23 to 26", "flag": "", "deck": "w01a"}, {"id": "w01a-023", "week": 1, "topic": "Defining AI", "type": "explain", "q": "Explain why artificial intelligence is hard to define even though the word artificial is easy to agree on.", "model": "Artificial means produced by human effort rather than arising naturally, and people broadly agree on that. Intelligence is a different matter because it means intellect, wisdom and understanding, which are very hard to measure. Without a clear measure it is hard to say when a machine has it. The theory of multiple intelligences adds to the problem because it splits intelligence into several kinds. This is why the Turing Test uses behaviour as a practical definition.", "points": ["Artificial has basic agreement on its meaning", "Intelligence is hard to define because it is hard to measure", "Intelligence may have several modalities and not one single form", "Behaviour based tests offer a practical way around the problem"], "source": "Week 1 lecture, slide 4 and 6", "flag": "", "deck": "w01a"}, {"id": "w01a-024", "week": 1, "topic": "Multiple intelligences", "type": "explain", "q": "Explain the theory of multiple intelligences and describe two of the types.", "model": "The theory says that human intelligence is not one general ability but is split into specific modalities. Visual-spatial intelligence is spatial judgement and the ability to picture objects from different angles, for example when navigating. Linguistic-verbal intelligence is a skill with words and languages, such as reading, writing and telling stories. Other types include logical-mathematical, bodily-kinesthetic, naturalistic, interpersonal, intrapersonal and existential. Each type raises the question of whether a machine could have it.", "points": ["Intelligence is split into modalities and not one general ability", "Describes one type correctly", "Describes a second type correctly", "Mentions that other types exist or links types to machines"], "source": "Week 1 lecture, slide 6 to 14", "flag": "", "deck": "w01a"}, {"id": "w01a-025", "week": 1, "topic": "Turing Test", "type": "explain", "q": "Explain why the computing definition of AI focuses on behaviour and not on how the machine works.", "model": "Asking whether a machine truly thinks cannot be answered because intelligence is hard to define and measure. The computing definition therefore says AI is the ability of a machine to mimic the behaviour of living things, mainly humans. How the machine does this is not important and what matters is the outcome. This follows from the Turing Test, which only asks whether a judge can tell the machine apart from a person. The definition also does not require the machine to copy biological methods.", "points": ["Thinking and intelligence are hard to define or measure", "AI means a machine mimicking behaviour of living entities", "The method does not matter and the outcome does", "Linked to the Turing Test"], "source": "Week 1 lecture, slide 2, 18 and 27", "flag": "", "deck": "w01a"}, {"id": "w01a-026", "week": 1, "topic": "AI types", "type": "explain", "q": "Describe theory of mind AI and explain how it differs from classic pattern matching systems.", "model": "Theory of mind AI would be able to understand human motives, intentions and reasoning and predict behaviour, as if simulating human relationships. It could place information in context. It would have broad functionality, whereas classic machine learning algorithms only work well in one specific domain. The key difference is that it would not just match patterns but would understand them. This type is often linked to artificial general intelligence.", "points": ["Understands human motives and intentions and predicts behaviour", "Can contextualise information", "Broad functionality compared with narrow domain algorithms", "Understands patterns and does not only match them"], "source": "Week 1 lecture, slide 25", "flag": "", "deck": "w01a"}, {"id": "w01b-001", "week": 1, "topic": "What EDA is", "type": "single", "q": "What is the purpose of exploratory data analysis before building a model?", "options": ["To profile, summarise and visualise data so its quality and patterns are understood", "To tune the final model settings until test accuracy stops improving", "To deploy a trained model and monitor how it behaves on live data", "To replace validation by checking the model against the training set"], "answer": [0], "explain": "EDA happens before formal modelling and builds intuition about content, quality, relationships and anomalies. Tuning, deployment and validation come later.", "source": "Week 1 data lecture, slide 12", "flag": "", "deck": "w01b"}, {"id": "w01b-002", "week": 1, "topic": "What EDA is", "type": "multi", "q": "Which of the following can EDA reveal about a dataset?", "options": ["Class imbalance and skewed distributions", "Missing values, duplicates and wrong data types", "The final accuracy the model will reach on unseen data", "Which neural network design will always perform best", "Target leakage and sampling bias"], "answer": [0, 1, 4], "explain": "EDA finds problems with the data and hints at suitable methods. It cannot give final performance because no model has been tested yet.", "source": "Week 1 data lecture, slide 13", "flag": "", "deck": "w01b"}, {"id": "w01b-003", "week": 1, "topic": "AI as science", "type": "single", "q": "In the scientific method for AI research, what comes straight after proposing an algorithmic approach as a hypothesis?", "options": ["Conclusion where findings are refined and published", "Experimentation using controlled tests on datasets", "Observation of a real world problem such as air quality", "Analysis of results using quantitative metrics"], "answer": [1], "explain": "The order is observation, hypothesis, experimentation, analysis and conclusion. Analysis needs results from the experiment first.", "source": "Week 1 data lecture, slide 9", "flag": "", "deck": "w01b"}, {"id": "w01b-004", "week": 1, "topic": "AI in research", "type": "multi", "q": "Which of the following are reasons AI is valuable in research?", "options": ["It can bridge fields such as biology, health and transport", "It can uncover hidden patterns in large and complex datasets", "It can automate repetitive cleaning, annotation and analysis", "It guarantees correct conclusions without any experiments", "It removes the need for reproducibility and peer review"], "answer": [0, 1, 2], "explain": "AI accelerates discovery and automates routine work. Research using AI still follows the scientific method with peer review and reproducibility.", "source": "Week 1 data lecture, slide 8 and 9", "flag": "", "deck": "w01b"}, {"id": "w01b-005", "week": 1, "topic": "Research pipeline", "type": "single", "q": "A researcher repeats a study using cross-validation, statistical tests and benchmark comparison. Which pipeline stage is this?", "options": ["Problem formulation", "Model development", "Evaluation and validation", "Data collection and preprocessing"], "answer": [2], "explain": "Cross-validation, statistical testing and benchmarking check whether the model really works. Choosing and justifying an algorithm belongs to model development.", "source": "Week 1 data lecture, slide 10", "flag": "", "deck": "w01b"}, {"id": "w01b-006", "week": 1, "topic": "Data modalities", "type": "single", "q": "Hourly air quality readings are collected from one sensor over several months and the order of the readings matters. Which modality fits best?", "options": ["Tabular with independent rows", "Text with tokens", "Image with channels", "Time series"], "answer": [3], "explain": "Time series are observations indexed by time where order and temporal dependence matter. Tabular rows are treated as separate entities.", "source": "Week 1 data lecture, slide 11 and 27", "flag": "", "deck": "w01b"}, {"id": "w01b-007", "week": 1, "topic": "Data modalities", "type": "single", "q": "Which pair of properties would you profile first when exploring audio data?", "options": ["Sampling rate and duration", "Tokenisation and vocabulary size", "Autocorrelation and seasonality only", "Shape, aspect ratio and colour channels"], "answer": [0], "explain": "Audio is profiled by sampling rate, duration and spectrograms. Tokenisation belongs to text and shape and channels belong to images.", "source": "Week 1 data lecture, slide 11", "flag": "", "deck": "w01b"}, {"id": "w01b-008", "week": 1, "topic": "Tabular EDA", "type": "single", "q": "After joining two tables, many rows appear twice. What does this most likely point to?", "options": ["A genuine extreme value that needs modelling", "A join that has gone wrong and created duplicates", "Seasonality in the underlying process", "Class imbalance in the target column"], "answer": [1], "explain": "Schema and integrity checks look for duplicated rows and identifier collisions, which signal broken joins. Outliers and imbalance are different problems.", "source": "Week 1 data lecture, slide 16", "flag": "", "deck": "w01b"}, {"id": "w01b-009", "week": 1, "topic": "Tabular EDA", "type": "single", "q": "One record shows a customer age of 250, while another shows a rare but real very high income. How should these be treated?", "options": ["Both are errors and should always be deleted straight away", "Both are true extremes and should be left untouched", "The age is likely an entry error and the income may be a true extreme to model", "The income is an error and the age should be capped"], "answer": [2], "explain": "Outlier checks aim to tell data errors from legitimate extremes. Real extremes call for modelling choices such as transforms, not automatic removal.", "source": "Week 1 data lecture, slide 19", "flag": "", "deck": "w01b"}, {"id": "w01b-010", "week": 1, "topic": "Tabular EDA", "type": "single", "q": "Why does EDA compare the scales and ranges of features?", "options": ["To remove duplicated rows before the dataset is split", "To measure how many values are missing in each column", "To choose how the data is divided into training groups", "To decide whether scaling is needed to stabilise optimisation and distance-based models"], "answer": [3], "explain": "Features with very different ranges can distort distance-based methods and make optimisation unstable. Standard, robust or power scaling may then be used.", "source": "Week 1 data lecture, slide 20", "flag": "", "deck": "w01b"}, {"id": "w01b-011", "week": 1, "topic": "Tabular EDA", "type": "single", "q": "A feature correlates almost perfectly with the target. What should you suspect first?", "options": ["Target leakage, where the feature gives away the answer", "That the feature is the ideal predictor and should be kept", "That the target is imbalanced across its classes", "That the feature needs a log transform to be stable"], "answer": [0], "explain": "Correlations that are too perfect are a warning of leakage. A model using the leaked feature would look good in testing but fail on real new data.", "source": "Week 1 data lecture, slide 21 and 13", "flag": "", "deck": "w01b"}, {"id": "w01b-012", "week": 1, "topic": "Tabular EDA", "type": "single", "q": "What does multicollinearity describe?", "options": ["How strongly each feature is related to the target label", "How strongly each feature can be explained by the other features", "How many values in each feature are missing", "How evenly the classes are spread across the dataset"], "answer": [1], "explain": "It is measured with the variance inflation factor and helps decide which variables to drop, combine or regularise. Feature to target links are target relationships.", "source": "Week 1 data lecture, slide 22", "flag": "", "deck": "w01b"}, {"id": "w01b-013", "week": 1, "topic": "Tabular EDA", "type": "multi", "q": "A dataset has a rare positive class. Which responses are sensible?", "options": ["Report overall accuracy only because it is the simplest measure", "Use stratified splits so each split keeps the class mix", "Use class weights or resampling", "Judge the model with measures such as F1 or PR-AUC", "Delete the rare class so the classes are balanced"], "answer": [1, 2, 3], "explain": "Imbalance makes accuracy misleading and can hide poor performance on the rare class. Deleting that class removes the very cases you care about.", "source": "Week 1 data lecture, slide 24", "flag": "", "deck": "w01b"}, {"id": "w01b-014", "week": 1, "topic": "Tabular EDA", "type": "single", "q": "A dataset holds daily sales for three years and the aim is to forecast the future. Which split design suits it?", "options": ["A random split that shuffles all days together", "A stratified split that balances classes", "A time-based split where training data comes before test data", "A split that places every year in all three sets"], "answer": [2], "explain": "The split should reflect how the data were generated. Random shuffling would let the model see the future and give overly optimistic results.", "source": "Week 1 data lecture, slide 25", "flag": "", "deck": "w01b"}, {"id": "w01b-015", "week": 1, "topic": "Tabular EDA", "type": "single", "q": "A dataset has many records for each patient. What split avoids an overly optimistic result?", "options": ["A random split that sends records of one patient to every set", "A time split that ignores which patient each record belongs to", "A split that uses only the most common class", "A grouped split that keeps all records of a patient in the same set"], "answer": [3], "explain": "If records of the same patient appear in training and test sets, the model can recognise the person. Grouped entities need grouped splitting.", "source": "Week 1 data lecture, slide 25", "flag": "", "deck": "w01b"}, {"id": "w01b-016", "week": 1, "topic": "Tabular EDA", "type": "multi", "q": "What can a dimensionality check with PCA on standardised data show?", "options": ["Which single feature caused the class label", "Two or three dimensional views for sanity checks", "The exact number of missing values in each row", "Potential for compressing the data", "Axes that are noisy or carry little signal"], "answer": [1, 3, 4], "explain": "PCA shows how variance is concentrated across directions. It does not prove causes and it is not a missingness check.", "source": "Week 1 data lecture, slide 26", "flag": "", "deck": "w01b"}, {"id": "w01b-017", "week": 1, "topic": "Time series", "type": "multi", "q": "Which are key properties of time series data?", "options": ["Possible non-stationarity", "Trends", "Temporal dependence, also called autocorrelation", "Seasonality", "Rows are independent so order never matters"], "answer": [0, 1, 2, 3], "explain": "Order is the defining feature of a time series. Because of this, observations are rarely independent.", "source": "Week 1 data lecture, slide 27", "flag": "", "deck": "w01b"}, {"id": "w01b-018", "week": 1, "topic": "Time series", "type": "single", "q": "A series rises steadily so its average changes over time. What is a suitable remedy before modelling?", "options": ["Differencing or detrending to make the series more stable", "Removing stop words so the series is less dense", "Shuffling the observations to break the order", "Splitting the series with stratified sampling"], "answer": [0], "explain": "A changing mean breaks stationarity. Differencing, detrending or variance-stabilising transforms such as log are the standard remedies.", "source": "Week 1 data lecture, slide 32", "flag": "", "deck": "w01b"}, {"id": "w01b-019", "week": 1, "topic": "Time series", "type": "single", "q": "What does analysing change points help you separate?", "options": ["Seasonal cycles from random sampling error", "Brief spikes from lasting shifts in level", "Training rows from validation rows", "Duplicated timestamps from missing timestamps"], "answer": [1], "explain": "A transient spike may be noise while a persistent level change means the data regime shifted. The two need different modelling responses.", "source": "Week 1 data lecture, slide 34", "flag": "", "deck": "w01b"}, {"id": "w01b-020", "week": 1, "topic": "Text EDA", "type": "single", "q": "Why might stop words be removed in a bag-of-words model?", "options": ["They are rare words that make the vocabulary too small", "They are the words that carry most of the meaning", "They are very frequent and rarely carry task-specific meaning, so removal cuts noise", "They are always spelled in capital letters"], "answer": [2], "explain": "Function words such as the and and dominate counts without telling much about the task. Removing them reduces dimensionality and noise.", "source": "Week 1 data lecture, slide 38", "flag": "", "deck": "w01b"}, {"id": "w01b-021", "week": 1, "topic": "Text EDA", "type": "single", "q": "What caution applies when converting all text to lowercase?", "options": ["It always makes the vocabulary larger and sparser", "It removes every punctuation mark in the text", "It changes the meaning of every word in all cases", "Case can carry meaning in some tasks or languages"], "answer": [3], "explain": "Lowercasing merges variants such as AI and ai, which reduces sparsity. The risk is losing meaning when capitalisation matters.", "source": "Week 1 data lecture, slide 39", "flag": "", "deck": "w01b"}, {"id": "w01b-022", "week": 1, "topic": "Text EDA", "type": "multi", "q": "Which actions belong to careful text cleansing?", "options": ["Masking URLs and mentions", "Normalising Unicode and unescaping HTML", "Collapsing extra whitespace", "Deleting every rare word from the corpus", "Rewriting sentences to improve their grammar"], "answer": [0, 1, 2], "explain": "Cleansing should standardise text without changing its meaning. Rewriting and deleting words change what the text says.", "source": "Week 1 data lecture, slide 40", "flag": "", "deck": "w01b"}, {"id": "w01b-023", "week": 1, "topic": "Text EDA", "type": "single", "q": "Why look at bigrams and trigrams rather than only single words?", "options": ["They capture phrases such as product names and idioms that single words miss", "They shorten every document so that all lengths match", "They remove noise such as URLs and markup tags", "They convert words into numbers in a continuous space"], "answer": [0], "explain": "Multiword expressions carry meaning that unigram counts lose. The last option describes embeddings.", "source": "Week 1 data lecture, slide 44 and 46", "flag": "", "deck": "w01b"}, {"id": "w01b-024", "week": 1, "topic": "Text EDA", "type": "single", "q": "What does projecting documents into a vector space and reducing dimensions help you see?", "options": ["The exact vocabulary size and word frequencies", "Clusters, themes and outliers, plus early signs of how separable the labels are", "The number of empty or malformed documents", "The share of URLs and handles in the text"], "answer": [1], "explain": "Embedding plots show structure in the corpus. Vocabulary counts, empty texts and noise indicators come from other EDA steps.", "source": "Week 1 data lecture, slide 46", "flag": "", "deck": "w01b"}, {"id": "w01b-025", "week": 1, "topic": "Image EDA", "type": "multi", "q": "Which methods can find exact or near-duplicate images that might leak across splits?", "options": ["Perceptual hashes for near copies", "Raising the resolution of every image", "Embedding similarity between images", "Cryptographic hashes for exact copies", "Comparing per-channel means only"], "answer": [0, 2, 3], "explain": "Duplicates across training and test sets inflate results because the model has seen the same picture. Hashes and embeddings detect them.", "source": "Week 1 data lecture, slide 52", "flag": "", "deck": "w01b"}, {"id": "w01b-026", "week": 1, "topic": "What EDA is", "type": "explain", "q": "Explain what exploratory data analysis is and why it is done before modelling.", "model": "Exploratory data analysis is the structured process of profiling, summarising and visualising data to understand its content, quality, patterns, relationships and anomalies. It uses simple statistics such as counts, means and correlations together with plots such as histograms and scatter plots. It is done before modelling because it exposes problems like missing values, outliers and leakage early. It also shows distributions and imbalance, and it guides model choice and a realistic baseline.", "points": ["Defined as profiling, summarising and visualising data", "Combines simple statistics with plots", "Checks data quality such as missing values and outliers", "Informs model choice, baselines and bias detection"], "source": "Week 1 data lecture, slide 12 and 13", "flag": "", "deck": "w01b"}, {"id": "w01b-027", "week": 1, "topic": "Research pipeline", "type": "explain", "q": "Describe the stages of the AI research pipeline.", "model": "The pipeline starts with problem formulation, where objectives and research questions are defined. Next comes data collection and preprocessing, which establishes reliability and ethics. Model development follows, with algorithm selection and a justification for the choice. Evaluation and validation then use cross-validation, statistical tests and benchmark comparison. The last stage is knowledge contribution, meaning new methods, insights or applications. The module focus is on the data stages.", "points": ["Problem formulation defines objectives and questions", "Data collection and preprocessing covers reliability and ethics", "Model development involves choosing and justifying an algorithm", "Evaluation and validation, then knowledge contribution"], "source": "Week 1 data lecture, slide 10", "flag": "", "deck": "w01b"}, {"id": "w01b-028", "week": 1, "topic": "AI as science", "type": "explain", "q": "Explain how AI research follows the scientific method.", "model": "AI research starts with observation of a real world problem such as air quality or medical diagnosis. The researcher forms a hypothesis by proposing an algorithmic or modelling approach. Experimentation then tests it with controlled tests on datasets. Results are analysed with quantitative metrics. The conclusion refines the models, generalises the findings and publishes them. As in traditional science, reproducibility and peer review are emphasised.", "points": ["Observation of a real problem", "Hypothesis proposes an approach and experimentation tests it", "Analysis uses quantitative metrics", "Conclusion and publication with reproducibility and peer review"], "source": "Week 1 data lecture, slide 9", "flag": "", "deck": "w01b"}, {"id": "w01b-029", "week": 1, "topic": "Tabular EDA", "type": "explain", "q": "Describe how missing values and outliers are investigated in tabular data and what decisions the checks inform.", "model": "For missing values you measure where data are missing, how much, and whether gaps occur together or relate to the outcome. This shows which columns need imputing or dropping and warns of possible bias. For outliers you use robust rules such as the interquartile range and then inspect the flagged rows. The aim is to separate data entry errors from true extremes. Errors are fixed or removed, while real extremes lead to capping, transforming or choosing a model that copes with them.", "points": ["Missingness is measured by column, proportion and pattern", "It informs imputation or dropping and flags bias", "Outliers are found with robust rules and then inspected", "Errors are separated from legitimate extremes before deciding what to do"], "source": "Week 1 data lecture, slide 17 and 19", "flag": "", "deck": "w01b"}, {"id": "w01b-030", "week": 1, "topic": "Tabular EDA", "type": "explain", "q": "Explain why the way data is split into training, validation and test sets must reflect how the data were generated. Give one example.", "model": "The test set should give an honest estimate of how the model performs on new data. If the split ignores how the data arose, information leaks and results look better than they really are. For independent rows a random or stratified split is fine. For data over time a time-based split keeps the past in training and the future in testing. When several records belong to the same person or group, they must stay together in one set.", "points": ["Splits must allow honest estimates of generalisation", "Wrong splits cause optimistic bias", "Random or stratified for independent rows", "A correct example such as time-based or grouped splits"], "source": "Week 1 data lecture, slide 25", "flag": "", "deck": "w01b"}, {"id": "w01b-031", "week": 1, "topic": "Tabular EDA", "type": "explain", "q": "Explain what class imbalance is, why it matters and how EDA helps you respond.", "model": "Class imbalance means some classes or target regions occur much less often than others. It matters because a model can score high overall accuracy by favouring the common class while missing the rare one. EDA checks the class proportions early. If imbalance is found you can use stratified splits so each set keeps the mix, choose metrics such as F1 or PR-AUC, and apply class weights or resampling.", "points": ["Defines imbalance as unequal class frequencies", "Accuracy can hide poor performance on the rare class", "Checked by looking at class proportions", "Responses include stratified splits, better metrics, weights or resampling"], "source": "Week 1 data lecture, slide 24", "flag": "", "deck": "w01b"}, {"id": "w01b-032", "week": 1, "topic": "Time series", "type": "explain", "q": "Describe the key properties of time series data and explain why stationarity is checked.", "model": "A time series is a set of observations indexed by time and kept in order. The spacing can be regular or irregular and there may be one variable or several. Key properties are temporal dependence, which is autocorrelation, trends, seasonality and possible non-stationarity. Stationarity means the mean, variance and autocovariance stay stable over time. It is checked because trends or changing variance can break many models, and differencing, detrending or log transforms can remedy this.", "points": ["Observations are ordered in time", "Names properties such as autocorrelation, trend and seasonality", "Stationarity means stable mean, variance and autocovariance", "Remedies such as differencing, detrending or transforms"], "source": "Week 1 data lecture, slide 27 and 32", "flag": "", "deck": "w01b"}, {"id": "w01b-033", "week": 1, "topic": "Text EDA", "type": "explain", "q": "Explain stop-word removal, case normalisation and text cleansing, including a caution for each.", "model": "Stop word removal drops very common function words such as the and and, which cuts noise and dimensionality in bag of words models. Case normalisation usually lowercases text so variants like AI and ai merge, which reduces sparsity, but case can carry meaning in some tasks. Text cleansing standardises text by normalising Unicode, unescaping HTML, masking URLs and collapsing whitespace. It should be minimally invasive so that informative tokens and meaning are kept.", "points": ["Stop words are frequent words removed to reduce noise", "Case normalisation merges variants but may lose meaning", "Cleansing standardises text through steps such as masking URLs", "Cleaning should preserve meaning"], "source": "Week 1 data lecture, slide 38 to 40", "flag": "", "deck": "w01b"}, {"id": "w01b-034", "week": 1, "topic": "Image EDA", "type": "explain", "q": "Describe the main checks made when exploring image data and explain why duplicates are a problem.", "model": "An image is an array of pixel values with spatial dimensions and one or more channels. EDA profiles resolution and aspect ratio to set target shapes and padding rules. It also checks channel statistics such as means, ranges and colour space, which guide normalisation and can reveal greyscale stored as colour. Quality checks look for blur, over or under exposure and corrupt files. Duplicates matter because the same or near identical image in both training and test sets leaks information and inflates results.", "points": ["Images are pixel arrays with dimensions and channels", "Resolution and aspect ratio profiling", "Intensity and channel statistics and quality checks such as blur", "Duplicates across splits cause leakage and optimistic results"], "source": "Week 1 data lecture, slide 47 to 52", "flag": "", "deck": "w01b"}, {"id": "w01b-035", "week": 1, "topic": "Data modalities", "type": "explain", "q": "Name the main data modalities and give one thing you would profile for each.", "model": "Tabular data has rows as entities and columns as features, so you check types, duplicates and missing values. Time series data is ordered, so you look at autocorrelation and seasonality. Text is profiled through tokenisation, vocabulary and length statistics. Images are profiled by shape, aspect ratio and channels. Audio is profiled by sampling rate, duration and spectrograms. Video adds frame rate, resolution and colour depth. Each modality needs its own EDA workflow.", "points": ["Lists at least four modalities correctly", "Gives a suitable profiling item for tabular and time series", "Gives suitable items for text, image or audio", "Notes that each modality needs its own EDA workflow"], "source": "Week 1 data lecture, slide 11", "flag": "", "deck": "w01b"}, {"id": "w02-001", "week": 2, "topic": "Machine learning basics", "type": "single", "q": "How does a machine learning system differ from a program built on hand-crafted rules?", "options": ["It learns patterns from data, usually historical, instead of following rules a person wrote", "It follows fixed rules but runs them much faster than a person could", "It stores every past example and replays the matching answer", "It needs a person to write a new rule for every case"], "answer": [0], "explain": "Machine learning improves performance on a task by learning from data. Hand-written rules are exactly what it tries to avoid.", "source": "Week 2 lecture, slide 3", "flag": "", "deck": "w02"}, {"id": "w02-002", "week": 2, "topic": "Machine learning basics", "type": "single", "q": "An agent learns to play a game by trying moves and receiving rewards or penalties. Which paradigm is this?", "options": ["Supervised learning", "Reinforcement learning", "Unsupervised learning", "Rule-based programming"], "answer": [1], "explain": "Reinforcement learning is trial and error guided by rewards. Supervised learning needs labelled examples and unsupervised learning looks for structure.", "source": "Week 2 lecture, slide 3", "flag": "", "deck": "w02"}, {"id": "w02-003", "week": 2, "topic": "Machine learning basics", "type": "multi", "q": "Which of the following are core building blocks of a machine learning approach?", "options": ["A written list of rules covering every possible case", "A guarantee that the training data is free of bias", "Evaluation that checks how well the model generalises", "An objective or loss that says what is being optimised", "An optimisation method that fits the model"], "answer": [2, 3, 4], "explain": "The building blocks are data, a model family, a loss, optimisation and evaluation. Data quality, bias and leakage still need care and are never guaranteed.", "source": "Week 2 lecture, slide 4", "flag": "", "deck": "w02"}, {"id": "w02-004", "week": 2, "topic": "Why ML", "type": "single", "q": "Spammers and fraudsters keep changing their behaviour. Why does machine learning cope better than fixed rules?", "options": ["Fixed rules cannot be changed once they are written", "The model never needs fresh data after the first training", "The model can be retrained on new data without rewriting the logic", "The model replaces data quality checks with probabilities"], "answer": [2], "explain": "Concept drift means behaviour changes over time, and retraining adapts the model. Rules can be edited but a growing rule set becomes unmanageable.", "source": "Week 2 lecture, slide 5", "flag": "", "deck": "w02"}, {"id": "w02-005", "week": 2, "topic": "Why ML", "type": "multi", "q": "In which situations is a simple rule or a verified algorithm better than machine learning?", "options": ["Having very little data of poor quality", "Needing clear, auditable reasons for each decision", "Calculating a drug dose where errors are unacceptable", "Calculating tax bands that follow exact written rules", "Spotting complex fraud patterns in huge amounts of data", "Adapting to customers whose behaviour keeps changing"], "answer": [0, 1, 2, 3], "explain": "Deterministic logic, safety critical use, tiny data and a need for transparency all favour rules. Complex patterns and changing data are where machine learning helps.", "source": "Week 2 lecture, slide 5 and 7", "flag": "", "deck": "w02"}, {"id": "w02-006", "week": 2, "topic": "Supervised learning", "type": "single", "q": "A bank wants to predict whether a new applicant will default within 12 months. What kind of task is it?", "options": ["Regression, because default is a risk score", "Regression, because applicants are numbered", "Clustering, because applicants form natural groups", "Classification, because the outcome is a category"], "answer": [3], "explain": "Default or no default is a discrete class. Regression predicts a continuous value such as a price or a time.", "source": "Week 2 lecture, slide 12 and 14", "flag": "", "deck": "w02"}, {"id": "w02-007", "week": 2, "topic": "Supervised learning", "type": "multi", "q": "Which of the following are classification tasks?", "options": ["Predicting wheat yield in tonnes per hectare", "Forecasting a journey time in minutes", "Deciding from a chest X-ray whether pneumonia is present", "Placing each customer in new, active or churn-risk", "Identifying a dog's breed from a photo"], "answer": [2, 3, 4], "explain": "Classification predicts discrete classes. Yield and journey time are continuous numbers, which makes them regression.", "source": "Week 2 lecture, slide 14", "flag": "", "deck": "w02"}, {"id": "w02-008", "week": 2, "topic": "Supervised learning", "type": "single", "q": "Which of the following is a regression task?", "options": ["Forecasting travel time in minutes for tomorrow morning", "Deciding whether an email is spam", "Deciding whether a customer will leave", "Choosing a flower species from measurements"], "answer": [0], "explain": "Regression returns a numeric estimate of a continuous value. The other three produce a category.", "source": "Week 2 lecture, slide 12 and 14", "flag": "", "deck": "w02"}, {"id": "w02-009", "week": 2, "topic": "Classification", "type": "single", "q": "A classifier outputs a probability for each class. How is this turned into a final label?", "options": ["The model always picks the class seen most often in training", "A threshold is chosen, balancing the real-world costs of false positives and false negatives", "The probabilities are averaged over all the training examples", "A person reviews every prediction and picks the label"], "answer": [1], "explain": "The threshold is a decision made after the model. Moving it trades false alarms against missed cases.", "source": "Week 2 lecture, slide 16", "flag": "", "deck": "w02"}, {"id": "w02-010", "week": 2, "topic": "Evaluation", "type": "single", "q": "A fraud team has few investigators and wants most of its flagged cases to be real fraud. Which measure should it watch most closely?", "options": ["Recall", "Mean squared error", "Precision", "Number of features"], "answer": [2], "explain": "Precision asks how many predicted positives are truly positive, so it matters when false positives are costly. Recall focuses on missed positives instead.", "source": "Week 2 lecture, slide 24", "flag": "", "deck": "w02"}, {"id": "w02-011", "week": 2, "topic": "Evaluation", "type": "single", "q": "A hospital screening test must catch as many ill patients as possible, even at the cost of extra checks. Which measure matters most?", "options": ["Precision", "Accuracy", "Specificity", "Recall"], "answer": [3], "explain": "Recall is the share of actual positives that were caught, so it matters when missing a case is costly. Specificity concerns healthy people correctly cleared.", "source": "Week 2 lecture, slide 24 and 25", "flag": "", "deck": "w02"}, {"id": "w02-012", "week": 2, "topic": "Evaluation", "type": "single", "q": "A model on a heavily imbalanced dataset always predicts the majority class. What will its accuracy look like?", "options": ["High, even though it never finds a single positive case", "Low, because it ignores half of the classes", "Zero, because it never predicts the positive class", "Equal to its recall on the positive class"], "answer": [0], "explain": "Accuracy counts all correct predictions, and the majority class makes up most of them. This is why accuracy can mislead and measures such as F1 are preferred.", "source": "Week 2 lecture, slide 24", "flag": "", "deck": "w02"}, {"id": "w02-013", "week": 2, "topic": "Evaluation", "type": "multi", "q": "Which statements about the confusion matrix are correct?", "options": ["Precision and recall are derived from its four counts", "It applies only to regression problems", "It counts correct and incorrect predictions for each class", "It records true negatives, which are correctly rejected cases", "It records false negatives, which are missed positives"], "answer": [0, 2, 3, 4], "explain": "The matrix holds true positives, false positives, true negatives and false negatives. It is a classification tool, so the regression option is wrong.", "source": "Week 2 lecture, slide 23", "flag": "", "deck": "w02"}, {"id": "w02-014", "week": 2, "topic": "Evaluation", "type": "single", "q": "What does the F1 score combine?", "options": ["Accuracy and specificity, using the arithmetic mean", "Precision and recall, using the harmonic mean", "Precision and the number of classes, using the mode", "Recall and training loss, using the harmonic mean"], "answer": [1], "explain": "F1 gives one balanced number from precision and recall. It is useful when classes are imbalanced.", "source": "Week 2 lecture, slide 24", "flag": "", "deck": "w02"}, {"id": "w02-015", "week": 2, "topic": "Evaluation", "type": "single", "q": "What does an ROC curve plot as the decision threshold is varied?", "options": ["Precision against the number of training examples", "Accuracy against the number of neighbours used", "The true positive rate against the false positive rate", "Training loss against the number of passes over the data"], "answer": [2], "explain": "Each point on the curve is one threshold, and AUC summarises how well the model ranks positives above negatives.", "source": "Week 2 lecture, slide 25", "flag": "", "deck": "w02"}, {"id": "w02-016", "week": 2, "topic": "Algorithms", "type": "multi", "q": "Which of the following correctly pair a classification algorithm with its description?", "options": ["Support vector machines with a single tree of if then rules", "Logistic regression with a linear classifier using a logistic function", "Naive Bayes with a probabilistic method assuming independent features", "k-NN with a model fitted fully before any prediction is made", "Random forest with a bagged group of trees that reduces variance"], "answer": [1, 2, 4], "explain": "Decision trees give if then rules and support vector machines use the kernel trick. k-NN does very little work until it is asked to predict.", "source": "Week 2 lecture, slide 26 and 35", "flag": "", "deck": "w02"}, {"id": "w02-017", "week": 2, "topic": "K-nearest neighbours", "type": "single", "q": "Why can the same new point be given a different class when k is changed?", "options": ["The distance measure changes whenever k changes", "The training labels are rewritten for each new value of k", "The model is retrained from scratch for every value of k", "A different set of neighbours is counted, so the majority vote can change"], "answer": [3], "explain": "The neighbours counted at each k differ, so the majority may differ. The labels and the distance measure stay the same.", "source": "Week 2 lecture, slide 31 to 34", "flag": "", "deck": "w02"}, {"id": "w02-018", "week": 2, "topic": "K-nearest neighbours", "type": "single", "q": "k-NN is called a lazy learner. What does this mean?", "options": ["It does little work in training and does most of its work when asked to predict", "It learns very slowly and needs many passes over the data", "It ignores some training examples to save effort", "It makes predictions without comparing to any examples"], "answer": [0], "explain": "There is no real training phase, which suits real-time use. The cost appears at prediction time when distances are computed.", "source": "Week 2 lecture, slide 35", "flag": "", "deck": "w02"}, {"id": "w02-019", "week": 2, "topic": "K-nearest neighbours", "type": "single", "q": "How does k-NN give a prediction for regression instead of classification?", "options": ["It takes a majority vote among the k nearest neighbours", "It averages the values of the k nearest neighbours", "It fits a straight line through all the training points", "It picks the single furthest neighbour as the answer"], "answer": [1], "explain": "Classification uses a vote, and regression uses an average of neighbour values. Both use the nearest points.", "source": "Week 2 lecture, slide 36", "flag": "", "deck": "w02"}, {"id": "w02-020", "week": 2, "topic": "K-nearest neighbours", "type": "single", "q": "A k-NN model uses age in years and income in pounds, left unscaled. What is the likely effect?", "options": ["Age dominates the distance, because it is the smaller number", "Both features count equally, because distance ignores units", "Income dominates the distance, so age has little influence on which points are nearest", "The model cannot be fitted until the features are scaled"], "answer": [2], "explain": "Distance is driven by the feature with the largest numeric range. Scaling puts features on a comparable footing.", "source": "Week 2 lecture, slide 36 and 39", "flag": "The slides state that k-NN is sensitive to irrelevant features and the Week 1 slides mention scaling for distance models. The unscaled income example is standard textbook knowledge.", "deck": "w02"}, {"id": "w02-021", "week": 2, "topic": "K-nearest neighbours", "type": "multi", "q": "Which of the following are drawbacks of k-NN?", "options": ["It must assume the data follow a normal distribution", "High memory and computation cost on large datasets", "Performance depends heavily on the choice of k", "It can only be used for classification", "Sensitivity to irrelevant features and noise"], "answer": [1, 2, 4], "explain": "k-NN works for classification and regression, and it is non-parametric, so it assumes no particular data distribution.", "source": "Week 2 lecture, slide 35 and 39", "flag": "", "deck": "w02"}, {"id": "w02-022", "week": 2, "topic": "K-nearest neighbours", "type": "single", "q": "How should the best value of k be chosen?", "options": ["Always use k equal to one, because it matches the closest point", "Use the value that gives the best result on the training data", "Pick the value that makes the number of votes even", "Compare several values on validation data, optionally with cross-validation, and keep the best"], "answer": [3], "explain": "Using validation data shows how each k performs on unseen examples. Judging on training data would favour k equal to one, which memorises the training set.", "source": "Week 2 lecture, slide 37", "flag": "", "deck": "w02"}, {"id": "w02-023", "week": 2, "topic": "Decision trees", "type": "single", "q": "What does Gini impurity measure in a node of a decision tree?", "options": ["How mixed the classes are, where zero means all samples share one class", "How many features are left to split on", "How deep the node sits in the tree", "How many samples the node contains"], "answer": [0], "explain": "It is the chance of mislabelling a random sample if labelled by the node's class mix. A pure node has an impurity of zero.", "source": "Week 2 lecture, slide 42", "flag": "", "deck": "w02"}, {"id": "w02-024", "week": 2, "topic": "Decision trees", "type": "single", "q": "At the root, a tree finds that splitting on Windy gives purer child nodes than splitting on Outlook. Which does it choose?", "options": ["Outlook, because it has more possible values", "Windy, because it gives the larger reduction in impurity", "Outlook, because it always comes first in the table", "Windy, because binary features are always chosen first"], "answer": [1], "explain": "The tree tries each split and keeps the one with the greatest gain, meaning the largest drop in weighted impurity. The number of values does not decide this.", "source": "Week 2 lecture, slide 44", "flag": "", "deck": "w02"}, {"id": "w02-025", "week": 2, "topic": "Decision trees", "type": "multi", "q": "Which of the following are valid reasons for a decision tree to stop splitting?", "options": ["The training data has been shuffled", "The k nearest neighbours agree", "No features remain to split on", "A maximum depth has been reached", "The node is pure", "A minimum number of samples has been reached"], "answer": [2, 3, 4, 5], "explain": "Stopping rules are purity, no features left or limits such as depth and sample size. The other options are unrelated to tree growth.", "source": "Week 2 lecture, slide 46", "flag": "", "deck": "w02"}, {"id": "w02-026", "week": 2, "topic": "Decision trees", "type": "single", "q": "A leaf contains more Yes examples than No examples but is not pure. What does the tree predict for a new case that reaches it?", "options": ["No prediction, because only pure leaves can predict", "The minority class, to be cautious about the majority", "The majority class, with a probability estimated from the leaf's class mix", "A class chosen at random from the examples in the leaf"], "answer": [2], "explain": "An impure leaf still predicts its majority class, and the share of that class gives an estimated probability.", "source": "Week 2 lecture, slide 45 to 47", "flag": "", "deck": "w02"}, {"id": "w02-027", "week": 2, "topic": "Machine learning basics", "type": "explain", "q": "Define machine learning and distinguish supervised, unsupervised and reinforcement learning.", "model": "Machine learning is a branch of AI where systems learn patterns from data, usually historical data, to improve at a task instead of relying on hand-crafted rules. In supervised learning the model learns from labelled examples. In unsupervised learning there are no labels and the aim is to find structure in the data. In reinforcement learning an agent learns by trial and error, guided by rewards.", "points": ["Learns patterns from data and not from hand-crafted rules", "Supervised uses labelled examples", "Unsupervised discovers structure without labels", "Reinforcement uses trial and error with rewards"], "source": "Week 2 lecture, slide 3", "flag": "", "deck": "w02"}, {"id": "w02-028", "week": 2, "topic": "Why ML", "type": "explain", "q": "Explain why machine learning is sometimes better than rule-based approaches, and describe when it should not be used.", "model": "Machine learning is better when patterns are complex, there are many edge cases, data changes over time or inputs are noisy. It can capture nonlinear interactions and be retrained as behaviour drifts instead of rewriting rules. It should not be used with tiny or poor data, where it will overfit. It is also unsuitable when exact rules exist, in safety critical work where errors are unacceptable, and when clear auditable reasoning is required.", "points": ["Complex patterns, many edge cases or changing data favour ML", "Retraining adapts to concept drift", "Tiny or poor data causes overfitting", "Deterministic, safety critical or transparent needs favour rules"], "source": "Week 2 lecture, slide 5 and 7", "flag": "", "deck": "w02"}, {"id": "w02-029", "week": 2, "topic": "Supervised learning", "type": "explain", "q": "Explain supervised learning, including features and labels, and give one example each of classification and regression.", "model": "Supervised learning trains a model on labelled historical data so it can predict outcomes for new, unseen cases. The data hold input features, also called predictors or independent variables, and an output label, also called the target or dependent variable. In classification the label is a discrete class, for example predicting whether an email is spam. In regression the label is a continuous number, for example predicting the price of a house.", "points": ["Learns from labelled examples to predict unseen cases", "Features are inputs and the label is the target", "Classification predicts a category with a valid example", "Regression predicts a continuous value with a valid example"], "source": "Week 2 lecture, slide 10 to 14", "flag": "", "deck": "w02"}, {"id": "w02-030", "week": 2, "topic": "Classification", "type": "explain", "q": "Explain how a classification model turns its output into a decision and why the threshold matters.", "model": "A classification model learns patterns that separate the categories and outputs a probability for each class. To get a final label, a threshold is applied to those probabilities. The threshold is chosen to balance the real-world costs of mistakes. Lowering it catches more positives but raises false positives. Raising it does the opposite, so the choice depends on whether false alarms or missed cases are more costly.", "points": ["Model outputs probabilities for each class", "A threshold converts probabilities to labels", "Threshold balances costs of false positives and false negatives", "Describes the effect of raising or lowering it"], "source": "Week 2 lecture, slide 16", "flag": "", "deck": "w02"}, {"id": "w02-031", "week": 2, "topic": "Evaluation", "type": "explain", "q": "Compare precision and recall and say when each matters most.", "model": "Precision asks, of the items predicted positive, how many are truly positive. It matters when false positives are costly, for example fraud investigations where staff time is limited. Recall asks, of all the real positives, how many were caught. It matters when missing a positive is costly, for example disease screening. The F1 score combines the two when a balance is needed.", "points": ["Precision is the share of predicted positives that are correct", "Recall is the share of actual positives that were found", "Precision matters when false positives are costly with an example", "Recall matters when false negatives are costly with an example"], "source": "Week 2 lecture, slide 24", "flag": "", "deck": "w02"}, {"id": "w02-032", "week": 2, "topic": "Evaluation", "type": "explain", "q": "Explain why accuracy can be misleading on imbalanced data and what you could use instead.", "model": "Accuracy is the share of all predictions that are correct. When one class is far more common, a model can predict that class every time and still score high accuracy while finding none of the rare cases. This hides poor performance on the class that usually matters. Better choices are precision, recall and the F1 score, and the confusion matrix shows where the mistakes fall.", "points": ["Accuracy counts all correct predictions", "A majority class guesser can look accurate", "It hides failure on the rare class", "Suggests precision, recall, F1 or the confusion matrix"], "source": "Week 2 lecture, slide 23 and 24", "flag": "", "deck": "w02"}, {"id": "w02-033", "week": 2, "topic": "K-nearest neighbours", "type": "explain", "q": "Describe how k-NN classifies a new data point and explain why it is called lazy and non-parametric.", "model": "To classify a new point, k-NN chooses a value for k and measures the distance from the new point to the training points, for example with Euclidean distance. It takes the k nearest points and uses a majority vote of their classes. It is called lazy because it does little work during training and does most of its work at prediction time. It is non-parametric because it does not assume any underlying data distribution.", "points": ["Choose k and measure distances to training points", "Uses a majority vote of the k nearest neighbours", "Lazy means little training and most work at prediction", "Non-parametric means no assumed data distribution"], "source": "Week 2 lecture, slide 35 and 36", "flag": "", "deck": "w02"}, {"id": "w02-034", "week": 2, "topic": "K-nearest neighbours", "type": "explain", "q": "Explain how you would choose a good value of k for a k-NN model.", "model": "The value of k strongly affects performance, so it should be chosen with evidence. Split the data into training and validation sets. Try several values of k, perhaps around an initial estimate. Measure each with a suitable performance metric on the validation data. Choose the value that performs best, and use cross-validation if you want a more reliable comparison. Judging on the training data alone would be misleading because it does not show how the model copes with unseen cases.", "points": ["Performance depends heavily on k", "Use training and validation sets", "Compare several values with a metric", "Pick the best and optionally use cross-validation"], "source": "Week 2 lecture, slide 37 and 39", "flag": "", "deck": "w02"}, {"id": "w02-035", "week": 2, "topic": "Decision trees", "type": "explain", "q": "Explain how a decision tree decides which feature to split on.", "model": "A decision tree tries each possible split at a node and measures how pure the resulting child nodes are. Gini impurity shows how mixed the classes in a node are, and zero means all samples share one class. The tree calculates the weighted impurity of the children and compares it with the parent. The split with the largest drop, called the gain, is chosen. The same process then repeats on each child node.", "points": ["Tries each possible split", "Gini impurity measures how mixed a node is", "Compares weighted child impurity with the parent to find the gain", "Picks the split with the largest gain and repeats on the children"], "source": "Week 2 lecture, slide 42 to 45", "flag": "", "deck": "w02"}, {"id": "w02-036", "week": 2, "topic": "Decision trees", "type": "explain", "q": "Describe when a decision tree stops growing and how it makes a prediction for a new case.", "model": "A tree stops splitting when nodes are pure, when no features remain, or when limits such as minimum samples or maximum depth are reached. To predict, a new case
