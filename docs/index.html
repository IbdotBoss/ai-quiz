starts at the root and follows the branch matching each feature value until it reaches a leaf. The leaf gives the predicted class, which is the majority class there. An impure leaf also gives an estimated probability based on its class mix. For example, a leaf holding mostly Yes examples predicts Yes with a probability that reflects how many of its examples were Yes.", "points": ["Stops when nodes are pure, features run out or limits are met", "New case follows branches from the root to a leaf", "Leaf predicts the majority class", "Impure leaf gives an estimated probability"], "source": "Week 2 lecture, slide 46 and 47", "flag": "", "deck": "w02"}, {"id": "w03-001", "week": 3, "topic": "Regression or classification", "type": "single", "q": "A utility company wants to estimate tomorrow's electricity use in kilowatt hours from the weather forecast. What kind of supervised task is this?", "options": ["Regression, because the target is a continuous numeric value", "Classification, because the answer falls into high, medium or low use", "Classification, because weather inputs are grouped into categories", "Clustering, because no labelled examples are needed for this task"], "answer": [0], "explain": "The target is a number on a continuous scale, so this is regression. Classification would only fit if the company chose to predict a category such as high or low use.", "source": "Week 3 lecture, slide 7 and 12", "flag": "", "deck": "w03"}, {"id": "w03-002", "week": 3, "topic": "Regression or classification", "type": "single", "q": "Which of these tasks is a classification problem rather than a regression problem?", "options": ["Forecasting the travel time in minutes for a journey tomorrow", "Deciding from a chest X-ray whether a patient has pneumonia", "Predicting wheat yield in tonnes per hectare from soil and weather", "Predicting how many support tickets will be raised tomorrow"], "answer": [1], "explain": "Pneumonia or no pneumonia is a discrete class. The other three predict numeric quantities, and a count of tickets is still treated as a numeric target.", "source": "Week 3 lecture, slide 9", "flag": "", "deck": "w03"}, {"id": "w03-003", "week": 3, "topic": "Labelled data", "type": "multi", "q": "Which statements about the labelled data used in supervised learning are correct?", "options": ["The model learns from the features alone and never sees the labels", "Labelled data is only needed after training to hide the true answers", "The label is the input that the model reads in order to make a prediction", "The output label is also called the dependent variable or target", "Input features are also called independent variables or predictors"], "answer": [3, 4], "explain": "Features are the inputs and the label is the known output the model learns to predict. The wrong options swap these roles or claim the labels are not used during learning.", "source": "Week 3 lecture, slide 6", "flag": "", "deck": "w03"}, {"id": "w03-004", "week": 3, "topic": "Regression or classification", "type": "single", "q": "Is the following statement correct?\n\"Regression returns class probabilities, and a threshold is then chosen to decide the label.\"", "options": ["Correct, because every supervised model returns class probabilities first", "Incorrect, because regression does not return any numeric estimate at all", "Incorrect, because that describes classification and regression returns a numeric estimate", "Incorrect, because thresholds are used only in unsupervised clustering"], "answer": [2], "explain": "Class probabilities and thresholds belong to classification. Regression gives a number such as a price or a temperature directly.", "source": "Week 3 lecture, slide 7", "flag": "", "deck": "w03"}, {"id": "w03-005", "week": 3, "topic": "Evaluation metrics", "type": "single", "q": "A regression model makes mostly small errors but a few very large ones. Which metric will react most strongly to those few large errors?", "options": ["Mean absolute error, because it squares each error before averaging", "Mean absolute error, because it adds extra weight to the largest errors", "R-squared, because it is measured in the units of the target variable", "Mean squared error, because squaring penalises larger mistakes more heavily"], "answer": [3], "explain": "Squaring makes a large error count far more than a small one, so mean squared error is pulled up by outliers. Mean absolute error treats every unit of error equally and is less sensitive.", "source": "Week 3 lecture, slide 19 and 20", "flag": "", "deck": "w03"}, {"id": "w03-006", "week": 3, "topic": "Evaluation metrics", "type": "single", "q": "Why is root mean squared error often easier to explain to a client than mean squared error?", "options": ["It is on the same scale as the target, so it is in the same units", "It ignores outliers completely, so it gives a steadier figure", "It always lies between zero and one, which makes it easy to compare", "It measures how much variance in the target the model explains"], "answer": [0], "explain": "Taking the square root undoes the squaring and brings the error back to the units of the target. It still reacts strongly to outliers, so the option about ignoring them fails.", "source": "Week 3 lecture, slide 21", "flag": "", "deck": "w03"}, {"id": "w03-007", "week": 3, "topic": "Evaluation metrics", "type": "single", "q": "A model has an R-squared of 0. What does this tell you about it?", "options": ["It predicts every value perfectly, with no error at all", "It predicts no better than simply always predicting the mean of the actual values", "It explains all of the variance in the target variable", "It is worse than the baseline of predicting the mean"], "answer": [1], "explain": "A value of 1 is a perfect fit and 0 means the model adds nothing over predicting the mean. Only a value below 0 means it is worse than that baseline.", "source": "Week 3 lecture, slide 22", "flag": "", "deck": "w03"}, {"id": "w03-008", "week": 3, "topic": "Evaluation metrics", "type": "single", "q": "A model gets a negative R-squared on test data. What is the most sensible conclusion?", "options": ["The model is a perfect fit and the negative sign is a display quirk", "The model explains a negative amount of noise, which is a good sign", "The model is doing worse than a baseline that always predicts the mean", "The model has been scored with the wrong unit for the target"], "answer": [2], "explain": "R-squared below 0 means the model is worse than the mean baseline. It is a warning that the model is poor, not a sign of a good fit.", "source": "Week 3 lecture, slide 22", "flag": "", "deck": "w03"}, {"id": "w03-009", "week": 3, "topic": "Evaluation metrics", "type": "multi", "q": "Which of these are used to evaluate a regression model?", "options": ["Silhouette score", "Mean squared error", "R-squared", "Root mean squared error", "Mean absolute error"], "answer": [1, 2, 3, 4], "explain": "The four regression metrics all compare predictions with actual values. Silhouette score is a clustering measure and belongs to a different week.", "source": "Week 3 lecture, slide 18", "flag": "", "deck": "w03"}, {"id": "w03-010", "week": 3, "topic": "Linear regression", "type": "single", "q": "What does ordinary least squares choose when it fits a linear regression model?", "options": ["The coefficients that make the largest single prediction error equal to zero", "The coefficients that split the data into the most similar groups", "The coefficients that make the predictions average out to the target mean", "The coefficients that make the sum of squared prediction errors as small as possible"], "answer": [3], "explain": "Ordinary least squares picks the line whose predictions are closest to the data, where closeness means the smallest sum of squared residuals. It does not group data or fix one error to zero.", "source": "Week 3 lecture, slide 26 and 27", "flag": "", "deck": "w03"}, {"id": "w03-011", "week": 3, "topic": "Choosing a model", "type": "single", "q": "A regulator asks a team to show how each input changes the predicted price, using clear coefficients. Which model suits this best?", "options": ["Linear regression, because it gives interpretable coefficients", "Random forest regression, because averaging many trees shows each coefficient", "Gradient boosting, because sequential trees give one coefficient per input", "Support vector regression, because it always gives the simplest explanation"], "answer": [0], "explain": "Linear regression is the model used when interpretability matters and the relationship is roughly linear. Tree ensembles are accurate but do not produce simple coefficients.", "source": "Week 3 lecture, slide 16 and 23", "flag": "", "deck": "w03"}, {"id": "w03-012", "week": 3, "topic": "Random forest", "type": "single", "q": "How does a random forest regression model produce its final prediction for one case?", "options": ["It picks the prediction of the single tree that scored best in training", "It averages the numbers predicted by all of its decision trees", "It lets the trees vote on a class and returns the most common class", "It adds the predictions of the trees together to get one large total"], "answer": [1], "explain": "Each tree predicts a number and the forest returns their average. Voting is for classification, and adding without dividing would make the answer grow with the number of trees.", "source": "Week 3 lecture, slide 30 to 32", "flag": "", "deck": "w03"}, {"id": "w03-013", "week": 3, "topic": "Random forest", "type": "single", "q": "Why is a random forest usually more stable than one decision tree?", "options": ["Each tree sees the whole dataset, so all trees agree and errors vanish", "The trees are built one after another, each one fixing the last tree", "Averaging many slightly different trees smooths out the mistakes of any one tree", "The forest removes outliers from the data before any tree is built"], "answer": [2], "explain": "The trees are built on random rows and features, so they differ, and averaging evens out their individual errors. Building trees one after another to fix errors describes boosting instead.", "source": "Week 3 lecture, slide 23 and 30", "flag": "", "deck": "w03"}, {"id": "w03-014", "week": 3, "topic": "Random forest", "type": "multi", "q": "Which statements describe how a random forest regression model is built and used?", "options": ["The final prediction is the average of the tree predictions", "It is an ensemble of many decision tree regressors", "Each tree is built to correct the errors of the tree before it", "It handles non-linear data well and is robust to outliers", "Each tree is trained on random variations of the rows and features"], "answer": [0, 1, 3, 4], "explain": "The first four are the defining ideas of a random forest. Correcting the previous tree is the idea behind gradient boosting, so that option is wrong.", "source": "Week 3 lecture, slide 23 and 30", "flag": "", "deck": "w03"}, {"id": "w03-015", "week": 3, "topic": "Bagging and boosting", "type": "single", "q": "How does gradient boosting regression differ from random forest regression?", "options": ["It builds all trees at the same time on random rows and averages them", "It uses one very deep tree instead of many shallow trees", "It fits a straight line through the data using least squares", "It builds trees one after another so that each tree fixes errors left by earlier trees"], "answer": [3], "explain": "Random forest is a bagging method with independent trees averaged together. Boosting builds trees in sequence, each correcting the earlier ones.", "source": "Week 3 lecture, slide 23", "flag": "", "deck": "w03"}, {"id": "w03-016", "week": 3, "topic": "Why regression matters", "type": "multi", "q": "Which of these are reasons regression models matter in research?", "options": ["They predict continuous values such as prices and demand", "They measure the effect of independent variables on an outcome", "They underpin many more advanced machine learning techniques", "They help test assumptions about cause and effect relationships"], "answer": [0, 1, 2, 3], "explain": "All four are reasons given for the value of regression. It quantifies relationships, forecasts numbers, supports hypothesis testing and is a foundation for advanced models.", "source": "Week 3 lecture, slide 16", "flag": "Cause and effect wording follows the slide, in practice regression alone shows association.", "deck": "w03"}, {"id": "w03-017", "week": 3, "topic": "Features and labels", "type": "single", "q": "A housing dataset has columns for square feet, bedrooms, bathrooms, location score and price. The model must predict price. Which column is the label?", "options": ["Price, because it is the value the model is trained to predict", "Square feet, because it is the first column and the most important", "Location score, because it is the only column that is not a count", "All the columns, because a label is any column in the dataset"], "answer": [0], "explain": "The label is the target output, which here is price. The other columns are input features that the model uses to estimate it.", "source": "Week 3 lecture, slide 13", "flag": "", "deck": "w03"}, {"id": "w03-018", "week": 3, "topic": "Learning paradigms", "type": "single", "q": "A program improves its decisions by receiving rewards and penalties through trial and error, with no labelled examples. Which learning paradigm is this?", "options": ["Supervised learning", "Reinforcement learning", "Unsupervised learning", "Regression learning"], "answer": [1], "explain": "Learning from rewards by trial and error is reinforcement learning. Supervised learning needs labelled examples and unsupervised learning looks for structure without feedback.", "source": "Week 3 lecture, slide 3", "flag": "", "deck": "w03"}, {"id": "w03-019", "week": 3, "topic": "Evaluation metrics", "type": "multi", "q": "Which statements about R-squared are correct?", "options": ["It is measured in the same units as the target variable", "A value of 0 means the model is no better than predicting the mean", "It shows how much of the variance in the target the model explains", "A value closer to 1 means a better fit", "It can never be below zero"], "answer": [1, 2, 3], "explain": "R-squared compares the model with a mean baseline and measures explained variance. It has no units and it can be negative when the model is worse than the baseline.", "source": "Week 3 lecture, slide 22", "flag": "", "deck": "w03"}, {"id": "w03-020", "week": 3, "topic": "Regression or classification", "type": "multi", "q": "Which of these tasks are regression problems?", "options": ["Deciding whether an email is spam", "Predicting future electricity or gas consumption", "Assigning a customer to a churn risk group", "Identifying a dog breed from a photo", "Estimating crop yield from soil and climate data"], "answer": [1, 4], "explain": "Regression predicts a continuous numeric value such as consumption or yield. Spam detection, breed identification and churn grouping all choose between classes.", "source": "Week 3 lecture, slide 9 and 12", "flag": "", "deck": "w03"}, {"id": "w03-021", "week": 3, "topic": "Regression and classification", "type": "explain", "q": "Describe the difference between classification and regression, and give one example of each.", "model": "Both are supervised learning tasks, which means they learn from labelled data. Classification predicts a discrete class, such as deciding whether an email is spam or not. Regression predicts a continuous numeric value, such as the price of a house from its size and location. A classification model can return probabilities for each class and a threshold turns those into a label. A regression model returns a number directly, and its quality is judged by how far the numbers are from the true values.", "points": ["States that classification predicts discrete classes and regression predicts continuous values", "Gives a correct classification example such as spam or default", "Gives a correct regression example such as price or temperature", "Mentions that both learn from labelled data"], "source": "Week 3 lecture, slide 7 to 9", "flag": "", "deck": "w03"}, {"id": "w03-022", "week": 3, "topic": "Supervised learning", "type": "explain", "q": "Explain what supervised machine learning is, and describe the parts of the labelled data it uses.", "model": "Supervised learning trains a model on labelled historical examples so it can predict the outcome for new, unseen cases. Each example has input features, also called independent variables or predictors. It also has an output label, also called the dependent variable or target. The model learns the link between the features and the label. For example, a house price model learns from past sales where size and location are the features and the sale price is the label.", "points": ["Says the model learns from labelled examples", "Names input features and output labels", "Mentions that predictions are made on new, unseen data", "Gives a sensible example"], "source": "Week 3 lecture, slide 5 and 6", "flag": "", "deck": "w03"}, {"id": "w03-023", "week": 3, "topic": "Linear regression", "type": "explain", "q": "Explain how ordinary least squares fits a linear regression model.", "model": "Linear regression predicts the target as a straight line, or a flat surface when there are many inputs, through the data. Ordinary least squares looks for the coefficients that place that line as close to the data as possible. It measures closeness by the residuals, which are the gaps between predicted and actual values. It squares them and adds them up, and it chooses the coefficients that make this sum as small as possible. The result is the best fitting line in the least squares sense.", "points": ["Says the model is a line or hyperplane with coefficients to find", "Identifies residuals as the differences between predicted and actual values", "States that the squared residuals are summed and minimised", "Links the result to the best fitting line"], "source": "Week 3 lecture, slide 26 and 27", "flag": "", "deck": "w03"}, {"id": "w03-024", "week": 3, "topic": "Random forest", "type": "explain", "q": "Describe how a random forest regression model makes a prediction, and explain why this is more stable than using one decision tree.", "model": "A random forest is an ensemble of many decision tree regressors. Each tree is built on random rows and a random choice of features, so the trees differ from one another. For a new case every tree predicts a number. The forest returns the average of those numbers. A single tree can be thrown off by quirks in its training data, but averaging many different trees cancels out their individual errors. This makes the forest more stable, more robust to outliers and less prone to overfitting.", "points": ["Describes many trees built on random rows and features", "States that the final prediction is the average of the tree outputs", "Explains that averaging reduces the effect of any one tree's errors", "Mentions robustness to outliers or less overfitting"], "source": "Week 3 lecture, slide 30 to 32", "flag": "", "deck": "w03"}, {"id": "w03-025", "week": 3, "topic": "Evaluation metrics", "type": "explain", "q": "Compare mean absolute error with mean squared error, and say when each might be preferred.", "model": "Mean absolute error is the average size of the gaps between predicted and actual values. Mean squared error squares each gap before averaging, so large mistakes are penalised much more than small ones. This makes mean absolute error less sensitive to outliers and mean squared error more sensitive. If a few big errors are especially costly, mean squared error or its square root is a good choice. If outliers are rare noise and a fair typical error is wanted, mean absolute error is better.", "points": ["Describes mean absolute error as an average absolute difference", "Describes mean squared error as squaring errors before averaging", "Says squaring penalises large errors more strongly", "Links mean absolute error to lower sensitivity to outliers"], "source": "Week 3 lecture, slide 19 and 20", "flag": "", "deck": "w03"}, {"id": "w03-026", "week": 3, "topic": "Evaluation metrics", "type": "explain", "q": "Explain what R-squared tells you about a regression model, and what the values 1, 0 and below 0 mean.", "model": "R-squared shows how much of the variance in the target variable the model explains. A value of 1 is a perfect fit. A value closer to 1 is better. A value of 0 means the model is no better than always predicting the mean of the actual values. A value below 0 means the model is worse than that mean baseline. It is useful because it compares the model against a simple reference.", "points": ["Says it measures the share of variance in the target explained by the model", "States that 1 is a perfect fit", "States that 0 equals the mean baseline", "States that a negative value is worse than the baseline"], "source": "Week 3 lecture, slide 22", "flag": "", "deck": "w03"}, {"id": "w03-027", "week": 3, "topic": "Choosing a model", "type": "explain", "q": "Compare linear regression with random forest regression and explain when you would choose each.", "model": "Linear regression fits a straight line through the data. It works best when the relationship is roughly linear. It gives interpretable coefficients and makes a good baseline. Random forest regression averages many decision trees, so it handles non-linear patterns well, copes with outliers and is less prone to overfitting. It is less easy to interpret. I would choose linear regression when a simple explainable model is needed and the relationship looks linear. I would choose a random forest for complex, non-linear data where accuracy matters most.", "points": ["Says linear regression suits roughly linear relationships and interpretability", "Says random forest handles non-linear data and is robust", "Notes the trade-off between interpretability and flexibility", "Gives a clear situation for each choice"], "source": "Week 3 lecture, slide 23", "flag": "", "deck": "w03"}, {"id": "w03-028", "week": 3, "topic": "Bagging and boosting", "type": "explain", "q": "Explain the difference between random forest regression and gradient boosting regression.", "model": "Both use many decision trees, but they combine them differently. A random forest is a bagging method. It builds many trees independently on random variations of the data and averages their predictions. Gradient boosting builds trees one after another. Each new tree is trained to fix the errors left by the earlier trees, so the model improves step by step. Bagging mainly reduces instability, while boosting focuses on gradually correcting mistakes.", "points": ["Identifies random forest as bagging with independent trees averaged", "Identifies boosting as building trees sequentially", "States that each boosted tree corrects earlier errors", "Notes that both are tree ensembles"], "source": "Week 3 lecture, slide 23", "flag": "", "deck": "w03"}, {"id": "w04-001", "week": 4, "topic": "Supervised or unsupervised", "type": "single", "q": "What is the main difference between supervised and unsupervised learning?", "options": ["Unsupervised learning uses unlabelled data to find structure, supervised learning uses labelled data to predict", "Unsupervised learning uses labelled data to predict, supervised learning finds structure", "Unsupervised learning needs rewards from an environment, supervised learning does not", "Unsupervised learning only predicts numbers, supervised learning only predicts classes"], "answer": [0], "explain": "Supervised learning learns from input and output pairs to predict outcomes. Unsupervised learning has no labels and looks for patterns or groupings in the data itself.", "source": "Week 4 lecture, slide 6", "flag": "", "deck": "w04"}, {"id": "w04-002", "week": 4, "topic": "Supervised or unsupervised", "type": "single", "q": "A chemistry dataset describes wines by their measured properties but has no column giving the wine type. Which task is the data suited to?", "options": ["Regression, to predict the wine type as a number", "Clustering, to discover whether natural groups of wines exist", "Classification, to learn from the known wine type column", "Reinforcement learning, to reward the right wine type"], "answer": [1], "explain": "With no labels there is nothing to predict in a supervised way, so the sensible task is to look for groups. Classification and regression both need a target column.", "source": "Week 4 lecture, slide 7", "flag": "", "deck": "w04"}, {"id": "w04-003", "week": 4, "topic": "Algorithm families", "type": "multi", "q": "Which of these are common unsupervised learning methods?", "options": ["Decision trees", "Linear regression", "K-means", "Autoencoders", "Principal component analysis"], "answer": [2, 3, 4], "explain": "K-means, principal component analysis and autoencoders find structure without labels. Linear regression and decision trees learn from labelled examples.", "source": "Week 4 lecture, slide 6", "flag": "", "deck": "w04"}, {"id": "w04-004", "week": 4, "topic": "Clustering", "type": "multi", "q": "Which statements about clustering are correct?", "options": ["It predicts a continuous number for each new data point", "It works without a target variable or predefined categories", "It groups points that are close or similar by some measure such as distance", "It needs labelled examples of every group before it can start", "It can be used as an exploratory tool to find hidden structure"], "answer": [1, 2, 4], "explain": "Clustering is similarity based, unsupervised and exploratory. The wrong options describe supervised classification and regression.", "source": "Week 4 lecture, slide 12", "flag": "", "deck": "w04"}, {"id": "w04-005", "week": 4, "topic": "Clustering", "type": "single", "q": "A shop wants to split its customers into groups by behaviour and preferences so it can tailor its marketing. Which task is this?", "options": ["Market basket analysis using clustering", "Regression to forecast next month's sales", "Customer segmentation using clustering", "Dimensionality reduction to remove customers"], "answer": [2], "explain": "Grouping customers by behaviour is segmentation, a clustering task. Market basket analysis looks instead for products bought together.", "source": "Week 4 lecture, slide 5 and 14", "flag": "", "deck": "w04"}, {"id": "w04-006", "week": 4, "topic": "Unsupervised examples", "type": "single", "q": "A supermarket wants to discover which products are often bought together. What is this application called?", "options": ["Document clustering", "Gene analysis", "Customer segmentation", "Market basket analysis"], "answer": [3], "explain": "Market basket analysis discovers associations between products that appear in the same purchase. Customer segmentation groups the customers themselves.", "source": "Week 4 lecture, slide 5", "flag": "", "deck": "w04"}, {"id": "w04-007", "week": 4, "topic": "K-means", "type": "single", "q": "Which list gives the steps of k-means in the correct order?", "options": ["Place centres at random, assign points to the nearest centre, move centres to cluster means, repeat", "Assign points to clusters, place centres at random, repeat until all clusters are the same size", "Move centres to cluster means, place centres at random, assign points once and stop", "Place centres at the data mean, label each point, then train a model on the labels"], "answer": [0], "explain": "K-means starts with random centres, assigns each point to the closest centre, moves each centre to the mean of its points, and repeats. It does not stop after one pass or need labels.", "source": "Week 4 lecture, slide 21 to 25", "flag": "", "deck": "w04"}, {"id": "w04-008", "week": 4, "topic": "K-means", "type": "single", "q": "K-means is run twice on the same data with the same k and returns different clusters. What is the most likely cause?", "options": ["The data changed between runs because k-means edits its own input", "The starting cluster centres were chosen at random and were different each time", "K-means randomly changes the number of clusters on each run", "The algorithm stopped before assigning points to any centre"], "answer": [1], "explain": "The initial centres are placed at random, so different starting points can lead to different final clusters. The value of k is fixed by the user.", "source": "Week 4 lecture, slide 21", "flag": "Run to run variation is textbook knowledge. The slide only shows that centres start at random.", "deck": "w04"}, {"id": "w04-009", "week": 4, "topic": "K-means", "type": "single", "q": "In k-means, what does it mean to say the algorithm has converged?", "options": ["Every cluster has been given exactly the same number of points", "All centres have moved to the overall mean of the dataset", "No point changes its cluster membership when the process is repeated", "The value of k has reached the number of data points"], "answer": [2], "explain": "Convergence is reached when repeating the assign and move steps no longer changes which cluster any point belongs to.", "source": "Week 4 lecture, slide 25 and 26", "flag": "", "deck": "w04"}, {"id": "w04-010", "week": 4, "topic": "Choosing k", "type": "single", "q": "Why can you not simply pick the value of k that gives the lowest inertia?", "options": ["Inertia is always the same whatever value of k is used", "Inertia rises as k grows, so the smallest k always wins", "Inertia can only be calculated when k is exactly two", "Inertia keeps falling as k grows, so it cannot show which k is the right one alone"], "answer": [3], "explain": "Inertia generally decreases as more clusters are added. This is why the elbow, where improvement drops sharply, is used to choose k instead of the minimum.", "source": "Week 4 lecture, slide 29 and 31", "flag": "The slide says inertia falls as k rises, the conclusion about not using the minimum is a standard reading.", "deck": "w04"}, {"id": "w04-011", "week": 4, "topic": "Choosing k", "type": "single", "q": "On a plot of inertia against k, what marks a good choice of k in the elbow method?", "options": ["The point after which the rate of improvement drops drastically", "The point where inertia first becomes zero", "The point where inertia is highest on the plot", "The point where the line is perfectly straight"], "answer": [0], "explain": "Adding clusters helps a lot at first, then very little. The bend where this change happens is the elbow, although it can be hard to see.", "source": "Week 4 lecture, slide 31", "flag": "", "deck": "w04"}, {"id": "w04-012", "week": 4, "topic": "Silhouette score", "type": "single", "q": "A point has a silhouette value close to 0. What does this say about it?", "options": ["It is very well clustered and far from other clusters", "It lies on the boundary between two clusters", "It is the exact centre of its own cluster", "It was left out of every cluster by the algorithm"], "answer": [1], "explain": "Values near 1 mean a well clustered point and values near 0 mean it sits between clusters. Negative values suggest it may be in the wrong cluster.", "source": "Week 4 lecture, slide 32", "flag": "", "deck": "w04"}, {"id": "w04-013", "week": 4, "topic": "Silhouette score", "type": "multi", "q": "Which statements about the parts of the silhouette score are correct?", "options": ["The separation term is the average distance to points in the nearest neighbouring cluster", "The score ranges from 0 to 100 for each point", "The cohesion term is the average distance to other points in the same cluster", "The overall score is the largest value found among all the points", "A good clustering has small cohesion distances and large separation distances"], "answer": [0, 2, 4], "explain": "Cohesion measures tightness within a cluster and separation measures distance to the nearest other cluster. The overall score is the average over all points, and each value lies between minus one and plus one.", "source": "Week 4 lecture, slide 32", "flag": "", "deck": "w04"}, {"id": "w04-014", "week": 4, "topic": "Silhouette score", "type": "single", "q": "How is the silhouette score used to choose the number of clusters?", "options": ["Pick the k where the average score is closest to minus one", "Pick the largest k that was tried, because more clusters are always better", "Run k-means for several values of k and pick the k with the highest average score", "Pick the k at which the score first drops below zero"], "answer": [2], "explain": "The best k is the one that maximises the average silhouette score. Too few clusters give low separation and too many give fragmented, unstable clusters.", "source": "Week 4 lecture, slide 33", "flag": "", "deck": "w04"}, {"id": "w04-015", "week": 4, "topic": "Clustering methods", "type": "single", "q": "Which clustering method groups points by density and can find clusters of arbitrary shape?", "options": ["K-means", "Hierarchical clustering", "Gaussian mixture models", "DBSCAN"], "answer": [3], "explain": "DBSCAN is density based and is good for irregular cluster shapes. K-means favours compact groups around centres.", "source": "Week 4 lecture, slide 13", "flag": "", "deck": "w04"}, {"id": "w04-016", "week": 4, "topic": "Clustering methods", "type": "single", "q": "A researcher wants a tree diagram showing how clusters merge or split at different levels. Which method gives this?", "options": ["Hierarchical clustering, which builds a dendrogram", "K-means, which builds a dendrogram around centres", "DBSCAN, which builds a dendrogram from densities", "Principal component analysis, which builds a dendrogram of features"], "answer": [0], "explain": "A dendrogram is the tree produced by hierarchical clustering. The other methods do not produce one.", "source": "Week 4 lecture, slide 13", "flag": "", "deck": "w04"}, {"id": "w04-017", "week": 4, "topic": "Dimensionality reduction", "type": "multi", "q": "Which are benefits of reducing the number of features in a dataset?", "options": ["Data can be plotted in two or three dimensions", "The data gains a labelled target column", "Faster computation", "Less noise and redundancy", "Lower risk of overfitting"], "answer": [0, 2, 3, 4], "explain": "Fewer features speed things up, remove noise, reduce overfitting and allow plotting. Reducing features never creates labels.", "source": "Week 4 lecture, slide 35", "flag": "", "deck": "w04"}, {"id": "w04-018", "week": 4, "topic": "PCA", "type": "single", "q": "What does principal component analysis do to a dataset?", "options": ["It groups the points into a set number of clusters", "It projects the data onto directions that capture the greatest variance", "It predicts a label for each point from known examples", "It rewards the directions that lead to a goal state"], "answer": [1], "explain": "Principal component analysis finds new axes, the principal components, along which the data varies most, and projects the data onto them. It is not a clustering or prediction method.", "source": "Week 4 lecture, slide 36", "flag": "", "deck": "w04"}, {"id": "w04-019", "week": 4, "topic": "Dimensionality reduction", "type": "single", "q": "How does linear discriminant analysis differ from principal component analysis?", "options": ["It is unsupervised and tries to maximise the total variance", "It is non-linear and only preserves very local structure", "It is supervised and tries to maximise the separation between classes", "It is a clustering method that finds density based groups"], "answer": [2], "explain": "Linear discriminant analysis uses class labels to separate classes. Principal component analysis uses no labels and keeps variance.", "source": "Week 4 lecture, slide 36", "flag": "", "deck": "w04"}, {"id": "w04-020", "week": 4, "topic": "PCA", "type": "single", "q": "In principal component analysis, what does a large eigenvalue of the covariance matrix indicate?", "options": ["The matching feature should be removed because it is noisy", "The matching point is an outlier that belongs to its own cluster", "The matching component is the label the model must predict", "The matching principal component captures a large share of the variance"], "answer": [3], "explain": "Eigenvalues show how strongly the data stretches along each eigenvector direction, and this is what the explained variance ratio is built from. Large ones are the components worth keeping.", "source": "Week 4 lecture, slide 39 to 42", "flag": "The link from eigenvalue size to explained variance is standard textbook linear algebra, the slides show it only through the explained variance ratio.", "deck": "w04"}, {"id": "w04-021", "week": 4, "topic": "PCA", "type": "single", "q": "After principal component analysis, the first one or two components explain almost all the variance in a dataset with four features. What does this suggest?", "options": ["The original features contain a lot of redundancy and can be summarised in fewer dimensions", "The four original features were all unrelated to each other", "The data must contain exactly one or two natural clusters", "The remaining components must be the most important ones"], "answer": [0], "explain": "If a few components hold most of the variance, the features overlap heavily, so a low dimensional summary loses little information. It says nothing direct about the number of clusters.", "source": "Week 4 lecture, slide 44", "flag": "The slide gives the variance figures, the interpretation about redundancy is standard.", "deck": "w04"}, {"id": "w04-022", "week": 4, "topic": "K-means", "type": "multi", "q": "Which statements about k-means are correct?", "options": ["Each centre is moved to the mean position of its cluster", "It needs a labelled target to place the centres", "The user chooses the number of clusters k", "It always finds clusters of any shape"], "answer": [0, 2], "explain": "K-means needs k set in advance and it moves each centre to the mean of its points. It uses no labels and favours compact groups.", "source": "Week 4 lecture, slide 19 to 25", "flag": "", "deck": "w04"}, {"id": "w04-023", "week": 4, "topic": "Dimensionality reduction", "type": "multi", "q": "Which of these are dimensionality reduction methods?", "options": ["Principal component analysis", "t-SNE", "Linear discriminant analysis", "DBSCAN", "UMAP"], "answer": [0, 1, 2, 4], "explain": "The first four reduce the number of features. DBSCAN is a density based clustering method.", "source": "Week 4 lecture, slide 13 and 36", "flag": "", "deck": "w04"}, {"id": "w04-024", "week": 4, "topic": "Supervised and unsupervised", "type": "explain", "q": "Compare supervised and unsupervised learning in terms of the data they use and what they aim to do.", "model": "Supervised learning uses labelled data, which are input and output pairs, and aims to predict outcomes for new data. Linear regression, decision trees and neural networks are examples. Unsupervised learning uses unlabelled data and aims to find inherent structure or patterns. K-means, principal component analysis and autoencoders are examples. For instance, supervised learning could predict house prices from past sales, while unsupervised learning could group customers by behaviour without any predefined groups.", "points": ["States that supervised learning uses labelled data and unsupervised uses unlabelled data", "States that supervised aims to predict and unsupervised aims to find structure", "Names a correct algorithm for each", "Gives a sensible example of the contrast"], "source": "Week 4 lecture, slide 6", "flag": "", "deck": "w04"}, {"id": "w04-025", "week": 4, "topic": "Clustering", "type": "explain", "q": "Explain what clustering is and give one real application.", "model": "Clustering is an unsupervised technique that groups similar data points together based on their features, without any labels or target variable. Points that are close under some measure, such as distance, end up in the same cluster. It is used as an exploratory tool to find hidden patterns. A common application is customer segmentation, where a business groups customers by behaviour and preferences so that marketing can be tailored to each group.", "points": ["Says clustering is unsupervised with no labels or target", "Explains that similar or close points are grouped together", "Describes it as exploratory for finding hidden structure", "Gives a valid application such as segmentation"], "source": "Week 4 lecture, slide 12 and 14", "flag": "", "deck": "w04"}, {"id": "w04-026", "week": 4, "topic": "K-means", "type": "explain", "q": "Describe how the k-means algorithm works, including when it stops.", "model": "K-means divides the data into k clusters, where the user chooses k. It first places k centres at random. It then assigns every point to its closest centre and moves each centre to the mean position of the points assigned to it. These two steps repeat. The algorithm stops when no point changes its cluster membership, which is called convergence. Overall it aims to minimise the total squared distance between points and their cluster centres.", "points": ["Says k centres start at random", "Describes assigning points to the closest centre", "Describes moving each centre to its cluster mean", "States that it repeats until membership stops changing", "Mentions minimising squared distances"], "source": "Week 4 lecture, slide 19 to 26", "flag": "", "deck": "w04"}, {"id": "w04-027", "week": 4, "topic": "Choosing k", "type": "explain", "q": "Explain how the elbow method helps you choose the number of clusters in k-means.", "model": "Inertia is the sum of squared distances from each point to its cluster centre, and smaller values mean tighter clusters. Inertia falls as k increases. The elbow method plots inertia against k and looks for the point where the rate of improvement drops sharply. That bend is the elbow and suggests a good value of k, because adding more clusters beyond it gives little benefit. The elbow can be hard to see on some plots, so another measure may be needed.", "points": ["Defines inertia as squared distance to the cluster centre", "Says inertia decreases as k grows", "Identifies the elbow as where improvement drops sharply", "Notes the elbow can be hard to see"], "source": "Week 4 lecture, slide 29 to 31", "flag": "", "deck": "w04"}, {"id": "w04-028", "week": 4, "topic": "Silhouette score", "type": "explain", "q": "Explain what the silhouette score measures and how it is used to choose k.", "model": "The silhouette score shows how well each point fits its own cluster compared with other clusters. It compares the average distance to points in the same cluster with the average distance to points in the nearest neighbouring cluster. Values run from minus one to plus one. Near plus one means well clustered, near zero means on a boundary and negative means possibly misclassified. To choose k, run k-means for several values, average the score for each and pick the k with the highest average.", "points": ["Describes cohesion within the cluster versus separation from the nearest cluster", "States the range from minus one to plus one with meanings", "States that the overall score is an average over points", "Says the best k maximises the score"], "source": "Week 4 lecture, slide 32 and 33", "flag": "", "deck": "w04"}, {"id": "w04-029", "week": 4, "topic": "Clustering methods", "type": "explain", "q": "Compare k-means with DBSCAN and say which suits clusters of irregular shape.", "model": "K-means groups points around centres by minimising squared distance, and the user must choose k in advance. It tends to find compact, roughly round groups. DBSCAN groups points by density, so it can find clusters of arbitrary shape. For data where the clusters are curved or irregular, DBSCAN is the better choice. K-means is simpler and the most popular method, and it suits compact groups where a sensible k can be found.", "points": ["Describes k-means as centre and distance based with k chosen by the user", "Describes DBSCAN as density based", "Says DBSCAN finds arbitrary shaped clusters", "Gives a clear situation for choosing each"], "source": "Week 4 lecture, slide 13 and 19", "flag": "The point that k-means favours compact round groups is standard knowledge, the slide only says DBSCAN suits arbitrary shapes.", "deck": "w04"}, {"id": "w04-030", "week": 4, "topic": "Dimensionality reduction", "type": "explain", "q": "Explain what dimensionality reduction is and why it is useful.", "model": "Dimensionality reduction reduces the number of input features while keeping as much relevant information as possible. It projects the data into a lower dimensional space. This makes high dimensional data easier to visualise, analyse and process, and it helps with the curse of dimensionality. It also speeds up computation, reduces noise and redundancy and lowers the risk of overfitting. Methods include principal component analysis, linear discriminant analysis, t-SNE and UMAP.", "points": ["Says it reduces the number of features while preserving information", "Mentions projection into a lower dimensional space", "Gives at least two benefits such as speed, noise, overfitting or visualisation", "Names a method"], "source": "Week 4 lecture, slide 34 to 36", "flag": "", "deck": "w04"}, {"id": "w04-031", "week": 4, "topic": "PCA", "type": "explain", "q": "Describe the main steps of principal component analysis and what the result is used for.", "model": "First the data is centred by subtracting the mean of each feature. Next the covariance matrix is calculated to show how features vary together. Eigen-decomposition of this matrix gives eigenvectors, which are the principal components, and eigenvalues, which show how much variance each carries. The data is then projected onto the chosen components. Keeping only the first few components gives a smaller summary that keeps most of the variance, which helps visualisation and can be useful before clustering.", "points": ["Mentions centring the data", "Mentions the covariance matrix", "Says eigenvectors give the components and eigenvalues give the variance", "Says the data is projected onto the top components"], "source": "Week 4 lecture, slide 37 to 44", "flag": "", "deck": "w04"}, {"id": "w04-032", "week": 4, "topic": "Dimensionality reduction", "type": "explain", "q": "Compare principal component analysis with linear discriminant analysis and with t-SNE.", "model": "Principal component analysis is unsupervised and linear. It projects data onto the directions of greatest variance. Linear discriminant analysis is supervised, so it uses class labels and tries to maximise the separation between classes. T-SNE is a non-linear method that preserves local structure and is mainly used to visualise data in two or three dimensions. So the choice depends on whether labels exist and whether the aim is to keep variance, separate classes or plot neighbourhoods.", "points": ["Says principal component analysis maximises variance and needs no labels", "Says linear discriminant analysis is supervised and separates classes", "Says t-SNE is non-linear and preserves local structure for visualisation"], "source": "Week 4 lecture, slide 36", "flag": "", "deck": "w04"}, {"id": "w05a-001", "week": 5, "topic": "What is RL", "type": "single", "q": "Which description best fits reinforcement learning?", "options": ["An agent learns sequential decisions by interacting with an environment and receiving rewards or penalties", "A model learns to predict a numeric target from labelled historical examples", "An algorithm groups unlabelled data points by how similar they are", "A model reduces the number of features while keeping most of the variance"], "answer": [0], "explain": "Reinforcement learning is trial and error guided by feedback. The other options describe supervised regression, clustering and dimensionality reduction.", "source": "Week 5 reinforcement learning lecture, slide 5 and 6", "flag": "", "deck": "w05a"}, {"id": "w05a-002", "week": 5, "topic": "RL versus supervised", "type": "single", "q": "How does the feedback in reinforcement learning differ from the feedback in supervised learning?", "options": ["It is a correct label supplied for every example before training starts", "It is a reward or penalty after actions, not a correct answer given for every example", "It is a cluster number assigned to each data point by the algorithm", "It is the average of all earlier errors, with no link to actions"], "answer": [1], "explain": "A reinforcement learning agent is only told how good its actions turned out, and must work out which actions caused the outcome. Supervised models are given the right answer for each example.", "source": "Week 5 reinforcement learning lecture, slide 5 and 6", "flag": "The contrast with supervised learning is a standard reading of the slide wording on trial and error.", "deck": "w05a"}, {"id": "w05a-003", "week": 5, "topic": "Elements of RL", "type": "single", "q": "In reinforcement learning, which component responds to the agent's action with a reward or penalty?", "options": ["The agent itself", "The Q-table", "The environment", "The training dataset"], "answer": [2], "explain": "The agent acts and the environment responds with feedback. The agent then uses that feedback to improve its decisions.", "source": "Week 5 reinforcement learning lecture, slide 6", "flag": "", "deck": "w05a"}, {"id": "w05a-004", "week": 5, "topic": "Elements of RL", "type": "single", "q": "A robot is learning to walk. Which event would count as a penalty?", "options": ["Staying balanced while moving forward", "Using less energy for each step", "Reaching a stable and efficient walking style", "Falling down or losing balance"], "answer": [3], "explain": "Falling or losing balance is the negative feedback. Staying balanced, moving forward and saving energy are rewards.", "source": "Week 5 reinforcement learning lecture, slide 8", "flag": "", "deck": "w05a"}, {"id": "w05a-005", "week": 5, "topic": "Elements of RL", "type": "single", "q": "For a chess playing AI such as AlphaZero, what is the environment?", "options": ["The chessboard together with the opponent's moves", "The set of winning openings the AI has stored", "The chess program that chooses each move", "The reward of winning a match"], "answer": [0], "explain": "The environment is everything the agent interacts with, which here is the board and the opponent. The program making the moves is the agent and winning is a reward.", "source": "Week 5 reinforcement learning lecture, slide 8", "flag": "", "deck": "w05a"}, {"id": "w05a-006", "week": 5, "topic": "Elements of RL", "type": "multi", "q": "Which of these are rewards for an autonomous car that is learning to drive?", "options": ["Avoiding collisions", "Hard braking", "Staying in its lane", "Reaching the destination smoothly", "Running a red light"], "answer": [0, 2, 3], "explain": "Safe, lawful and smooth driving earns rewards. Collisions, hard braking, lane violations and running red lights are penalties.", "source": "Week 5 reinforcement learning lecture, slide 8", "flag": "", "deck": "w05a"}, {"id": "w05a-007", "week": 5, "topic": "Types of RL", "type": "single", "q": "An agent learns which chess moves are good purely from playing many games, without learning the probabilities of future outcomes. Which type is this?", "options": ["Model-based reinforcement learning", "Model-free reinforcement learning", "Supervised classification", "Unsupervised clustering"], "answer": [1], "explain": "A model-free agent learns from experienced transitions and rewards and does not explicitly learn how the environment works. A model-based agent builds a model first.", "source": "Week 5 reinforcement learning lecture, slide 10", "flag": "", "deck": "w05a"}, {"id": "w05a-008", "week": 5, "topic": "Types of RL", "type": "single", "q": "A robot in an unknown maze learns how valuable each move is from its expected future rewards, and uses those values to choose moves. Which type is this?", "options": ["Policy-based reinforcement learning", "Model-based reinforcement learning with a reward function supplied", "Value-based reinforcement learning", "Clustering of the maze positions"], "answer": [2], "explain": "Value-based methods estimate the expected cumulative reward of states or actions and pick actions with high estimates. Q-learning is an example.", "source": "Week 5 reinforcement learning lecture, slide 12", "flag": "", "deck": "w05a"}, {"id": "w05a-009", "week": 5, "topic": "Actor-critic", "type": "multi", "q": "Which statements about actor-critic reinforcement learning are correct?", "options": ["The critic learns a value function that judges how good decisions are", "The critic chooses the next action and the actor scores it", "It is a clustering method with two groups of points", "The actor learns a policy that chooses actions", "It combines policy-based and value-based learning"], "answer": [0, 3, 4], "explain": "The actor picks actions and the critic evaluates them through expected future reward. The wrong options swap the roles or describe an unrelated method.", "source": "Week 5 reinforcement learning lecture, slide 14", "flag": "", "deck": "w05a"}, {"id": "w05a-010", "week": 5, "topic": "Q-learning", "type": "single", "q": "What kind of reinforcement learning algorithm is Q-learning?", "options": ["A model-based, policy-based algorithm that needs a transition model", "A supervised algorithm that learns from labelled state and action pairs", "An unsupervised algorithm that groups states into clusters", "A model-free, value-based algorithm that learns action values from experience"], "answer": [3], "explain": "Q-learning does not need to know how the environment works and it learns the value of actions through experience.", "source": "Week 5 reinforcement learning lecture, slide 12 and 15", "flag": "", "deck": "w05a"}, {"id": "w05a-011", "week": 5, "topic": "Q-table", "type": "single", "q": "What does one entry Q of state and action in a Q-table represent?", "options": ["The expected total reward for taking that action in that state and then following the best policy", "The immediate reward for the action and nothing about later rewards", "The probability that the environment moves to the next state", "The number of times the agent has visited that state"], "answer": [0], "explain": "A Q-value is a long term estimate that includes later rewards. The immediate reward alone is held in the reward table.", "source": "Week 5 reinforcement learning lecture, slide 20", "flag": "", "deck": "w05a"}, {"id": "w05a-012", "week": 5, "topic": "Q-table", "type": "single", "q": "What is the difference between the reward table and the Q-table?", "options": ["The reward table is learned during training and the Q-table is given in advance", "The reward table gives immediate feedback for a move and the Q-table stores learned long term values", "The reward table stores policies and the Q-table stores transition probabilities", "They hold the same numbers and differ only in how they are drawn"], "answer": [1], "explain": "The reward table is the fixed immediate feedback for going from one state to another. The Q-table starts at zero and is filled by learning, so it comes to include future rewards.", "source": "Week 5 reinforcement learning lecture, slide 19 to 21", "flag": "", "deck": "w05a"}, {"id": "w05a-013", "week": 5, "topic": "Q-table", "type": "single", "q": "What are the starting values in a Q-table before the agent has learned anything?", "options": ["The same values as the reward table", "Random values chosen between minus one and one", "Zero everywhere", "The maximum reward for every entry"], "answer": [2], "explain": "The Q-table is initialised with zero and then filled in as the agent explores, using the reward table.", "source": "Week 5 reinforcement learning lecture, slide 20", "flag": "", "deck": "w05a"}, {"id": "w05a-014", "week": 5, "topic": "Q-learning update", "type": "single", "q": "In the Q-learning update rule, what does the learning parameter G, typically 0.8, control?", "options": ["How many episodes the agent is allowed to run before stopping", "How often the agent chooses a random action instead of the best one", "How many states the environment is allowed to contain", "How much the best value of the next state counts compared with the immediate reward"], "answer": [3], "explain": "The rule adds the reward of the current move to G times the best value of the next state. A larger G makes future rewards matter more.", "source": "Week 5 reinforcement learning lecture, slide 22", "flag": "The slide calls G the learning parameter, its role here is as a discount on future value, which is how it is normally described.", "deck": "w05a"}, {"id": "w05a-015", "week": 5, "topic": "Q-learning update", "type": "single", "q": "If G in the Q-learning update were set to zero, how would the agent value its actions?", "options": ["Only by the immediate reward, ignoring what comes after", "Only by the best value of the final goal state", "By the sum of all future rewards, with no discount", "It would not be able to assign any value at all"], "answer": [0], "explain": "With G equal to zero the future term vanishes, so each Q-value is just the reward of the current move. The agent becomes short sighted.", "source": "Week 5 reinforcement learning lecture, slide 22", "flag": "", "deck": "w05a"}, {"id": "w05a-016", "week": 5, "topic": "Q-learning", "type": "single", "q": "Why does the strength of moves near the goal get learned first, with earlier moves strengthened later?", "options": ["The agent is told the whole route in advance and learns it backwards", "The goal reward first strengthens the last move, then values spread backwards to earlier moves", "Earlier moves are always given higher rewards than later moves", "The Q-table is filled in alphabetical order of the state names"], "answer": [1], "explain": "Reaching the goal strengthens the move into it. Next time, the move before it can see that strong value ahead, so the effect spreads back step by step.", "source": "Week 5 reinforcement learning lecture, slide 17 and 18", "flag": "", "deck": "w05a"}, {"id": "w05a-017", "week": 5, "topic": "Q-learning", "type": "single", "q": "An agent starts with no knowledge and moves at random. Why can it still learn a good route to the goal?", "options": ["The environment tells it the best action before each move", "Random movement is guaranteed to find the shortest route immediately", "By chance it reaches the goal, and that reward strengthens the moves that led to it", "It copies the route from a labelled set of examples"], "answer": [2], "explain": "The agent learns from experience. Reaching the goal gives a reward that raises the value of the moves leading there, and repeated episodes refine this.", "source": "Week 5 reinforcement learning lecture, slide 17 and 18", "flag": "", "deck": "w05a"}, {"id": "w05a-018", "week": 5, "topic": "Q-learning", "type": "single", "q": "What does it mean when a Q-table is described as converged?", "options": ["Every entry has been set back to zero", "The agent has stopped receiving rewards from the environment", "All entries are equal to the largest reward", "The values have stabilised after many episodes of interaction"], "answer": [3], "explain": "The table is built step by step over many episodes until the values stop changing. That settled table is the converged Q-table.", "source": "Week 5 reinforcement learning lecture, slide 24 and 25", "flag": "", "deck": "w05a"}, {"id": "w05a-019", "week": 5, "topic": "Q-learning", "type": "multi", "q": "Which statements about Q-learning are correct?", "options": ["It needs the transition probabilities supplied in advance", "It learns from experience by trying actions", "It does not need to know how the environment works", "It updates an action-value function over many iterations", "It needs a labelled example of the right action for every state"], "answer": [1, 2, 3], "explain": "Q-learning is model free and learns by trial and error, updating action values step by step. It needs neither a transition model nor labelled actions.", "source": "Week 5 reinforcement learning lecture, slide 15", "flag": "", "deck": "w05a"}, {"id": "w05a-020", "week": 5, "topic": "Types of RL", "type": "multi", "q": "Which statements describe value-based reinforcement learning?", "options": ["The agent must be given a full model of the environment", "Q-learning is an example", "The agent learns a policy directly with no value estimates", "The estimates are used to choose actions that maximise long term reward", "The agent estimates expected cumulative future rewards of states or actions"], "answer": [1, 3, 4], "explain": "Value-based methods learn values and act on them, and Q-learning does exactly this. Learning a policy directly is the policy-based approach.", "source": "Week 5 reinforcement learning lecture, slide 12", "flag": "", "deck": "w05a"}, {"id": "w05a-021", "week": 5, "topic": "Types of RL", "type": "multi", "q": "Which statements correctly describe model-based reinforcement learning?", "options": ["It needs labelled examples of the correct action", "It learns only from experienced rewards and never builds a model", "It uses a model of how the environment works", "The model includes transition probabilities and a reward function"], "answer": [2, 3], "explain": "A model-based agent predicts consequences with a model and plans ahead. The wrong options describe model-free learning and supervised learning.", "source": "Week 5 reinforcement learning lecture, slide 11", "flag": "", "deck": "w05a"}, {"id": "w05a-022", "week": 5, "topic": "What is RL", "type": "explain", "q": "Explain what reinforcement learning is, naming the agent, the environment and the reward in one example.", "model": "Reinforcement learning is a branch of machine learning in which an agent learns to make sequential decisions by interacting with an environment. The agent tries actions and the environment responds with a reward or a penalty. Over time the agent improves its strategy to gain the best long term outcome. In a self-driving car example the agent is the driving system, the environment is the road with other cars and traffic lights, and rewards are given for safe driving while collisions are penalised.", "points": ["Says an agent learns by interacting with an environment", "Says feedback comes as rewards or penalties and learning is by trial and error", "Mentions long term or cumulative outcome", "Identifies agent, environment and reward correctly in an example"], "source": "Week 5 reinforcement learning lecture, slide 5 to 8", "flag": "", "deck": "w05a"}, {"id": "w05a-023", "week": 5, "topic": "RL versus supervised", "type": "explain", "q": "Compare reinforcement learning with supervised learning.", "model": "Supervised learning learns from labelled examples where the correct answer is given for each input, and it then predicts for new data. Reinforcement learning has no such answers. The agent acts, receives rewards or penalties and works out over many trials which actions give the best long term result. Supervised learning is passive learning from a fixed dataset, while reinforcement learning is an active process in which the agent's own actions shape what it experiences next.", "points": ["Says supervised learning uses labelled data with correct answers", "Says reinforcement learning uses rewards and penalties from trial and error", "Mentions the agent acting and learning from consequences"], "source": "Week 5 reinforcement learning lecture, slide 3 to 6", "flag": "The comparison is built from the recap and the trial and error wording, the passive and active framing is textbook.", "deck": "w05a"}, {"id": "w05a-024", "week": 5, "topic": "Types of RL", "type": "explain", "q": "Explain the difference between model-free and model-based reinforcement learning, with an example of each.", "model": "A model-free agent learns directly from experience of actions and rewards, without learning how the environment works. For example, a chess AI that plays thousands of games and learns which moves tend to win. A model-based agent has a model of the environment, including transition probabilities and a reward function. It uses this to predict what its actions will do and to plan ahead. A robot vacuum that predicts the result of different routes before moving is an example.", "points": ["Says model-free learns from experience without a model of the environment", "Says model-based uses transition probabilities and a reward function to plan", "Gives a suitable example of each"], "source": "Week 5 reinforcement learning lecture, slide 10 and 11", "flag": "", "deck": "w05a"}, {"id": "w05a-025", "week": 5, "topic": "Types of RL", "type": "explain", "q": "Compare value-based and policy-based reinforcement learning.", "model": "Value-based methods learn to estimate the expected cumulative future reward of states or actions, and the agent picks actions that have high values. Q-learning is an example. Policy-based methods learn a policy directly. A policy tells the agent which action to take in a given state, and learning aims to maximise expected cumulative reward. Steering an autonomous vehicle is a policy-based example, and navigating a maze by learning move values is a value-based example.", "points": ["Says value-based methods estimate the value of states or actions", "Says policy-based methods learn the action choice directly", "Names Q-learning as value-based", "Gives a suitable example"], "source": "Week 5 reinforcement learning lecture, slide 12 and 13", "flag": "", "deck": "w05a"}, {"id": "w05a-026", "week": 5, "topic": "Actor-critic", "type": "explain", "q": "Describe how actor-critic reinforcement learning works.", "model": "Actor-critic combines policy-based and value-based learning, using two components that work together. The actor learns a policy, which decides what action to take in each state. The critic learns a value function that judges how good the actions or states are in terms of expected future reward. The critic's evaluation helps the actor to improve. In a walking robot, the actor decides how to move the legs and the critic judges how well those movements contribute to walking without falling.", "points": ["Says it combines policy-based and value-based methods", "Describes the actor as choosing actions through a policy", "Describes the critic as evaluating using a value function", "Gives an example such as a walking robot"], "source": "Week 5 reinforcement learning lecture, slide 14", "flag": "", "deck": "w05a"}, {"id": "w05a-027", "week": 5, "topic": "Q-learning", "type": "explain", "q": "Explain in your own words what Q-learning is and what the Q-table stores.", "model": "Q-learning is a model-free reinforcement learning method in which an agent learns the best action to take in each situation by trying actions and learning from the rewards. The agent does not need to know how the environment works. It stores what it learns in a Q-table, a lookup table where each entry gives the expected total reward for taking an action in a state and then following the best policy afterwards. The table starts at zero and is improved through experience.", "points": ["Says it is model-free and learns from rewards by trying actions", "Describes the Q-table as a lookup table of action values for each state", "Says each value is the expected total reward when following the best policy afterwards", "Says the table starts at zero and improves with experience"], "source": "Week 5 reinforcement learning lecture, slide 15 and 20", "flag": "", "deck": "w05a"}, {"id": "w05a-028", "week": 5, "topic": "Q-learning update", "type": "explain", "q": "Describe how a Q-table is updated and explain the role of the learning parameter.", "model": "The agent explores the environment and updates each entry using the reward for the current move plus the learning parameter multiplied by the best value available from the next state. The reward table supplies the immediate rewards. The parameter, typically 0.8, controls how much future value counts, and if it were zero only the immediate reward would matter. The process is repeated over many episodes, so values near the goal spread backwards, until the table stops changing and has converged.", "points": ["Says the update combines the current reward with the best next-state value", "Explains that the parameter weights how much future value counts", "Says updates repeat over many episodes", "Says the table converges when values stabilise"], "source": "Week 5 reinforcement learning lecture, slide 22 to 25", "flag": "Calling the learning parameter a weight on future value is the usual discount factor description, the slide only calls it the learning parameter.", "deck": "w05a"}, {"id": "w05a-029", "week": 5, "topic": "Q-learning", "type": "explain", "q": "Explain why a Q-learning agent needs many episodes before its Q-table is useful.", "model": "At the start the Q-table is all zeros, so the agent knows nothing and early moves are effectively random. Only when the agent reaches the goal does it receive a reward that strengthens the move into the goal. In later episodes the move before that can see the strengthened value, so the benefit spreads back one step at a time. Many episodes are needed for this to reach every state, and for the values to settle at a converged table.", "points": ["Says the table starts at zero with no knowledge", "Explains that the goal reward first strengthens the last move", "Explains that the value spreads backwards to earlier states over repeated episodes", "Mentions convergence"], "source": "Week 5 reinforcement learning lecture, slide 17 to 25", "flag": "", "deck": "w05a"}, {"id": "w05b-001", "week": 5, "topic": "GA basics", "type": "single", "q": "What natural process do genetic algorithms imitate?", "options": ["Biological evolution through natural selection and survival of the fittest", "The way neurons in the brain pass signals to each other", "The way an animal learns by being rewarded for its actions", "The way light is sorted into groups by its wavelength"], "answer": [0], "explain": "Genetic algorithms are inspired by evolution. A population of solutions changes over generations, and the fitter ones are more likely to pass on their features.", "source": "Week 5 genetic algorithms lecture, slide 1 and 6", "flag": "", "deck": "w05b"}, {"id": "w05b-002", "week": 5, "topic": "GA basics", "type": "single", "q": "Is the following statement correct?\n\"A genetic algorithm improves one single solution step by step until it is good enough.\"", "options": ["Correct, because each generation contains only the single best solution", "Incorrect, because it repeatedly generates and modifies a whole population of solutions", "Incorrect, because it never improves any solution and only picks at random", "Correct, because crossover needs only one parent solution"], "answer": [1], "explain": "A genetic algorithm works on a population. It selects parents from the current population by fitness and uses them to produce children for the next generation.", "source": "Week 5 genetic algorithms lecture, slide 7", "flag": "", "deck": "w05b"}, {"id": "w05b-003", "week": 5, "topic": "GA terms", "type": "single", "q": "When a genetic algorithm represents a candidate solution as a bitstring, what does the whole bitstring correspond to?", "options": ["A gene, which is one complete candidate solution", "A mutation, which is one complete candidate solution", "A chromosome, which is one complete candidate solution", "A fitness value, which scores one candidate solution"], "answer": [2], "explain": "A chromosome is the full string and each gene is one position in it, a 0 or a 1 in the bitstring example. Fitness is the score of the chromosome, not the string itself.", "source": "Week 5 genetic algorithms lecture, slide 2 and 14", "flag": "", "deck": "w05b"}, {"id": "w05b-004", "week": 5, "topic": "GA terms", "type": "single", "q": "In the bitstring example, what is a single gene?", "options": ["The whole six bit string that represents a candidate", "The numeric result of the equation being minimised", "The pair of parents chosen for crossover", "One bit in the chromosome, with a value of 0 or 1"], "answer": [3], "explain": "Genes are the blocks that make up a chromosome. In the example each gene is a single bit.", "source": "Week 5 genetic algorithms lecture, slide 2 and 14", "flag": "", "deck": "w05b"}, {"id": "w05b-005", "week": 5, "topic": "GA terms", "type": "single", "q": "In a genetic algorithm, what does the fitness of a chromosome tell you?", "options": ["How good that solution is at solving the problem", "How many genes the chromosome contains", "How different the chromosome is from its parents", "How many generations the algorithm has run so far"], "answer": [0], "explain": "Fitness is the measure of success, which in biology is how well an organism does and here is how good a solution is. It is used to decide which solutions are kept.", "source": "Week 5 genetic algorithms lecture, slide 2 and 15", "flag": "", "deck": "w05b"}, {"id": "w05b-006", "week": 5, "topic": "GA operators", "type": "single", "q": "Which operation in a genetic algorithm combines parts of two parent chromosomes to make a new one?", "options": ["Mutation", "Crossover", "Fitness testing", "Encoding"], "answer": [1], "explain": "Crossover is the recombination of genes from parents. Mutation instead changes bits at random in one chromosome.", "source": "Week 5 genetic algorithms lecture, slide 2, 4 and 16", "flag": "", "deck": "w05b"}, {"id": "w05b-007", "week": 5, "topic": "GA operators", "type": "single", "q": "What does mutation do to a chromosome in a genetic algorithm?", "options": ["It joins it with a second parent to make a child", "It deletes the weakest chromosomes from the population", "It randomly changes part of it, such as flipping a bit", "It scores it against the equation being minimised"], "answer": [2], "explain": "Mutation is a random change to the DNA or bitstring, like a copying error. It adds variety that crossover alone might not give.", "source": "Week 5 genetic algorithms lecture, slide 5 and 16", "flag": "The purpose of adding variety is standard knowledge, the slides define mutation as a random change.", "deck": "w05b"}, {"id": "w05b-008", "week": 5, "topic": "GA steps", "type": "single", "q": "How does a genetic algorithm start?", "options": ["By differentiating the equation and finding where the gradient is zero", "By choosing the single best solution from a stored list", "By crossing over two parents chosen by hand", "By creating an initial population of random candidate solutions"], "answer": [3], "explain": "The first step generates a set of random solutions, encoded for example as bitstrings, and then tests how good each one is.", "source": "Week 5 genetic algorithms lecture, slide 13 and 14", "flag": "", "deck": "w05b"}, {"id": "w05b-009", "week": 5, "topic": "GA steps", "type": "multi", "q": "Which actions are part of the repeating loop of a genetic algorithm?", "options": ["Remove some of the bad solutions", "Replace the whole population with new random solutions every time", "Test and rank each solution by how good it is", "Duplicate some of the good solutions", "Make small changes to the good solutions"], "answer": [0, 2, 3, 4], "explain": "The loop tests, removes weak solutions, duplicates strong ones and varies them until the best is good enough. Restarting at random each time would throw away what has been learned.", "source": "Week 5 genetic algorithms lecture, slide 13", "flag": "", "deck": "w05b"}, {"id": "w05b-010", "week": 5, "topic": "GA steps", "type": "single", "q": "When does the genetic algorithm loop stop?", "options": ["When the best solution is good enough", "After exactly one generation", "When every chromosome has been mutated once", "When the population is reduced to one gene"], "answer": [0], "explain": "The process repeats until the proposed solution is good enough, rather than after a fixed single pass.", "source": "Week 5 genetic algorithms lecture, slide 13 and 15", "flag": "", "deck": "w05b"}, {"id": "w05b-011", "week": 5, "topic": "Analytical limits", "type": "multi", "q": "Which are problems with solving an optimisation problem by differentiating an equation?", "options": ["It is not suitable for complex real-world problems with many variables", "Differentiation can only find maxima and never minima", "It always needs a population of random solutions first", "The relationship may have several minima", "Not every relationship can be written as an equation"], "answer": [0, 3, 4], "explain": "The analytical method needs an equation, can be confused by several minima and does not scale to complex problems. It can find minima, and it does not need a population.", "source": "Week 5 genetic algorithms lecture, slide 11", "flag": "", "deck": "w05b"}, {"id": "w05b-012", "week": 5, "topic": "Numerical limits", "type": "single", "q": "What is the main weakness of blind generate and test as a numerical method?", "options": ["It can only be used when the relationship is an exact equation", "Guesses are not guided by earlier results, so convergence may take too long", "It always finds a perfect solution but needs too much memory", "It cannot test how good a solution is"], "answer": [1], "explain": "Blind guessing is basic trial and error, so it can be slow and can be misled by several minima. A genetic algorithm does better by building on good solutions.", "source": "Week 5 genetic algorithms lecture, slide 11 to 13", "flag": "", "deck": "w05b"}, {"id": "w05b-013", "week": 5, "topic": "GA versus blind search", "type": "single", "q": "Why can a genetic algorithm do better than blind trial and error?", "options": ["It tests only one solution, so it needs less computation", "It tests every possible solution, so it cannot miss the best", "It keeps and varies good solutions, so each generation builds on earlier results", "It ignores the quality of solutions, so it avoids bias"], "answer": [2], "explain": "Ranking, removing bad solutions, duplicating good ones and making small changes steers the search towards better answers instead of guessing blindly.", "source": "Week 5 genetic algorithms lecture, slide 13", "flag": "", "deck": "w05b"}, {"id": "w05b-014", "week": 5, "topic": "Reformulation", "type": "single", "q": "Why are problems often reformulated as minimisation problems before using a genetic algorithm?", "options": ["Because a genetic algorithm cannot handle maximisation in any form", "Because minima are always easier to find than maxima by hand", "Because the fitness of a solution cannot be measured otherwise", "Genetic algorithm solutions usually involve finding the minimum of something"], "answer": [3], "explain": "The usual set up is to look for a minimum, which corresponds to an acceptable limit, so other problems are rewritten to fit.", "source": "Week 5 genetic algorithms lecture, slide 8", "flag": "The slide gives this as the usual set up, the stronger claim about maximisation is not made, so only the slide wording is used.", "deck": "w05b"}, {"id": "w05b-015", "week": 5, "topic": "Where GA is used", "type": "multi", "q": "Which problems suit a genetic algorithm well?", "options": ["Sorting a short list of numbers", "Route optimisation", "Scheduling", "Finance", "Reading an exact answer from a known formula"], "answer": [1, 2, 3], "explain": "Genetic algorithms are most successful on large search spaces such as scheduling, route optimisation and finance. A short list or a known formula needs no search.", "source": "Week 5 genetic algorithms l
