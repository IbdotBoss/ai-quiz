<html lang="en">

<title>AI Test Practice</title>
<style>
@font-face{font-family:"Atkinson Next";src:url(data:font/woff2;base64,/*FONT*/) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --paper:#fff;--ink:#1b1424;--ink-2:#4b4357;--ink-3:#c9c3d3;--hair:#dedbe4;--tint:#f4f2f7;
  --font:"Atkinson Next",Verdana,sans-serif;
  --right:#18794e;--wrong:#b3261e;--focus:#3e4a89;--off:#6b6475;--hatch:#d9d5e0;--veil:#1b142499;
  --t-xs:.84rem;--t-s:.94rem;--t-m:1.0625rem;--t-l:1.375rem;--t-xl:2.25rem;
  --r:6px;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t-m)/1.5 var(--font)}
main{max-width:680px;margin:0 auto;padding:24px 16px 72px;min-height:100dvh}
@media (min-width:800px){main{padding:48px 24px 96px}}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:800 var(--t-xl)/1.1 var(--font)}
h2{font:700 var(--t-l)/1.25 var(--font);margin-top:40px}
h3,.sub{font-size:var(--t-m);font-weight:700;margin-top:20px;line-height:1.5}
h1.stem,h2.stem{margin:8px 0 4px}
h1:focus,h2:focus,.fb:focus,legend:focus{outline:none}
p{margin:8px 0;text-wrap:pretty}
.s{font-size:var(--t-s);color:var(--ink-2)}
a{color:var(--ink)}
svg{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

button,select{font:700 1rem/1.2 var(--font);color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 20px;min-height:44px;cursor:pointer}
button.p{background:var(--ink);color:var(--paper)}
button:active:not(:disabled){transform:translateY(1px)}
button.l{border:0;padding:12px 0;text-decoration:underline;font-weight:400;font-size:var(--t-s)}
button:disabled{color:var(--off);border-color:var(--off);background:var(--paper);cursor:default}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1.5px solid var(--ink);font-size:var(--t-s)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--wrong)}

/* the heatmap */
.plot{border-collapse:separate;border-spacing:4px 4px;margin:12px 0 0 -4px;width:calc(100% + 8px)}
.plot th{font-weight:400;text-align:left;padding:0}
.plot thead th{font-size:var(--t-xs);color:var(--ink-2);text-align:center;vertical-align:bottom;width:72px;line-height:1.2;padding-bottom:4px}
.plot thead th:first-child{width:auto}
.plot tbody th{border-top:1px solid var(--hair);padding:0 8px 0 0}
.plot .wk{display:flex;gap:4px;width:100%;min-height:48px;align-items:center;text-align:left;border:0;border-radius:0;padding:0;font-weight:400;font-size:var(--t-s);line-height:1.3}
.plot .wk b{font-weight:800;flex:0 0 1.7em;font-variant-numeric:tabular-nums}
.plot .wk span{text-decoration:underline}
select{max-width:100%;text-overflow:ellipsis}
.plot td{padding:0;height:1px}
.plot td button{width:100%;height:100%;min-height:48px;border:0;border-radius:0;padding:0;font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.plot td button.new{line-height:1.2;background:repeating-linear-gradient(135deg,var(--paper) 0 5px,var(--hatch) 5px 6.5px);color:var(--ink-2);font-size:var(--t-xs);font-weight:400}
.plot td button:hover{outline:2px solid var(--ink);outline-offset:1px}
.key{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:var(--t-xs);color:var(--ink-2);flex-wrap:wrap}
.key .sw{display:flex}.key .sw i{width:16px;height:12px;display:block}
.key .nw{width:16px;height:12px;background:repeating-linear-gradient(135deg,var(--paper) 0 3px,var(--hatch) 3px 4.5px);border:1px solid var(--hair);margin-left:12px}

.papers{border-top:1.5px solid var(--ink);margin-top:12px}
.papers button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:16px 0;font-weight:400}
.papers button b{font-size:var(--t-l);font-weight:700}
.papers button span{grid-column:1;color:var(--ink-2);font-size:var(--t-s);line-height:1.4}
.papers button i{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:var(--t-s);font-variant-numeric:tabular-nums;white-space:nowrap}
.papers button:hover:not(:disabled) b{text-decoration:underline}
.papers button:disabled b{color:var(--off)}
.paper{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;border-bottom:1px solid var(--hair);padding:16px 0}
.paper b{display:block;font-size:var(--t-l);font-weight:700}
.paper span{display:block;color:var(--ink-2);font-size:var(--t-s);line-height:1.4}
.paper .m{color:var(--ink);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px}.papers .acts button{display:inline-block;width:auto;border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 16px;font-weight:700;text-align:center}.papers .acts button:disabled{border-color:var(--off)}
@media (max-width:520px){.paper{grid-template-columns:minmax(0,1fr)}}
.pl{margin:8px 0;padding-left:20px}.pl li{margin:4px 0}
.top>b{min-width:0;overflow-wrap:anywhere}.top>button,.top>span{white-space:nowrap;flex:none}

fieldset{border:0;margin:0;padding:0;min-width:0}legend{padding:0}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:24px;font-size:var(--t-s);color:var(--ink-2)}
.stem{font:700 var(--t-l)/1.35 var(--font);margin:8px 0 4px;white-space:pre-wrap;text-wrap:balance;display:block}
.how{display:block;font-size:var(--t-s);color:var(--ink-2);font-weight:400;margin-bottom:12px}
.o{display:grid;grid-template-columns:22px minmax(0,1fr) 24px;gap:0 12px;align-items:start;padding:12px 0;border-top:1px solid var(--hair);cursor:pointer}
.o input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ink);cursor:pointer}
.o input:disabled{cursor:default}
.o small{display:block;font-weight:700;font-size:var(--t-xs);color:var(--wrong)}.o small.ok{color:var(--right)}
.o .mk{width:22px;height:22px;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:4px 24px}.row .o{border:0;grid-template-columns:22px auto;padding:8px 0;min-height:44px}
textarea{display:block;width:100%;min-height:200px;resize:vertical;font:400 var(--t-m)/1.6 var(--font);color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px}
textarea.short{min-height:96px}
textarea::placeholder{color:var(--ink-2);opacity:1}
.yours{white-space:pre-wrap;font-family:var(--font);background:var(--tint);padding:12px;border-radius:var(--r);overflow-wrap:break-word}
.fb{margin-top:20px;border-top:1.5px solid var(--ink);padding-top:4px;overflow-wrap:break-word}
.flag{background:var(--tint);padding:12px;border-radius:var(--r);font-size:var(--t-s);margin-top:12px}
.nav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:28px}
.ai{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
.ai button{font-weight:400;font-size:var(--t-s);padding:8px 16px}

details{margin-top:28px;border-top:1px solid var(--hair)}
summary{cursor:pointer;padding:12px 0;font-size:var(--t-s)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:4px 0 16px}
.grid button{padding:0;min-height:44px;font-size:var(--t-s);font-weight:400;font-variant-numeric:tabular-nums}
.grid .done{background:var(--ink);color:var(--paper);font-weight:700}
.grid .cur{outline:3px solid var(--focus);outline-offset:2px}

.total{font-size:var(--t-xl);font-weight:800;line-height:1.1;margin:16px 0 4px;font-variant-numeric:tabular-nums}
table.t{border-collapse:collapse;width:100%;font-size:var(--t-s);margin-top:8px;font-variant-numeric:tabular-nums}
.t td,.t th{border-bottom:1px solid var(--hair);padding:8px 12px 8px 0;text-align:left;vertical-align:top}
.t th{border-bottom:1.5px solid var(--ink);font-weight:700}
.t .num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0;white-space:nowrap}
.rev{border-top:1.5px solid var(--ink);margin-top:32px}
.foot{margin-top:64px;border-top:1px solid var(--hair);padding-top:16px;font-size:var(--t-s);color:var(--ink-2)}
.foot .gh{display:inline-flex;align-items:center;gap:8px;vertical-align:bottom;min-height:24px}
.notes{overflow-wrap:break-word;font-family:var(--font);font-size:1.0625rem;line-height:1.65}
.notes strong{font-weight:700}
.notes blockquote{margin:12px 0 20px;padding:12px 16px;border-radius:var(--r);background:var(--tint);font-size:var(--t-s)}
.notes blockquote p{margin:0}
.notes blockquote p::before{content:"Watch out. ";font-style:normal;font-weight:700;color:var(--wrong)}
.notes ol,.notes ul{padding-left:24px}
.notes h1{font-size:var(--t-xl);margin-top:28px}
.notes h2{border-top:1px solid var(--hair);padding-top:16px;margin-top:28px}
.notes h3{font-size:var(--t-m);margin-top:24px}
.notes h2{font-size:var(--t-l)}
.notes h4{font:700 var(--t-l)/1.3 var(--font);margin:20px 0 0;border-top:1px solid var(--hair);padding-top:12px}
/* On a week page the sheet title is an h3 and its sections are h4, so the title must be the larger one. */
.wk-notes h3{font-size:var(--t-l);margin-top:32px}
.wk-notes h4{font-size:var(--t-m)}
.notes table{display:block;overflow-x:auto;border-collapse:collapse;margin:12px 0;font-size:var(--t-s);font-variant-numeric:tabular-nums}
.notes td,.notes th{border-bottom:1px solid var(--hair);padding:8px 16px 8px 0;text-align:left;vertical-align:top}
.notes li{margin:4px 0}
dialog{border:1.5px solid var(--ink);border-radius:var(--r);padding:20px;max-width:min(420px,calc(100% - 40px));color:var(--ink)}
dialog::backdrop{background:var(--veil)}
dialog .nav{margin-top:20px}

/* home */
.kick{font-size:var(--t-s);color:var(--ink-2);margin:0}
.next{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:20px;margin-top:16px}
.next small{display:block;font-size:var(--t-s);color:var(--ink-3)}
.next b{display:block;font-size:var(--t-l);line-height:1.3;margin:4px 0 16px;overflow-wrap:break-word}
.next button{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.next button:focus-visible{outline-color:var(--paper)}
.then{margin-top:28px}
.then h2,.wh{margin:0;font-size:var(--t-m)}
.then button{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:12px 0;font-weight:400}
.then button span{color:var(--ink-2);font-size:var(--t-s)}
.then button:hover b{text-decoration:underline}
.plot td .tr{display:block;font-size:var(--t-xs);font-weight:400}
.sq summary{list-style:none;cursor:pointer}.sq summary::-webkit-details-marker{display:none}.sq summary{font-weight:700;padding:12px 0}.sq .pm::after{content:" +";color:var(--ink-2)}.sq[open] .pm::after{content:" -"}
.sq{margin-top:28px}
.more{margin-top:24px}
.menu h2{font-size:var(--t-m);margin-top:28px}
</style>
</head>
<body>
<noscript><p style="padding:20px">This practice page needs JavaScript switched on.</p></noscript>
<main id="app"></main>
<dialog id="dlg" aria-labelledby="dlg-t"><p id="dlg-t"></p><div class="nav"><button id="dlg-no">Keep answering</button><button class="p" id="dlg-yes">Hand in the paper</button></div></dialog>
<script>
const DATA = /*DATA*/;
const WEEKS = {1:"Introduction to AI, data and EDA",2:"Classification",3:"Regression",4:"Clustering and PCA",5:"Reinforcement learning and genetic algorithms",6:"Neural network basics",7:"Backpropagation",8:"Convolutional networks",9:"Segmentation and object detection",10:"Recurrent networks",11:"Natural language processing"};
const DECKS = {w01a:"Week 1, Introduction to AI",w01b:"Week 1, Data and EDA",w02:"Week 2, Classification",w03:"Week 3, Regression",w04:"Week 4, Clustering and PCA",w05a:"Week 5, Reinforcement learning",w05b:"Week 5, Genetic algorithms",w06:"Week 6, Neural network basics",w07:"Week 7, Backpropagation",w08:"Week 8, Convolutional networks",w09:"Week 9, Segmentation and detection",w10:"Week 10, Recurrent networks",w11:"Week 11, Natural language processing"};
// Viridis in ten steps, the default colormap of the plots in the practicals. Dark text from step 5 up.
const VIR = ["#440154","#482878","#3e4a89","#31688e","#26828e","#1f9e89","#35b779","#6ece58","#b5de2b","#fde725"];
const Q = DATA.questions, BYID = Object.fromEntries(Q.map(q => [q.id, q]));
const FOCUS = Q.filter(q => q.focus).sort((a, b) => a.week - b.week);
const MOCK = Q.filter(q => q.mock).sort((a, b) => a.week - b.week || (a.id < b.id ? -1 : 1));
const BYDECK = Object.fromEntries(Q.map(q => [q.deck, q.week]));
const LS = "ai-quiz-v1";
let st = {sc:{}, seen:{}, run:null, hist:[], ai:"claude", aiTemp:false, core:true};
try { Object.assign(st, JSON.parse(localStorage.getItem(LS) || "{}")); } catch(e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch(e) {} };
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isEx = q => q.type === "explain";
const marks = q => isEx(q) ? q.points.length : 1;
const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const pool = () => Q;
const weeksPresent = [...new Set(Q.map(q => q.week))].sort((a, b) => a - b);
let tick = null, first = true;
const focusOn = sel => { const e = app.querySelector(sel); if (e) { e.tabIndex = -1; e.focus({preventScroll:true}); } };
const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
// Weakest first: never tried, then lowest score, then least seen.
const weakest = qs => shuffle(qs).sort((a, b) => ((st.sc[a.id] ?? -1) - (st.sc[b.id] ?? -1)) || ((st.seen[a.id] || 0) - (st.seen[b.id] || 0)));

const TICK = `<svg class="mk" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 12l5 5L18 6" fill="none" stroke="var(--right)" stroke-width="3"/></svg>`;
const CROSS = `<svg class="mk" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 5l12 12M17 5L5 17" fill="none" stroke="var(--wrong)" stroke-width="3"/></svg>`;
const FOOT = `<footer class="foot"><p><a href="https://faaja.space/">All three modules: faaja.space</a></p>
  <p>Created by <a href="https://www.ibrahimuthman.me/">Ibrahim Uthman</a>. If it helped, <a class="gh" href="https://github.com/IbdotBoss/ai-quiz">star it on GitHub<svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>.</p></footer>`;

/* ---------- asking an AI assistant ---------- */
// No key and no backend. The question goes to the assistant as a prefilled prompt and is also copied,
// because prefill support differs between assistants and changes without notice.
const AI = {
  claude:{name:"Claude", url:q => "https://claude.ai/new?q=" + encodeURIComponent(q), priv:q => "https://claude.ai/new?incognito=true&q=" + encodeURIComponent(q)},
  chatgpt:{name:"ChatGPT", url:q => "https://chatgpt.com/?q=" + encodeURIComponent(q), priv:q => "https://chatgpt.com/?temporary-chat=true&q=" + encodeURIComponent(q)},
  perplexity:{name:"Perplexity", url:q => "https://www.perplexity.ai/search?q=" + encodeURIComponent(q)},
  gemini:{name:"Gemini", url:null, open:"https://gemini.google.com/app"}
};
const INTRO = "I am revising for a university Artificial Intelligence in-class test. The questions are descriptive, test basic understanding and need no calculations. Use plain language and keep your reply under 200 words.";
function prompt(q, mode, mine) {
  const L = [INTRO, "", "QUESTION", q.q, ""];
  if (isEx(q)) {
    if (mode === "hint") return L.concat(mine ? ["MY ANSWER SO FAR", mine, ""] : [], "Do not give me the full answer. Give me one hint that points me towards what a good answer covers, then ask me to try again.").join("\n");
    return L.concat("MY ANSWER", mine || "I did not write an answer.", "", "MODEL ANSWER", q.model, "", "POINTS A MARKER LOOKS FOR", q.points.map(p => "- " + p).join("\n"), "",
      "Mark my answer against those points. Say which points I made, which I missed, and correct anything I got wrong. Then ask me one follow-up question that checks I understand the idea.").join("\n");
  }
  const letter = i => String.fromCharCode(65 + i), list = a => a.map(i => letter(i) + ". " + q.options[i]).join("\n") || "Nothing";
  const ok = same(mine, q.answer);
  return L.concat("OPTIONS", list(q.options.map((_, i) => i)), "", "CORRECT", list(q.answer), "", "I CHOSE", list(mine), "",
    ok ? "I got this right. Explain the idea behind it one level deeper, then ask me one follow-up question that checks I understand it."
       : "I got this wrong. Explain what I was probably thinking, why the correct answer is right, and the one idea to remember. Then ask me one follow-up question.").join("\n");
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e) { try { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; } catch(e2) { return false; } }
}
const aiRow = buttons => `<div class="ai">${buttons.map(([mode, text]) => `<button data-ai="${mode}">${text}</button>`).join("")}<span class="s" id="ai-st" role="status"></span></div>`;
async function sendAi(text, out) {
  const t = AI[st.ai] || AI.claude, copied = await copy(text);
  {
    const fits = t.url && encodeURIComponent(text).length < 6000;
    const temp = st.aiTemp && t.priv;
    if (fits) { window.open((temp ? t.priv : t.url)(text), "_blank", "noopener,noreferrer"); out.textContent = `Opened ${t.name}${temp ? " in a temporary chat" : ""}.${copied ? " The prompt is also copied, so paste it if the box is empty." : ""}`; }
    else if (copied) { out.innerHTML = `Prompt copied. <a href="${t.open || t.url("").split("?")[0]}" target="_blank" rel="noopener noreferrer">Open ${t.name}</a> and paste it.`; }
    else out.textContent = "Copying failed in this browser. Choose a different assistant under Ask AI on the Notes, sets and papers page.";
  }
}
function wireAi(q, getMine) {
  app.querySelectorAll("[data-ai]").forEach(b => b.onclick = () => sendAi(prompt(q, b.dataset.ai, getMine()), document.getElementById("ai-st")));
}
const aiName = () => (AI[st.ai] || AI.claude).name;

/* ---------- home ---------- */
function cell(week, ex) {
  const qs = pool().filter(q => q.week === week && isEx(q) === ex), tried = qs.filter(q => q.id in st.sc);
  const frac = tried.length ? tried.reduce((s, q) => s + st.sc[q.id], 0) / tried.length : 0;
  return {qs, tried:tried.length, frac};
}
const weakQ = () => pool().filter(q => q.id in st.sc && st.sc[q.id] < 1);
const exQ = () => pool().filter(isEx), mcQ = () => pool().filter(q => !isEx(q)), byId = (a, b) => a.id < b.id ? -1 : 1;
const goWeek = w => { week(w); window.scrollTo(0, 0); };
// The real format: 10 multiple choice and 4 written, each from a different week, 50 minutes.
function timed() {
  const pick = (qs, n) => { const ids = []; shuffle(weeksPresent).forEach(w => { const q = weakest(qs.filter(q => q.week === w))[0]; if (q && ids.length < n) ids.push(q.id); }); return ids; };
  start({title:"Timed paper", ids:[...pick(mcQ(), 10), ...pick(exQ(), 4)], exam:true, limit:50 * 60});
}
function home() {
  clearInterval(tick);
  const resume = st.run && !st.run.done, toMark = st.run && st.run.done && st.run.exam;
  const left = resume && st.run.limit ? Math.ceil(timeLeft() / 60) : 0;
  // Stable pick so the card does not change on every visit: lowest score, then earliest week.
  const top = FOCUS.slice().sort((a, b) => ((st.sc[a.id] ?? -1) - (st.sc[b.id] ?? -1)) || a.week - b.week)[0], redo = weakQ().length;

  // An untouched week other than the one the card already points to.
  const fresh = weeksPresent.find(w => !cell(w, true).tried && !cell(w, false).tried && !(top && !resume && !toMark && w === top.week));
  let card;
  if (resume) card = [`You stopped at question ${st.run.i + 1} of ${st.run.ids.length}${st.run.limit ? (left ? `, ${left} min left` : ", time is up") : ""}`, st.run.title, "Resume"];
  else if (toMark) card = ["Handed in and waiting for your marks", st.run.title, "Mark it"];
  else if (top && (st.sc[top.id] ?? -1) >= 1) card = ["Every test focus answer has full marks", "Timed paper, 4 written and 10 multiple choice", "Start the paper"];
  else if (top) card = [top.id in st.sc ? `Your weakest broad written answer, ${Math.round(st.sc[top.id] * 100)}% last time` : "A broad written question like the real test asks", `Week ${top.week}, ${top.topic}`, "Answer it"];
  const then = [];
  if (redo) then.push(["t-redo", `Redo ${Math.min(redo, 20)} ${redo === 1 ? "question" : "questions"} you lost marks on`, "From your earlier sets"]);
  if (fresh) then.push(["t-week", `Start week ${fresh}, ${WEEKS[fresh] || ""}`, "Nothing tried yet. Opens its notes and questions"]);
  if ((resume || toMark) && top && (st.sc[top.id] ?? -1) < 1 && top.week !== fresh && then.length < 2) then.push(["t-focus", "Answer a broad written question", `Week ${top.week}, ${top.topic}`]);
  if (then.length < 2 && !(card && card[2] === "Start the paper")) then.push(["t-timed", "Sit the timed paper", "4 written and 10 multiple choice in 50 minutes, like the real test"]);
  const td = (w, ex) => {
    const c = cell(w, ex), kind = ex ? "written answer" : "multiple choice";
    if (!c.qs.length) return "<td></td>";
    const pct = Math.round(c.frac * 100), bin = Math.min(9, Math.floor(c.frac * 10));
    return c.tried
      ? `<td><button data-w="${w}" data-ex="${ex ? 1 : 0}" style="background:${VIR[bin]};color:${bin > 4 ? "var(--ink)" : "var(--paper)"}" aria-label="Week ${w}, ${kind} questions. ${pct} percent right, ${c.tried} of ${c.qs.length} tried. Practise.">${pct}%<small class="tr">${c.tried} of ${c.qs.length}</small></button></td>`
      : `<td><button class="new" data-w="${w}" data-ex="${ex ? 1 : 0}" aria-label="Week ${w}, ${kind} questions. Not started, ${c.qs.length} questions. Practise.">new</button></td>`;
  };
  app.innerHTML = `
  <p class="kick">Week 12 test, 50 minutes</p>
  <h1>Next up</h1>
  ${card ? `<div class="next"><small>${esc(card[0])}</small><b>${esc(card[1])}</b><button id="go">${card[2]}</button></div>` : ""}
  ${then.length ? `<div class="then"><h2>Then</h2>${then.map(t => `<button id="${t[0]}"><b>${esc(t[1])}</b><span>${esc(t[2])}</span></button>`).join("")}</div>` : ""}
  <details class="sq"><summary id="hm">Marks by week<span aria-hidden="true" class="pm"></span></summary>
  <table class="plot" aria-labelledby="hm">
    <thead><tr><th scope="col"><span class="vh">Week</span></th><th scope="col">Multiple choice</th><th scope="col">Written</th></tr></thead>
    <tbody>${weeksPresent.map(w => `<tr><th scope="row"><button class="wk" data-week="${w}" aria-label="Week ${w}, ${esc(WEEKS[w] || "")}. Open notes and questions."><b>${w}</b><span>${esc(WEEKS[w] || "")}</span></button></th>${td(w, false)}${td(w, true)}</tr>`).join("")}</tbody>
  </table>
  <div class="key"><span>0%</span><span class="sw" aria-hidden="true">${VIR.map(c => `<i style="background:${c}"></i>`).join("")}</span><span>100% right</span><span class="nw" aria-hidden="true"></span><span>not tried</span></div>
  </details>
  <p class="more"><button class="l" id="all">All notes, sets and papers</button></p>
  ${FOOT}`;
  if (!first) focusOn("h1"); first = false;
  app.querySelectorAll(".wk").forEach(b => b.onclick = () => goWeek(+b.dataset.week));
  app.querySelectorAll(".plot td button").forEach(b => b.onclick = () => {
    const w = +b.dataset.w, ex = b.dataset.ex === "1", c = cell(w, ex);
    start({title:`Week ${w}, ${ex ? "written answers" : "multiple choice"}`, ids:weakest(c.qs).slice(0, ex ? 5 : 10).map(q => q.id)});
  });
  const one = () => start({title:`Test focus, Week ${top.week}`, ids:[top.id]});
  const allDone = !resume && !toMark && top && (st.sc[top.id] ?? -1) >= 1;
  on("go", resume || toMark ? () => show() : allDone ? timed : one);
  on("t-focus", one);
  on("t-redo", () => start({title:"Questions to redo", ids:weakest(weakQ()).slice(0, 20).map(q => q.id)}));
  on("t-week", () => goWeek(fresh));
  on("t-timed", timed);
  // Keep the minutes on the card current while home is open.
  if (resume && st.run.limit) tick = setInterval(() => { const m = Math.ceil(timeLeft() / 60), el = app.querySelector(".next small"); if (el) el.textContent = `You stopped at question ${st.run.i + 1} of ${st.run.ids.length}, ${m ? m + " min left" : "time is up"}`; if (!m) clearInterval(tick); }, 15000);
  on("all", () => { menu(); window.scrollTo(0, 0); });
}

  <p><button class="l" id="reset">Clear my progress</button></p>
  </div>${FOOT}`;
  focusOn("h1");
  on("back", () => { home(); window.scrollTo(0, 0); });

// One row on the list. btns is a list of [id, label, primary, disabled].
function paper(title, desc, meta, btns) {
  return `<div class="paper"><div><b>${esc(title)}</b><span>${esc(desc)}</span><span class="m">${esc(meta)}</span></div>
    <div class="acts">${btns.map(b => `<button id="${b[0]}" class="${b[2] ? "p" : ""}" ${b[3] ? "disabled" : ""} aria-label="${esc(b[1] + ", " + title)}">${b[1]}</button>`).join("")}</div></div>`;
}

// Study view. Every question on one page with its answer showing.
function study(title, ids, test, back = home, backLabel = "Back to the home page") {
  clearInterval(tick);
  app.innerHTML = `<div class="top"><button class="l" id="back">${esc(backLabel)}</button><b>Study</b><span>${ids.length} questions</span></div>
  <h1 style="margin-top:24px">${esc(title)}</h1>
  <p class="s">Every answer is showing. Read through, then test yourself.</p>
  <div class="nav"><span></span><button id="t1">Test me on these</button></div>
  ${ids.map((id, i) => {
    const q = BYID[id];
    return `<section class="rev"><div class="meta"><span>Question ${i + 1}. Week ${q.week}, ${esc(q.topic)}</span><span>${marks(q)} ${marks(q) === 1 ? "mark" : "marks"}</span></div><h2 class="stem">${esc(q.q)}</h2>
    ${isEx(q) ? `<h3 class="sub">Model answer</h3><p>${esc(q.model)}</p><h3 class="sub">Points a marker looks for</h3><ul class="pl">${q.points.map(pt => `<li>${esc(pt)}</li>`).join("")}</ul>${srcLine(q)}`
      : `${q.options.map((o, k) => optRow(q, k, false, q.answer.includes(k) ? "key" : "", true)).join("")}<p>${esc(q.explain)}</p>${srcLine(q)}`}</section>`;
  }).join("")}
  <div class="nav"><button id="up">Back to the top</button><button class="p" id="t2">Test me on these</button></div>${FOOT}`;
  focusOn("h1"); window.scrollTo(0, 0);
  on("back", () => { back(); window.scrollTo(0, 0); }); on("t1", test); on("t2", test); on("up", () => { window.scrollTo(0, 0); focusOn("h1"); });
}

/* ---------- a run of questions ---------- */
function start(o) {
  if (st.run && !st.run.done && !confirm(`This replaces your unfinished ${st.run.title.toLowerCase()}. Start the new one?`)) return;
  if (st.run && st.run.done && st.run.exam && !confirm(`This clears your handed-in ${st.run.title.toLowerCase()} and any marks you have not ticked. Start the new one?`)) return;
  const order = {};
  o.ids.forEach(id => { const q = BYID[id]; if (!isEx(q)) order[id] = shuffle([...q.options.keys()]); });
  st.run = {title:o.title, ids:o.ids, exam:!!o.exam, limit:o.limit || 0, t0:Date.now(), i:0, ans:{}, text:{}, pts:{}, auto:{}, checked:{}, order, done:false};
  save(); show(); window.scrollTo(0, 0);
}
function show() { const r = st.run; if (!r) return home(); r.done ? results() : question(); }
const timeLeft = () => Math.max(0, st.run.limit - Math.floor((Date.now() - st.run.t0) / 1000));
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const answered = (r, id) => isEx(BYID[id]) ? !!(r.text[id] || "").trim() : !!(r.ans[id] || []).length;
const got = (r, q) => isEx(q) ? (r.pts[q.id] || []).length : (same(r.ans[q.id] || [], q.answer) ? 1 : 0);
function record(r, q) { st.seen[q.id] = (st.seen[q.id] || 0) + 1; st.sc[q.id] = got(r, q) / marks(q); }

// Key terms of a marking point: its content words, cut to a rough stem so "clusters" matches "cluster".
const STOP = new Set("about above after again also and another any are because been before being between both but can cannot could does doing done each either every for from given gives have having how into its itself just like made make makes many may more most much must need needs not one only other over same should some such than that the their them then there these they this those through too under until used uses using very was were what when where which while who why will with within without would your says say said states state mentions mention describes describe names name gives explains explain identifies identify links link notes note valid correct correctly example sensible suitable clear least".split(" "));
const stemWord = w => w.replace(/(ations?|ising|izing|ised|ized|ing|ies|ed|es|s)$/, "");
const terms = text => [...new Set((text.toLowerCase().match(/[a-z][a-z-]{2,}/g) || []).filter(w => !STOP.has(w)).map(stemWord).filter(w => w.length > 2))];
// Which points does the answer seem to cover? A point counts when at least half of its key terms appear.
function autoTick(q, text) {
  const mine = new Set(terms(text));
  return q.points.map((p, i) => { const t = terms(p), hit = t.filter(w => mine.has(w)); return t.length && hit.length >= Math.max(1, Math.ceil(t.length / 2)) ? i : -1; }).filter(i => i >= 0);
}
// A hint from the marking points, made on the page: the key words of one more point each time. Nothing is sent anywhere.
const hintWords = p => [...new Set((p.match(/[A-Za-z][A-Za-z-]{3,}/g) || []).filter(w => !STOP.has(w.toLowerCase())))].slice(0, 4).join(", ");
function hintBlock(q, r) {
  const n = ((r.hint || {})[q.id]) || 0, N = q.points.length;
  return `<div class="ai">${n < N ? `<button id="hint">${n ? "Another hint" : "Get a hint"}</button>` : ""}<span class="s">${n ? "" : `A full answer makes ${N} points.`}</span></div>${n ? `<ul class="pl hints">${q.points.slice(0, n).map((p, i) => `<li>Point ${i + 1} of ${N} uses words like: ${esc(hintWords(p))}</li>`).join("")}</ul>` : ""}`;
}
const stateOf = (q, k, picked) => q.answer.includes(k) ? (picked.includes(k) ? "right" : "missed") : (picked.includes(k) ? "wrong" : "");
function optRow(q, k, sel, state, locked) {
  const label = {right:"Your answer. Right.", missed:q.type === "multi" ? "Right answer. You did not choose it." : "This is the right answer.", wrong:"Your answer. Wrong.", key:"Right answer."}[state] || "";
  return `<label class="o"><input type="${q.type === "multi" ? "checkbox" : "radio"}" name="o" value="${k}" ${sel ? "checked" : ""} ${locked ? "disabled" : ""}>
    <span>${esc(q.options[k])}${label ? `<small${state === "wrong" ? "" : ' class="ok"'}>${label}</small>` : ""}</span>
    ${state === "wrong" ? CROSS : state ? TICK : "<span></span>"}</label>`;
}
const srcLine = q => `<p class="s">${esc(q.source)}</p>${q.flag ? `<p class="flag"><b>Note on this question.</b> ${esc(q.flag)}</p>` : ""}`;
// The model answer with its marking points. live lets the points be ticked.
function modelBlock(q, r, live, h) {
  const mine = r.pts[q.id] || [];
  return `<${h} class="sub">Model answer</${h}><p>${esc(q.model)}</p>
    <fieldset class="pts" data-id="${q.id}"><legend><${h} class="sub">Tick each point your answer made</${h}></legend>
    <p class="s">${(r.auto[q.id] || []).length ? `Key terms from ${r.auto[q.id].length} of ${q.points.length} points appear in your answer. The page matches words and cannot judge meaning, so it ticks nothing. Only your ticks count.` : (r.text[q.id] || "").trim() ? "The page found too few key terms from any point in your answer. Tick the points you did make." : "You did not write an answer, so nothing is ticked."}</p>
    ${q.points.map((p, i) => `<label class="o"><input type="checkbox" value="${i}" ${mine.includes(i) ? "checked" : ""} ${live ? "" : "disabled"}><span>${esc(p)}${(r.auto[q.id] || []).includes(i) ? `<small class="ok">Key terms found. Did you make this point?</small>` : ""}</span><span></span></label>`).join("")}</fieldset>${srcLine(q)}`;
}

function question() {
  clearInterval(tick);
  const r = st.run, q = BYID[r.ids[r.i]], n = r.ids.length, ex = isEx(q), checked = !r.exam && r.checked[q.id];
  const picked = r.ans[q.id] || [];
  const body = ex
    ? `<h1 class="stem"><label for="ans">${esc(q.q)}</label></h1><span class="how">Write a short paragraph in your own words.</span>
       ${checked ? `<p class="yours">${esc(r.text[q.id] || "No answer written.")}</p>` : `<textarea id="ans" spellcheck="true">${esc(r.text[q.id] || "")}</textarea>`}`
    : `<fieldset><legend><h1 class="stem">${esc(q.q)}</h1><span class="how">${q.type === "multi" ? "More than one answer is right. Choose all of them." : "Choose one answer."}</span></legend>
       ${r.order[q.id].map(k => optRow(q, k, picked.includes(k), checked ? stateOf(q, k, picked) : "", checked)).join("")}</fieldset>`;
  const fb = !checked ? "" : `<div class="fb" role="status">${ex ? modelBlock(q, r, true, "h2") : `<p>${esc(q.explain)}</p>${srcLine(q)}`}
    ${aiRow([["mark", ex ? `Ask ${aiName()} to mark it` : `Ask ${aiName()} about this`]])}</div>`;
  const n2 = r.ids.filter(id => answered(r, id)).length;
  app.innerHTML = `
  <div class="top"><button class="l" id="quit">${r.limit ? "Leave, clock keeps running" : "Save and leave"}</button><b>${esc(r.title)}</b>${r.limit ? `<span class="timer" id="tm" role="timer" aria-label="Time left"></span>` : `<span>Question ${r.i + 1} of ${n}</span>`}</div>
  <div class="meta"><span>Week ${q.week}, ${esc(q.topic)}</span><span>${checked ? `${got(r, q)} of ${marks(q)} ${marks(q) === 1 ? "mark" : "marks"}` : `${marks(q)} ${marks(q) === 1 ? "mark" : "marks"}`}</span></div>
  ${body}${fb}
  ${ex && !checked && !r.exam ? hintBlock(q, r) : ""}
  <div class="nav">
    <button id="prev" ${r.i ? "" : "disabled"}>Previous question</button>
    ${r.exam ? (r.i < n - 1 ? `<button class="p" id="next">Next question</button>` : `<button class="p" id="fin">Hand in the paper</button>`)
      : (checked ? `<button class="p" id="next">${r.i < n - 1 ? "Next question" : "See my marks for this set"}</button>` : `<button class="p" id="chk">${ex ? "Show the model answer" : "Check my answer"}</button>`)}
  </div>
  ${r.exam ? `<details open><summary>Go to a question. ${n2} of ${n} answered.</summary><div class="grid">${r.ids.map((id, i) => `<button data-i="${i}" class="${answered(r, id) ? "done" : ""} ${i === r.i ? "cur" : ""}" aria-label="Question ${i + 1}, ${answered(r, id) ? "answered" : "not answered"}"${i === r.i ? ' aria-current="true"' : ""}>${i + 1}</button>`).join("")}</div><button id="fin2">Hand in the paper</button></details>` : ""}`;

  const ta = document.getElementById("ans");
  if (ta) ta.oninput = () => { r.text[q.id] = ta.value; save(); };
  app.querySelectorAll("input[name=o]").forEach(e => e.onchange = () => { r.ans[q.id] = [...app.querySelectorAll("input[name=o]:checked")].map(x => +x.value); save(); });
  app.querySelectorAll(".pts input").forEach(e => e.onchange = () => {
    r.pts[q.id] = [...app.querySelectorAll(".pts input:checked")].map(x => +x.value); st.sc[q.id] = got(r, q) / marks(q); save();
    app.querySelector(".meta span:last-child").textContent = `${got(r, q)} of ${marks(q)} marks`;
  });
  wireAi(q, () => ex ? (r.text[q.id] || "").trim() : (r.ans[q.id] || []));
  focusOn(checked ? ".fb" : ex ? "#ans" : "legend");
  const go = i => { r.i = i; save(); question(); window.scrollTo(0, 0); };
  on("quit", () => { save(); home(); window.scrollTo(0, 0); });
  on("prev", () => go(r.i - 1));
  on("next", () => r.i < n - 1 ? go(r.i + 1) : finish());
  on("hint", () => { r.hint = r.hint || {}; r.hint[q.id] = (r.hint[q.id] || 0) + 1; save(); question(); });
  on("chk", () => { r.checked[q.id] = true; if (ex) { r.auto[q.id] = autoTick(q, r.text[q.id] || ""); r.pts[q.id] = []; } record(r, q); save(); question(); });
  const fin = () => {
    const left = r.ids.filter(id => !answered(r, id)).length;
    const d = document.getElementById("dlg");
    document.getElementById("dlg-t").textContent = left ? `${left} ${left === 1 ? "question has" : "questions have"} no answer. You cannot change answers after handing in.` : "Every question has an answer. You cannot change answers after handing in.";
    document.getElementById("dlg-no").onclick = () => d.close();
    document.getElementById("dlg-yes").onclick = () => { d.close(); finish(); };
    d.showModal();
  };
  on("fin", fin); on("fin2", fin);
  app.querySelectorAll(".grid button").forEach(b => b.onclick = () => go(+b.dataset.i));
  if (r.limit) {
    const tm = document.getElementById("tm");
    const upd = () => { const s = timeLeft(); tm.textContent = fmt(s) + " left"; tm.classList.toggle("low", s < 300); if (!s) { clearInterval(tick); document.getElementById("dlg").close(); finish(); } };
    upd(); if (timeLeft()) tick = setInterval(upd, 1000);
  }
}

function finish() {
  clearInterval(tick);
  const r = st.run; if (r.done) return;
  r.done = true; r.took = Math.floor((Date.now() - r.t0) / 1000); if (r.limit) r.took = Math.min(r.took, r.limit);
  if (r.exam) r.ids.forEach(id => { const q = BYID[id]; if (isEx(q)) { r.auto[id] = autoTick(q, r.text[id] || ""); r.pts[id] = []; } if (!isEx(q) && (answered(r, id) || id in st.sc)) record(r, q); else if (isEx(q)) st.seen[id] = (st.seen[id] || 0) + 1; });
  st.hist.push({title:r.title, score:0, total:0, at:Date.now()}); st.hist = st.hist.slice(-30);
  tally(); save(); results(); window.scrollTo(0, 0);
}
// Explain questions in a timed paper are marked on the results page, so the total can change after finishing.
function tally() {
  const r = st.run, h = st.hist[st.hist.length - 1];
  r.score = r.ids.reduce((s, id) => s + got(r, BYID[id]), 0); r.total = r.ids.reduce((s, id) => s + marks(BYID[id]), 0);
  if (h) { h.score = r.score; h.total = r.total; }
}

function results() {
  const r = st.run, toMark = r.exam && r.ids.some(id => isEx(BYID[id]));
  const line = () => `${r.score} of ${r.total} marks`;
  app.innerHTML = `<div class="top"><button class="l" id="back">Back to the home page</button><b>${esc(r.title)}</b><span></span></div>
  <h1 style="margin-top:24px">${toMark ? "Mark your paper" : "Your marks for this set"}</h1>
  <p class="total" id="tot" aria-live="polite">${line()}</p>
  <p class="s">${r.ids.length} questions in ${fmt(r.took)}${r.limit && r.took >= r.limit ? ". Time ran out" : ""}.${toMark ? " Tick the points you made in each written answer to mark it. The total updates as you tick. A written answer you do not mark keeps its earlier score. Tick before you leave this page, because leaving clears the paper." : ""} Any question you lose a mark on goes into Questions to redo on the home page.</p>
  ${r.ids.map((id, i) => {
    const q = BYID[id], pk = r.ans[id] || [];
    return `<section class="rev"><div class="meta"><span>Question ${i + 1}. Week ${q.week}, ${esc(q.topic)}</span><span data-got="${id}">${got(r, q)} of ${marks(q)} ${marks(q) === 1 ? "mark" : "marks"}</span></div><h2 class="stem">${esc(q.q)}</h2>
    ${isEx(q) ? `<h3>Your answer</h3><p class="yours">${esc(r.text[id] || "No answer written.")}</p>${modelBlock(q, r, true, "h3")}` : `${r.order[id].map(k => optRow(q, k, pk.includes(k), stateOf(q, k, pk), true)).join("")}<p>${esc(q.explain)}</p>${srcLine(q)}`}</section>`;
  }).join("")}
  <div class="nav"><span></span><button class="p" id="back2">Back to the home page</button></div>${FOOT}`;
  app.querySelectorAll(".pts").forEach(fs => fs.onchange = () => {
    const id = fs.dataset.id, q = BYID[id];
    r.pts[id] = [...fs.querySelectorAll("input:checked")].map(x => +x.value); st.sc[id] = got(r, q) / marks(q); tally(); save();
    app.querySelector(`[data-got="${id}"]`).textContent = `${got(r, q)} of ${marks(q)} marks`;
    document.getElementById("tot").textContent = line();
  });
  focusOn("h1");
  const back = () => { if (toMark && !confirm("Leave and clear this paper? Tick the points you made first if you want your mark.")) return; st.run = null; save(); home(); window.scrollTo(0, 0); };
  on("back", back); on("back2", back);
}

// A box for the student's own question. about names the subject, covers lists its topics.
const aiSum = () => (AI[st.ai] || AI.claude).url ? `Ask AI settings. The buttons open ${aiName()}.` : `Ask AI settings. The buttons copy your question to paste into ${aiName()}.`;
const askBox = (about, example) => `<h2><label for="ask">Ask ${aiName()} about ${esc(about)}</label></h2>
  <p class="s" id="ask-h">Type your own question. ${(AI[st.ai] || AI.claude).url ? `Send opens ${aiName()}${st.aiTemp && (AI[st.ai] || AI.claude).priv ? " in a temporary chat" : ""} with your question and the topics of ${esc(about)} filled in.` : `Gemini cannot be filled in from a link, so Copy for Gemini copies your question and the topics of ${esc(about)} for you to paste into Gemini.`}</p>
  <textarea id="ask" class="short" aria-describedby="ask-h ask-st" placeholder="For example, ${esc(example)}"></textarea>
  <div class="ai"><button class="p" id="ask-go">${(AI[st.ai] || AI.claude).url ? "Send to" : "Copy for"} ${aiName()}</button><span class="s" id="ask-st" role="status"></span></div>`;
function wireAsk(about, topics) {
  on("ask-go", () => {
    const mine = document.getElementById("ask").value.trim(), out = document.getElementById("ask-st");
    if (!mine) { out.textContent = "Type a question first."; document.getElementById("ask").focus(); return; }
    sendAi([INTRO, "", `The question is about ${about} of the module. It covers ${topics.join(", ")}.`, "", "MY QUESTION", mine, "",
      "Answer it directly, then ask me one follow-up question that checks I understand."].join("\n"), out);
  });
}
const EXAMPLES = {1:"what is the difference between weak AI and strong AI?", 2:"when should I look at recall instead of accuracy?", 3:"why does squaring errors punish large mistakes more?", 4:"why does k-means need the number of clusters in advance?", 5:"what does the Q-table store?", 6:"why can a single perceptron not learn XOR?", 7:"why does backpropagation need the chain rule?", 8:"what does pooling do to a feature map?", 9:"how is segmentation different from object detection?", 10:"why does an LSTM remember longer than a simple RNN?"};

function week(w) {
  clearInterval(tick);
  const sheets = DATA.notes.filter(n => (BYDECK[n.deck] || 0) === w);
  const topics = [...new Set(Q.filter(q => q.week === w).map(q => q.topic))];
  const line = ex => { const c = cell(w, ex); return c.tried ? `${Math.round(c.frac * 100)}% right, ${c.tried} of ${c.qs.length} tried` : `${c.qs.length} questions, not started`; };
  app.innerHTML = `<div class="top"><button class="l" id="back">Back to the home page</button><b>Week ${w}</b><span></span></div>
  <h1 style="margin-top:24px">Week ${w}, ${esc(WEEKS[w] || "")}</h1>
  <div class="papers" style="margin-top:20px">
    <button id="w-st"><b>Study the answers</b><span>Every question for this week with its answer showing.</span><i>${cell(w, true).qs.length + cell(w, false).qs.length} questions</i></button>
    <button id="w-mc"><b>Multiple choice</b><span>Up to 10 questions, starting with the ones you get wrong.</span><i>${line(false)}</i></button>
    <button id="w-ex"><b>Written answers</b><span>Up to 5 questions. Type a paragraph, then mark it against a model answer.</span><i>${line(true)}</i></button>
  </div>
  <h2>Notes for Week ${w}</h2>
  <div class="notes wk-notes">${sheets.map(n => n.html.replace(/<(\/?)h2/g, "<$1h4").replace(/<(\/?)h1/g, "<$1h3")).join("") || "<p>No notes for this week yet.</p>"}</div>
  ${askBox("Week " + w, EXAMPLES[w] || "")}${FOOT}`;
  focusOn("h1");
  on("back", () => { home(); window.scrollTo(0, 0); });
  const go = ex => start({title:`Week ${w}, ${ex ? "written answers" : "multiple choice"}`, ids:weakest(cell(w, ex).qs).slice(0, ex ? 5 : 10).map(q => q.id)});
  on("w-mc", () => go(false)); on("w-ex", () => go(true));
  on("w-st", () => study(`Week ${w}, ${WEEKS[w] || ""}`, [...cell(w, true).qs, ...cell(w, false).qs].map(q => q.id), () => start({title:`Week ${w}`, ids:[...weakest(cell(w, true).qs).slice(0, 5), ...weakest(cell(w, false).qs).slice(0, 10)].map(q => q.id)}), () => week(w), `Back to week ${w}`));
  wireAsk(`Week ${w}, ${WEEKS[w]},`, topics);
}

function notes(deck) {
  const n = DATA.notes.find(x => x.deck === deck) || DATA.notes[0];
  app.innerHTML = `<div class="top"><button class="l" id="back">Back to the home page</button><b>Revision notes</b><span></span></div>
  <h1 style="margin-top:24px">Revision notes</h1>
  <p style="margin-top:16px"><label for="sheet" class="s" style="display:block;margin-bottom:4px">Lecture deck</label><select id="sheet">${DATA.notes.map(x => `<option value="${x.deck}" ${x === n ? "selected" : ""}>${esc(DECKS[x.deck] || x.deck)}</option>`).join("")}</select></p>
  <div class="notes">${n ? n.html.replace(/<(\/?)h2/g, "<$1h3").replace(/<(\/?)h1/g, "<$1h2") : "<p>No notes yet.</p>"}</div>
  ${n && BYDECK[n.deck] ? `<p><button id="wkq">Open Week ${BYDECK[n.deck]} questions</button></p>` : ""}
  ${n ? askBox(DECKS[n.deck] || n.deck, EXAMPLES[BYDECK[n.deck]] || "") : ""}${FOOT}`;
  if (n) wireAsk(DECKS[n.deck] || n.deck, [...new Set(Q.filter(q => q.deck === n.deck).map(q => q.topic))]);
  document.getElementById("sheet").onchange = e => { notes(e.target.value); document.getElementById("sheet").focus(); };
  on("wkq", () => { week(BYDECK[n.deck]); window.scrollTo(0, 0); });
  on("back", () => { home(); window.scrollTo(0, 0); });
  window.scrollTo(0, 0);
}

if (st.run && !st.run.ids.every(id => BYID[id])) st.run = null;
if (st.run && !st.run.auto) st.run.auto = {};
home();
</script>
</body>
</html>
